%3A%22%E6%B2%89%E4%B8%8E%E6%98%95%E4%B9%8B%E6%81%8B%22%2C%22short_name%22%3A%22%E6%B2%89%E4%B8%8E%E6%98%95%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23F6F1E8%22%2C%22theme_color%22%3A%22%23A8E6CF%22%7D">
<style>
:root{
  --bg:#F6F1E8; --card:#FFFEFB; --ink:#33302A; --sub:#8B8172;
  --line:#E8DFCE; --green:#5F8F7B; --orange:#D98E5F; --blue:#7A9CC6; --brown:#8A7458;
  --green-soft:#E9F0E9; --orange-soft:#F8ECE2; --danger:#D4605A;
  --radius:18px; --shadow:0 3px 14px rgba(70,58,40,.09);
  --fs:1;
  --glass:rgba(255,253,248,.40); --glass-strong:rgba(255,253,248,.62);
  --glass-brd:rgba(255,255,255,.55); --glass-sh:0 8px 28px rgba(70,58,40,.10);
  --gold:#C9A227;
  --s1:rgba(255,178,200,.55); --s2:rgba(178,190,255,.5); --s3:rgba(255,208,150,.48);
  --s4:rgba(190,232,214,.5); --s5:rgba(255,240,190,.38); --s6:rgba(200,220,255,.34);
  --body-g1:#F8F3E9; --body-g2:#F0E6D8;
  --serif:'Songti SC','STSong','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(165deg,var(--body-g1),var(--body-g2));color:var(--ink);font-family:var(--sans);font-size:calc(15px*var(--fs));line-height:1.55}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:calc(16px*var(--fs));color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
textarea{resize:none}
input:focus,textarea:focus{border-color:var(--green)}
::placeholder{color:#BBA98C}
#app{max-width:560px;margin:0 auto;background:rgba(255,255,255,.26);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);position:relative;min-height:100dvh}
@media(min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 30px rgba(70,58,40,.06)}}
#view{min-height:100dvh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}

/* 页面顶栏（子页返回） */
.page-top{display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-brd)}
.page-top .back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--card);border:1px solid var(--line);flex-shrink:0}
.page-top .pt{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;margin-left:6px}
.page-top .pr{margin-left:auto;display:flex;gap:6px}
.screen{padding:4px 14px 20px}
.view-title{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.view-title .count{margin-left:auto;font-family:var(--sans);font-size:calc(12px*var(--fs));color:var(--sub);font-weight:400}

/* ============ 主界面（桌面） ============ */
#home{padding:calc(26px + env(safe-area-inset-top)) 18px 20px}
.home-greet{font-size:calc(14px*var(--fs));color:var(--sub);letter-spacing:1px}
.home-title{font-family:var(--serif);font-size:calc(26px*var(--fs));font-weight:700;margin:2px 0 14px}
.status-card{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:24px;padding:15px 16px;margin-bottom:20px;box-shadow:var(--glass-sh);cursor:pointer}
.status-card .sc-body{flex:1;min-width:0}
.status-card .sc-name{font-family:var(--serif);font-size:calc(17px*var(--fs));font-weight:700}
.status-card .sc-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:calc(12.5px*var(--fs));color:#5A4632;background:#F3EDDF;border-radius:20px;padding:3px 10px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.b-soft{background:var(--green-soft);color:#3F6B58}
.app-sec-title{font-size:calc(13px*var(--fs));color:var(--sub);letter-spacing:1.5px;margin-bottom:10px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.app-item{text-align:center;cursor:pointer}
.app-icon{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 7px;box-shadow:0 6px 18px rgba(70,58,40,.13);transition:transform .12s}
.app-item:active .app-icon{transform:scale(.92)}
.app-item span{font-size:calc(13px*var(--fs));color:var(--ink)}
.home-foot{text-align:center;font-size:calc(12px*var(--fs));color:#B3A994;margin-top:26px;line-height:1.7}

/* ============ 聊天 ============ */
.chat-top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-brd);box-shadow:0 2px 14px rgba(70,58,40,.05);position:sticky;top:0;z-index:10}
.chat-top .ct-who{flex:1;min-width:0}
.chat-top .ct-name{font-family:var(--serif);font-size:calc(16px*var(--fs));font-weight:700;display:flex;align-items:center;gap:6px}
.chat-top .ct-chips{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.chat-top .ct-chips .chip{font-size:calc(10.5px*var(--fs));padding:2px 8px}
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 96px)}
#chatList{flex:1;overflow-y:auto;padding:12px 12px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;background-size:cover;background-position:center;background-attachment:local}
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px;padding:0 10px}
.msg-row.in{justify-content:flex-start}
.msg-row.out{flex-direction:row-reverse}
.bubble-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--fs));font-weight:600;overflow:hidden;color:#fff;box-shadow:var(--shadow)}
.bubble-av img{width:100%;height:100%;object-fit:cover}
.bubble-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff}
.bubble{max-width:76%;padding:9px 12px;border-radius:17px;font-size:calc(15px*var(--fs));position:relative;word-break:break-word;white-space:pre-wrap;cursor:pointer}
.bubble.out{background:var(--green);border-bottom-right-radius:5px;color:#fff}
.bubble.out .t{color:rgba(255,255,255,.72)}
.bubble.in{background:var(--glass-strong);border:1px solid var(--glass-brd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom-left-radius:5px}
.bubble .t{display:block;font-size:calc(10.5px*var(--fs));color:var(--sub);margin-top:4px;text-align:right;white-space:nowrap}
.bubble .st.gray{opacity:.5}
.bubble.out .quote-box{background:rgba(0,0,0,.16);color:#fff}
.bubble.in.typing{min-width:56px;min-height:36px;display:flex;align-items:center;justify-content:center}
.bubble .st{color:var(--green);font-weight:700;font-size:calc(10.5px*var(--fs))}
.bubble .st.gray{color:#BBA98C;font-weight:400}
.quote-box{font-size:calc(12px*var(--fs));color:var(--sub);background:rgba(138,116,88,.1);border-left:2px solid var(--line);border-radius:6px;padding:4px 8px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bubble.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:11px 14px}
.typing-dots{display:inline-flex;gap:3px;align-items:center}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:#BBA98C;animation:blink 1.1s infinite}
.typing-dots i:nth-child(2){animation-delay:.22s}.typing-dots i:nth-child(3){animation-delay:.44s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quote-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:7px 12px 0;font-size:calc(12px*var(--fs));color:var(--sub)}
.quote-bar .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-bar button{color:var(--green);font-size:calc(13px*var(--fs));padding:4px 6px;min-height:30px}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--glass-brd);background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0}
.chat-input textarea{flex:1;max-height:96px;min-height:42px;background:#FBF9F2}
.chat-input button{background:var(--green);color:#fff;border-radius:12px;padding:11px 18px;font-size:calc(15px*var(--fs));flex-shrink:0;min-width:64px;min-height:44px}

.saved-item{display:flex;gap:11px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:14px;padding:10px 13px;margin-bottom:9px}
.saved-item svg{flex-shrink:0;margin-top:2px}
.s-txt{font-size:calc(14.5px*var(--fs));word-break:break-word;line-height:1.5}

#ntfBar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(30,35,30,.92);color:#fff;border-radius:16px;padding:10px 13px;display:none;align-items:center;gap:10px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ============ 主题 / 决策 / 玻璃卡 ============ */
.theme-row{display:flex;gap:8px}
.th-card{flex:1;border-radius:16px;padding:10px 6px;background:rgba(255,255,255,.55);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:76px}

.th-card .meta{font-size:calc(10.5px*var(--fs))}
.th-swatch{width:36px;height:22px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}

.th-swatch.fog{background:linear-gradient(120deg,#EDF3F8 50%,#5C87A8 50%)}
.th-swatch.aurora{background:linear-gradient(120deg,#F6F1E8 50%,#C88BB0 50%)}
.tint-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tint-dot{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:4px 5px;border-radius:12px;border:1px solid transparent}

.poll-time{display:flex;gap:8px;margin:6px 0 2px}
.pt-btn{flex:1;border-radius:14px;padding:9px 8px;background:rgba(255,255,255,.55);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
.pt-btn.on{background:var(--green);border-color:transparent;color:#fff}
.pt-btn b{font-size:calc(14px*var(--fs))}
.pt-btn span{font-size:calc(11px*var(--fs));opacity:.75}
.poll-yesno{display:flex;gap:8px;margin:6px 0 2px;align-items:center}
.poll-yesno input{flex:1}
.poll-yesno .btn{flex-shrink:0}
.opt-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.opt-idx{width:26px;text-align:center;font-size:calc(12px*var(--fs));color:var(--sub);flex-shrink:0}
.opt-in{flex:1}
.opt-row .del{width:40px;height:40px;border-radius:10px;color:var(--danger);font-size:calc(16px*var(--fs));flex-shrink:0}
.poll-multi{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px;background:rgba(255,255,255,.5);border-radius:12px;padding:8px 10px}
.poll-multi .mstepper{display:flex;align-items:center;gap:8px}
.mstepper button{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;font-size:calc(17px*var(--fs))}
.mstepper b{font-size:calc(16px*var(--fs));min-width:20px;text-align:center}
.poll-log-btn{width:100%;margin-top:10px;padding:9px;border-radius:12px;background:rgba(255,255,255,.55);border:1px dashed var(--line);color:var(--sub);font-size:calc(13px*var(--fs));min-height:44px}
.poll-log-item{background:rgba(255,255,255,.55);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.pl-q{font-size:calc(14px*var(--fs));font-weight:600}
.pl-a{font-size:calc(13.5px*var(--fs));margin-top:2px}
/* 玻璃 ins 卡片升级 */
.ck-card{background:rgba(255,250,240,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);box-shadow:0 8px 24px rgba(214,158,102,.14),inset 0 1px 0 rgba(255,255,255,.6);border-radius:18px;border-bottom-left-radius:6px}

.tf-card{align-self:flex-end;background:rgba(200,226,212,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);color:#3F6B58;border-radius:18px;border-bottom-right-radius:6px;min-width:150px;max-width:76%;text-align:center;box-shadow:0 10px 28px rgba(95,143,123,.18),inset 0 1px 0 rgba(255,255,255,.6);padding:12px 14px}
.tf-card.in{align-self:flex-start;background:rgba(255,228,233,.66);border-color:rgba(255,255,255,.72);color:#A5475B;border-bottom-left-radius:6px;border-bottom-right-radius:18px;box-shadow:0 10px 28px rgba(214,140,158,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.tf-card .tf-n{font-size:calc(12px*var(--fs));opacity:.85}
.tf-card .tf-a{font-size:calc(24px*var(--fs));font-weight:800;margin:3px 0;letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.tf-card .tf-t{font-size:calc(11px*var(--fs));opacity:.8}
.tf-btns button{background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.poll-card{background:rgba(255,255,255,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);border-radius:18px;border-bottom-right-radius:6px;padding:12px 13px;max-width:78%;box-shadow:0 10px 28px rgba(95,143,123,.14),inset 0 1px 0 rgba(255,255,255,.6)}
.poll-card .pq{font-size:calc(15px*var(--fs));font-weight:700;margin-bottom:8px}
.poll-card .po{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-bottom:6px;font-size:calc(13.5px*var(--fs));text-align:center}
.poll-card .pt{font-size:calc(11px*var(--fs));color:var(--sub);margin-top:6px;text-align:center}
/* ============ 高透玻璃主页 + 气泡预设 + 聊天室设置 ============ */
.status-card,.widget,.app-icon{background:rgba(255,255,255,.26);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 26px rgba(90,70,50,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.app-icon{border-radius:18px}
.app-item span{color:var(--ink)}
.home-title{color:var(--ink)}
.home-greet{color:var(--sub)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap}
.preset-btn{border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.55);border:1px solid var(--line);font-size:calc(13px*var(--fs));min-height:40px}
.preset-btn.on{background:var(--green);border-color:transparent;color:#fff}
/* 气泡预设 */
#view .bubble{border-radius:calc(var(--bub-r,17px)*1px);opacity:calc(var(--bub-o,100)*1%)}
#view.bs-wechat .bubble.in{background:#fff;border:1px solid #E4E4E4;color:#333;border-bottom-left-radius:6px}
#view.bs-wechat .bubble.out{background:#95EC69;color:#333;border-bottom-right-radius:6px}

#view.bs-kakao .bubble.out{background:#fff;color:#333;border:1px solid #E4E4E4;border-bottom-right-radius:8px}
#view.bs-kakao .bubble.out .t{color:rgba(0,0,0,.5)}
#view.bs-imessage .bubble{border-radius:20px}
#view.bs-imessage .bubble.in{background:#E9E9EB;color:#000;border-bottom-left-radius:6px}
#view.bs-imessage .bubble.out{background:#34C759;color:#fff;border-bottom-right-radius:6px}
#view.bs-wechat .bubble.out,.bubble.out .st{color:#333}
/* ============ 通用 ============ */
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--glass-sh)}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;object-fit:cover;background:#6E7F5E}
.avatar.sm{width:34px;height:34px;font-size:calc(15px*var(--fs))}
.row{display:flex;align-items:center;gap:10px}
.meta{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.btn{background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:calc(15px*var(--fs));display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:var(--card);color:var(--green);border:1px solid var(--green)}
.btn.small{padding:6px 12px;font-size:calc(13px*var(--fs));border-radius:10px;min-height:40px}
.btn:active{opacity:.85}

/* 朋友圈 */
.post-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.post-form textarea{min-height:64px}
.post{display:flex;flex-direction:column;gap:8px}
.post .head{display:flex;align-items:center;gap:9px}
.post .head .nm{font-weight:700;font-size:calc(14.5px*var(--fs))}
.post .txt{font-size:calc(15px*var(--fs));white-space:pre-wrap;word-break:break-word;padding:4px 0}
.post .tag{display:inline-flex;align-items:center;gap:4px;font-size:calc(11px*var(--fs));color:var(--sub);background:#F1E9D7;border-radius:20px;padding:2px 9px;align-self:flex-start}
.cmt-box{margin-top:4px;background:#F3ECDC;border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:4px}
.cmt{font-size:calc(13.5px*var(--fs));line-height:1.5}
.cmt b{font-weight:600;margin-right:4px}
.cover{width:100%;height:118px;border-radius:18px;background-size:cover;background-position:center;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.cover .cov-btn{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.88);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:calc(12px*var(--fs));min-height:30px}

/* 信箱 */
.letter{position:relative}
.letter.unread{border-color:var(--green)}
.letter .dot-badge{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--green)}
.letter .subject{font-family:var(--serif);font-size:calc(16px*var(--fs));font-weight:700;margin:2px 0 4px}
.letter .body{font-size:calc(14px*var(--fs));color:#5A4632;white-space:pre-wrap;word-break:break-word;background:#FBF6EA;border-radius:10px;padding:8px 10px;margin-top:6px}

/* 字卡 */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.cat-tabs button{flex-shrink:0;font-size:calc(13px*var(--fs));padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.cat-tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.card-grid{display:flex;flex-direction:column;gap:10px}
.zika{border-left:4px solid var(--green);position:relative;padding-right:34px}
.zika .txt{font-size:calc(14.5px*var(--fs));white-space:pre-wrap;word-break:break-word}
.zika .chip{display:inline-block;font-size:calc(11px*var(--fs));color:var(--green);background:#ECF0E4;border-radius:20px;padding:2px 9px;margin-top:6px}
.zika .del{position:absolute;right:10px;top:10px;color:#BBA98C;font-size:calc(16px*var(--fs));padding:4px}
.zika .del:active{color:var(--danger)}
.lib-actions{display:flex;gap:8px;margin-bottom:12px}
.lib-actions button{flex:1}

/* 日记 */
.diary-card .d-date{font-family:var(--serif);font-size:calc(16px*var(--fs));font-weight:700}
.diary-card .d-txt{font-size:calc(14.5px*var(--fs));color:#4A3F33;white-space:pre-wrap;word-break:break-word;background:#FBF6EA;border-radius:10px;padding:9px 11px;margin-top:7px;line-height:1.75}

/* 我的/设置 */
.me-sec{margin-bottom:16px}
.me-sec h3{font-family:var(--serif);font-size:calc(15px*var(--fs));font-weight:700;margin-bottom:8px;color:#5A4632}
.contact-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.contact-item:last-child{border-bottom:none}
.contact-item .info{flex:1;min-width:0}
.contact-item .info b{display:block;font-size:calc(15px*var(--fs))}
.contact-item .info span{font-size:calc(11.5px*var(--fs));color:var(--sub);word-break:break-all}
.contact-item .on-tag{font-size:calc(11px*var(--fs));color:#fff;background:var(--green);border-radius:20px;padding:2px 8px;flex-shrink:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1;min-width:80px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:calc(16px*var(--fs));font-family:var(--serif)}
.stat span{font-size:calc(11px*var(--fs));color:var(--sub)}
.note{background:#FBF6EA;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:calc(12.5px*var(--fs));color:#6B5A44;line-height:1.6}

/* 弹出层 */
#sheet-mask{position:fixed;inset:0;background:rgba(58,44,31,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet-mask.hide{display:none}
.sheet{width:100%;max-width:560px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-brd);border-top:none;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;margin-bottom:12px}
.sheet label{display:block;font-size:calc(12.5px*var(--fs));color:var(--sub);margin:10px 0 4px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions button{flex:1;padding:11px 0;border-radius:12px;font-size:calc(15px*var(--fs));min-height:44px}
.sheet .actions .ok{background:var(--green);color:#fff}
.sheet .cancel{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.sheet .actions .cancel{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.rhy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rhy-grid .inl label{font-size:calc(11.5px*var(--fs));color:var(--sub);margin-bottom:3px;display:block}
.rhy-grid input{font-size:calc(16px*var(--fs));padding:8px 10px}
.unit-row{display:flex;gap:6px}
.unit-row select{flex:1;font-family:inherit;font-size:calc(16px*var(--fs));border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink)}
.sw-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:none}
.sw-row .tt{font-size:calc(14px*var(--fs))}
.sw-row .tt small{display:block;font-size:calc(11.5px*var(--fs));color:var(--sub);margin-top:1px}
.sw{position:relative;display:inline-block;width:46px;height:27px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .track{position:absolute;inset:0;background:#D8CBB2;border-radius:14px;transition:.2s}
.sw .thumb{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+.track{background:var(--wechat,#5F8F7B)}
.sw input:checked+.track+.thumb{left:22px}
.pct-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pct-grid .inl label{font-size:calc(11px*var(--fs));color:var(--sub);display:block;margin-bottom:3px}
.pct-grid input{font-size:calc(15px*var(--fs));padding:7px 6px;text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.avatar-prev{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:calc(22px*var(--fs));font-weight:700;object-fit:cover;flex-shrink:0}
.contact-pick{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;background:var(--card)}
.contact-pick.on{border-color:var(--green);background:var(--green-soft)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap}
.preset-row button{width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;border:2px solid transparent}
.preset-row button.on{border-color:var(--ink)}

/* 来电 / 通话（ring 来电全屏 · mini 顶部悬浮条 · full 全屏通话） */
#callOverlay{position:fixed;inset:0;z-index:80;display:none;color:#fff}
#callOverlay.show{display:block}
#callOverlay.ring,#callOverlay.full{background-size:cover;background-position:center;background-color:#2A3A30}
#callOverlay.ring::before,#callOverlay.full::before{content:'';position:absolute;inset:0;background:rgba(24,32,26,.48);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ring-box{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16% 0 calc(10% + env(safe-area-inset-bottom))}
.call-avatar{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:calc(42px*var(--fs));font-weight:700;overflow:hidden}
.call-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.call-avatar i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--serif)}
.call-name{font-size:calc(23px*var(--fs));font-weight:700;margin-top:16px}
.call-state{font-size:calc(13px*var(--fs));opacity:.78;margin-top:5px}
.call-timer{font-size:calc(15px*var(--fs));opacity:.95;margin-top:4px;font-variant-numeric:tabular-nums}
.call-btns{display:flex;gap:60px;align-items:flex-end}
.call-btn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:calc(12px*var(--fs));opacity:.92}
.call-btn .ic{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--danger)}
.call-btn.accept .ic{background:#2FBF71}
/* mini 顶部悬浮通话条（不挡聊天） */
#callOverlay.mini{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;z-index:90;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 10px 30px rgba(30,24,15,.18);color:var(--ink)}
.call-mini{display:flex;align-items:center;gap:10px;padding:8px 12px}
.call-mini .cm-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--serif);font-size:calc(17px*var(--fs));font-weight:700;color:#fff}
.call-mini .cm-av img{width:100%;height:100%;object-fit:cover}
.call-mini .cm-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal}
.call-mini .cm-tx{flex:1;min-width:0}
.call-mini .cm-tx b{font-size:calc(14px*var(--fs));display:block}
.call-mini .cm-tx span{font-size:calc(12px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums}
.call-mini button{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.65);color:var(--ink);flex-shrink:0;min-height:38px}
.call-mini button.duan{background:var(--danger);color:#fff}
/* full 全屏通话 */
.call-full{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 0 calc(12% + env(safe-area-inset-bottom));color:#fff}
.call-full .cf-top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.call-full .cf-top button{color:#fff;font-size:calc(13px*var(--fs));background:rgba(255,255,255,.16);border-radius:14px;padding:7px 14px;min-height:40px;display:flex;align-items:center;gap:5px}
.call-full .cf-body{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;gap:10px}
.call-full .call-timer{font-size:calc(17px*var(--fs));margin-top:6px}
.video-stage{width:min(300px,72%);aspect-ratio:3/4;border-radius:20px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.video-stage img.vf{width:100%;height:100%;object-fit:cover}
.video-stage .vs-label{position:absolute;bottom:8px;left:10px;font-size:calc(11px*var(--fs));opacity:.8;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 8px}
.video-badge{position:absolute;top:8px;right:8px;font-size:calc(10px*var(--fs));background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
#transferOverlay{position:fixed;inset:0;background:rgba(30,24,15,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:none;align-items:center;justify-content:center}
#transferOverlay.show{display:flex}
.transfer-pop{width:292px;background:#fff;border-radius:16px;padding:22px 16px 16px;text-align:center}
.transfer-pop .ttl{font-size:calc(14px*var(--fs));color:#555;margin-top:10px}
.transfer-pop .amt{font-size:calc(38px*var(--fs));font-weight:700;margin:6px 0 2px;font-family:var(--serif)}
.transfer-pop .amt small{font-size:calc(17px*var(--fs));font-weight:600}
.transfer-pop .btns{display:flex;gap:10px;margin-top:16px}
.transfer-pop .btns button{flex:1;padding:12px 0;border-radius:10px;font-size:calc(15px*var(--fs));min-height:44px}
.tr-accept{background:#2FBF71;color:#fff}
.tr-decline{background:#F2F2F2;color:#888}
/* ===== v7：字体 / 转账 / 钱包 / 统计 ===== */
.fs-row{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:12px 14px}
.fs-btn{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.7);color:var(--green);font-size:calc(18px*var(--fs));font-weight:700;display:flex;align-items:center;justify-content:center;min-height:44px}
.fs-val{flex:1;text-align:center;font-size:calc(16px*var(--fs));font-weight:600;font-variant-numeric:tabular-nums}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.amt-chip{background:var(--green-soft);color:#2F6B3C;border-radius:14px;padding:10px 14px;font-size:calc(14px*var(--fs));font-weight:600;min-height:44px}
.tf-card{align-self:flex-end;background:var(--green);color:#fff;border-radius:15px;border-bottom-right-radius:5px;padding:10px 14px;min-width:150px;max-width:76%;text-align:center;box-shadow:0 6px 16px rgba(95,143,123,.28)}
.tf-card.in{align-self:flex-start;background:#FBE2E6;color:#A5475B;border-bottom-left-radius:5px;border-bottom-right-radius:15px;box-shadow:0 6px 16px rgba(200,120,135,.22)}
.tf-card .tf-n{font-size:calc(12px*var(--fs));opacity:.85}
.tf-card .tf-a{font-size:calc(22px*var(--fs));font-weight:800;margin:3px 0;letter-spacing:.5px}
.tf-card .tf-t{font-size:calc(11px*var(--fs));opacity:.8}
.tf-btns{display:flex;gap:8px;margin:8px 0 2px}
.tf-btns button{flex:1;padding:7px 0;border-radius:10px;background:#fff;color:#A5475B;font-size:calc(13px*var(--fs));min-height:38px}
.tf-btns button.gray{color:var(--sub);background:rgba(255,255,255,.7)}
.ck-card{display:flex;align-items:flex-start;gap:9px;border-radius:16px;padding:10px 13px;max-width:78%;background:#FFF7EA;border:1px solid #F3E0BC;min-width:150px}
.ck-card.out{background:#EAF3FF;border-color:#CBDDF3}
.ck-card .ck-ic{width:30px;height:30px;border-radius:50%;background:#F0C987;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck-card.out .ck-ic{background:#8FB7E8}
.ck-card .ck-tx{flex:1;min-width:0}
.ck-card .ck-tx b{display:block;font-size:calc(12px*var(--fs));color:#C08A3E}
.ck-card.out .ck-tx b{color:#5F8FB8}
.ck-card .ck-tx span{font-size:calc(14px*var(--fs));color:var(--ink);word-break:break-word}
.ck-card .t{margin-left:auto;font-size:calc(11px*var(--fs));color:var(--sub);white-space:nowrap}
/* 朋友圈微信 */
.p-row{display:flex;gap:10px}
.p-av{flex-shrink:0}
.p-main{flex:1;min-width:0}
.post .p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.post .ptime{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.p-ops{display:flex;gap:4px}
.p-ops .op{display:inline-flex;align-items:center;gap:4px;font-size:calc(13px*var(--fs));color:var(--sub);background:none;border:none;padding:6px 10px;min-height:38px;border-radius:10px}
.p-ops .op.on{color:#E05C5C}
.p-ops .op .like-ic{color:#E05C5C}
.p-likes{margin-top:8px;background:#F3ECDC;border-radius:9px;padding:5px 10px;font-size:calc(13px*var(--fs));color:#3E5A8F}
.pc-in{display:flex;gap:8px;margin-top:8px;align-items:center}
.pc-in input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:rgba(255,255,255,.6);font-size:calc(13px*var(--fs));min-height:44px;box-sizing:border-box}
.pc-in button{min-height:44px;padding:0 14px;border-radius:10px;background:var(--green);color:#fff}
.me-overlay{position:absolute;right:10px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.me-overlay b{font-size:calc(14px*var(--fs))}
/* 邮件 */
.mail-tabs{display:flex;gap:8px;margin-bottom:12px}
.m-tab{flex:1;padding:10px;border-radius:14px;background:rgba(255,255,255,.45);border:1px solid var(--glass-brd);font-size:calc(14px*var(--fs));color:var(--sub);min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px}
.m-tab.on{background:var(--green);color:#fff;border-color:transparent}
.m-cnt{background:rgba(0,0,0,.14);border-radius:20px;padding:1px 7px;font-size:calc(11px*var(--fs))}
.m-tab.on .m-cnt{background:rgba(255,255,255,.28)}
.mail-item{display:flex;gap:11px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 13px;margin-bottom:9px}
.mail-item.unread{background:rgba(255,255,255,.68)}
.m-body{flex:1;min-width:0}
.m-top{display:flex;align-items:center;justify-content:space-between}
.m-top b{font-size:calc(14.5px*var(--fs))}
.m-time{font-size:calc(11px*var(--fs));color:var(--sub)}
.m-title{font-size:calc(14px*var(--fs));font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mail-item.unread .m-title{font-weight:800}
.m-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4C9EE8;margin-left:6px;vertical-align:middle}
.m-sum{font-size:calc(12.5px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.m-st{font-size:calc(11px*var(--fs));color:var(--green);margin-top:2px}
.mail-fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(95,143,123,.4);z-index:20}
.mail-detail .md-av{display:flex;justify-content:center;margin-bottom:10px}
.mail-detail .md-title{font-size:calc(17px*var(--fs));font-weight:700;text-align:center}
.mail-detail .md-meta{text-align:center;font-size:calc(12px*var(--fs));color:var(--sub);margin:4px 0 12px}
.mail-detail .md-body{font-size:calc(15px*var(--fs));line-height:1.75;white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.5);border-radius:12px;padding:12px}
.wallet-hero{background:linear-gradient(140deg,#C9A227,#E4C465);color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 26px rgba(201,162,39,.28)}
.wallet-hero .wh-label{font-size:calc(13px*var(--fs));opacity:.9}
.wallet-hero .wh-amt{font-size:calc(34px*var(--fs));font-weight:800;font-family:var(--serif);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.wallet-hero .wh-note{font-size:calc(12px*var(--fs));opacity:.85}
.wl-t{font-family:var(--serif);font-size:calc(15px*var(--fs));font-weight:700;margin:4px 0 8px;color:#5A4632}
.wl-item{display:flex;align-items:center;gap:12px}
.wl-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(13px*var(--fs));font-weight:700;color:#fff;flex-shrink:0}
.wl-dot.in{background:var(--green)}
.wl-dot.out{background:var(--orange)}
.wl-amt{font-size:calc(15px*var(--fs));font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.wl-amt.in{color:var(--green)}
.wl-amt.out{color:var(--danger)}
.st-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px}
.st-item{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 6px;text-align:center}
.st-item b{display:block;font-size:calc(20px*var(--fs));font-weight:800;font-family:var(--serif);color:var(--ink)}
.st-item span{font-size:calc(11px*var(--fs));color:var(--sub)}
.mini-edit{font-size:calc(12px*var(--fs));color:var(--sub);border:1px solid var(--glass-brd);background:rgba(255,255,255,.6);border-radius:10px;padding:4px 10px;min-height:34px;flex-shrink:0}

#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(58,44,31,.92);color:#FFFDF6;padding:9px 16px;border-radius:20px;font-size:calc(13.5px*var(--fs));z-index:99;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:calc(14px*var(--fs));line-height:1.7}
.empty .big{font-family:var(--serif);font-size:calc(30px*var(--fs));display:block;margin-bottom:8px;color:#C9B592}

/* ===== v5：聊天工具 + 表情 + 决策 + 查岗 ===== */
.chat-tools{display:flex;gap:6px;align-items:center;padding:6px 10px 0;background:var(--card);flex-shrink:0}
.chat-tools button{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0;background:#F4F0E6}
.chat-tools button.on{background:var(--green);color:#fff}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 2px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:calc(12px*var(--fs));color:var(--ink);padding:6px 0;border-radius:12px}
.tool-item:active{background:#EFE8D8}
.tool-item .ti{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--green)}
.stk-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 2px}
.stk-item{font-size:calc(27px*var(--fs));height:52px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44px}
.stk-img{height:56px;width:56px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff}
.bubble img.msg-img{max-width:210px;max-height:270px;border-radius:12px;display:block}
.poll-card{align-self:flex-end;max-width:84%;background:var(--card);border:1px solid var(--line);border-radius:17px 5px 17px 17px;padding:10px 13px}
.poll-card .pq{font-size:calc(14.5px*var(--fs));font-weight:600;margin-bottom:8px;white-space:pre-wrap}
.poll-card .po{font-size:calc(13px*var(--fs));color:#3F6B58;background:var(--green-soft);border-radius:10px;padding:6px 10px;margin-bottom:6px;white-space:pre-wrap}
.poll-card .pt{font-size:calc(10.5px*var(--fs));color:var(--sub);margin-top:4px}
.checkin-list{display:flex;flex-direction:column;gap:8px}
.checkin-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px}
.checkin-item .ci-txt{flex:1;font-size:calc(14.5px*var(--fs))}
.checkin-item .del{color:#BBA98C;font-size:calc(16px*var(--fs));padding:6px;min-height:44px}

/* ===== v5：陪伴番茄钟 ===== */
.companion-bg{position:relative;border-radius:24px;overflow:hidden;min-height:400px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#EAF0EC,#DCE8DE);border:1px solid var(--line)}
.companion-bg .cbg{position:absolute;inset:0;background-size:cover;background-position:center}
.companion-bg .cc{position:relative;z-index:1}
.timer-box{text-align:center;padding:22px 0 14px;background:rgba(255,253,246,.8);border-radius:20px;border:1px solid rgba(232,223,206,.7)}
.timer{font-family:var(--serif);font-size:calc(56px*var(--fs));font-weight:700;color:#4A3F33;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-state{font-size:calc(13px*var(--fs));color:var(--sub);margin-top:4px}
.mode-chips{display:flex;gap:8px;flex-wrap:wrap}
.mode-chip{padding:8px 14px;border-radius:20px;font-size:calc(13px*var(--fs));background:rgba(255,253,246,.85);border:1px solid var(--line);color:#4A3F33;min-height:44px}
.mode-chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.timer-btns{display:flex;gap:10px}
.timer-btns button{flex:1;padding:13px 0;border-radius:14px;font-size:calc(15px*var(--fs));background:var(--green);color:#fff;min-height:46px}
.timer-btns button.ghost{background:rgba(255,253,246,.85);color:var(--green);border:1px solid var(--green)}

/* ===== v5：来电视频 ===== */
.video-stage{width:200px;height:340px;border-radius:22px;background:linear-gradient(160deg,#1F2E26,#31483A);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.video-stage img.vf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-stage .vs-label{font-size:calc(12px*var(--fs));color:rgba(255,255,255,.55);position:absolute;bottom:10px;left:0;right:0;text-align:center}
.video-badge{position:absolute;top:8px;right:8px;font-size:calc(10.5px*var(--fs));background:rgba(0,0,0,.4);color:#fff;border-radius:12px;padding:2px 8px}

/* ===== v5：主页壁纸/图标装修 ===== */
#home.cbg{background-size:cover;background-position:center;background-attachment:fixed}
.icon-edit-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.icon-edit-item:last-child{border-bottom:none}
.icon-edit-item .ie-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.icon-edit-item .ie-ic img{width:100%;height:100%;object-fit:cover}
.icon-edit-item .ie-nm{flex:1;font-size:calc(14.5px*var(--fs))}
.icon-edit-item button{font-size:calc(12.5px*var(--fs));color:var(--green);padding:8px 10px;min-height:44px}
.icon-edit-item button.gray{color:var(--sub)}
.bg-cell{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.bg-cell:last-child{border-bottom:none}
.bg-cell .bc-nm{flex:1;font-size:calc(14.5px*var(--fs))}
.bg-cell .bc-th{width:44px;height:30px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line);flex-shrink:0}
.sm-list{display:flex;flex-direction:column;gap:8px}
.sm-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px}
.sm-item .txt{flex:1;font-size:calc(14.5px*var(--fs))}
.preset-row{display:flex;gap:10px;flex-wrap:wrap}

/* ================= 字卡抽取 ================= */
function drawCards(n,poolArr){
  var pool=(poolArr||state.cards).slice();
  var out=[],k=0;
  while(pool.length&&out.length<n&&k<100){
    var i=Math.floor(Math.random()*pool.length);
    out.push(pool.splice(i,1)[0].text);k++;
  }
  return out;
}
var FALLBACK=['收到，我在。','嗯，我在听。','记下了。','好，就这么说定了。'];
function drawCardText(){var d=drawCards(1);return d.length?d[0]:pick(FALLBACK)}
function pickCardText(){
  if(state.cards.length){
    var groups={};
    for(var i=0;i<state.cards.length;i++){var tg=state.cards[i].tag||'';(groups[tg]=groups[tg]||[]).push(state.cards[i])}
    var keys=Object.keys(groups);
    var g=groups[keys[Math.floor(Math.random()*keys.length)]];
    return g[Math.floor(Math.random()*g.length)].text;
  }
  return drawCardText();
}
function drawBalancedCards(n){
  var out=[];
  for(var i=0;i<n;i++)out.push(pickCardText());
  return out;
}
function composeText(c){
  if(c&&c.puzzle&&state.cards.length)return drawBalancedCards(rnd(2,3)).join('\n\n');
  return pickCardText();
}

function rndDelay(c,kind){
  var min=kind==='init'?c.initMin:c.replyMin;
  var max=kind==='init'?c.initMax:c.replyMax;
  if(min>max){var tmp=min;min=max;max=tmp}
  return rnd(min,max)*1000;
}
function pickBurstCount(c){
  if(c.burstOn===false)return 1;
  var b=c.burst||[45,32,15,6,2];
  var r=Math.random()*100,acc=0;
  for(var i=0;i<5;i++){acc+=(b[i]||0);if(r<acc)return i+1}
  return 1;
}

/* ================= 调度器 ================= */
var _timer=null,_typing=null,_ntfSilent=false,_ntfTimer=null;
function schedule(){
  if(_timer){clearTimeout(_timer);_timer=null}
  var items=[],t=now();
  for(var i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(m.dir==='out'&&m.readDue&&!m.read)items.push({ts:m.readDue,fn:(function(mm){return function(){markRead(mm)}})(m)});
    if(m.dir==='out'&&m.replyDue&&!m.answered)items.push({ts:m.replyDue,fn:(function(mm){return function(){replyChat(mm)}})(m)});
    if(m.dir==='in'&&m.ts>t)items.push({ts:m.ts,fn:function(){renderChat()}});
  }
  for(var j=0;j<state.letters.length;j++){
    var l=state.letters[j];
    if(l.dir==='out'&&!l.answered&&l.replyDue)items.push({ts:l.replyDue,fn:(function(ll){return function(){replyLetter(ll)}})(l)});
  }
  for(var k=0;k<state.posts.length;k++){
    var p=state.posts[k];
    if(p.commentDue&&p.commentDue>t&&!p.commented)items.push({ts:p.commentDue,fn:(function(pp){return function(){postComment(pp)}})(p)});
  var ac2=activeContact();
  if(ac2&&state.nextPostDue&&state.nextPostDue[ac2.id]&&state.nextPostDue[ac2.id]>t)items.push({ts:state.nextPostDue[ac2.id],fn:(function(cc){return function(){maybePost(cc,now());state.nextPostDue[cc.id]=now()+rnd((state.settings.momMin||180)*60000,(state.settings.momMax||720)*60000);save();schedule()}})(ac2)});
  if(state.settings&&state.settings.visitorOn){
    if(!state.nextVisitDue||state.nextVisitDue<=t)state.nextVisitDue=t+rnd((state.settings.visitorMin||180)*60000,(state.settings.visitorMax||720)*60000);
    items.push({ts:state.nextVisitDue,fn:function(){state.lastVisit=now();state.visitorCount=(state.visitorCount||0)+1;state.nextVisitDue=now()+rnd((state.settings.visitorMin||180)*60000,(state.settings.visitorMax||720)*60000);save();renderAll()}});
  }
  }
  var ddq=state.diaryDue||[];
  for(var di=0;di<ddq.length;di++){
    var de=ddq[di];
    if(de&&de.due&&de.due>t)items.push({ts:de.due,fn:(function(ee){return function(){diaryDueFire(ee)}})(de)});
  }
  for(var cid in state.nextInit){
    var c=contact(cid);
    if(!c)continue;
    var nt=state.nextInit[cid];
    if(!nt||nt<=t)nt=t+rndDelay(c,'init');
    items.push({ts:nt,fn:(function(cc){return function(){initiate(cc)}})(c)});
  }
  if(!items.length)return;
  items.sort(function(a,b){return a.ts-b.ts});
  var nx=items[0];
  var wait=nx.ts-now();
  if(wait>0)_timer=setTimeout(function(){nx.fn();schedule()},Math.min(wait,2147483000));
  else{nx.fn();schedule()}
}
function markRead(m){
  if(m.read)return;
  m.read=true;
  var c=contact(m.contactId);
  if(c&&c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null;m.answered=true}
  else if(c){_typing={contactId:c.id,ts:now(),hold:true}}

  pushBurst(c,now(),pickBurstCount(c));

function importCards(file){
  if(!file.files||!file.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var arr=d&&d.app==='zika-cards'&&Array.isArray(d.cards)?d.cards:(Array.isArray(d)?d:null);
      if(!arr||!arr.length){toast('没有找到字卡，请检查文件');return}
      var n=0;
      for(var i=0;i<arr.length;i++){
        var c=arr[i];
        if(!c||!c.text)continue;
        if(typeof c==='string')c={text:c};
        state.cards.push({id:uid(),text:String(c.text),tag:c.tag||'',created:now()});
        n++;
      }
      save();renderCards();toast('已导入 '+n+' 张字卡');
    }catch(e){toast('导入失败：文件无法读取')}
  };

function fmtLeft(){
  var s=_left||0,m=Math.floor(s/60),ss=s%60;
  return ('0'+m).slice(-2)+':'+('0'+ss).slice(-2);
}
function tick(){
  var el=$('#timerText'),st=$('#timerState');
  if(!el)return;
  if(_running){
    if(_left>0){
      _left--;
      if(_left<=0){_running=false;beep();if(st)st.textContent='时间到，休息一下吧';toast('陪伴时间到！休息一下吧')}
    }
  }
  el.textContent=fmtLeft();
  if(st&&_running)st.textContent='专注中…还剩 '+fmtLeft()+'';
  if(_running)_tmrTick=setTimeout(tick,1000);
}
function modePick(id){
  var mo=findMode(id);if(!mo)return;
  _curMode=id;_left=0;_running=false;renderCompanion();
}
function timerStart(){
  if(!_curMode){toast('先选一个模式');return}
  if(_left<=0){var mo=findMode(_curMode);if(mo)_left=mo.mins*60}
  _running=true;
  beep(true);
  tick();
}
function timerPause(){_running=false;tick()}
function timerReset(){_left=0;_running=false;tick()}
function beep(init){
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended')_actx.resume();
    if(init)return;
    var o=_actx.createOscillator(),g=_actx.createGain();
    o.frequency.value=880;g.gain.value=.28;
    o.connect(g);g.connect(_actx.destination);
    o.start();
    setTimeout(function(){o.stop()},500);
  }catch(e){}
}

function unitToSec(v,unit){
  v=Math.max(1,parseInt(v,10)||1);
  return unit==='s'?v:(unit==='m'?v*60:(unit==='h'?v*3600:v*86400));
}
function pickUnitSec(secs){
  if(secs<60)return{val:secs,unit:'s'};
  if(secs%60===0&&secs<3600)return{val:secs/60,unit:'m'};
  if(secs%3600===0&&secs<86400)return{val:secs/3600,unit:'h'};
  if(secs%86400===0)return{val:secs/86400,unit:'d'};
  return{val:Math.round(secs/60),unit:'m'};
}

function importBackup(file){
  if(!file.files||!file.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||d.app!=='zika-site'||!d.state||!Array.isArray(d.state.contacts)){toast('文件格式不对，请选字卡备份文件');return}
      var s=migrate(d.state);
      if(!s.cards||!Array.isArray(s.cards))s.cards=[];
      if(!s.statusCards||!Array.isArray(s.statusCards))s.statusCards=defaultState().statusCards;
      if(!s.moodCards||!Array.isArray(s.moodCards))s.moodCards=defaultState().moodCards;
      if(!s.messages||!Array.isArray(s.messages))s.messages=[];
      if(!s.posts||!Array.isArray(s.posts))s.posts=[];
      if(!s.letters||!Array.isArray(s.letters))s.letters=[];
      if(!s.transfers||!Array.isArray(s.transfers))s.transfers=[];
      if(!s.diary||typeof s.diary!=='object')s.diary={};
      if(!s.nextInit||typeof s.nextInit!=='object')s.nextInit={};
      var ok=false;
      for(var i=0;i<s.contacts.length;i++)if(s.contacts[i].id===s.activeContact)ok=true;
      if(!ok&&s.contacts.length)s.activeContact=s.contacts[0].id;
      if(!s.contacts.length){toast('备份里没有联系人');return}
      s.lastActive=now();
      state=s;save();closeSheet();renderAll();schedule();
      toast('备份导入成功');
    }catch(e){toast('导入失败：文件无法读取')}

  fr.readAsText(file.files[0]);
  file.value='';
}

function replyChat(m){
  var c=contact(m.contactId);if(!c)return;
  m.answered=true;m.replyDue=null;
  if(m.kind==='poll'){replyPoll(m);return}
  var count=pickBurstCount(c),quote=null;
  if(Math.random()<0.4){
    for(var i=state.messages.length-1;i>=0;i--){
      var mm=state.messages[i];
      if(mm.dir==='out'&&mm.contactId===c.id&&mm.kind!=='poll'){quote=mm.id;break}
    }
  }
  var emojiMode=Math.random()<0.15;
  var texts=[];
  for(var j=0;j<count;j++)texts.push(composeText(c));
  var cur=0;
  function typeStep(){
    _typing={contactId:c.id,ts:now()};
    renderChat();
    setTimeout(function(){
      var stS=state.settings||{};
      if(cur===0&&stS.stopTyping&&Math.random()*100<(stS.stopTypingPct||15)){
        _typing=null;
        state.messages.push({id:uid(),contactId:c.id,dir:'sys',text:pick(['对方取消了发送','刚打了又删了','… 还是没发出去']),ts:now()});
        save();renderChat();schedule();
        return;
      }
      if(emojiMode){
        _typing=null;
        maybeEmojiReply(c);
        save();renderChat();schedule();
        return;
      }
      pushIn(c.id,texts[cur],now(),cur===0?quote:null);
      cur++;
      save();renderChat();
      if(cur<count)typeStep();
      else{_typing=null;save();schedule()}
    },rnd(900,1800));
  }
  typeStep();
}

/* ================= 后台保活：离线补发 ================= */
function syncCatchUp(){
  _ntfSilent=true;
  var last=state.lastActive||now();
  state.lastActive=now();
  var end=now();
  if(end-last<15000){_ntfSilent=false;save();schedule();return}
  for(var k=0;k<state.contacts.length;k++){
    var c=state.contacts[k];
    var t=state.nextInit[c.id]||last,guard=0;
    while(t<end&&guard<50){
      t+=rndDelay(c,'init');
      if(t<=end){pushBurst(c,t,pickBurstCount(c));maybePost(c,t);guard++}
    }
    state.nextInit[c.id]=Math.max(t,end);
    for(var i=0;i<state.messages.length;i++){
      var m=state.messages[i];
      if(m.contactId===c.id&&m.dir==='out'){
        if(m.readDue&&!m.read&&m.readDue<=end)m.read=true;
        if(m.replyDue&&!m.answered&&m.replyDue<=end){
          m.answered=true;
          if(m.kind==='poll'){replyPoll(m,Math.min(m.replyDue,end))}
          else if(c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null}
          else pushBurst(c,Math.min(m.replyDue,end),pickBurstCount(c));
        }
      }
    }
    for(var j=0;j<state.letters.length;j++){
      var l=state.letters[j];
      if(l.contactId===c.id&&l.dir==='out'&&!l.answered&&l.replyDue&&l.replyDue<=end){
        l.answered=true;
        var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);
        var pool=state.writerCards&&state.writerCards.length?state.writerCards:state.cards;
        var body=drawCards(n,pool).join('\n\n');
        if(!body)body=drawCardText();
        state.letters.push({id:uid(),contactId:c.id,dir:'in',title:'Re：'+(l.title||'来信'),body:body,ts:Math.min(l.replyDue,end),unread:true});
      }
    }
  }
  for(var q=0;q<state.posts.length;q++){
    var p=state.posts[q];
    if(p.contactId===null&&p.commentDue&&!p.commented&&p.commentDue<=end){
      var c2=contact(state.activeContact);
      if(c2){
        p.commented=true;
        if(Math.random()<0.5)p.heLiked=true;
        if(Math.random()*100<(c2.replyPct||100))p.comments.push({id:uid(),contactId:c2.id,text:pickCardText(),ts:Math.min(p.commentDue,end)});
      }
    }
  }
  var d0=new Date(last),d1=new Date(end);
  var loop=d0;
  while(loop.getTime()<=d1.getTime()&&loop.getTime()<=end){
    ensureDiary(loop.getTime());
    loop=new Date(loop.getTime()+86400000);
    if(loop.getTime()-d1.getTime()>7*86400000)break;
  }
  _ntfSilent=false;
  save();renderAll();schedule();
  toast('补发完成：离线期间的新消息已同步');
}

/* ===== 潮汐系统 ===== */
function tideInfo(){
  var t=state.tide||{};
  if(!t||!t.start)return null;
  var st=new Date(t.start);
  if(isNaN(st.getTime()))return null;
  var cy=t.cycle||28,du=t.days||5;
  var nx=new Date(st.getTime()+cy*86400000);
  var today=new Date();today.setHours(0,0,0,0);
  var diff=Math.round((nx-today)/86400000);
  var inDays=Math.round((today-st)/86400000);
  var ovu=t.ovulation!==false;
  var status;
  if(inDays>=0&&inDays<du)status='正在经期第 '+(inDays+1)+' 天';
  else if(diff>0){
    if(ovu&&Math.abs(diff-(cy-14))<=3)status='接近排卵期，注意防护';
    else status='距离下次还有 '+diff+' 天';
  }else status='应该就在这几天';
  return {start:st,next:nx,diff:diff,status:status,cycle:cy,days:du,inDays:inDays};
}
function fmtDate(dt){
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}
function renderTide(){
  var t=state.tide||{start:'',days:5,cycle:28,history:[]};
  var info=tideInfo();
  var html='<div class="page-top"><button class="back" data-view="home">'+ICON_BACK+'</button><span class="pt">潮汐</span></div>';
  html+='<div class="screen">';
  html+='<div class="tide-hero"><div class="th-label">潮汐 · 经期记录</div>';
  if(info){

  html+='<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="flex:1" data-act="tide-save">保存</button><button class="btn ghost" style="flex:1" data-act="tide-record">记入历史</button></div>';
  html+='<p class="meta" style="margin-top:8px">排卵期提示按下次日期前推 14 天估算，仅供参考</p></div>';
  if(t.history&&t.history.length){
    html+='<div class="card" style="padding:0 14px"><h3 style="padding-top:12px">历史记录</h3>';
    for(var i=t.history.length-1;i>=0;i--){
      var h=t.history[i];
      html+='<div class="tide-hist-item"><b>'+esc(h.start)+' · 持续 '+h.days+' 天 · 周期 '+h.cycle+' 天</b><button class="del" data-act="tide-del" data-idx="'+i+'">×</button></div>';
    }
    html+='</div>';
  }
  html+='</div>';

}

function tideRecord(){

/* ===== 小组件背景上传 / 拖拽 ===== */
var _wdImgKey='clock';
function readWidgetImg(input){
  if(!input.files||!input.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MAX=800,sc=Math.min(1,MAX/Math.max(img.width,img.height));
      var cw=document.createElement('canvas');cw.width=Math.round(img.width*sc);cw.height=Math.round(img.height*sc);
      var cx=cw.getContext('2d');cx.drawImage(img,0,0,cw.width,cw.height);
      state.widgetImgs=state.widgetImgs||{};
      state.widgetImgs[_wdImgKey]=cw.toDataURL('image/jpeg',.88);
      save();toast('背景已更新');
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(input.files[0]);
  input.value='';
}
function wdImgClear(){
  state.widgetImgs={};
  save();renderHome();toast('已恢复默认背景');
}
function initWidgetDrag(){
  var grid=document.getElementById('widgetGrid');if(!grid)return;
  var drag=null,timer=null,ghost=null,startX=0,startY=0;
  function findW(t){var el=t;while(el&&el!==grid&&!el.classList.contains('widget'))el=el.parentNode;return el===grid?null:el}
  function begin(x,y,target){
    var el=findW(target);if(!el||el.classList.contains('wm-btn'))return;
    startX=x;startY=y;
    timer=setTimeout(function(){
      if(!el.parentNode)return;
      drag=el;
      el.classList.add('dragging');
      ghost=el.cloneNode(true);
      ghost.id='dragGhost';
      ghost.style.width=el.offsetWidth+'px';
      ghost.style.left=(x-el.offsetWidth/2)+'px';
      ghost.style.top=(y-el.offsetHeight/2)+'px';
      document.body.appendChild(ghost);
    },380);
  }
  function move(x,y){
    if(timer&&Math.abs(x-startX)+Math.abs(y-startY)>12){clearTimeout(timer);timer=null}
    if(!drag)return;
    if(ghost){ghost.style.left=(x-ghost.offsetWidth/2)+'px';ghost.style.top=(y-ghost.offsetHeight/2)+'px'}
    var items=grid.querySelectorAll('.widget');
    for(var i=0;i<items.length;i++){
      var it=items[i];
      if(it===drag||it.classList.contains('dragging'))continue;
      var r=it.getBoundingClientRect();
      if(x>r.left-6&&x<r.right+6&&y>r.top-6&&y<r.bottom+6){
        var a=drag,b=it;
        var ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
        if(br.top<(ar.top+ar.height/2))grid.insertBefore(a,b);
        else grid.insertBefore(a,b.nextSibling);
        break;
      }
    }
  }
  function end(){
    if(timer){clearTimeout(timer);timer=null}
    if(!drag)return;
    drag.classList.remove('dragging');
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
    ghost=null;
    var order=[],its=grid.querySelectorAll('.widget');
    for(var i=0;i<its.length;i++){
      var k=its[i].getAttribute('data-wkey')||wKeyOf(its[i]);
      if(k)order.push(k);
    }
    if(order.length)state.widgetOrder=order;
    save();
    drag=null;
  }
  function wKeyOf(el){
    var cls=el.className||'';
    if(cls.indexOf('w-time')>-1)return 'clock';
    if(cls.indexOf('w-days')>-1)return 'days';
    if(cls.indexOf('w-music')>-1)return 'music';
    if(cls.indexOf('w-note')>-1)return 'note';
    return null;
  }
  grid.addEventListener('touchstart',function(e){var t=e.touches[0];begin(t.clientX,t.clientY,e.target)},{passive:true});
  grid.addEventListener('touchmove',function(e){
    if(!drag)return;
    var t=e.touches[0];move(t.clientX,t.clientY);
    if(drag)e.preventDefault();
  },{passive:false});
  grid.addEventListener('touchend',function(){end()});
  grid.addEventListener('touchcancel',function(){end()});
  grid.addEventListener('mousedown',function(e){begin(e.clientX,e.clientY,e.target);e.preventDefault()});
  document.addEventListener('mousemove',function(e){if(drag){move(e.clientX,e.clientY);e.preventDefault()}});
  document.addEventListener('mouseup',function(){end()});
}
(function(){
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t&&t.id==='wdImgFile')readWidgetImg(t);
  });
})();

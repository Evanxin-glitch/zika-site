.mail-fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(95,143,123,.4);z-index:20}
.mail-detail .md-av{display:flex;justify-content:center;margin-bottom:10px}
.mail-detail .md-title{font-size:calc(17px*var(--fs));font-weight:700;text-align:center}
.mail-detail .md-meta{text-align:center;font-size:calc(12px*var(--fs));color:var(--sub);margin:4px 0 12px}
.mail-detail .md-body{font-size:calc(15px*var(--fs));line-height:1.75;white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.5);border-radius:12px;padding:12px}
/* ★ 打开一封信：按"信纸"观感统一（比普通卡片更实、标题用宋体居中） */
.mail-detail{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,252,254,.95))!important;
  border:1px solid rgba(255,255,255,.92)!important;border-radius:22px!important;
  box-shadow:0 12px 30px rgba(160,130,150,.14)!important;padding:18px 17px!important}
.mail-detail .md-title{font-family:var(--serif);font-size:calc(19px*var(--fs));font-weight:800}
.mail-detail .md-body{background:rgba(255,255,255,.58);border-radius:14px;padding:13px;line-height:1.85}
.wallet-hero{background:linear-gradient(140deg,#C9A227,#E4C465);color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 26px rgba(201,162,39,.28)}
.wallet-hero .wh-label{font-size:calc(13px*var(--fs));opacity:.9}
.wallet-hero .wh-amt{font-size:calc(34px*var(--fs));font-weight:800;font-family:var(--serif);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.wallet-hero .wh-note{font-size:calc(12px*var(--fs));opacity:.85}
.wl-t{font-family:var(--serif);font-size:calc(15px*var(--fs));font-weight:700;margin:4px 0 8px;color:#5A4632}
.wl-item{display:flex;align-items:center;gap:12px}
.wl-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(13px*var(--fs));font-weight:700;color:#fff;flex-shrink:0}
.wl-dot.in{background:var(--green)}
.wl-dot.out{background:var(--orange)}
.wl-amt{font-size:calc(15px*var(--fs));font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.wl-amt.in{color:var(--green)}
.wl-amt.out{color:var(--danger)}
.st-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px}
.st-item{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 6px;text-align:center}
.st-item b{display:block;font-size:calc(20px*var(--fs));font-weight:800;font-family:var(--serif);color:var(--ink)}
.st-item span{font-size:calc(11px*var(--fs));color:var(--sub)}
.mini-edit{font-size:calc(12px*var(--fs));color:var(--sub);border:1px solid var(--glass-brd);background:rgba(255,255,255,.6);border-radius:10px;padding:4px 10px;min-height:34px;flex-shrink:0}

#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(58,44,31,.92);color:#FFFDF6;padding:9px 16px;border-radius:20px;font-size:calc(13.5px*var(--fs));z-index:99;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:calc(14px*var(--fs));line-height:1.7}
.empty .big{font-family:var(--serif);font-size:calc(30px*var(--fs));display:block;margin-bottom:8px;color:#C9B592}

/* ===== v5：聊天工具 + 表情 + 决策 + 查岗 ===== */
.chat-tools{display:flex;gap:6px;align-items:center;padding:6px 10px 0;background:var(--card);flex-shrink:0}
.chat-tools button{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0;background:#F4F0E6}
.chat-tools button.on{background:var(--green);color:#fff}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 2px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:calc(12px*var(--fs));color:var(--ink);padding:6px 0;border-radius:12px}
.tool-item:active{background:#EFE8D8}
.tool-item .ti{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--green)}
.stk-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 2px}
.stk-item{font-size:calc(27px*var(--fs));height:52px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44px}
.stk-img{height:56px;width:56px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff}
.bubble img.msg-img{max-width:210px;max-height:270px;border-radius:12px;display:block}
.poll-card{align-self:flex-end;max-width:84%;background:var(--card);border:1px solid var(--line);border-radius:17px 5px 17px 17px;padding:10px 13px}
.poll-card .pq{font-size:calc(14.5px*var(--fs));font-weight:600;margin-bottom:8px;white-space:pre-wrap}
.poll-card .po{font-size:calc(13px*var(--fs));color:#3F6B58;background:var(--green-soft);border-radius:10px;padding:6px 10px;margin-bottom:6px;white-space:pre-wrap}
.poll-card .pt{font-size:calc(10.5px*var(--fs));color:var(--sub);margin-top:4px}
.checkin-list{display:flex;flex-direction:column;gap:8px}
.checkin-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px}
.checkin-item .ci-txt{flex:1;font-size:calc(14.5px*var(--fs))}
.checkin-item .del{color:#BBA98C;font-size:calc(16px*var(--fs));padding:6px;min-height:44px}

/* ===== v5：陪伴番茄钟 ===== */
.companion-bg{position:relative;border-radius:24px;overflow:hidden;min-height:400px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#EAF0EC,#DCE8DE);border:1px solid var(--line)}
.companion-bg .cbg{position:absolute;inset:0;background-size:cover;background-position:center}
.companion-bg .cc{position:relative;z-index:1}
.timer-box{text-align:center;padding:22px 0 14px;background:rgba(255,253,246,.8);border-radius:20px;border:1px solid rgba(232,223,206,.7)}
.timer{font-family:var(--serif);font-size:calc(56px*var(--fs));font-weight:700;color:#4A3F33;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-state{font-size:calc(13px*var(--fs));color:var(--sub);margin-top:4px}
.mode-chips{display:flex;gap:8px;flex-wrap:wrap}
.mode-chip{padding:8px 14px;border-radius:20px;font-size:calc(13px*var(--fs));background:rgba(255,253,246,.85);border:1px solid var(--line);color:#4A3F33;min-height:44px}
.mode-chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.timer-btns{display:flex;gap:10px}
.timer-btns button{flex:1;padding:13px 0;border-radius:14px;font-size:calc(15px*var(--fs));background:var(--green);color:#fff;min-height:46px}
.timer-btns button.ghost{background:rgba(255,253,246,.85);color:var(--green);border:1px solid var(--green)}

/* ===== v5：来电视频 ===== */
.video-stage{width:200px;height:340px;border-radius:22px;background:linear-gradient(160deg,#1F2E26,#31483A);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.video-stage img.vf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-stage .vs-label{font-size:calc(12px*var(--fs));color:rgba(255,255,255,.55);position:absolute;bottom:10px;left:0;right:0;text-align:center}
.video-badge{position:absolute;top:8px;right:8px;font-size:calc(10.5px*var(--fs));background:rgba(0,0,0,.4);color:#fff;border-radius:12px;padding:2px 8px}

/* ===== v5：主页壁纸/图标装修 ===== */
#home.cbg{background-size:cover;background-position:center;background-attachment:fixed}
.icon-edit-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.icon-edit-item:last-child{border-bottom:none}
.icon-edit-item .ie-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.icon-edit-item .ie-ic img{width:100%;height:100%;object-fit:cover}
.icon-edit-item .ie-nm{flex:1;font-size:calc(14.5px*var(--fs))}
.icon-edit-item button{font-size:calc(12.5px*var(--fs));color:var(--green);padding:8px 10px;min-height:44px}
.icon-edit-item button.gray{color:var(--sub)}
.bg-cell{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.bg-cell:last-child{border-bottom:none}
.bg-cell .bc-nm{flex:1;font-size:calc(14.5px*var(--fs))}
.bg-cell .bc-th{width:44px;height:30px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line);flex-shrink:0}
.sm-list{display:flex;flex-direction:column;gap:8px}
.sm-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px}
.sm-item .txt{flex:1;font-size:calc(14.5px*var(--fs))}
.preset-row{display:flex;gap:10px;flex-wrap:wrap}
.me-av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:calc(17px*var(--fs));font-weight:600;flex-shrink:0;overflow:hidden}
.me-av img{width:100%;height:100%;object-fit:cover}
.post-acts{display:flex;align-items:center;gap:14px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.post-acts .act{display:flex;align-items:center;gap:4px;font-size:calc(13px*var(--fs));color:var(--sub);min-height:44px;padding:0 4px}
.post-acts .act.on{color:#D4605A}
.post-acts .like-ic{font-size:calc(15px*var(--fs))}
.post-acts .he-like{font-size:calc(12.5px*var(--fs));color:var(--sub);background:var(--green-soft);border-radius:10px;padding:3px 9px}
.preset-row button{width:62px;height:70px;border-radius:12px;border:2.5px solid transparent;min-height:44px}
.preset-row button.on{border-color:var(--green)}
/* ===== v7.1 ins 毛玻璃强化 ===== */
body{background:linear-gradient(165deg,#FAEDF2 0%,#F7F0E6 36%,#ECEAF7 70%,#E9EBF1 100%)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 460px at 8% 4%,var(--s1),transparent 70%),radial-gradient(500px 420px at 92% 10%,var(--s2),transparent 70%),radial-gradient(640px 520px at 86% 78%,var(--s3),transparent 70%),radial-gradient(460px 400px at 10% 86%,var(--s4),transparent 70%),radial-gradient(380px 320px at 46% 22%,var(--s5),transparent 70%),radial-gradient(320px 280px at 70% 44%,var(--s6),transparent 70%)}
.home-title{font-size:calc(26px*var(--fs));letter-spacing:2px;text-shadow:0 2px 18px rgba(255,255,255,.85)}
.home-greet{color:#8A7A68;font-size:calc(13px*var(--fs))}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.app-item{display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 4px 10px;border-radius:22px;cursor:pointer;background:none;border:none;box-shadow:none}
.app-item span{font-size:calc(12.5px*var(--fs));color:var(--ink)}
.app-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.72);box-shadow:0 8px 20px rgba(90,70,50,.16),inset 0 0 0 1px rgba(255,255,255,.28);position:relative}
/* 自定义图标：图片铺满整个圆角块，底衬纯白，原来的图形符号不再透出来 */
.app-icon.has-img{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#fff!important}
.app-icon.has-img .app-icon-img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.status-card{background:var(--glass-strong)}
.home-foot{color:#9A8C7C;font-size:calc(12px*var(--fs))}
/* ===== v7.2 小组件 + 通话浮窗 ===== */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.widget{border-radius:20px;padding:12px 14px;background:linear-gradient(150deg,rgba(255,196,216,.4),rgba(255,238,244,.18) 45%,rgba(255,210,230,.3));backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.72);box-shadow:0 8px 24px rgba(255,168,196,.18),inset 0 1px 0 rgba(255,255,255,.6);min-height:64px}
.w-time{grid-column:1/3;display:flex;align-items:baseline;gap:10px}
.w-time b{font-size:calc(30px*var(--fs));font-variant-numeric:tabular-nums;letter-spacing:1px}
.w-time span{color:var(--sub);font-size:calc(13px*var(--fs))}
.w-anno{display:flex;align-items:baseline;gap:6px;justify-content:center;flex-direction:column}
.w-anno b{font-size:calc(26px*var(--fs));color:#C97B5A;line-height:1.1}
.w-anno span{color:var(--sub);font-size:calc(12.5px*var(--fs))}
.w-music{display:flex;align-items:center;gap:10px}
.wm-ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#FFB3C1,#A0C4FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(160,140,180,.28)}
.wm-tx{flex:1;min-width:0}
.wm-tx b{display:block;font-size:calc(14px*var(--fs))}
.wm-tx span{font-size:calc(12.5px*var(--fs));color:var(--sub)}
.wm-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.78);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:44px;font-size:calc(14px*var(--fs));box-shadow:0 3px 10px rgba(60,50,30,.12)}
#callOverlay.mini{position:fixed;right:14px;top:calc(96px + env(safe-area-inset-top));left:auto;transform:none;width:196px;z-index:90;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:0 14px 38px rgba(30,24,15,.24);color:var(--ink)}
.call-mini{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 14px 12px}
.call-mini .cm-av{width:66px;height:66px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--serif);font-size:calc(24px*var(--fs));font-weight:700;color:#fff;box-shadow:0 8px 20px rgba(80,60,40,.22)}
.call-mini .cm-av img{width:100%;height:100%;object-fit:cover}
.call-mini .cm-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal}
.call-mini .cm-tx{text-align:center;min-width:0}
.call-mini .cm-tx b{font-size:calc(15px*var(--fs));display:block}
.call-mini .cm-tx span{font-size:calc(12px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums}
.call-mini .duan{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--danger);color:#fff;flex-shrink:0;min-height:26px;box-shadow:0 4px 10px rgba(200,60,60,.28)}
.call-full .cf-ops{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.cf-ops button{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.82);color:var(--ink);font-size:calc(11px*var(--fs));min-height:64px}
.cf-ops button.on{background:#5F8F7B;color:#fff}
.cf-ops button.duan{background:var(--danger);color:#fff}
.cf-ops button svg{width:22px;height:22px}
.app-item.dragging{opacity:.3;transform:scale(.9)}
@keyframes appjig{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.4deg)}75%{transform:rotate(2.4deg)}}
.app-grid.editing .app-item .app-icon{animation:appjig .42s ease-in-out infinite}
.widgets.editing .widget{animation:appjig .42s ease-in-out infinite}
#dragGhost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:.92;will-change:transform;transition:none;filter:drop-shadow(0 10px 18px rgba(255,140,180,.35))}
/* ===== v7.2 小组件 / 通话浮窗 / 拖拽 / 开关 ===== */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.widget{border-radius:20px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);min-height:62px}
.w-time{grid-column:1/3;display:flex;align-items:baseline;gap:10px}
.w-time b{font-size:calc(30px*var(--fs));font-variant-numeric:tabular-nums;letter-spacing:1px}
.w-time span{color:var(--sub);font-size:calc(13px*var(--fs))}
.w-days{display:flex;flex-direction:column;justify-content:center;gap:2px}
.w-days b{font-size:calc(26px*var(--fs));color:var(--orange);line-height:1.1}
.w-days span{color:var(--sub);font-size:calc(13px*var(--fs))}
.w-music{display:flex;align-items:center;gap:10px}
.wm-ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#FFB3C1,#A0C4FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(160,140,180,.28)}
.wm-tx{flex:1;min-width:0}
.wm-tx b{display:block;font-size:calc(14px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wm-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.78);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:44px;font-size:calc(14px*var(--fs));box-shadow:0 3px 10px rgba(60,50,30,.12)}

#callOverlay.mini{position:fixed;inset:auto;right:14px;bottom:auto;top:calc(14px + env(safe-area-inset-top));left:auto;width:158px;z-index:90;background:rgba(255,255,255,.52);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.78);border-radius:20px;box-shadow:0 12px 34px rgba(30,24,15,.24);color:var(--ink)}

/* ===== 潮汐系统 ===== */
.tide-hero{background:linear-gradient(140deg,#E89FB4,#C49BD9);color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 26px rgba(216,130,160,.3)}

/* 小组件自由摆放：容器留出高度，组件按存档里的百分比坐标绝对定位，
   这样长按拖动后可以停在任意位置（也自动适配不同屏幕宽度） */
.widgets{position:relative}
/* 组件尺寸：m 宽条(整行) / s 小方块(半宽) / l 大方块(整行加高) */
.widgets .widget.wfree{position:absolute;margin:0;left:0;width:100%;box-sizing:border-box;cursor:grab;touch-action:none}
.widgets .widget.wfree.wsz-s{width:46%;padding:11px 12px}
.widgets .widget.wfree.wsz-s .w-big{font-size:calc(26px*var(--fs))}
.widgets .widget.wfree.wsz-s .widget-inline{font-size:calc(12px*var(--fs))}
.widgets .widget.wfree.wsz-l{width:100%;min-height:150px;padding:16px 16px 14px}
.widgets .widget.wfree.wsz-l .w-big{font-size:calc(42px*var(--fs))}
.widgets .widget.wfree.wsz-s .w-sub,.widgets .widget.wfree.wsz-s .widget-note-txt{display:none}

.widgets.editfree .widget.wfree{animation:appjig .42s ease-in-out infinite}
/* 小组件单列排布：宽度跟随容器，绝不影响聊天气泡等其它元素 */
.widgets .widget.wfree{width:100%}
/* 容器改成块级定位上下文：grid 会把撑高用的占位块塞进某一列，导致右侧留白、高度算错 */
.widgets{display:block;padding-top:0}
.widgets .wfree-spacer{display:block;width:100%;height:0}
.widgets .wfree .widget-grip{position:absolute;right:7px;top:6px;width:14px;height:14px;opacity:.0;pointer-events:none;background:radial-gradient(currentColor 1.2px,transparent 1.3px);background-size:5px 5px;color:var(--sub)}
.widgets.editfree .wfree .widget-grip{opacity:.55}
#callOverlay.show.mini{inset:auto;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;height:auto;background:none;box-shadow:none;pointer-events:none}
#callOverlay.show.mini .call-mini{pointer-events:auto;position:relative;background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,238,244,.82));backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(255,140,180,.3),inset 0 1px 0 rgba(255,255,255,.85);border-radius:20px;display:flex;flex-direction:row;align-items:center;gap:5px;padding:5px 8px;touch-action:none;cursor:grab;width:auto;max-width:calc(100vw - 20px);height:auto}
#callOverlay.show.mini .call-mini .cm-av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--serif);font-size:calc(11px*var(--fs));font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(80,60,40,.18)}
#callOverlay.show.mini .call-mini .cm-av img{width:100%;height:100%;object-fit:cover}
#callOverlay.show.mini .call-mini .cm-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal}
#callOverlay.show.mini .call-mini .cm-tx{flex:1;min-width:0;line-height:1.25}
#callOverlay.show.mini .call-mini .cm-tx b{display:block;font-size:calc(12px*var(--fs));color:#7A4A5E;font-weight:600}
#callOverlay.show.mini .call-mini .cm-timer{display:block;font-size:calc(10px*var(--fs));color:#C68BA0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#callOverlay.show.mini .call-mini button{width:26px;height:26px;min-height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;min-width:0;border:none;cursor:pointer;background:rgba(255,255,255,.75);color:#B25E8B;box-shadow:0 2px 8px rgba(255,140,180,.22)}
#callOverlay.show.mini .call-mini button.duan{background:linear-gradient(150deg,#FF7B8E,#FF5A76);color:#fff}
#callOverlay.show.mini .call-mini button svg{width:16px;height:16px}
/* 拖动过的通话条：位置由内联样式决定（只在够宽的屏幕上生效） */
@media(min-width:600px){
  #callOverlay.show.mini.dragged{left:auto;right:auto;transform:none;max-width:none}
}
#callOverlay.show{display:block}
#callOverlay.show.full,#callOverlay.show.ring{left:0;right:0;top:0}
/* 存储面板 */
.stg-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:calc(13px*var(--fs));padding:5px 0;color:var(--sub)}
.stg-row b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stg-bar{height:6px;border-radius:999px;background:rgba(200,175,190,.25);overflow:hidden;margin:7px 0 3px}
.stg-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC3D6,#E9759F)}
.stg-acts{display:flex;gap:10px;margin-top:10px}
.stg-sub{margin-top:12px;padding-top:10px;border-top:1px solid rgba(200,175,190,.28);font-size:calc(12px*var(--fs));font-weight:700;color:var(--ink)}
.stg-row.stg-err b{color:#C4577E;font-weight:600;max-width:62%;text-align:right;word-break:break-all}
/* ===== v8 组件外观：大圆角磨砂玻璃 =====
   版式参考用户给的截图：封面压圆头像 / 照片右下带标签条 / # 标题清单 / 黑胶唱片。
   只改外观，不动任何位置逻辑（widgetPos / 拖拽那套完全不碰）。 */
/* ★ 组件底图为什么以前一直改不了：
   这一块原来写的是 background:linear-gradient(...)!important，
   background 是**简写**，会把 background-image 一起重置；再加上 !important，
   就把 JS 写在内联 style 上的底图彻底压死了 —— 选了图也永远看不见。
   现在改成由 CSS 变量 --wbg 提供背景图：
     · 默认值 = 原来那条渐变（外观完全不变）
     · JS 选中底图时只把内联的 --wbg 换成 url(...)，样式表仍是 !important 但取值来自变量
   这样既盖得住旧规则，又能让底图生效。 */
/* 第 523 行那条 .widget 把 background/border/box-shadow/border-radius 都写成了 !important，
   所以这里必须同样用 !important 才盖得住（同优先级靠"更靠后"取胜）。
   但**backdrop-filter 刻意不写** —— 让这三条继续按原样生效：
     · 523 行        → var(--blur)（桌面观感）
     · 614 行(@media max-width:600px)      → 模糊降到 12px（手机省 GPU）
     · 608 行(prefers-reduced-transparency)→ 关掉毛玻璃给不透明底（无障碍）
   并且在本块**之后**再把这两条无障碍/性能规则重新声明一次，防止被这里的 !important 压掉。 */
.widget{border-radius:26px!important;padding:16px 18px!important;
  --wbg:linear-gradient(160deg,rgba(255,255,255,.66),rgba(255,236,244,.42) 55%,rgba(255,241,247,.56));
  background-image:var(--wbg)!important;
  border:1px solid rgba(255,255,255,.72)!important;
  box-shadow:0 10px 26px rgba(180,140,160,.13),inset 0 1px 0 rgba(255,255,255,.9)!important}
/* 换了底图的组件：铺满 + 淡淡压一层白，保证上面的字还看得清 */
.widget.haswbg{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;
  background-color:rgba(255,255,255,.62)!important;background-blend-mode:overlay}
/* ===== 最小尺寸下的紧凑适配 =====
   小尺寸只有约 213px 宽，照搬大尺寸的排版会把内容压成 "For…"、"10…"。
   这里针对小尺寸单独调整：不是把字压扁，而是换排法 / 缩小装饰件，让信息读得出来。
   （flex-direction 必须 !important —— 第 532/538 行那两条也带 !important） */
.widget.wsz-s.w-clock,.widget.wsz-s.w-time{flex-direction:column!important;align-items:flex-start!important;gap:2px!important;justify-content:center!important}
.widget.wsz-s.w-clock b,.widget.wsz-s.w-time b{font-size:calc(26px*var(--fs))}
.widget.wsz-s.w-clock span,.widget.wsz-s.w-time span{font-size:calc(11px*var(--fs));white-space:normal}
.widget.wsz-s .wm-vinyl{width:44px;height:44px}
.widget.wsz-s .wm-vinyl::after{width:14px;height:14px;margin:-7px 0 0 -7px}
.widget.wsz-s .wm-btn{width:30px;height:30px;min-height:30px;font-size:calc(12px*var(--fs))}
.widget.wsz-s .wm-song{font-size:calc(14px*var(--fs))}
.widget.wsz-s .wm-sub{font-size:calc(11px*var(--fs))}
.widget.wsz-s .nf-tt{font-size:calc(12.5px*var(--fs))}
.widget.wsz-s .nf-it{font-size:calc(12px*var(--fs))}
.widget.wsz-s .ph-cap{right:8px;bottom:8px;max-width:80%;font-size:calc(11.5px*var(--fs));padding:5px 10px}
.widget.wsz-s.w-weather .wx-ic{font-size:calc(22px*var(--fs))}
.widget.wsz-s.w-weather .wx-tx b{font-size:calc(19px*var(--fs))}
.widget.wsz-s.w-feed .wf-item{font-size:calc(12.5px*var(--fs))}
.widget.wsz-s.w-feed .wf-tt{font-size:calc(11.5px*var(--fs))}
/* 把被上面 !important 盖掉的两条重新放回最后，保证优先级不变 */
@media (max-width:600px){
  .widget{box-shadow:0 4px 12px rgba(150,120,140,.10),inset 0 1px 0 rgba(255,255,255,.7)!important;
    backdrop-filter:blur(12px) saturate(140%)!important;-webkit-backdrop-filter:blur(12px) saturate(140%)!important}
}
@media (prefers-reduced-transparency:reduce){
  .widget{background-color:rgba(255,255,255,.92)!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}

/* 相册：照片铺满整张卡，配文做右下角标签条 */
.widget.w-photo{padding:0!important;overflow:hidden!important;min-height:170px!important;display:block!important}
.widget.w-photo .ph-img{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:26px;box-shadow:none;background-size:cover;background-position:center}
.widget.w-photo .ph-cap{position:absolute;right:12px;bottom:12px;max-width:72%;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:calc(12px*var(--fs));color:#7A6A60;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 4px 12px rgba(150,120,140,.16)}
.widget.w-photo .ph-empty{position:absolute;left:14px;right:14px;top:14px;bottom:14px;height:auto;display:flex;align-items:center;justify-content:center;

/* 音乐：黑胶唱片 + 衬线斜体歌名 + 进度条 */
.widget.w-music{gap:14px!important;min-height:96px}
.wm-vinyl{position:relative;width:64px;height:64px;border-radius:50%;flex:none;

.wm-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wm-song{font-family:var(--serif);font-style:italic;font-size:calc(17px*var(--fs));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wm-bar{position:relative;height:4px;border-radius:999px;background:rgba(200,175,190,.28);overflow:hidden;display:block}
.wm-bar i{position:absolute;left:0;top:0;bottom:0;width:42%;border-radius:999px;background:linear-gradient(90deg,#FFC3D6,#E9759F)}

/* 便签：多行时呈现清单样式 */
.widget.w-note{flex-direction:column!important;align-items:stretch!important;justify-content:center!important;gap:8px!important;min-height:96px}
.nf-tt{font-size:calc(13.5px*var(--fs));font-weight:700;color:#C97B8E}
.nf-list{display:flex;flex-direction:column;gap:7px}
.nf-it{display:flex;align-items:center;gap:9px;font-size:calc(12.5px*var(--fs));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-dot{width:11px;height:11px;border-radius:50%;flex:none;background:#B9AFA6}
.nf-ring{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid #CFC4BA;box-sizing:border-box}

/* 在一起：居中，数字放大 */
.widget.w-days{flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;min-height:82px}
.widget.w-days .d-num{font-family:var(--serif);font-size:calc(30px*var(--fs));font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.widget.w-days .d-lb,.widget.w-days .d-un{font-size:calc(12px*var(--fs));color:var(--sub)}

/* 陆沉状态卡：封面 + 圆头像压在下沿 + 名字（版式参考截图第一张） */
.status-card{position:relative!important;display:block!important;padding:0!important;overflow:hidden!important;border-radius:26px!important;min-height:206px}
.status-card .sc-cover{position:absolute;left:0;right:0;top:0;height:78px;background-size:cover;background-position:center 30%;
  background-image:linear-gradient(120deg,rgba(255,196,216,.72),rgba(255,232,240,.5))}
.status-card .sc-avwrap{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;overflow:hidden;
  border:3px solid rgba(255,255,255,.94);box-shadow:0 6px 16px rgba(150,120,140,.22);background:#fff;
  display:flex;align-items:center;justify-content:center;z-index:2}
.status-card .sc-avwrap img,.status-card .sc-avwrap .avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.status-card .sc-avwrap .avatar>span,.status-card .sc-avwrap>span{font-size:22px}
.status-card .sc-body{position:relative;padding:126px 16px 18px!important;text-align:center;z-index:1}
.status-card .sc-name{font-family:var(--serif);font-size:calc(19px*var(--fs));font-weight:800}
.status-card .sc-chips{justify-content:center;margin-top:8px}

/* ===== 音乐 App 播放页 ===== */
.music-screen{padding-bottom:24px}
.mv-sess{display:flex;align-items:center;gap:8px;margin:8px 0 10px;padding:9px 12px;border-radius:14px;
  background:rgba(255,255,255,.34);color:#fff;font-size:calc(13px*var(--fs));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mv-sess .mv-dot{width:8px;height:8px;border-radius:50%;background:#7CE0A6;box-shadow:0 0 0 4px rgba(124,224,166,.25);flex:none;animation:mvdot 1.6s ease-in-out infinite}
@keyframes mvdot{0%,100%{opacity:1}50%{opacity:.35}}
.mus-mini{margin-left:auto;font-size:calc(12.5px*var(--fs));color:var(--sub);background:rgba(255,255,255,.72);
  border-radius:999px;padding:6px 14px;min-height:34px}
.mv-sess .mv-sessbg,.mv-sess .mv-sessend{margin-left:auto;font-size:calc(12px*var(--fs));color:#fff;background:rgba(255,255,255,.22);
  border-radius:10px;padding:5px 10px;min-height:30px}
.mv-sess .mv-sessend{margin-left:6px;background:rgba(255,120,140,.34)}
.mv-sess .mv-sessic{width:34px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.mv-sess .mv-sessic svg{width:15px;height:15px}
/* 横幅里现在有三个 .mv-sessbg：只让第一个吃掉剩余空间，后面两个正常挨着排 */
.mv-sess .mv-sessbg+.mv-sessbg{margin-left:0}
.mv-card{margin-top:6px;padding:20px 18px 18px;border-radius:26px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,236,244,.5));
  border:1px solid rgba(255,255,255,.72);box-shadow:0 10px 26px rgba(180,140,160,.13)}
.mv-card.onbg{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mv-vinyl{position:relative;width:132px;height:132px;margin:4px auto 14px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#2b2b2e 0 3px,#3b3b40 3px 6px);
  box-shadow:0 10px 26px rgba(60,50,60,.32)}
.mv-vinyl::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:linear-gradient(150deg,#F9AEC2,#EE7BA4)}
.mv-vinyl.spin,.wm-vinyl.spin{animation:mvspin 7s linear infinite}
@keyframes mvspin{to{transform:rotate(360deg)}}
.mv-song{display:block;font-family:var(--serif);font-style:italic;font-size:calc(19px*var(--fs));font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-sub{display:block;margin-top:3px;font-size:calc(12px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-card.onbg .mv-sub{color:rgba(255,255,255,.8)}
.mv-prog{display:flex;align-items:center;gap:9px;margin:16px 0 6px}
.mv-prog>span{font-size:calc(11px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.mv-card.onbg .mv-prog>span{color:rgba(255,255,255,.85)}
.mv-track{position:relative;flex:1;height:5px;border-radius:999px;background:rgba(200,175,190,.32);overflow:hidden}
.mv-track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC3D6,#E9759F)}
.mv-ops{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 10px}
.mv-play{width:62px;height:62px;min-height:62px;border-radius:50%;font-size:calc(20px*var(--fs));color:#fff;
  background:linear-gradient(150deg,#F9AEC2,#EE7BA4);box-shadow:0 8px 20px rgba(242,143,176,.4)}
.mv-sm{width:46px;height:46px;min-height:46px;border-radius:50%;font-size:calc(16px*var(--fs));color:var(--ink);background:rgba(255,255,255,.72)}
.mv-card.onbg .mv-sm{background:rgba(255,255,255,.24);color:#fff}
.mv-sub-ops{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.mv-sub-ops button{font-size:calc(12px*var(--fs));padding:6px 12px;min-height:32px;border-radius:999px;
  background:rgba(255,255,255,.6);color:var(--sub)}
.mv-sub-ops button.on{background:rgba(242,143,176,.24);color:#C4577E;font-weight:700}
.mv-card.onbg .mv-sub-ops button{background:rgba(255,255,255,.22);color:#fff}
.mv-card.onbg .mv-sub-ops button.on{background:rgba(255,255,255,.42);color:#fff}
.mv-tools{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.mv-tools .meta{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.mv-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mv-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.6)}
.mv-item.on{background:linear-gradient(150deg,rgba(255,196,216,.5),rgba(255,238,244,.34));border-color:rgba(242,143,176,.5)}
.mv-idx{width:22px;flex:none;text-align:center;font-size:calc(12px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums}
.mv-item.on .mv-idx{color:#C4577E;font-weight:700}
.mv-itx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.mv-itx b{font-size:calc(13.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-itx span{font-size:calc(11px*var(--fs));color:var(--sub)}
.mv-del{flex:none;width:30px;height:30px;min-height:30px;border-radius:50%;background:rgba(255,255,255,.7);color:#C4577E;font-size:calc(15px*var(--fs))}
/* ===== 一起听：可自由摆放的悬浮条 ===== */
.lsn-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));z-index:95;touch-action:none;
  width:calc(100% - 28px);max-width:440px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:20px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 10px 26px rgba(150,120,140,.22),inset 0 1px 0 rgba(255,255,255,.85);touch-action:none}
.lsn-bar .lsn-vinyl{width:38px;height:38px;border-radius:50%;flex:none;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#2b2b2e 0 2px,#3b3b40 2px 4px);
  animation:mvspin 7s linear infinite}
.lsn-bar .lsn-vinyl::after{content:'';position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:linear-gradient(150deg,#F9AEC2,#EE7BA4)}
.lsn-bar .lsn-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.28}
.lsn-bar .lsn-tx b{font-size:calc(13.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsn-bar .lsn-tx span{font-size:calc(11.5px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums}
.lsn-bar button{flex:none;width:38px;height:38px;min-height:38px;border-radius:12px;background:rgba(255,255,255,.7);color:var(--ink);
  display:flex;align-items:center;justify-content:center}
.lsn-bar button svg{width:17px;height:17px}

/* ===== 一起听 · 独立空间 =====
   规格（用户定的）：和聊天室完全分开，是一块自己的全屏空间；
   布局 = 两头像 + 「正在一起听」+ 歌名 + 进度条 + 「一起听 X 分钟 · 他也在听」+ 呼吸灯；
   背景 = 你在一起听里设的那张壁纸，不压暗、不改色；他说的话在卡片下面的小气泡里。 */
.lsn-space{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  overflow-y:auto;-webkit-overflow-scrolling:touch;animation:lsnIn .28s ease}
@keyframes lsnIn{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}
.lsn-space .lsn-x{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:3;
  width:42px;height:42px;min-height:42px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lsn-space .lsn-x svg{width:19px;height:19px}
.lsn-space .lsn-mini{position:absolute;right:64px;top:calc(14px + env(safe-area-inset-top));z-index:3;
  height:42px;min-height:42px;padding:0 15px;border-radius:999px;color:#fff;font-size:calc(12.5px*var(--fs));
  background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lsn-wrap{width:100%;max-width:430px;padding:calc(74px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center}
.lsn-card{width:100%;border-radius:28px;padding:24px 20px 20px;text-align:center;color:#fff;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.36);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 20px 50px rgba(24,16,30,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.lsn-avs{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.lsn-avs .lsn-av{width:56px;height:56px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(20,14,26,.26);background:rgba(255,255,255,.5)}
.lsn-avs .lsn-av.his{margin-left:-14px}
.lsn-avs .lsn-av svg,.lsn-avs .lsn-av img{width:52px;height:52px;border-radius:50%;display:block}
.lsn-avs .lsn-av i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  color:#fff;font-style:normal;font-weight:800;font-size:20px;font-family:var(--serif)}
.lsn-wave{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:12px}
.lsn-wave i{width:3px;border-radius:2px;background:rgba(255,255,255,.9);animation:lsnwave 1.1s ease-in-out infinite}
.lsn-wave i:nth-child(1){height:6px}
.lsn-wave i:nth-child(2){height:11px;animation-delay:.18s}
.lsn-wave i:nth-child(3){height:5px;animation-delay:.36s}
@keyframes lsnwave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.25)}}
.lsn-kicker{font-size:calc(12.5px*var(--fs));letter-spacing:2px;color:rgba(255,255,255,.88)}
.lsn-song{margin-top:6px;font-family:var(--serif);font-size:calc(21px*var(--fs));font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 12px rgba(20,14,26,.35)}
.lsn-track{margin:16px auto 6px;height:5px;border-radius:999px;background:rgba(255,255,255,.32);overflow:hidden}
.lsn-track i{display:block;height:100%;border-radius:999px;background:rgba(255,255,255,.95);transition:width .4s linear}
.lsn-times{display:flex;justify-content:space-between;font-size:calc(11px*var(--fs));color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
.lsn-meta{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;
  font-size:calc(12.5px*var(--fs));color:rgba(255,255,255,.94)}
.lsn-meta b{font-variant-numeric:tabular-nums}
.lsn-breath{width:9px;height:9px;border-radius:50%;flex:none;background:#9BE8B8;animation:lsnbreath 2s ease-in-out infinite}
@keyframes lsnbreath{0%{box-shadow:0 0 0 0 rgba(155,232,184,.7);opacity:1}70%{box-shadow:0 0 0 11px rgba(155,232,184,0);opacity:.72}100%{box-shadow:0 0 0 0 rgba(155,232,184,0);opacity:1}}
.lsn-said{width:100%;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.lsn-bub{display:flex;align-items:flex-start;gap:8px;animation:lsnpop .3s ease}
@keyframes lsnpop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.lsn-bub .lsn-bubav{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:flex;
  align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.85)}
.lsn-bub .lsn-bubav svg,.lsn-bub .lsn-bubav img,.lsn-bub .lsn-bubav i{width:23px;height:23px;border-radius:50%;display:block}
.lsn-bub .lsn-bubav i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px;color:#fff}
.lsn-bub b{max-width:82%;font-weight:600;font-size:calc(13.5px*var(--fs));line-height:1.55;color:var(--ink);
  background:rgba(255,255,255,.93);border-radius:4px 15px 15px 15px;padding:9px 13px;
  box-shadow:0 6px 18px rgba(24,16,30,.16);word-break:break-word}
.lsn-bgbtn{margin-top:20px;height:38px;min-height:38px;padding:0 18px;border-radius:999px;color:#fff;
  font-size:calc(12.5px*var(--fs));background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.44);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
/* ★ 浅色壁纸（比如自己上传的浅底图）时，白字会彻底看不见 ——
   量一下壁纸的亮度，浅底就把这块空间里所有文字/按钮自动翻成深色；
   深色壁纸完全不动（还是白字 + 文字阴影）。 */
.lsn-space.lsn-light .lsn-card{background:rgba(255,255,255,.52);border-color:rgba(255,255,255,.78);
  box-shadow:0 20px 50px rgba(120,96,116,.18),inset 0 1px 0 rgba(255,255,255,.9)}
.lsn-space.lsn-light .lsn-kicker{color:rgba(74,59,68,.74)}
.lsn-space.lsn-light .lsn-song{color:#4A3B44;text-shadow:none}
.lsn-space.lsn-light .lsn-times{color:rgba(74,59,68,.72)}
.lsn-space.lsn-light .lsn-track{background:rgba(74,59,68,.16)}
.lsn-space.lsn-light .lsn-track i{background:rgba(74,59,68,.78)}
.lsn-space.lsn-light .lsn-meta{color:rgba(74,59,68,.88)}
.lsn-space.lsn-light .lsn-wave i{background:rgba(74,59,68,.7)}
.lsn-space.lsn-light .lsn-x,.lsn-space.lsn-light .lsn-mini,.lsn-space.lsn-light .lsn-bgbtn{
  color:#4A3B44;background:rgba(255,255,255,.66);border-color:rgba(255,255,255,.9)}
/* ★ 播放/暂停键：这块空间里原来只有进度条没有播放键，
   歌一旦是暂停的，人在空间里就"放不出来"，只能退出去音乐页（用户报的"不能播放"）。 */
.lsn-space .lsn-ops{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:15px}
.lsn-space .lsn-tb{width:44px;height:44px;min-height:44px;border-radius:50%;color:#fff;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.42);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lsn-space .lsn-tb svg{width:19px;height:19px}
.lsn-space .lsn-tb.on{background:rgba(124,224,166,.34);border-color:rgba(124,224,166,.72);box-shadow:0 0 0 3px rgba(124,224,166,.14)}
.lsn-space.lsn-light .lsn-tb{color:#4A3B44;background:rgba(255,255,255,.66);border-color:rgba(255,255,255,.9)}
.lsn-space.lsn-light .lsn-tb.on{background:rgba(124,224,166,.5);border-color:rgba(95,143,123,.6)}
.lsn-space .lsn-play{width:58px;height:58px;min-height:58px;border-radius:50%;color:#fff;
  background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.58);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 26px rgba(24,16,30,.24)}
.lsn-space .lsn-play svg{width:23px;height:23px}
.lsn-space.lsn-light .lsn-play{color:#4A3B44;background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.95)}

/* ===== 统一大卡片（转账 / 决策 / 查岗 / 礼物 / 代买）=====
   之前这几张卡片是各写各的，转账太小、风格也不统一。
   现在共用一套外壳：顶部彩色分类标签 + 大标题 + 说明 + 底部状态。
   放在样式表最末尾，同优先级靠"更靠后"盖住旧规则。 */
.gcard{display:flex;flex-direction:column;gap:9px;border-radius:22px;padding:16px 17px 15px;
  /* 统一给足宽度：以前宽度跟着内容走，短内容的卡片（比如查岗）会显得很小，
     这就是"卡片太小"的观感来源。现在所有卡片一样宽，读起来是同一套设计。 */
  width:78%;min-width:232px;max-width:336px;background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 12px 30px rgba(160,125,145,.16),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.gcard.in{align-self:flex-start;border-bottom-left-radius:7px}
.gcard.out{align-self:flex-end;border-bottom-right-radius:7px}
.gc-head{display:flex;align-items:center;gap:8px}
.gc-tag{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.4px;
  padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.05);color:#7A6A60}
.gc-time{margin-left:auto;font-size:calc(11px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.gc-amt{font-family:var(--serif);font-size:calc(34px*var(--fs));font-weight:800;line-height:1.05;letter-spacing:.5px}
.gc-amt small{font-size:calc(19px*var(--fs));font-weight:700;margin-right:2px}
.gc-title{font-size:calc(17px*var(--fs));font-weight:700;line-height:1.42;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.gc-sub{font-size:calc(12.5px*var(--fs));color:var(--sub);line-height:1.45}
.gc-note{font-size:calc(12.5px*var(--fs));color:var(--sub)}
.gc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}
.gc-state{margin-left:auto;font-size:calc(11.5px*var(--fs));font-weight:700;padding:5px 11px;border-radius:999px;
  background:rgba(0,0,0,.05);color:#7A6A60;white-space:nowrap}
.gc-state.ok{background:rgba(47,107,60,.14);color:#2F6B3C}
.gc-state.wait{background:rgba(217,142,95,.16);color:#A96A32}
.gc-state.no{background:rgba(0,0,0,.06);color:var(--sub)}
/* 礼物 / 代买 的商品行 */
.gc-item{display:flex;align-items:center;gap:11px}
.gc-emoji{width:46px;height:46px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.gc-itx{min-width:0;display:flex;flex-direction:column;gap:2px}
.gc-itx b{font-size:calc(15px*var(--fs));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-itx span{font-size:calc(12px*var(--fs));color:var(--sub)}
/* 决策选项 */
.gc-opts{display:flex;flex-direction:column;gap:7px}
.gc-opt{text-align:left;font-size:calc(14px*var(--fs));padding:11px 13px;border-radius:14px;
  background:rgba(255,255,255,.86);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);color:var(--ink)}
.gc-opt.on{background:rgba(217,142,95,.16);box-shadow:inset 0 0 0 1px rgba(217,142,95,.4);font-weight:700}
/* 按钮 */
.gc-btns{display:flex;gap:8px;margin-top:2px}
.gc-btns button{flex:1;padding:11px 0;border-radius:14px;font-size:calc(13.5px*var(--fs));font-weight:700;min-height:42px;
  background:linear-gradient(150deg,#F9AEC2,#EE7BA4);color:#fff;box-shadow:0 6px 16px rgba(242,143,176,.3)}
.gc-btns button.gray{background:rgba(255,255,255,.9);color:var(--sub);font-weight:500;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
/* 各分类配色 */
.gcard.c-green{background:linear-gradient(160deg,rgba(233,244,236,.95),rgba(255,255,255,.92))}
.gcard.c-green .gc-tag{background:rgba(47,107,60,.14);color:#2F6B3C}
.gcard.c-green .gc-amt{color:#2F6B3C}
.gcard.c-purple{background:linear-gradient(160deg,rgba(240,236,250,.95),rgba(255,255,255,.92))}
.gcard.c-purple .gc-tag{background:rgba(124,92,180,.14);color:#6B4FA0}
.gcard.c-pink{background:linear-gradient(160deg,rgba(253,238,242,.95),rgba(255,255,255,.92))}
.gcard.c-pink .gc-tag{background:rgba(196,87,126,.14);color:#C4577E}
.gcard.c-gift{background:linear-gradient(160deg,rgba(255,244,232,.95),rgba(255,255,255,.92))}
.gcard.c-gift .gc-tag{background:rgba(217,142,95,.18);color:#B4703A}
.gcard.c-teal{background:linear-gradient(160deg,rgba(232,246,246,.95),rgba(255,255,255,.92))}
.gcard.c-teal .gc-tag{background:rgba(47,124,124,.16);color:#2F6B6B}
/* 查岗卡里的回复区（沿用原来的输入/快捷回复，只调整到新卡片里） */
.gcard .ck-reply{display:flex;flex-direction:column;gap:8px}
.gcard .ck-in{width:100%;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:10px 12px;
  font-size:calc(13.5px*var(--fs));background:rgba(255,255,255,.9);resize:none;min-height:44px;color:var(--ink)}
.gcard .ck-chips{display:flex;flex-wrap:wrap;gap:7px}
.gcard .ck-chips button{font-size:calc(12px*var(--fs));padding:7px 12px;border-radius:999px;min-height:34px;
  background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);color:var(--ink)}
.gcard .ck-actions{display:flex;gap:8px}
.gcard .ck-actions button{flex:1;padding:11px 0;border-radius:14px;font-size:calc(13.5px*var(--fs));min-height:42px}
.gcard .ck-later{background:rgba(255,255,255,.9);color:var(--sub);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.gcard .ck-send{background:linear-gradient(150deg,#F9AEC2,#EE7BA4);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(242,143,176,.3)}
.gcard .ck-replied{display:flex;align-items:center;gap:8px;font-size:calc(12.5px*var(--fs));color:var(--sub);
  background:rgba(255,255,255,.8);border-radius:14px;padding:9px 12px}
.gcard .ck-replied b{color:var(--ink);font-size:calc(13.5px*var(--fs));flex:1;min-width:0}
.gcard .ck-more{display:block;font-style:normal;font-weight:400;color:var(--sub);
  font-size:calc(12px*var(--fs));margin-top:3px;line-height:1.4}
.gcard .ck-done{font-style:normal;font-size:calc(11px*var(--fs));font-weight:700;color:#2F6B3C;
  background:rgba(47,107,60,.14);border-radius:999px;padding:3px 9px}

/* ===== 商城 App ===== */
.shop-head{display:flex;align-items:baseline;gap:9px;margin:12px 0 9px}
.shop-head b{font-family:var(--serif);font-size:calc(17px*var(--fs))}
.shop-head span{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.shop-regen{margin-left:auto;font-size:calc(12px*var(--fs));color:var(--sub);background:rgba(255,255,255,.7);
  border-radius:999px;padding:6px 13px;min-height:32px}
.shop-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.shop-tab{flex:none;font-size:calc(12.5px*var(--fs));padding:7px 14px;border-radius:999px;min-height:34px;
  background:rgba(255,255,255,.72);color:var(--sub);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.shop-tab.on{background:linear-gradient(150deg,#F9AEC2,#EE7BA4);color:#fff;font-weight:700}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:12px}
.shop-item{display:flex;flex-direction:column;gap:6px;border-radius:20px;padding:12px;
  background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 20px rgba(160,125,145,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.si-top{display:flex;align-items:center;gap:7px}
.si-emoji{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.si-cat{margin-left:auto;font-size:calc(10.5px*var(--fs));color:var(--sub);background:rgba(0,0,0,.045);
  border-radius:999px;padding:3px 8px}
.si-name{font-size:calc(13.5px*var(--fs));font-weight:700;line-height:1.35;min-height:2.7em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.si-price{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:800;color:#C4577E}
.si-btns{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.si-btns button{padding:9px 0;border-radius:13px;font-size:calc(12.5px*var(--fs));font-weight:700;min-height:38px;
  background:linear-gradient(150deg,#F9AEC2,#EE7BA4);color:#fff}
.si-btns button.gray{background:rgba(255,255,255,.92);color:var(--sub);font-weight:500;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.shop-order{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;margin-bottom:7px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.7)}
.so-emoji{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(255,255,255,.9);flex:none}
.so-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.so-tx b{font-size:calc(13px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-tx span{font-size:calc(11px*var(--fs));color:var(--sub)}
.so-p{font-family:var(--serif);font-weight:700;color:#C4577E;font-size:calc(13.5px*var(--fs));flex:none}

/* ===== 朋友圈：发图 / 表情包动态 ===== */
.pf-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.pf-imgs:empty{display:none}
.pf-thumb{position:relative;width:74px;height:74px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.7)}
.pf-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pf-del{position:absolute;right:2px;top:2px;width:22px;height:22px;min-height:22px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;font-size:calc(13px*var(--fs));line-height:1}
.pf-tools{display:flex;align-items:center;gap:10px;margin-top:10px}
.pf-img{font-size:calc(13px*var(--fs));padding:9px 14px;border-radius:14px;min-height:40px;
  background:rgba(255,255,255,.85);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.pf-tip{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.pf-tools .btn{margin-left:auto;width:auto;padding:9px 22px}
.p-imgs{display:grid;gap:5px;margin-top:9px}
.p-imgs.n1{grid-template-columns:1fr}
.p-imgs.n1 img{max-height:260px}
.p-imgs.n2{grid-template-columns:1fr 1fr}
.p-imgs.n3{grid-template-columns:1fr 1fr 1fr}
.p-imgs.n4{grid-template-columns:1fr 1fr}
.p-imgs img{width:100%;height:100%;max-height:170px;object-fit:cover;border-radius:12px;display:block;
  box-shadow:0 4px 12px rgba(150,120,140,.14)}
.p-sticker{display:block;width:132px;max-width:60%;height:auto;border-radius:14px;margin:4px 0 6px;
  box-shadow:0 6px 18px rgba(150,120,140,.18)}

/* ===== 设置页：顶部分类跳转 ===== */
.me-jump{position:sticky;top:0;z-index:6;margin:6px -12px 10px;padding:8px 12px;
  background:linear-gradient(180deg,rgba(255,252,250,.96),rgba(255,252,250,.86));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.05)}
.mj-row{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.mj-chip{flex:none;font-size:calc(12.5px*var(--fs));padding:8px 14px;border-radius:999px;min-height:36px;
  background:rgba(255,255,255,.86);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);white-space:nowrap}
.mj-chip:active{background:rgba(242,143,176,.2)}
.me-sec{scroll-margin-top:64px}
.me-flash{animation:meFlash 1.2s ease-out}
@keyframes meFlash{0%{background:rgba(242,143,176,.22)}100%{background:transparent}}

/* ===== 表情包翻页 ===== */
.stk-page{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 2px;flex-wrap:wrap}
.stk-page button{font-size:calc(13px*var(--fs));padding:9px 18px;border-radius:14px;min-height:40px;
  background:rgba(255,255,255,.9);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.stk-page button:disabled{opacity:.4}
.stk-page span{font-size:calc(12px*var(--fs));color:var(--sub)}

/* ===== 音乐 App：重做的播放器界面 ===== */
.music-screen{padding-bottom:26px}
.page-top .mus-mini{margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  font-size:calc(12.5px*var(--fs));color:var(--sub);padding:8px 12px;min-height:36px;border-radius:12px;
  background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.mp-hero{position:relative;margin:8px 0 14px;padding:22px 18px 16px;border-radius:28px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(255,238,245,.86));
  border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 36px rgba(214,150,180,.18),inset 0 1px 0 rgba(255,255,255,.9)}
.mp-hero.onbg{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.42);color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.mp-artwrap{display:flex;justify-content:center;margin-bottom:14px}
.mp-art{position:relative;width:146px;height:146px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:
    repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.09) 0 1.5px,rgba(0,0,0,0) 1.5px 5px),
    conic-gradient(from 210deg,#5B4A55,#3E333B,#6A5763,#463A43,#5B4A55);
  box-shadow:0 16px 32px rgba(90,60,80,.32),inset 0 0 0 8px rgba(255,255,255,.06)}
.mp-art.spin{animation:mvspin 7s linear infinite}
.mp-art::after{content:'';position:absolute;inset:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mp-groove{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.mp-label{position:relative;z-index:2;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:800;font-size:calc(22px*var(--fs));color:#fff;
  background:linear-gradient(150deg,#F9AEC2,#EE7BA4);box-shadow:0 4px 14px rgba(200,90,130,.4)}
.mp-title{display:block;font-family:var(--serif);font-size:calc(19px*var(--fs));font-weight:800;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.mp-hero.onbg .mp-title{color:#fff}
.mp-artist{display:block;margin-top:4px;font-size:calc(12px*var(--fs));color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.mp-hero.onbg .mp-artist{color:rgba(255,255,255,.82)}
.mp-prog{display:flex;align-items:center;gap:10px;margin:18px 2px 4px}
.mp-prog>span{font-size:calc(11px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:32px;text-align:center}
.mp-hero.onbg .mp-prog>span{color:rgba(255,255,255,.85)}
.mp-track{position:relative;flex:1 1 auto;min-width:0;height:8px;border-radius:999px;background:rgba(190,160,178,.3);cursor:pointer}
.mp-hero.onbg .mp-track{background:rgba(255,255,255,.3)}
.mp-track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC3D6,#E9759F)}
.mp-track em{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(200,90,130,.45);transition:left .16s linear}
.mp-ops{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 14px}
.mp-play{width:66px;height:66px;min-height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;
  color:#fff;background:linear-gradient(150deg,#F9AEC2,#EE7BA4);box-shadow:0 10px 24px rgba(238,123,164,.42),inset 0 1px 0 rgba(255,255,255,.5)}
.mp-play:active{transform:scale(.96)}
.mp-side{width:48px;height:48px;min-height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;
  color:var(--ink);background:rgba(255,255,255,.78);box-shadow:0 4px 12px rgba(180,140,160,.16)}
.mp-hero.onbg .mp-side{background:rgba(255,255,255,.24);color:#fff}
.mp-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.mp-chip{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px*var(--fs));padding:7px 13px;min-height:34px;border-radius:999px;
  color:var(--sub);background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.mp-chip.on{color:#C4577E;font-weight:700;background:rgba(242,143,176,.22)}
.mp-hero.onbg .mp-chip{background:rgba(255,255,255,.22);color:#fff}
.mp-hero.onbg .mp-chip.on{background:rgba(255,255,255,.4);color:#fff}
.mp-tools{display:flex;align-items:center;gap:10px;margin:4px 0 14px;min-width:0}
.mp-upload{display:inline-flex;align-items:center;gap:7px;font-size:calc(13px*var(--fs));font-weight:600;
  padding:11px 18px;border-radius:16px;color:#fff;background:linear-gradient(150deg,#8FBEA6,#6FA98C);
  box-shadow:0 8px 20px rgba(111,169,140,.3)}
.mp-count{font-size:calc(11.5px*var(--fs));color:var(--sub);margin-left:auto;flex:1 1 auto;min-width:0;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-listhead{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 8px}
.mp-listhead b{font-size:calc(14px*var(--fs))}
.mp-listhead span{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.mp-list{display:flex;flex-direction:column;gap:8px}
.mp-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:18px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.75);box-shadow:0 3px 12px rgba(190,150,170,.1)}
.mp-row.on{background:linear-gradient(150deg,rgba(255,196,216,.55),rgba(255,238,244,.4));border-color:rgba(242,143,176,.5)}
.mp-no{width:24px;flex:none;text-align:center;font-size:calc(12px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums}
.mp-row.on .mp-no{color:#C4577E;font-weight:700}
.mp-eq{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.mp-eq i{width:3px;border-radius:2px;background:#E9759F;animation:mpeq .9s ease-in-out infinite}
.mp-eq i:nth-child(2){animation-delay:.18s}.mp-eq i:nth-child(3){animation-delay:.36s}
@keyframes mpeq{0%,100%{height:5px}50%{height:13px}}
.mp-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.32}
.mp-tx b{font-size:calc(13.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-tx span{font-size:calc(11px*var(--fs));color:var(--sub)}
.mp-del{flex:none;width:32px;height:32px;min-height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;
  color:#C4577E;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.mp-empty{padding:26px 16px;text-align:center;border-radius:22px;background:rgba(255,255,255,.6);
  border:1px dashed rgba(242,143,176,.4);font-size:calc(13px*var(--fs));color:var(--sub);line-height:1.9}
.mp-empty-ic{display:block;font-size:calc(30px*var(--fs));color:#E9A9C0;margin-bottom:4px}
.mp-empty i{font-style:normal;font-size:calc(11.5px*var(--fs))}

/* ===== 图片失效时的体面占位（不再露出浏览器默认的破图 / alt 文字）===== */
.media-dead{display:inline-flex;align-items:center;justify-content:center;
  padding:8px 14px;margin:4px 0;border-radius:12px;font-size:calc(12px*var(--fs));
  color:var(--sub);background:rgba(255,255,255,.66);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}

/* ===== 问卷（颜色全部走主题变量，切主题会跟着变）===== */
.sv-new{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:15px;font-weight:700;color:var(--green);cursor:pointer}
.sv-new .ic{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.sv-new small{display:block;font-weight:400;color:var(--sub);font-size:11.5px;margin-top:2px}
.sv-t{font-size:12.5px;font-weight:700;color:var(--green);margin:16px 4px 7px;letter-spacing:.5px}
.sv-t .n{color:var(--sub);font-weight:400;margin-left:6px}
.sv-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 15px}
.sv-empty{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;color:var(--sub);font-size:13px}
.sv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.sv-row:first-child{border-top:0}
.sv-row .tt{font-weight:700;font-size:14.5px;color:var(--ink)}
.sv-row .mt{font-size:11.5px;color:var(--sub);margin-top:3px}
.sv-tag{font-size:11px;padding:3px 9px;border-radius:10px;white-space:nowrap}
.sv-tag.done{background:var(--green-soft);color:var(--green);font-weight:700}
.sv-tag.wait{background:var(--orange-soft);color:var(--orange)}
.sv-tag.todo{background:rgba(201,123,142,.16);color:#B96A84;font-weight:700}
.sv-grp{margin-top:12px}
.sv-gt{font-size:12.5px;font-weight:700;color:var(--ink);margin:0 2px 6px;display:flex;justify-content:space-between}

function fmtAgo(ts){
  var df=Math.floor((now()-ts)/1000);
  if(df<60)return '刚刚';
  if(df<3600)return Math.floor(df/60)+'分钟前';
  if(df<86400)return Math.floor(df/3600)+'小时前';
  if(df<604800)return Math.floor(df/86400)+'天前';
  return fmtTime(ts);
}
function fmtTime(ts){
  var d=new Date(ts),td=new Date();
  var hh=('0'+d.getHours()).slice(-2),mm=('0'+d.getMinutes()).slice(-2),hm=hh+':'+mm;
  var d0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  var t0=new Date(td.getFullYear(),td.getMonth(),td.getDate()).getTime();
  if(d0===t0)return hm;
  if(d0===t0-86400000)return '昨天 '+hm;
  if(d.getFullYear()===td.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';

  if(s<60)return s+'秒';

  var opts=[['主存档',KEY],['镜像',KEY_MIRROR],['上一份备份',KEY+'_bak'],['损坏原文',KEY_RAW]];
  var out=[];
  for(var i=0;i<opts.length;i++){
    var v=null;
    try{v=localStorage.getItem(opts[i][1])}catch(e){}
    out.push({n:opts[i][0],len:v?v.length:0});
  }
  return out;
}
/** 手动释放：把旧副本挪进大容量存储再从 localStorage 删掉，然后重写存档 */
function freeLocalSpace(){
  var keys=[['mirror',KEY_MIRROR],['bak',KEY+'_bak'],['rawfail',KEY_RAW]];
  var freed=0,cnt=0;
  for(var i=0;i<keys.length;i++){
    var v=null;
    try{v=localStorage.getItem(keys[i][1])}catch(e){}
    if(!v)continue;
    try{idbPut('spill_'+keys[i][0],v)}catch(e){}
    try{localStorage.removeItem(keys[i][1]);freed+=v.length;cnt++}catch(e){}
  }
  var ok=false;
  try{window.__saveErr=null;ok=save()}catch(e){}
  if(!cnt)toast('没有可释放的旧副本');
  else if(ok)toast('已释放约 '+fmtBytes(freed)+'（'+cnt+' 份旧副本），存档已重新写入');
  else toast('释放了约 '+fmtBytes(freed)+'，但仍写入失败，请看下面的诊断');
  fillStoragePanel();
}
function fmtBytes(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(0)+' KB';
  if(n<1073741824)return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
/** 设置页的存储面板：已用 / 可用 / 图片占用（真实数字，来自浏览器） */
function fillStoragePanel(){
  var el=document.getElementById('stgBox');
  if(!el)return;
  var est=(navigator.storage&&navigator.storage.estimate)?navigator.storage.estimate().catch(function(){return null}):Promise.resolve(null);
  var per=(navigator.storage&&navigator.storage.persisted)?navigator.storage.persisted().catch(function(){return false}):Promise.resolve(false);
  Promise.all([est,mediaStats(),per,idbGet('full').catch(function(){return null})]).then(function(a){
    var e=a[0],m=a[1],persisted=a[2],_full=a[3];
    var h='';
    if(e&&e.quota){
      var pct=Math.min(100,Math.round((e.usage||0)/e.quota*100));
      h+='<div class="stg-row"><span>已用</span><b>'+fmtBytes(e.usage)+'</b></div>';
      h+='<div class="stg-row"><span>可用</span><b>'+fmtBytes(e.quota)+'</b></div>';
      h+='<div class="stg-bar"><i style="width:'+pct+'%"></i></div>';
    }else{
      h+='<div class="stg-row"><span>这个浏览器没有提供容量数字</span><b></b></div>';
    }
    h+='<div class="stg-row"><span>图片</span><b>'+m.n+' 张 · '+fmtBytes(m.bytes)+'</b></div>';
    h+='<div class="stg-row"><span>持久化保护</span><b>'+(persisted?'已开启':'未开启')+'</b></div>';
    h+='<div class="stg-sub">主存储（大容量）</div>';
    h+='<div class="stg-row"><span>完整存档</span><b>'+(_full?fmtBytes(String(_full).length):'还没有')+'</b></div>';
    h+='<div class="stg-row"><span>上次写入</span><b>'+esc(String(window.__saveDb||'—'))+'</b></div>';
    h+='<div class="stg-sub">本机存档占用</div>';
    var _ls=localKeySizes();
    for(var _li=0;_li<_ls.length;_li++)h+='<div class="stg-row"><span>'+_ls[_li].n+'</span><b>'+fmtBytes(_ls[_li].len)+'</b></div>';
    if(window.__saveErr){
      h+='<div class="stg-row stg-err"><span>上次保存出错</span><b>'+esc(String(window.__saveErr.name||'')+' '+(window.__saveErr.msg||''))+'</b></div>';
    }else{
      h+='<div class="stg-row"><span>上次保存</span><b>'+(window.__saveStatus||'ok')+'</b></div>';
    }
    h+='<div class="stg-acts"><button class="btn ghost" style="flex:1" data-act="stg-free">释放本地空间</button></div>';
    h+='<div class="stg-acts"><button class="btn ghost" style="flex:1" data-act="stg-persist">'+(persisted?'重新申请':'申请持久化')+'</button><button class="btn ghost" style="flex:1" data-act="stg-refresh">刷新</button></div>';
    el.innerHTML=h;
  }).catch(function(){ el.innerHTML='<div class="stg-row"><span>读取失败</span><b></b></div>' });
}
function stgPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persist().then(function(ok){
        toast(ok?'浏览器已授予持久化存储保护':'浏览器暂未授予，请避免清理网站数据');
        fillStoragePanel();
      }).catch(function(){toast('申请失败')});
    }else toast('这个浏览器不支持持久化申请');
  }catch(e){toast('申请失败')}
}
/** dataURL -> Blob（老代码产出的都是 dataURL） */
function dataUrlToBlob(u){
  try{
    var i=u.indexOf(',');if(i<0)return null;
    var head=u.slice(0,i),body=u.slice(i+1);
    if(head.indexOf('base64')<0)return null;
    var mime=(head.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
    var bin=atob(body),len=bin.length,arr=new Uint8Array(len);
    for(var k=0;k<len;k++)arr[k]=bin.charCodeAt(k);
    return new Blob([arr],{type:mime});
  }catch(e){return null}
}
/** 把一段图片数据（dataURL 或 Blob）收进媒体库 -> 引用串。失败就原样返回旧值。 */
function mediaAdopt(data,name){
  if(!data)return Promise.resolve('');
  if(isMediaRef(data))return Promise.resolve(data);
  var blob=(typeof data==='string')?dataUrlToBlob(data):data;
  if(!blob)return Promise.resolve(data);
  return mediaPut(blob,name).then(function(ref){return ref||data});
}
var _mediaPending={};
/* ★ 已知取不到的媒体引用。
   iOS 清理站点数据、或导入备份但图片没跟着来时，IndexedDB 里的图会真的没了。
   以前遇到这种情况会渲染出 <img src="">，浏览器就把 alt 文案（"表情包"/"图片"）
   显示成一个空白破框 —— 用户截图里那个白框就是这么来的。
   现在：登记下来 → 给个透明像素（不再露 alt）→ 重要位置改成体面的占位提示。 */
var _mediaMissing={};
var TINY_PX='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
function mediaDead(v){ return !!(v&&_mediaMissing[v]) }
/** 同步取地址：已解析过就直接给；没解析过先返回空，并异步解析后自动补渲染。
    这样所有老的渲染代码只要把"图片值"换成这个函数即可，不用重写 HTML 结构。 */
function mediaUrlSync(v){
  if(!v)return '';
  if(!isMediaRef(v))return v;                 /* 老 dataURL 原样返回 */
  var u=_mediaUrlCache[v];
  if(u)return u;
  if(_mediaMissing[v])return TINY_PX;                    /* ★ 确认没了 → 透明像素，别露 alt 文字 */
  if(!_mediaPending[v]){
    _mediaPending[v]=1;
    mediaUrl(v).then(function(url){
      delete _mediaPending[v];
      try{renderAll()}catch(e){}                         /* 成功或失败都重绘一次 */
      /* ★ 一起听的独立空间不归 renderAll 管（它挂在 body 上），
         这里必须单独叫它重画一次 —— 否则上传的壁纸要"退出再进"才显示得出来。 */
      try{if(_lsnEl)musSpacePaint(true)}catch(e){}
      try{ntfRefreshAvatar()}catch(e){}                  /* 通知条的头像也补上 */
    }).catch(function(){                                  /* ★ 万一是 reject，别把 pending 卡死 */
      delete _mediaPending[v]; _mediaMissing[v]=1;
      try{renderAll()}catch(e){}
      try{if(_lsnEl)musSpacePaint(true)}catch(e){}
      try{ntfRefreshAvatar()}catch(e){}
    });
  }
  return '';
}
/** 收集状态里所有媒体引用（用于启动时一次性解析成地址） */
function collectMediaRefs(root){
  root=root||state;
  var out={},i;
  for(i=0;i<IMG_PATHS.length;i++){var v=imgAt(root,IMG_PATHS[i]);if(isMediaRef(v))out[v]=1}
  if(root.widgetImgs)for(var wk in root.widgetImgs)if(isMediaRef(root.widgetImgs[wk]))out[root.widgetImgs[wk]]=1;
  if(root.widgetPhoto&&isMediaRef(root.widgetPhoto.img))out[root.widgetPhoto.img]=1;
  if(root.appIcons)for(var ak in root.appIcons)if(isMediaRef(root.appIcons[ak]))out[root.appIcons[ak]]=1;
  if(root.stickers)for(i=0;i<root.stickers.length;i++){var sv=root.stickers[i]&&root.stickers[i].img;if(isMediaRef(sv))out[sv]=1}
  if(root.contacts)for(i=0;i<root.contacts.length;i++){var cv=root.contacts[i]&&root.contacts[i].avatarImg;if(isMediaRef(cv))out[cv]=1}
  if(root.me&&isMediaRef(root.me.avatarImg))out[root.me.avatarImg]=1;
  if(root.messages)for(i=0;i<root.messages.length;i++){var mv=root.messages[i]&&root.messages[i].img;if(isMediaRef(mv))out[mv]=1}
  if(root.posts)for(i=0;i<root.posts.length;i++){
    var po=root.posts[i];
    if(po&&isMediaRef(po.avatarImg))out[po.avatarImg]=1;
    if(po&&isMediaRef(po.sticker))out[po.sticker]=1;
    if(po&&Array.isArray(po.imgs))for(var j=0;j<po.imgs.length;j++)if(isMediaRef(po.imgs[j]))out[po.imgs[j]]=1;
  }
  var keys=[];for(var k in out)keys.push(k);
  return keys;
}
/** 启动时把所有引用一次性解析成 blob 地址，之后渲染就能同步拿到 */
function mediaPreload(){
  var refs=collectMediaRefs();
  if(!refs.length)return;
  var n=0;
  for(var i=0;i<refs.length;i++){
    mediaUrl(refs[i]).then(function(u){ if(u)n++; });
  }
}
/** 老存档里的 base64 图片，在后台一张一张搬进媒体库。
    搬成功才把状态里的值换成引用 —— 失败就原样保留，绝不会把图弄丢。
    这一步是"内存真正变小"落到你已有数据上的关键：搬完之后，
    图片本体在 IndexedDB 里是二进制，不再以文本形式占着内存。 */
var _mediaMigrating=false;
function legacyMediaJobs(){
  var jobs=[],seen={};
  function consider(path){
    if(seen[path])return;
    var v=imgAt(state,path);
    if(typeof v==='string'&&v.length>IMG_SAFE&&v.indexOf('data:')===0){seen[path]=1;jobs.push(path)}
  }
  var i;
  for(i=0;i<IMG_PATHS.length;i++)consider(IMG_PATHS[i]);
  if(state.widgetImgs)for(var wk in state.widgetImgs)consider('widgetImgs.'+wk);
  if(state.widgetPhoto)consider('widgetPhoto.img');
  if(state.appIcons)for(var ak in state.appIcons)consider('appIcons.'+ak);
  if(state.stickers)for(i=0;i<state.stickers.length;i++)consider('stickers.'+i+'.img');
  if(state.contacts)for(i=0;i<state.contacts.length;i++)consider('contacts.'+i+'.avatarImg');
  if(state.messages)for(i=0;i<state.messages.length;i++)consider('messages.'+i+'.img');
  if(state.posts)for(i=0;i<state.posts.length;i++){
    consider('posts.'+i+'.avatarImg');
    if(state.posts[i]&&Array.isArray(state.posts[i].imgs))
      for(var j=0;j<state.posts[i].imgs.length;j++)consider('posts.'+i+'.imgs.'+j);
  }
  return jobs;
}
function migrateLegacyMedia(){
  if(_mediaMigrating)return;
  if(state._mediaMigrated)return;
  var jobs=legacyMediaJobs();
  if(!jobs.length){ state._mediaMigrated=1; return }
  _mediaMigrating=true;
  var idx=0,moved=0;
  window.__mediaMigrateTotal=jobs.length;
  function step(){
    if(idx>=jobs.length){
      _mediaMigrating=false;
      state._mediaMigrated=1;
      window.__mediaMigrateDone=moved;
      try{save()}catch(e){}
      try{mediaPreload()}catch(e){}
      try{renderAll()}catch(e){}
      return;
    }
    var path=jobs[idx++];
    var val=imgAt(state,path);
    if(typeof val!=='string'||val.indexOf('data:')!==0){ setTimeout(step,8); return }
    mediaAdopt(val,'migrated').then(function(ref){
      if(ref&&isMediaRef(ref)){ try{imgSet(state,path,ref);moved++}catch(e){} }
      setTimeout(step,8);
    }).catch(function(){ setTimeout(step,8) });
  }
  /* 等界面先画完再开始搬，别抢首屏 */
  setTimeout(step,1500);
}
function mediaSet(el,url,mode){
  if(!el||!url)return;
  if(mode==='bg')el.style.backgroundImage='url("'+url+'")';
  else el.setAttribute('src',url);
}
function mediaApply(el,value,mode){
  if(!el||!value)return;
  if(!isMediaRef(value)){mediaSet(el,value,mode);return}
  var u=_mediaUrlCache[value];
  if(u){mediaSet(el,u,mode);return}
  mediaUrl(value).then(function(url){if(url)mediaSet(el,url,mode)});
}
/** 渲染后统一补水：把 [data-media] 元素接上真正的地址。
    所有图片位置都只写这个属性，不再往 HTML 里内联 base64。 */
var _mhTimer=null;
function mediaHydrate(root){
  root=root||document;
  var els;
  try{els=root.querySelectorAll('[data-media]')}catch(e){return}
  for(var i=0;i<els.length;i++){
    var el=els[i],v=el.getAttribute('data-media');
    if(!v)continue;
    if(el.getAttribute('data-media-done')===v)continue;
    el.setAttribute('data-media-done',v);
    mediaApply(el,v,el.getAttribute('data-media-mode')||'img');
  }
}
function scheduleMediaHydrate(){
  if(_mhTimer)return;
  _mhTimer=setTimeout(function(){
    _mhTimer=null;
    mediaHydrate();
    /* 异步读回图片后可能有新元素进来，再补一次 */
    setTimeout(mediaHydrate,120);
  },0);
}
/** 生成图片属性片段：引用与老 dataURL 都走同一条路（都靠补水贴上去） */
function mediaAttr(v,mode){
  if(!v)return '';
  return ' data-media="'+esc(v)+'" data-media-mode="'+(mode==='bg'?'bg':'img')+'"';
}
/** 媒体库自检：拿不到大容量存储时明确告知，避免用户以为图丢了 */
function mediaSelfCheck(){
  mediaPut(new Blob(['1'],{type:'text/plain'}),'__probe').then(function(ref){
    if(!ref)toast('提示：图片存储不可用，新上传的图片可能无法保存，请检查浏览器存储权限');
  });
}
function idbOpen(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open('zika-store',1);
      r.onupgradeneeded=function(){try{r.result.createObjectStore('big')}catch(e){}}
      r.onsuccess=function(){res(r.result)}
      r.onerror=function(){rej(r.error)}
      r.onblocked=function(){rej(new Error('blocked'))}
    }catch(e){rej(e)}
  });
}
var _idbWarned=false;
function idbWarn(){
  if(_idbWarned)return;_idbWarned=true;
  if(typeof toast==='function')toast('提示：浏览器大容量存储不可用，聊天记录会改用本地存档保存，建议在 设置→备份 导出备份');
}
function idbPut(key,val){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction('big','readwrite');
        tx.objectStore('big').put(val,key);
        tx.oncomplete=function(){res(1)}
        tx.onerror=function(){rej(tx.error)}
        tx.onabort=function(){rej(tx.error)}
      }catch(e){rej(e)}
    });
  }).catch(function(){idbWarn()});
}
/** 会如实告诉成败的写入：idbPut 内部把错误吞掉了，
    拿它来判断"存好了没有"会得出假成功，所以另开一个。 */
function idbPutOK(key,val){
  return idbOpen().then(function(db){
    if(!db)return false;
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction('big','readwrite');
        tx.objectStore('big').put(val,key);
        tx.oncomplete=function(){res(true)};
        tx.onerror=function(){rej(tx.error)};
        tx.onabort=function(){rej(tx.error)};
      }catch(e){rej(e)}
    });
  }).then(function(){return true}).catch(function(){try{idbWarn()}catch(e){}return false});
}
/** 写入整份存档前的保护：
    启动时如果本机缓存被裁过（比如消息被裁成 0 条），
    紧接着的 boot 保存会拿这份"假空档"去覆盖大容量存储里的厚实副本 —— 那就真丢了。
    所以先比一比：新的这份明显更空、而库里那份还很厚，就跳过覆盖。 */
var _idbFullLen=null,_idbFullRich=null;
/* 高频保存的合并：发一条消息就存一次，存档大时每次 1 秒多，手机上会明显卡。
   合并成"最多约 1 秒写一次 + 最后一版一定补写"，既不丢数据也不卡。 */
var _fullTimer=null,_fullDirty=null,_lastFullJson=null;
function scheduleFullWrite(json){
  if(json&&json===_lastFullJson){ window.__saveDb=window.__saveDb||'ok'; return }
  _fullDirty=json;
  if(_fullTimer)return;
  /* 本机那份被裁过时，IndexedDB 就是唯一完整副本 —— 这种情况必须尽快落盘，
     不然这 1 秒里被系统杀掉进程，刚发的消息就没了。
     本机那份是完整的（没被裁）才允许合并等待。 */
  var _delay=window.__saveLocalLossy?80:900;
  _fullTimer=setTimeout(function(){
    _fullTimer=null;
    var j=_fullDirty;_fullDirty=null;
    if(!j)return;
    idbPutFullSafe(j).then(function(good){
      window.__saveDb=good;
      if(good!=='fail'){_lastFullJson=j;window.__saveIdbAt=Date.now();return}
      /* 大容量存储没写进去：本机那份完整就没事，被裁过就必须报警 */
      window.__saveErr={t:Date.now(),name:'IdbWriteFailed',msg:'大容量存储写入失败',bytes:(j||'').length};
      var _lossy=!!window.__saveLocalLossy||window.__saveStatus==='dbonly';
      if(_lossy)window.__saveStatus='failed';
      if(_lossy&&typeof toast==='function')toast('保存出问题了：本机缓存被裁、大容量存储又写不进去。请立刻到 设置→备份 导出备份');
      /* 兜底：至少把大表写进 big 仓库，多留一条命 */
      idbDumpNow();
    });
  },_delay);
}
/** 页面要关了：把还没落盘的那一版补上 */
function flushFullWrite(){
  if(_fullTimer){clearTimeout(_fullTimer);_fullTimer=null}
  var j=_fullDirty;_fullDirty=null;
  if(j&&j!==_lastFullJson){ try{idbPutOK('full',j);_lastFullJson=j}catch(e){} }
  idbDumpNow();
}
function idbPutFullSafe(json){
  function richOf(txt){
    try{
      var o=JSON.parse(txt);
      var m=(o&&Array.isArray(o.messages))?o.messages.length:0;
      var c=(o&&Array.isArray(o.cards))?o.cards.length:0;
      return m+c;
    }catch(e){return -1}
  }
  function write(){ return idbPutOK('full',json).then(function(good){ if(good)_idbFullLen=json.length; return good?'ok':'fail' }) }
  var newLen=json.length;
  /* 常见路径：新存档跟库里那份差不多大 → 不存在"被裁空"的风险，
     直接写，**不读库也不解析**。（大存档时这一下能省掉整份读+整份 parse） */
  if(!window.__forceFullWrite&&_idbFullLen!=null&&newLen>_idbFullLen*0.5)return write();
  /* 慢路径：新存档明显变小了，才去比一比是不是"启动时本机缓存被裁过"造成的假空档 */
  return idbGet('full').then(function(old){
    if(typeof old==='string'&&old.length>200){
      _idbFullLen=old.length;
      if(!window.__forceFullWrite&&_idbFullRich==null)_idbFullRich=richOf(old);
      var a=_idbFullRich,b=richOf(json);
      if(a!=null&&a>=20&&b<a*0.5){
        window.__saveSkippedBackup=1;
        window.__saveNote='这次的存档比大容量存储里的旧存档少很多，已跳过覆盖以保护数据（下次存完整内容时会正常写入）';
        return 'kept';
      }
      _idbFullRich=b;
    }
    return write();
  }).catch(function(){return write()});
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction('big','readonly');
        var g=tx.objectStore('big').get(key);
        g.onsuccess=function(){res(g.result)}
        g.onerror=function(){rej(g.error)}
      }catch(e){rej(e)}
    });
  }).catch(function(){return null});
}
/* 有些浏览器（含 iOS 无痕、file://）不支持持久存储，申请一下能显著降低被系统清理的概率 */
try{
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
}catch(e){}

/** 写入一份存档。设置永远先同步落盘；大图只留清单（本体在 IndexedDB）；

function writeLocal(json){

  if(_localDrop>0&&Array.isArray(obj.messages)&&obj.messages.length>_localDrop){
    obj.messages=obj.messages.slice(_localDrop);

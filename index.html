  if(state.statusCards.length)state.currentStatus={text:pick(state.statusCards).text,ts:now()};
  if(state.moodCards.length)state.currentMood={text:pick(state.moodCards).text,ts:now()};
  save();
}
function statusChip(){
  return '<span class="chip b-soft">'+esc(state.currentStatus.text)+'</span><span class="chip">'+esc(state.currentMood.text)+'</span>';
}

/* ================= 字卡抽取 ================= */
function drawCards(n,poolArr){
  var pool=(poolArr||state.cards).slice();
  var out=[],k=0;
  while(pool.length&&out.length<n&&k<100){
    var i=Math.floor(Math.random()*pool.length);
    out.push(pool.splice(i,1)[0].text);k++;
  }
  return out;
}
var FALLBACK=['收到，我在。','嗯，我在听。','记下了。','好，就这么说定了。'];
function drawCardText(){var d=drawCards(1);return d.length?d[0]:pick(FALLBACK)}
function pickCardText(used){
  if(!state.cards.length)return drawCardText();
  /* 按分类分组并缓存（字卡库变了自动失效） */
  var sig=state.cards.length+':'+(state.cards[state.cards.length-1].id||'');
  if(_cardGroups&&_cardSig!==sig){_cardGroups=null;_cardKeys=null}
  _cardSig=sig;
  var groups=_cardGroups;
  if(!groups){
    groups={};
    for(var i=0;i<state.cards.length;i++){var tg=state.cards[i].tag||'';(groups[tg]=groups[tg]||[]).push(state.cards[i])}
    _cardGroups=groups;
    _cardKeys=null;
  }
  var keys=_cardKeys;
  if(!keys){keys=[];for(var kk in groups)keys.push(kk);_cardKeys=keys}
  /* 分类等概率 -> 分类内"不放回"地挑，保证同一条消息里不会重复用同一张字卡 */
  var order=_shuffleKeys(keys),fallback='';
  for(var a=0;a<order.length;a++){
    var g=groups[order[a]];
    if(!g||!g.length)continue;
    var pool=_unusedTexts(g,used);
    if(!pool.length)continue;
    var text=pool[Math.floor(Math.random()*pool.length)];
    if(!fallback)fallback=text;
    if(!used||used.indexOf(text)<0)return text;
  }
  return fallback||drawCardText();
}
function _shuffleKeys(keys){
  var a=keys.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function _unusedTexts(g,used){
  var out=[];
  for(var i=0;i<g.length;i++){
    var tx=g[i].text;
    if(!used||used.indexOf(tx)<0)out.push(tx);
  }
  return out;
}
var _cardGroups=null,_cardKeys=null,_cardSig=null;
function cardLibChanged(){_cardGroups=null;_cardKeys=null}
function drawBalancedCards(n){
  var out=[],used=[];
  for(var i=0;i<n;i++){
    var t=pickCardText(used);
    if(!t)break;
    out.push(t);used.push(t);
  }
  return out;
}
function composeText(c,avoid){
  var text;
  if(c&&c.puzzle&&state.cards.length)text=drawBalancedCards(rnd(2,3)).join('\n\n');
  else text=pickCardText();
  /* 连发时尽量不出现两条一模一样的内容 */
  if(avoid!=null&&text===avoid&&state.cards.length>1){
    for(var t=0;t<3;t++){
      var alt=(c&&c.puzzle&&state.cards.length)?drawBalancedCards(rnd(2,3)).join('\n\n'):pickCardText();
      if(alt!==avoid){text=alt;break}
    }
  }
  return text;
}

/* ================= 节奏与连发 ================= */
function rndDelay(c,kind){
  var min=kind==='init'?c.initMin:c.replyMin;
  var max=kind==='init'?c.initMax:c.replyMax;
  if(min>max){var tmp=min;min=max;max=tmp}
  return rnd(min,max)*1000;
}
function pickBurstCount(c){
  if(c.burstOn===false)return 1;
  var b=c.burst||[45,32,15,6,2];
  var r=Math.random()*100,acc=0;
  for(var i=0;i<5;i++){acc+=(b[i]||0);if(r<acc)return i+1}
  return 1;
}
function pushIn(cid,text,t,replyTo){
  var m={id:uid(),contactId:cid,dir:'in',text:text,ts:t};
  if(state.settings&&state.settings.soundOn)beep();
  if(replyTo)m.replyTo=replyTo;
  state.messages.push(m);
  if(m.dir==='in'&&(location.hash.replace('#','')!=='chat'||state.activeContact!==m.contactId)){state.unread=(state.unread||0)+1;save()}
  notifyIncoming(m);
  return m;
}
function pushBurst(c,baseTs,count,quoteId){
  var prev=null;
  pushIn(c.id,composeText(c,prev),baseTs,quoteId);
  prev=state.messages[state.messages.length-1].text;
  for(var i=1;i<count;i++){
    var txt=composeText(c,prev);
    pushIn(c.id,txt,baseTs+i*rnd(20,50)*1000);
    prev=txt;
  }
}
function maybePost(c,t){
  var d0=new Date(t);d0.setHours(0,0,0,0);
  var cnt=0;
  for(var i=0;i<state.posts.length;i++){
    var p=state.posts[i];
    if(p.contactId===c.id){var d1=new Date(p.ts);d1.setHours(0,0,0,0);if(d1.getTime()===d0.getTime())cnt++}
  }
  if(cnt>=3)return;
  var lastP=0;
  for(var ip2=0;ip2<state.posts.length;ip2++)if(state.posts[ip2].contactId===c.id&&state.posts[ip2].ts>lastP)lastP=state.posts[ip2].ts;
  var st8=state.settings||{};
  var gap=rnd((st8.momMin||180)*60000,(st8.momMax||720)*60000);
  if(lastP&&t-lastP<gap*0.4)return;
  state.posts.push({id:uid(),contactId:c.id,text:pickCardText(),ts:t,comments:[]});
  feedEvent(c.name+' 发了一条朋友圈','moments');
  if(!state.nextPostDue||!state.nextPostDue[c.id])state.nextPostDue[c.id]=t+gap;
}

/* ================= 日记 ================= */
function ensureDiary(ts){
  var ds=dateStr(ts||now());
  var d=state.diary[ds];
  if(!d){
    var n=clamp((state.settings&&state.settings.diaryCount)||3,1,8);
    var body=drawCards(n).join('\n\n');
    state.diary[ds]={text:body,ts:ts||now(),mine:{text:'',ts:0},hisComments:[],myComments:[]};
    feedEvent(activeContact().name+' 写好了今天的日记','diary');
    save();
    return true;
  }
  if(!d.mine)d.mine={text:'',ts:0};
  if(!d.hisComments)d.hisComments=[];
  if(!d.myComments)d.myComments=[];
  return false;
}
function upgradeDiary(){
  var k2=state.diary||{};
  for(var k in k2){
    var d=k2[k];
    if(!d.mine)d.mine={text:'',ts:0};
    if(!d.hisComments)d.hisComments=[];
    if(!d.myComments)d.myComments=[];
  }
}

/* ================= 调度器 ================= */
var _timer=null,_typing=null,_ntfSilent=false,_ntfTimer=null;
function schedule(){
  if(_timer){clearTimeout(_timer);_timer=null}
  var items=[],t=now();
  for(var i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(m.dir==='out'&&m.readDue&&!m.read)items.push({ts:m.readDue,fn:(function(mm){return function(){markRead(mm)}})(m)});
    if(m.dir==='out'&&m.replyDue&&!m.answered)items.push({ts:m.replyDue,fn:(function(mm){return function(){replyChat(mm)}})(m)});
    if(m.dir==='in'&&m.ts>t)items.push({ts:m.ts,fn:function(){renderChat()}});
  }
  for(var j=0;j<state.letters.length;j++){
    var l=state.letters[j];
    if(l.dir==='out'&&!l.answered&&l.replyDue)items.push({ts:l.replyDue,fn:(function(ll){return function(){replyLetter(ll)}})(l)});
  }
  for(var k=0;k<state.posts.length;k++){
    var p=state.posts[k];
    if(p.commentDue&&p.commentDue>t&&!p.commented)items.push({ts:p.commentDue,fn:(function(pp){return function(){postComment(pp)}})(p)});
  var ac2=activeContact();
  if(ac2&&state.nextPostDue&&state.nextPostDue[ac2.id])items.push({ts:state.nextPostDue[ac2.id],fn:(function(cc){return function(){maybePost(cc,now());state.nextPostDue[cc.id]=now()+rnd((state.settings.momMin||180)*60000,(state.settings.momMax||720)*60000);save();schedule()}})(ac2)});
  if(state.settings&&state.settings.visitorOn){
    if(!state.nextVisitDue)state.nextVisitDue=t+rnd((state.settings.visitorMin||180)*60000,(state.settings.visitorMax||720)*60000);
    items.push({ts:state.nextVisitDue,fn:function(){state.lastVisit=now();state.visitorCount=(state.visitorCount||0)+1;state.nextVisitDue=now()+rnd((state.settings.visitorMin||180)*60000,(state.settings.visitorMax||720)*60000);save();renderAll()}});
  }
  }
  var acX=activeContact();
  if(acX&&state.settings&&state.settings.callOn!==false){
    var cmn=(state.settings.callMin!=null?state.settings.callMin:15),cmx=(state.settings.callMax!=null?state.settings.callMax:60);
    if(cmn>cmx){var cq0=cmn;cmn=cmx;cmx=cq0}
    if(!state.nextCallDue)state.nextCallDue=t+rnd(cmn,cmx)*60000;
    items.push({ts:state.nextCallDue,fn:(function(cc){return function(){
      if(Math.random()*100<(cc.callPct==null?30:cc.callPct))beginCall('voice');
      state.nextCallDue=now()+rnd(cmn,cmx)*60000;save();schedule();
    }})(acX)});
  }
  if(acX&&state.settings&&state.settings.letterInitOn!==false){
    var lmn=(state.settings.letterInitMin!=null?state.settings.letterInitMin:180),lmx=(state.settings.letterInitMax!=null?state.settings.letterInitMax:1920);
    if(lmn>lmx){var lq0=lmn;lmn=lmx;lmx=lq0}
    if(!state.nextLetterDue)state.nextLetterDue=t+rnd(lmn,lmx)*60000;
    items.push({ts:state.nextLetterDue,fn:(function(cc){return function(){var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);state.letters.push({id:uid(),contactId:cc.id,dir:'in',title:pick(['晚风来信','今日小笺','随手写给你','想你了']),body:drawCards(n).join('\n\n'),ts:now(),unread:true});feedEvent(cc.name+' 给你寄来一封信','mail');state.nextLetterDue=now()+rnd(lmn,lmx)*60000;save();renderAll();schedule()}})(acX)});
  }
  var ddq=state.diaryDue||[];
  for(var di=0;di<ddq.length;di++){
    var de=ddq[di];
    if(de&&de.due&&de.due>t)items.push({ts:de.due,fn:(function(ee){return function(){diaryDueFire(ee)}})(de)});
  }
  for(var cid in state.nextInit){
    var c=contact(cid);
    if(!c)continue;
    var nt=state.nextInit[cid];
    if(!nt)nt=t+rndDelay(c,'init');
    items.push({ts:nt,fn:(function(cc){return function(){initiate(cc)}})(c)});
  }
  if(!items.length)return;
  items.sort(function(a,b){return a.ts-b.ts});
  var nx=items[0];
  var wait=nx.ts-now();
  if(wait>0)_timer=setTimeout(function(){nx.fn();schedule()},Math.min(wait,2147483000));
  else{nx.fn();schedule()}
}
function markRead(m){
  if(m.read)return;
  m.read=true;
  var c=contact(m.contactId);
  if(c&&c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null;m.answered=true}
  else if(c){_typing={contactId:c.id,ts:now(),hold:true}}
  save();renderChat();
}
function initiate(c){
  refreshMood();
  if(state.checkinPresets&&state.checkinPresets.length&&Math.random()*100<((state.settings&&state.settings.checkinPct)!=null?state.settings.checkinPct:25)){state.messages.push({id:uid(),contactId:c.id,dir:'in',kind:'checkin',text:'查岗：'+pick(state.checkinPresets),ts:now()});save();renderChat()}
  pushBurst(c,now(),pickBurstCount(c));
  feedEvent(c.name+' 给你发来了消息','chat');
  if(Math.random()*100<((state.settings&&state.settings.postPct)!=null?state.settings.postPct:50))maybePost(c,now());
  state.nextInit[c.id]=now()+rndDelay(c,'init');
  save();renderAll();schedule();
}
function rndLetterDelay(c){
  var min=c.letterMin||600,max=c.letterMax||7200;
  if(min>max){var tmp=min;min=max;max=tmp}
  return rnd(min,max)*1000;
}
function replyLetter(l){
  var c=contact(l.contactId);if(!c)return;
  l.answered=true;
  var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);
  var pool=state.writerCards&&state.writerCards.length?state.writerCards:state.cards;
  var body=drawCards(n,pool).join('\n\n');
  if(!body)body=drawCardText();
  state.letters.push({id:uid(),contactId:c.id,dir:'in',title:'Re：'+(l.title||'来信'),body:body,ts:now(),unread:true});
  feedEvent(c.name+' 回信了','mail');
  save();renderMail();schedule();toast(c.name+' 回了你的信');
}
function postComment(p){
  if(p.commented)return;
  p.commented=true;
  var c=contact(p.contactId);
  if(!c)return;
  if(Math.random()*100>=(c.replyPct||100))return;
  p.comments.push({id:uid(),contactId:c.id,text:drawCardText(),ts:now()});
  save();renderMoments();
}

function inChatView(){
  return location.hash.replace('#','')==='chat';
}
function renderChat(){
  /* 只有正停在聊天页时才整页重绘。否则（例如来电时）只更新聊天列表那一块，
     绝不把用户当前所在的页面覆盖成聊天页 */
  if(!inChatView()&&!document.getElementById('chatList'))return;
  var c=activeContact(),msgs=[];
  if(state.unread){state.unread=0;save()}
  var t=now();
  for(var i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(m.contactId===c.id&&m.ts<=t)msgs.push(m);
  }
  var top='<div class="chat-top"><button class="back" data-view="home">'+ICON_BACK+'</button><span class="pat-av" data-act="pat">'+avatarHtml(c,32)+'</span><div class="ct-who"><div class="ct-name">'+esc(c.name)+'</div><div class="ct-chips">'+statusChip()+'</div></div><div class="pr"><button class="back" data-act="call-voice" title="语音电话">'+ICON_CALL+'</button><button class="back" data-act="call-video" title="视频电话">'+ICON_VIDEO+'</button><button class="back" data-act="chat-room" title="聊天室设置">'+ICON_MORE+'</button></div></div>';
  var body='<div class="chat-wrap"><div id="chatList" style="'+chatBgStyle()+'">';
  if(!msgs.length)body+='<div class="empty"><span class="big">字</span>还没有消息，先打个招呼吧</div>';
  for(var j=0;j<msgs.length;j++)body+=bubbleHtml(msgs[j],c);
  if((state.settings&&state.settings.typingOn!==false)&&_typing&&_typing.contactId===c.id&&(_typing.hold||now()-_typing.ts<8000)){
    body+=typingRow(c);
  }
  body+='</div>';
  if(_quoteId){
    body+='<div class="quote-bar"><span class="txt">回复：'+esc(trunc(msgText(_quoteId),26))+'</span><button data-act="quote-cancel">取消</button></div>';
  }
  body+=multiBarHtml();
  body+='<div class="chat-input"><button class="tool-btn" data-act="tools">'+ICON_PLUS+'</button><textarea id="chatText" rows="1" placeholder="说点什么…"></textarea><button class="tool-btn" data-act="emoji">'+ICON_EMOJI+'</button><button data-act="send-chat">发送</button></div></div>';
  if(inChatView()){
    $('#view').innerHTML=top+body;
  }else{
    /* 不在聊天页：只把聊天列表那一块更新掉，不动当前页面 */
    var list=document.getElementById('chatList');
    if(!list)return;
    var wrap=list.parentNode;
    if(!wrap)return;
    var holder=document.createElement('div');
    holder.innerHTML=body;
    var fresh=holder.querySelector('.chat-wrap');
    if(fresh)wrap.innerHTML=fresh.innerHTML;
  }
  applyChatCss();
  var list2=$('#chatList');if(list2)list2.scrollTop=list2.scrollHeight;
  var ta=$('#chatText');
  if(ta){
    ta.addEventListener('input',function(){ta.style.height='auto';ta.style.height=Math.min(96,ta.scrollHeight)+'px'});
    ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
  }
}

/* ===== 图片选取：尽量不损失画质 =====
   以前壁纸会被压到最长边 1600 再用 JPEG 0.92 重编码，iPhone 截图（1179×2556）
   缩放后必然发糊。现在：壁纸/封面在安全范围内保持原分辨率，并且用无损 PNG，
   只有实在过大时才适度缩小。 */
function encodeImg(img,maxSide,opts){
  opts=opts||{};
  var w=img.width,h=img.height;
  var sc=Math.min(1,maxSide/Math.max(w,h));
  var cw=document.createElement('canvas');
  cw.width=Math.max(1,Math.round(w*sc));cw.height=Math.max(1,Math.round(h*sc));
  var cx=cw.getContext('2d');
  cx.imageSmoothingEnabled=true;
  cx.imageSmoothingQuality='high';
  cx.drawImage(img,0,0,cw.width,cw.height);
  /* 没有缩小就优先无损 PNG，彻底避免二次压缩发糊 */
  if(sc>=1&&opts.allowPng!==false){
    try{var png=cw.toDataURL('image/png');if(png&&png.length<4200000)return png}catch(e){}
  }
  return cw.toDataURL(opts.mime||'image/jpeg',opts.q==null?0.95:opts.q);
}
function pickImageFile(input,onDone){
  if(!input.files||!input.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){try{onDone(img)}catch(e){toast('图片处理失败：'+e.message)}input.value=''};
    img.onerror=function(){toast('这张图片读不出来，换一张试试');input.value=''};
    img.src=fr.result;
  };
  fr.readAsDataURL(input.files[0]);
}
function readUploadImg(input,kind){

function importCards(file){
  if(!file.files||!file.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var arr=d&&d.app==='zika-cards'&&Array.isArray(d.cards)?d.cards:(Array.isArray(d)?d:null);
      if(!arr||!arr.length){toast('没有找到字卡，请检查文件');return}
      var n=0;
      for(var i=0;i<arr.length;i++){
        var c=arr[i];
        if(!c||!c.text)continue;
        if(typeof c==='string')c={text:c};
        state.cards.push({id:uid(),text:String(c.text),tag:c.tag||'',created:now()});
        n++;
      }
      save();renderCards();toast('已导入 '+n+' 张字卡');
    }catch(e){toast('导入失败：文件无法读取')}
  };
  fr.readAsText(file.files[0]);

function fmtLeft(){
  var s=_left||0,m=Math.floor(s/60),ss=s%60;
  return ('0'+m).slice(-2)+':'+('0'+ss).slice(-2);
}
function tick(){
  var el=$('#timerText'),st=$('#timerState');
  if(!el)return;
  if(_running){
    if(_left>0){
      _left--;
      if(_left<=0){_running=false;beep();if(st)st.textContent='时间到，休息一下吧';toast('陪伴时间到！休息一下吧')}
    }
  }
  el.textContent=fmtLeft();
  if(st&&_running)st.textContent='专注中…还剩 '+fmtLeft()+'';
  if(_running)_tmrTick=setTimeout(tick,1000);
}
function modePick(id){
  var mo=findMode(id);if(!mo)return;
  _curMode=id;_left=0;_running=false;renderCompanion();
}
function timerStart(){
  if(!_curMode){toast('先选一个模式');return}
  if(_left<=0){var mo=findMode(_curMode);if(mo)_left=mo.mins*60}
  _running=true;
  beep(true);
  tick();
}
function timerPause(){_running=false;tick()}
function timerReset(){_left=0;_running=false;tick()}
function beep(init){
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended')_actx.resume();
    if(init)return;
    var o=_actx.createOscillator(),g=_actx.createGain();
    o.frequency.value=880;g.gain.value=.28;
    o.connect(g);g.connect(_actx.destination);
    o.start();
    setTimeout(function(){o.stop()},500);
  }catch(e){}
}

function unitToSec(v,unit){
  v=Math.max(1,parseInt(v,10)||1);
  return unit==='s'?v:(unit==='m'?v*60:(unit==='h'?v*3600:v*86400));
}
function pickUnitSec(secs){
  secs=Math.max(1,Math.round(secs||0));
  if(secs<60)return{val:secs,unit:'s'};
  if(secs%60===0&&secs<3600)return{val:secs/60,unit:'m'};
  if(secs%3600===0&&secs<86400)return{val:secs/3600,unit:'h'};
  if(secs%86400===0)return{val:secs/86400,unit:'d'};
  if(secs<600)return{val:secs,unit:'s'};
  return{val:Math.round(secs/60),unit:'m'};
}

function backupExport(){
  var d={app:'zika-site',version:6,exported:new Date().toISOString(),state:plainCopy(state)};
  try{delete d.state._imgs}catch(e){}
  /* 备份要能独立恢复：把 IndexedDB 里的大图也一起带上 */
  try{
    var live=imgValues(state);
    var n=0;for(var k in live)n++;
    if(n)d.images=live;
  }catch(e){}
  var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  var dt=new Date();
  a.download='字卡备份-'+dt.getFullYear()+('0'+(dt.getMonth()+1)).slice(-2)+('0'+dt.getDate()).slice(-2)+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},500);
  toast('备份已导出');
}
function importBackup(file){

  fr.onload=function(){

      if(!d||d.app!=='zika-site'||!d.state||!Array.isArray(d.state.contacts)){toast('文件格式不对，请选字卡备份文件');return}
      var s=migrate(d.state);

function replyChat(m){
  var c=contact(m.contactId);if(!c)return;
  m.answered=true;m.replyDue=null;
  if(m.kind==='poll'){replyPoll(m);return}
  var count=pickBurstCount(c),quote=null;
  if(Math.random()*100<((state.settings&&state.settings.quotePct)!=null?state.settings.quotePct:40)){
    for(var i=state.messages.length-1;i>=0;i--){
      var mm=state.messages[i];
      if(mm.dir==='out'&&mm.contactId===c.id&&mm.kind!=='poll'){quote=mm.id;break}
    }
  }
  var emojiMode=Math.random()*100<((state.settings&&state.settings.emojiPct)!=null?state.settings.emojiPct:15);
  var texts=[];
  for(var j=0;j<count;j++)texts.push(composeText(c));
  var cur=0;
  function typeStep(){
    _typing={contactId:c.id,ts:now(),hold:true};
    renderChat();
    setTimeout(function(){
      var stS=state.settings||{};
      if(cur===0&&stS.stopTyping&&Math.random()*100<(stS.stopTypingPct||15)){
        _typing=null;
        state.messages.push({id:uid(),contactId:c.id,dir:'sys',text:pick(['陆沉打了一句话又删掉了','陆沉想了想，还是没发出去','他刚打了又删了']),ts:now()});
        save();renderChat();schedule();
        return;
      }
      if(emojiMode){
        _typing=null;
        maybeEmojiReply(c);
        save();renderChat();schedule();
        return;
      }
      pushIn(c.id,texts[cur],now(),cur===0?quote:null);
      cur++;
      save();renderChat();
      if(cur<count)typeStep();
      else{_typing=null;save();schedule()}
    },rnd(900,1800));
  }
  typeStep();
}

var _ntfSW=null,_ntfSWState='idle';   /* idle | registering | ready | failed | unsupported */
function ntfRegisterSW(){
  if(!('serviceWorker' in navigator)){_ntfSWState='unsupported';return}
  if(!window.isSecureContext){_ntfSWState='insecure';return}
  if(state.settings&&state.settings.ntfSw===false){_ntfSWState='idle';return}
  if(_ntfSW||_ntfSWState==='registering')return;
  _ntfSWState='registering';
  ntfRefreshPanel();
  try{
    var code="self.addEventListener('notificationclick',function(e){e.notification.close();e.waitUntil(self.clients.matchAll({type:'window'}).then(function(l){for(var i=0;i<l.length;i++){try{l[i].postMessage({zika:'open-chat'})}catch(x){}}}))});";
    var url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    navigator.serviceWorker.register(url).then(function(r){
      _ntfSW=r;_ntfSWState='ready';ntfRefreshPanel();
    }).catch(function(){
      _ntfSW=null;_ntfSWState='failed';ntfRefreshPanel();
    });
  }catch(e){_ntfSWState='failed';ntfRefreshPanel()}
}

/** 提示音：用 WebAudio 生成两声轻响，不依赖外部文件 */
var _ntfAudio=null;
function ntfBeep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!_ntfAudio)_ntfAudio=new AC();
    var ctx=_ntfAudio;
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime;
    [[880,0,.16],[1245,.13,.2]].forEach(function(spec){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=spec[0];
      g.gain.setValueAtTime(0,t+spec[1]);
      g.gain.linearRampToValueAtTime(.09,t+spec[1]+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+spec[1]+spec[2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+spec[1]);o.stop(t+spec[1]+spec[2]+.02);
    });
  }catch(e){}
}
function ntfVibrate(){
  try{
    if(!navigator.vibrate)return;

  _ntfAgg={};
  for(var i=0;i<list.length;i++){
    var it=list[i],c=it.c;
    var prev=(state.settings&&(state.settings.ntfPreview||'full'));
    var body;
    var last=String(it.last||'').replace(/^查岗：/,'');
    if(prev==='hidden')body='有新消息';
    else if(prev==='sender')body=it.n>1?(it.n+' 条新消息'):'发来一条消息';
    else body=it.n>1?(it.n+' 条新消息：'+trunc(last,30)):trunc(last,40);
    if(!body)body='有新消息';
    try{
      if(ntfHasAPI()){
        var opt={body:body,tag:'zika-'+c.id,renotify:true,silent:!(state.settings&&state.settings.ntfSound!==false)};
        if(state.settings&&state.settings.ntfSticky===false)opt.requireInteraction=false;
        else opt.requireInteraction=true;
        var n=new Notification(c.name,opt);
        window.__lastNotification=n;
        n.onclick=function(){try{window.focus()}catch(e){};goView('chat');try{n.close()}catch(e){};};
      }
    }catch(e){}
    if(state.settings&&state.settings.ntfSound&&!(state.settings&&state.settings.ntfBgOnly===true&&!document.hidden))ntfBeep();

/* ================= 后台保活：离线补发 ================= */
function syncCatchUp(){
  _ntfSilent=true;
  var last=state.lastActive||now();
  state.lastActive=now();
  var end=now();
  if(end-last<15000){_ntfSilent=false;save();schedule();return}
  for(var k=0;k<state.contacts.length;k++){
    var c=state.contacts[k];
    var t=state.nextInit[c.id]||last,guard=0;
    while(t<end&&guard<50){
      t+=rndDelay(c,'init');
      if(t<=end){pushBurst(c,t,pickBurstCount(c));maybePost(c,t);guard++}
    }
    state.nextInit[c.id]=Math.max(t,end);
    for(var i=0;i<state.messages.length;i++){
      var m=state.messages[i];
      if(m.contactId===c.id&&m.dir==='out'){
        if(m.readDue&&!m.read&&m.readDue<=end)m.read=true;
        if(m.replyDue&&!m.answered&&m.replyDue<=end){
          m.answered=true;
          if(m.kind==='poll'){replyPoll(m,Math.min(m.replyDue,end))}
          else if(c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null}
          else pushBurst(c,Math.min(m.replyDue,end),pickBurstCount(c));
        }
      }
    }
    for(var j=0;j<state.letters.length;j++){
      var l=state.letters[j];
      if(l.contactId===c.id&&l.dir==='out'&&!l.answered&&l.replyDue&&l.replyDue<=end){
        l.answered=true;
        var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);
        var pool=state.writerCards&&state.writerCards.length?state.writerCards:state.cards;
        var body=drawCards(n,pool).join('\n\n');
        if(!body)body=drawCardText();
        state.letters.push({id:uid(),contactId:c.id,dir:'in',title:'Re：'+(l.title||'来信'),body:body,ts:Math.min(l.replyDue,end),unread:true});
      }
    }
  }
  for(var q=0;q<state.posts.length;q++){
    var p=state.posts[q];
    if(p.contactId===null&&p.commentDue&&!p.commented&&p.commentDue<=end){
      var c2=contact(state.activeContact);
      if(c2){
        p.commented=true;
        if(Math.random()<0.5)p.heLiked=true;
        if(Math.random()*100<(c2.replyPct||100))p.comments.push({id:uid(),contactId:c2.id,text:pickCardText(),ts:Math.min(p.commentDue,end)});
      }
    }
  }
  var d0=new Date(last),d1=new Date(end);
  var loop=d0;
  while(loop.getTime()<=d1.getTime()&&loop.getTime()<=end){
    ensureDiary(loop.getTime());
    loop=new Date(loop.getTime()+86400000);
    if(loop.getTime()-d1.getTime()>7*86400000)break;
  }
  _ntfSilent=false;
  save();renderAll();schedule();
  toast('补发完成：离线期间的新消息已同步');
}

/* ===== 存档健康检查：被系统清理或读取失败时，明确告诉用户并引导恢复 ===== */
function storageHealthCheck(){
  try{
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){}
  try{
    var st=window.__loadStatus,note=window.__loadNote||'';
    window.__loadStatus='';
    if(st==='fallback'){toast((note||'存档读取异常')+'，建议立刻到 设置→备份 导出备份');return}
    if(st==='restored'){if(note)toast(note);return}
    if(st==='dbonly'){
      /* 本地存档是空的：去大容量备份里找一找，找到就问用户要不要恢复 */
      idbGet('full').then(function(full){
        var ok=false;
        if(typeof full==='string'&&full.length>200){
          try{var t=JSON.parse(full);if(t&&t.contacts&&t.contacts.length)ok=true}catch(e){}
        }
        if(ok){
          if(confirm('检测到之前的完整备份还在，要现在恢复吗？（恢复后设置和聊天记录都会回来）'))importFromIdbFull(full);
        }else{
          idbGet('images').then(function(imgs){
            var n=0;if(imgs&&typeof imgs==='object')for(var k in imgs)n++;
            if(n)toast('检测到您之前设置过壁纸，但存档已被系统清理；请到 设置→备份 导入最近的备份文件');
          }).catch(function(){});
        }
      }).catch(function(){});
    }
  }catch(e){}
}
/** 从 IndexedDB 的整份备份里恢复存档 */
function importFromIdbFull(full){
  try{
    var d=JSON.parse(full);
    if(!d||!d.contacts){toast('备份内容无法识别');return}
    normalizeBig(d);
    try{d=migrate(d)}catch(e){}
    state=d;
    _imgHydrating=false;
    hydrateImages(state);
    try{save()}catch(e){}
    if(typeof renderAll==='function')renderAll();
    toast('已恢复存档');
  }catch(e){toast('恢复失败，请用 设置→备份 导入备份文件')}
}

  try{idbSelfCheck()}catch(e){}

function sendTransfer(amt){

  if(!state.wallet||state.wallet.balance<amt){toast('余额不足，去钱包看看');return}
  state.wallet.balance=Math.round((state.wallet.balance-amt)*100)/100;
  state.wallet.log.push({id:uid(),dir:'out',amount:amt,ts:now(),who:c.name});

  save();closeSheet();renderChat();toast('已转账 ¥'+amt.toFixed(2));
  setTimeout(function(){acceptTransfer(m.id)},rnd(2500,6000));
}

/* ===== v7：消息统计（聊天页顶栏入口） ===== */
function sheetStats(){
  var c=activeContact();
  var d0=new Date();d0.setHours(0,0,0,0);
  var tot=0,out=0,inn=0,today=0,todayIn=0,pz=0;
  for(var i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(m.contactId!==c.id)continue;
    if(m.dir==='out'){tot++;out++}
    else if(m.dir==='in'){tot++;inn++;if(m.text&&m.text.indexOf('\n\n')>=0)pz++}
    if(m.ts>=d0.getTime()){today++;if(m.dir==='in')todayIn++}
  }
  var w=state.wallet||{balance:888,log:[]};

/* ===== 潮汐系统 ===== */
function tideInfo(){
  var t=state.tide||{};
  if(!t||!t.start)return null;
  var st=new Date(t.start);
  if(isNaN(st.getTime()))return null;
  var cy=t.cycle||28,du=t.days||5;
  var nx=new Date(st.getTime()+cy*86400000);
  var today=new Date();today.setHours(0,0,0,0);
  var diff=Math.round((nx-today)/86400000);
  var inDays=Math.round((today-st)/86400000);
  var ovu=t.ovulation!==false;
  var status;
  if(inDays>=0&&inDays<du)status='正在经期第 '+(inDays+1)+' 天';
  else if(diff>0){
    if(ovu&&Math.abs(diff-(cy-14))<=3)status='接近排卵期，注意防护';
    else status='距离下次还有 '+diff+' 天';
  }else status='应该就在这几天';
  return {start:st,next:nx,diff:diff,status:status,cycle:cy,days:du,inDays:inDays};
}
function fmtDate(dt){
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}
function renderTide(){
  var t=state.tide||{start:'',days:5,cycle:28,history:[]};
  var info=tideInfo();
  var html='<div class="page-top"><button class="back" data-view="home">'+ICON_BACK+'</button><span class="pt">潮汐</span></div>';
  html+='<div class="screen">';
  html+='<div class="tide-hero"><div class="th-label">潮汐 · 经期记录</div>';
  if(info){
    html+='<div class="th-status">'+info.status+'</div><div class="th-next">下次预计 '+fmtDate(info.next)+'</div><div class="th-mini">周期 '+info.cycle+' 天 · 持续 '+info.days+' 天 · 上次开始 '+fmtDate(info.start)+'</div>';
  }else{
    html+='<div class="th-status">记下最近一次经期</div><div class="th-next">就能推算下次来的时间</div>';
  }
  html+='</div>';
  html+='<div class="card"><h3>记录这次</h3><div class="rhy-grid"><div class="inl"><label>开始日期</label><input id="tideStart" type="date" value="'+esc(t.start||'')+'"></div><div class="inl"><label>持续（天）</label><input id="tideDays" type="number" min="1" max="15" value="'+(t.days||5)+'"></div><div class="inl"><label>周期（天）</label><input id="tideCycle" type="number" min="15" max="60" value="'+(t.cycle||28)+'"></div></div>';
  html+='<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="flex:1" data-act="tide-save">保存</button><button class="btn ghost" style="flex:1" data-act="tide-record">记入历史</button></div>';
  html+='<p class="meta" style="margin-top:8px">排卵期提示按下次日期前推 14 天估算，仅供参考</p></div>';
  if(t.history&&t.history.length){

    for(var i=t.history.length-1;i>=0;i--){

function initWidgetDrag(){
  var grid=document.getElementById('widgetGrid');if(!grid)return;
  fitWidgetGrid();
  var drag=null,timer=null,ghost=null,startX=0,startY=0,offX=0,offY=0,manageTimer=null,movedFlag=0;
  function findW(t){var el=t;while(el&&el!==grid&&!el.classList.contains('widget'))el=el.parentNode;return el===grid?null:el}
  function clampN(v,a,b){return Math.max(a,Math.min(b,v))}
  function begin(x,y,target){
    var el=findW(target);
    if(!el||!el.classList.contains('wfree'))return;
    if(target&&target.closest&&target.closest('.wm-btn'))return;
    startX=x;startY=y;
    timer=setTimeout(function(){
      if(!el.parentNode)return;
      drag=el;
      var r=el.getBoundingClientRect();
      offX=x-r.left;offY=y-r.top;
      el.classList.add('dragging');
      grid.classList.add('editfree');
      ghost=el.cloneNode(true);
      ghost.id='dragGhost';
      ghost.className='widget';
      ghost.style.width=r.width+'px';
      ghost.style.height=r.height+'px';
      ghost.style.left='0';ghost.style.top='0';
      ghost.style.transform='translate3d('+r.left+'px,'+r.top+'px,0)';
      document.body.appendChild(ghost);
      try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
      /* 继续按住不放（不移动）= 打开这张组件的管理面板 */
      manageTimer=setTimeout(function(){
        if(drag&&!movedFlag){cancelDrag();var kk=wKeyOf(el);if(kk)sheetWidget(kk)}
      },900);
    },350);
  }
  var rafW=null;
  function cancelDrag(){
    if(manageTimer){clearTimeout(manageTimer);manageTimer=null}
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
    ghost=null;
    if(drag)drag.classList.remove('dragging');
    var g=document.getElementById('widgetGrid');
    if(g)g.classList.remove('editfree');
    drag=null;
  }
  function move(x,y){
    if(timer&&Math.abs(x-startX)+Math.abs(y-startY)>12){clearTimeout(timer);timer=null}
    if(!drag)return;
    if(Math.abs(x-startX)+Math.abs(y-startY)>10)movedFlag=1;
    if(rafW)return;
    rafW=requestAnimationFrame(function(){
      rafW=null;
      if(ghost)ghost.style.transform='translate3d('+(x-offX)+'px,'+(y-offY)+'px,0)';
    });
  }
  function end(){
    if(timer){clearTimeout(timer);timer=null}
    if(manageTimer){clearTimeout(manageTimer);manageTimer=null}
    movedFlag=0;
    if(!drag)return;
    var el=drag;
    el.classList.remove('dragging');
    grid.classList.remove('editfree');
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
    ghost=null;
    var k=wKeyOf(el);
    if(k){
      var gr=grid.getBoundingClientRect();
      var r=el.getBoundingClientRect();
      var w=el.offsetWidth||1;
      var maxX=Math.max(0,gr.width-w);
      var px=clampN(r.left-gr.left,0,maxX);
      var py=Math.max(0,r.top-gr.top);
      el.style.left=(gr.width?(px/gr.width*100):0)+'%';
      el.style.top=py+'px';
      state.widgetPos=state.widgetPos||{};
      state.widgetPos[k]={x:Math.round(gr.width?(px/gr.width*1000):0)/10,y:Math.round(py)};
      save();
      fitWidgetGrid();
    }
    drag=null;
  }
  grid.addEventListener('touchstart',function(e){var t=e.touches[0];if(t)begin(t.clientX,t.clientY,e.target)},{passive:true});
  grid.addEventListener('touchmove',function(e){
    if(!drag)return;
    var t=e.touches[0];if(t)move(t.clientX,t.clientY);
    e.preventDefault();
  },{passive:false});

function bindCallDrag(){

  function start(x,y,target){

    if(!ov||!ov.classList.contains('mini'))return;

    var el=target;
    while(el&&el!==document.body){
      if(el.getAttribute&&el.getAttribute('data-nodrag')!==null&&el.getAttribute&&el.getAttribute('data-nodrag')!==undefined){}

/* 图标拖拽：同一页内换位 + 拖到屏幕边缘自动翻页（跨页搬运） */
function bindAppDrag(grid,allGrids){
  var drag=null,timer=null,ghost=null,startX=0,startY=0;
  var edgeDir=0,edgeSince=0;
  var EDGE_PX=42,HOLD_MS=280;
  function findApp(t){var el=t;while(el&&el!==grid&&!el.classList.contains('app-item'))el=el.parentNode;return el===grid?null:el}
  function pageOf(g){return parseInt(g.getAttribute('data-page'),10)||0}
  function scrollToPage(n){
    var sc=document.getElementById('homePages');
    if(!sc)return;
    var g=allGrids[n];
    if(!g)return;
    var pg=g.closest?g.closest('.home-page'):null;
    var left=pg?pg.offsetLeft:0;
    sc.scrollTo({left:Math.max(0,left),behavior:'auto'});
  }
  function detachTo(target){
    if(!drag||!target||drag.parentNode===target)return;
    var g0=document.querySelector('.app-grid.editing');
    if(g0&&g0!==grid)g0.classList.remove('editing');
    if(drag.parentNode)drag.parentNode.removeChild(drag);
    target.appendChild(drag);
    grid=target;
    grid.classList.add('editing');
    scrollToPage(pageOf(target));
  }
  function begin(x,y,target){
    var el=findApp(target);if(!el)return;
    startX=x;startY=y;
    edgeDir=0;edgeSince=0;
    timer=setTimeout(function(){
      if(!el.parentNode)return;
      drag=el;
      el.classList.add('dragging');
      var g0=document.querySelector('.app-grid.editing');
      if(g0&&g0!==grid)g0.classList.remove('editing');
      grid.classList.add('editing');
      ghost=el.cloneNode(true);
      ghost.id='dragGhost';
      ghost.style.width=el.offsetWidth+'px';
      ghost.style.height=el.offsetHeight+'px';
      ghost.style.transform='translate3d('+(x-el.offsetWidth/2)+'px,'+(y-el.offsetHeight/2)+'px,0)';
      document.body.appendChild(ghost);
    },380);
  }
  var rafT=null;
  function move(x,y){
    if(timer&&Math.abs(x-startX)+Math.abs(y-startY)>12){clearTimeout(timer);timer=null}
    if(!drag)return;

    rafT=requestAnimationFrame(function(){
      rafT=null;
      if(ghost)ghost.style.transform='translate3d('+(x-ghost.offsetWidth/2)+'px,'+(y-ghost.offsetHeight/2)+'px,0)';
      var cur=pageOf(grid);
      var dir=0;
      if(x<=EDGE_PX&&cur>0)dir=-1;
      else if(x>=(window.innerWidth-EDGE_PX)&&cur<allGrids.length-1)dir=1;
      if(dir===0){edgeDir=0;edgeSince=0}
      else{
        var nowT=Date.now();
        if(dir!==edgeDir){edgeDir=dir;edgeSince=nowT}
        else if(nowT-edgeSince>=HOLD_MS){
          var tgt=allGrids[cur+dir];
          if(tgt){detachTo(tgt);edgeSince=nowT}
        }
      }
      var items=grid.querySelectorAll('.app-item');
      for(var i=0;i<items.length;i++){
        var it=items[i];
        if(it===drag||it.classList.contains('dragging'))continue;
        var r=it.getBoundingClientRect();
        if(x>r.left-6&&x<r.right+6&&y>r.top-6&&y<r.bottom+6){
          var a=drag,b=it;
          var ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();

          else grid.insertBefore(a,b.nextSibling);

        }
      }
    });
  }
  function end(){
    if(timer){clearTimeout(timer);timer=null}
    edgeDir=0;edgeSince=0;
    if(!drag)return;
    drag.classList.remove('dragging');
    for(var e2=0;e2<allGrids.length;e2++)allGrids[e2].classList.remove('editing');
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
    ghost=null;

    for(var pg2=0;pg2<allGrids.length;pg2++){
      var its=allGrids[pg2].querySelectorAll('.app-item');
      for(var i2=0;i2<its.length;i2++){
        var v=its[i2].getAttribute('data-view');
        if(v&&all.indexOf(v)<0)all.push(v);
      }
    }
    var prev=state.appOrder||[];
    for(var p2=0;p2<prev.length;p2++)if(all.indexOf(prev[p2])<0)all.push(prev[p2]);
    state.appOrder=all;
    save();
    drag=null;
  }
  grid.addEventListener('touchstart',function(e){var t=e.touches[0];begin(t.clientX,t.clientY,e.target)},{passive:true});
  grid.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    if(!drag){if(timer)move(t.clientX,t.clientY);return}
    move(t.clientX,t.clientY);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  grid.addEventListener('touchend',function(){end()});
  grid.addEventListener('touchcancel',function(){end()});
  grid.addEventListener('mousedown',function(e){begin(e.clientX,e.clientY,e.target);e.preventDefault()});
  document.addEventListener('mousemove',function(e){if(drag){move(e.clientX,e.clientY);e.preventDefault()}});
  document.addEventListener('mouseup',function(){end()});
}

(function(){
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act=music-play]');
    if(!b)return;
    state._mPlay=!state._mPlay;
    b.textContent=state._mPlay?'▐▐':'▶';
    if(state._mPlay)toast('正在播放 '+state.widgetMusic.song);
    else toast('已暂停');
  });
})();


</script>
<div id="ntfBar" style="display:none" onclick="ntfGo()"></div>
</body>
</html>

<style>
:root{
  --bg:#F6F1E8; --card:#FFFEFB; --ink:#33302A; --sub:#8B8172;
  --line:#E8DFCE; --green:#5F8F7B; --orange:#D98E5F; --blue:#7A9CC6; --brown:#8A7458;
  --green-soft:#E9F0E9; --orange-soft:#F8ECE2; --danger:#D4605A;
  --radius:18px; --shadow:0 3px 14px rgba(70,58,40,.09);
  --fs:1;
  --glass:rgba(255,253,248,.40); --glass-strong:rgba(255,253,248,.62);
  --glass-brd:rgba(255,255,255,.55); --glass-sh:0 8px 28px rgba(70,58,40,.10);
  --gold:#C9A227;
  --s1:rgba(255,178,200,.55); --s2:rgba(178,190,255,.5); --s3:rgba(255,208,150,.48);
  --s4:rgba(190,232,214,.5); --s5:rgba(255,240,190,.38); --s6:rgba(200,220,255,.34);
  --body-g1:#F8F3E9; --body-g2:#F0E6D8;
  --serif:'Songti SC','STSong','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(165deg,var(--body-g1),var(--body-g2));color:var(--ink);font-family:var(--sans);font-size:calc(15px*var(--fs));line-height:1.55}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:calc(16px*var(--fs));color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
textarea{resize:none}
input:focus,textarea:focus{border-color:var(--green)}
::placeholder{color:#BBA98C}
#app{max-width:560px;margin:0 auto;background:rgba(255,255,255,.26);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);position:relative;min-height:100dvh}
@media(min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 30px rgba(70,58,40,.06)}}
#view{min-height:100dvh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}

/* 页面顶栏（子页返回） */
.page-top{display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-brd)}
.page-top .back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--card);border:1px solid var(--line);flex-shrink:0}
.page-top .pt{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;margin-left:6px}
.page-top .pr{margin-left:auto;display:flex;gap:6px}
.screen{padding:4px 14px 20px}
.view-title{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.view-title .count{margin-left:auto;font-family:var(--sans);font-size:calc(12px*var(--fs));color:var(--sub);font-weight:400}

/* ============ 主界面（桌面） ============ */
#home{padding:calc(26px + env(safe-area-inset-top)) 18px 20px}
.home-greet{font-size:calc(14px*var(--fs));color:var(--sub);letter-spacing:1px}
.home-title{font-family:var(--serif);font-size:calc(26px*var(--fs));font-weight:700;margin:2px 0 14px}
.status-card{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:24px;padding:15px 16px;margin-bottom:20px;box-shadow:var(--glass-sh);cursor:pointer}
.status-card .sc-body{flex:1;min-width:0}
.status-card .sc-name{font-family:var(--serif);font-size:calc(17px*var(--fs));font-weight:700}
.status-card .sc-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:calc(12.5px*var(--fs));color:#5A4632;background:#F3EDDF;border-radius:20px;padding:3px 10px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.b-soft{background:var(--green-soft);color:#3F6B58}
.app-sec-title{font-size:calc(13px*var(--fs));color:var(--sub);letter-spacing:1.5px;margin-bottom:10px}
.app-grid{position:relative;z-index:2}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.app-item{text-align:center;cursor:pointer}
.app-icon{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 7px;box-shadow:0 6px 18px rgba(70,58,40,.13);transition:transform .12s}
.app-item:active .app-icon{transform:scale(.92)}
.app-item span{font-size:calc(13px*var(--fs));color:var(--ink)}
.home-foot{text-align:center;font-size:calc(12px*var(--fs));color:#B3A994;margin-top:26px;line-height:1.7}

/* ============ 聊天 ============ */
.chat-top{display:flex;align-items:center;gap:8px;padding:calc(7px + env(safe-area-inset-top)) 12px 6px;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-brd);box-shadow:0 2px 14px rgba(70,58,40,.05);position:sticky;top:0;z-index:10}
.chat-top .ct-who{flex:1;min-width:0}
.chat-top .ct-name{font-family:var(--serif);font-size:calc(16px*var(--fs));font-weight:700;display:flex;align-items:center;gap:6px}
.chat-top .ct-chips{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.chat-top .ct-chips .chip{font-size:calc(10.5px*var(--fs));padding:2px 8px}
.chat-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
/* 聊天页：整体按视口高度排，顶栏/底栏各自撑开，中间消息区吃掉剩余空间。
   原来写死 height:calc(100dvh - 96px)，顶栏实际更高时就会多出一截空白，
   看起来像上边框被拉长。 */
#view>.chat-top{flex-shrink:0}
#view:has(.chat-top){display:flex;flex-direction:column;height:100dvh;max-height:100dvh;overflow:hidden;overscroll-behavior:none}
/* ★ 聊天列表滑到头继续拖，以前会把滚动"接力"给整个页面 →
   整页被顶上去不回来，底部输入框就停在半空、下面露一大片空白（用户报的"被带起来"）。
   .screen / .home-page 早就写了 contain，就聊天列表漏了。 */
#chatList{flex:1;overflow-y:auto;padding:12px 12px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overscroll-behavior-y:contain}
/* 聊天壁纸固定在外层（不滚动）上，滑聊天记录时壁纸不动 */
.chat-wrap{background-size:cover;background-position:center;background-repeat:no-repeat}
/* ===== 气泡：内容自适应宽度，时间/已读挪到气泡外面 ===== */
.msg-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;padding:0 10px}
.msg-row.in{justify-content:flex-start}
.msg-row.out{flex-direction:row-reverse}
.msg-col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.msg-row.out .msg-col{align-items:flex-end}
.msg-row.in .msg-col{align-items:flex-start}
.msg-col .bubble{width:fit-content;max-width:100%;align-self:inherit}
.msg-row.out .msg-col .bubble{align-self:flex-end}
.msg-row.in .msg-col .bubble{align-self:flex-start}
.msg-meta{display:flex;align-items:center;gap:5px;margin-top:4px;padding:0 4px;line-height:1.2}
.msg-meta .t{font-size:calc(10.5px*var(--fs));color:var(--sub);white-space:nowrap}
.msg-meta .st{font-size:calc(10.5px*var(--fs));color:#7FA8D9;font-weight:700;white-space:nowrap}
.msg-meta .st.gray{color:#C9B4BB;font-weight:400}
.msg-meta .msg-menu-btn{color:var(--sub);font-size:calc(15px*var(--fs));line-height:1;padding:2px 4px;opacity:.65;min-height:0}
.msg-meta .msg-menu-btn:active{opacity:1}
/* 气泡里的时间行已废弃，兜底隐藏 */
.bubble>.t{display:none}
/* 消息操作面板 */
.msg-menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin:4px 0 6px}
.msg-menu-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid var(--glass-line);font-size:calc(12px*var(--fs));color:var(--ink);min-height:0}
.msg-menu-item .mm-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);box-shadow:0 3px 10px rgba(150,120,140,.1)}
.msg-menu-item.danger{color:#C25B5B}
.msg-menu-item:active{transform:scale(.96)}
.msg-menu-quote{font-size:calc(12.5px*var(--fs));color:var(--sub);background:rgba(138,116,88,.08);border-radius:12px;padding:8px 11px;margin-bottom:10px;max-height:64px;overflow:hidden}
/* ===== 字卡库：搜索 / 计数 / 分类管理 ===== */
.lib-search{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.lib-search input{flex:1;min-width:0}
.lib-search .btn{flex-shrink:0;min-width:64px;min-height:42px}
.lib-count{font-size:calc(12px*var(--fs));color:var(--sub);background:rgba(255,255,255,.55);border:1px solid var(--glass-line);border-radius:12px;padding:7px 11px;margin-bottom:8px;line-height:1.5}
.lib-count b{color:var(--ink);font-size:calc(13px*var(--fs))}
.cat-cats{margin-top:-2px}
.cat-cats .cnt{margin-left:4px;opacity:.55;font-size:calc(11px*var(--fs))}
.cat-tabs .add-cat{border:1px dashed rgba(201,123,142,.6);color:#B25E8B;background:rgba(255,255,255,.5);font-weight:600}
.cat-tabs .add-cat.danger{border-color:rgba(196,91,91,.55);color:#C25B5B;border-style:solid}
.card .chip.gray{opacity:.6;background:rgba(255,255,255,.6);color:var(--sub)}
/* ===== 备份：分类选择 ===== */
.bk-card{padding:14px}
.bk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.bk-head b{font-size:calc(15px*var(--fs))}
.bk-head .meta{margin-top:2px}
.bk-head-btns{display:flex;gap:6px;flex-shrink:0}
.bk-head-btns .btn{min-height:34px;min-width:56px}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bk-cat{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:13px;
background:rgba(255,255,255,.7);border:1px solid var(--line);cursor:pointer}
.bk-cat input{margin:2px 0 0;flex-shrink:0;width:16px;height:16px;accent-color:#D9557A}
.bk-cat .bk-tx{display:flex;flex-direction:column;min-width:0}
.bk-cat b{font-size:calc(13.5px*var(--fs));font-weight:700}
.bk-cat i{font-style:normal;font-size:calc(11.5px*var(--fs));color:var(--sub);line-height:1.45}
.bk-cat:has(input:checked){background:rgba(255,236,242,.9);border-color:rgba(217,85,122,.35)}
.bk-imgs{display:flex;gap:9px;align-items:flex-start;margin-top:10px;padding:10px 11px;border-radius:13px;
background:rgba(255,255,255,.7);border:1px solid var(--line);cursor:pointer}
.bk-imgs input{margin:2px 0 0;width:16px;height:16px;accent-color:#D9557A;flex-shrink:0}
.bk-imgs b{font-size:calc(13.5px*var(--fs))}
.bk-imgs i{display:block;font-style:normal;font-size:calc(11.5px*var(--fs));color:var(--sub);line-height:1.45}
.bk-mode{display:flex;align-items:center;gap:10px;margin-top:10px}
.bk-mode>span{font-size:calc(13px*var(--fs));color:var(--sub);flex-shrink:0}
.bk-mode select{flex:1;min-width:0;min-height:42px;border-radius:12px;border:1px solid var(--line);
background:rgba(255,255,255,.9);padding:0 10px;font-size:calc(13.5px*var(--fs));color:var(--ink)}
.bk-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bk-act{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 13px;border-radius:14px;
background:rgba(255,255,255,.8);border:1px solid var(--line);min-height:58px}
.bk-act b{font-size:calc(14px*var(--fs));white-space:nowrap}
.bk-act i{font-style:normal;font-size:calc(11.5px*var(--fs));color:var(--sub);flex:1;line-height:1.4}
.bk-act em{font-style:normal;font-size:calc(12.5px*var(--fs));color:#B25E8B;font-weight:700;flex-shrink:0}
.bk-act.danger b{color:#C25B5B} .bk-act.danger em{color:#C25B5B}
@media (max-width:400px){ .bk-grid{grid-template-columns:1fr} }
/* ===== 批量导入字卡 ===== */
.batch-foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.batch-foot .btn{flex-shrink:0}
.batch-foot .meta{margin-left:auto}
#cardBatchText{font-family:inherit;line-height:1.6}
/* 长按图标/组件时，别再弹 iOS 的"选择 / 拷贝 / 分享"气泡——
   那个气泡一出来，系统就把手势抢走了，拖拽直接中断（app 换不了位置就是这个原因） */
.app-item,.widget,.app-icon,.folder-app{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  user-select:none;
}
/* 拖拽模式下的图标不要参与滚动，交给 JS 处理 */
.app-grid.editing .app-item{touch-action:none}
.widgets.editfree .widget.wfree{touch-action:none}
/* App 图标层永远压在组件的上面：就算组件因为内容变高溢出一点点，
   也不会挡住图标的点击（点不开/拖不动就是这么来的） */
.app-grid{position:relative;z-index:3}
.app-sec-title{position:relative;z-index:3}
/* ===== 组件尺寸选择 ===== */
.wdlib-sz{display:inline-flex;gap:3px;margin-right:6px;flex-shrink:0}
.wdlib-sz button{min-height:30px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--sub);font-size:calc(12px*var(--fs))}
.wdlib-sz button.on{background:linear-gradient(150deg,#F0859F,#D9557A);color:#fff;border-color:transparent}
.menu-sizes{display:flex;align-items:center;gap:6px;padding:10px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.menu-sizes>span{font-size:calc(12.5px*var(--fs));color:var(--sub);margin-right:2px}
.menu-sizes button{min-height:34px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);font-size:calc(12.5px*var(--fs))}
.menu-sizes button.on{background:linear-gradient(150deg,#F0859F,#D9557A);color:#fff;border-color:transparent}
/* ===== 表情包 / 图片消息 ===== */
.bubble.bubble-media{padding:6px!important;background:rgba(255,255,255,.72)!important;border:1px solid var(--glass-line)!important;box-shadow:0 6px 18px rgba(150,120,140,.14)!important}
.bubble.bubble-media:after{display:none!important}
.msg-sticker{display:block;width:120px;height:auto;max-height:144px;object-fit:contain;border-radius:14px;
  box-shadow:0 6px 18px rgba(150,120,140,.18)}
/* 表情包：整条就是一张贴图，不带气泡底 */
.bubble.bubble-sticker{padding:0!important;background:transparent!important;border:none!important;
  box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:14px!important}
.bubble.bubble-sticker:after{display:none!important}
.msg-img{display:block;width:170px;max-width:58vw;height:auto;max-height:220px;object-fit:cover;border-radius:12px}
.bubble.out.bubble-media{background:rgba(255,255,255,.62)!important}
.stk-sec-title{font-size:calc(12px*var(--fs));color:var(--sub);letter-spacing:1px;margin:12px 0 6px}
.stk-emoji{font-size:calc(23px*var(--fs))}
.stk-add-emoji{display:flex;gap:8px;align-items:center}
.stk-add-emoji input{flex:1;min-width:0}
/* ===== 邀请一起专注卡片 ===== */
.iv-card{display:flex;flex-direction:column;gap:8px;border-radius:18px;padding:12px 13px;max-width:86%;min-width:190px;background:linear-gradient(160deg,#F3F7FF,#E8F0FF);border:1px solid #CCDCF5;box-shadow:0 6px 20px rgba(120,160,210,.16)}
.iv-card.out{background:linear-gradient(160deg,#F6F2FF,#EDE7FF);border-color:#DCD2F5}
.iv-top{display:flex;align-items:center;gap:7px}
.iv-ic{width:26px;height:26px;border-radius:50%;background:#8FB7E8;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iv-card.out .iv-ic{background:#A99BE0}
.iv-top b{font-size:calc(12.5px*var(--fs));color:#4A6E9E}
.iv-card.out .iv-top b{color:#6B5CA8}
.iv-tm{margin-left:auto;font-size:calc(11px*var(--fs));color:var(--sub);white-space:nowrap}
.iv-mode{font-size:calc(15px*var(--fs));font-weight:700;color:var(--ink)}
.iv-btns{display:flex;gap:8px}
.iv-btns button{flex:1;border-radius:12px;padding:9px 0;background:linear-gradient(150deg,#7FA8D9,#5C87B8);color:#fff;font-size:calc(13px*var(--fs));font-weight:700;min-height:40px}
.iv-btns button.gray{background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--sub);font-weight:400}
.iv-state{font-size:calc(11.5px*var(--fs));color:var(--sub);text-align:right}
/* ===== 多选模式 ===== */
.msg-row.multi-on .bubble{cursor:pointer}
.msg-row.multi-on .msg-col{max-width:calc(76% - 30px)}
.multi-tick{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(180,150,165,.55);display:none;align-items:center;justify-content:center;flex-shrink:0;font-size:calc(12px*var(--fs));color:#fff;background:rgba(255,255,255,.7);align-self:center;margin-bottom:14px}
.msg-row.multi-on .multi-tick{display:flex}
.msg-row.multi-on.picked .multi-tick{background:linear-gradient(150deg,#F9AEC2,#EE7BA4);border-color:transparent}
.msg-row.multi-on.picked .bubble{outline:2px solid rgba(242,143,176,.6);outline-offset:1px}
.multi-bar{display:flex;flex-direction:column;gap:8px;padding:8px 12px;background:linear-gradient(0deg,rgba(255,255,255,.82),rgba(255,255,255,.6));backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--glass-line);flex-shrink:0}
.multi-bar .mb-n{font-size:calc(12.5px*var(--fs));color:var(--sub);white-space:nowrap}
.multi-bar .mb-btns{display:flex;gap:6px;flex-wrap:wrap}
.multi-bar .mb-btns button{flex:1 1 0;min-width:64px;font-size:calc(12.5px*var(--fs));padding:8px 6px;border-radius:20px;background:rgba(255,255,255,.8);border:1px solid var(--glass-line);color:var(--ink);min-height:38px}
.multi-bar .mb-btns button.danger{color:#C25B5B}
.bubble-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--fs));font-weight:600;overflow:hidden;color:#fff;box-shadow:var(--shadow)}
.bubble-av img{width:100%;height:100%;object-fit:cover}
.bubble-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff}
.bubble{max-width:100%;padding:9px 12px;border-radius:17px;font-size:calc(15px*var(--fs));position:relative;word-break:break-word;white-space:pre-wrap;cursor:pointer}
.bubble.out{background:var(--green);border-bottom-right-radius:5px;color:#fff}
.bubble.out .t{color:rgba(255,255,255,.72)}
.bubble.in{background:var(--glass-strong);border:1px solid var(--glass-brd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom-left-radius:5px}
.bubble .t{display:block;font-size:calc(10.5px*var(--fs));color:var(--sub);margin-top:4px;text-align:right;white-space:nowrap}
.bubble .st.gray{opacity:.5}
.bubble.out .quote-box{background:rgba(0,0,0,.16);color:#fff}
.bubble.in.typing{min-width:56px;min-height:36px;display:flex;align-items:center;justify-content:center}
.bubble .st{color:var(--green);font-weight:700;font-size:calc(10.5px*var(--fs))}
.bubble .st.gray{color:#BBA98C;font-weight:400}
.quote-box{font-size:calc(12px*var(--fs));color:var(--sub);background:rgba(138,116,88,.1);border-left:2px solid var(--line);border-radius:6px;padding:4px 8px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bubble.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:11px 14px}
.typing-dots{display:inline-flex;gap:3px;align-items:center}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:#BBA98C;animation:blink 1.1s infinite}
.typing-dots i:nth-child(2){animation-delay:.22s}.typing-dots i:nth-child(3){animation-delay:.44s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quote-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:7px 12px 0;font-size:calc(12px*var(--fs));color:var(--sub)}
.quote-bar .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-bar button{color:var(--green);font-size:calc(13px*var(--fs));padding:4px 6px;min-height:30px}
.chat-input{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--glass-brd);background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0}
.chat-input textarea{flex:1;max-height:96px;min-height:42px;background:rgba(255,255,255,.78);border-radius:22px;border:1px solid rgba(244,143,177,.32);padding:9px 15px;box-shadow:inset 0 1px 4px rgba(244,143,177,.08)}
.chat-input button{background:var(--green);color:#fff;border-radius:16px;padding:11px 20px;font-size:calc(15px*var(--fs));flex-shrink:0;min-width:64px;min-height:44px}
.chat-input .tool-btn{background:rgba(255,255,255,.65);color:var(--green);width:40px;height:40px;padding:0;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-width:0;box-shadow:0 2px 8px rgba(70,58,40,.06)}
.center-msg{text-align:center;color:var(--sub);font-size:calc(12.5px*var(--fs));margin:4px auto;background:rgba(138,116,88,.12);border-radius:20px;padding:3px 12px;max-width:86%;word-break:break-all}
.transfer-card{align-self:center;background:#E7F0E1;border:1px solid #CFE0C4;border-radius:12px;padding:9px 14px;font-size:calc(13.5px*var(--fs));max-width:86%}
.transfer-card b{color:#2F6B3C;font-size:calc(15px*var(--fs))}

/* ============ 主页 ins / 拍一拍 / 通知 ============ */
.prof-card{padding:18px 14px}
.prof-av{display:flex;flex-direction:column;align-items:center;gap:6px}
.prof-av .avatar{width:76px;height:76px;font-size:calc(30px*var(--fs));box-shadow:0 6px 18px rgba(0,0,0,.18);border:2px solid #fff}
.prof-nm{font-size:calc(19px*var(--fs));font-weight:800}
.prof-bio{font-size:calc(13px*var(--fs));color:var(--sub)}
.prof-stats{display:flex;justify-content:space-around;margin:14px 0 4px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prof-stats .ps{display:flex;flex-direction:column;align-items:center;gap:2px}
.prof-stats b{font-size:calc(17px*var(--fs))}
.prof-stats span{font-size:calc(12px*var(--fs));color:var(--sub)}
.prof-tabs{display:flex;gap:8px;margin:12px 0 4px}
.prof-tabs .pt2{flex:1;padding:9px;border-radius:12px;background:rgba(255,255,255,.5);border:1px solid var(--glass-brd);font-size:calc(14px*var(--fs));color:var(--sub);min-height:44px}
.prof-tabs .pt2.on{background:var(--green);color:#fff;border-color:transparent}
.prof-tip{text-align:center;font-size:calc(11.5px*var(--fs));color:var(--sub);margin-bottom:10px}
.daily-card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:14px;padding:10px 13px;margin-bottom:9px}
.d-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.d-txt{font-size:calc(15px*var(--fs));line-height:1.6;word-break:break-word}
.tr-item{display:flex;align-items:center;gap:11px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:14px;padding:10px 13px;margin-bottom:9px}
.tr-ic{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.tr-ic.grey{background:var(--sub)}
.saved-item{display:flex;gap:11px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:14px;padding:10px 13px;margin-bottom:9px}
.saved-item svg{flex-shrink:0;margin-top:2px}
.s-txt{font-size:calc(14.5px*var(--fs));word-break:break-word;line-height:1.5}
.pat-av{display:inline-flex;cursor:pointer;touch-action:manipulation}
#ntfBar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(30,35,30,.92);color:#fff;border-radius:16px;padding:10px 13px;display:none;align-items:center;gap:10px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#ntfBar .ntf-av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0}
#ntfBar .ntf-av i{width:38px;height:38px;font-size:calc(16px*var(--fs))}
#ntfBar .ntf-tx{flex:1;min-width:0}
#ntfBar b{font-size:calc(13.5px*var(--fs));display:block}
#ntfBar span{font-size:calc(12.5px*var(--fs));opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#ntfBar .ntf-x{flex-shrink:0;opacity:.6}
/* ============ 主题 / 决策 / 玻璃卡 ============ */
.theme-row{display:flex;gap:8px}
.th-card{flex:1;border-radius:16px;padding:10px 6px;background:rgba(255,255,255,.55);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:76px}
.th-card.on{border-color:var(--green);background:rgba(240,248,244,.8);box-shadow:0 0 0 2px rgba(95,143,123,.25)}
.th-card b{font-size:calc(13.5px*var(--fs))}
.th-card .meta{font-size:calc(10.5px*var(--fs))}
.th-swatch{width:36px;height:22px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.th-swatch.bw{background:linear-gradient(120deg,#F3F3F1 50%,#555 50%)}
.th-swatch.fog{background:linear-gradient(120deg,#EDF3F8 50%,#5C87A8 50%)}
.th-swatch.aurora{background:linear-gradient(120deg,#F6F1E8 50%,#C88BB0 50%)}
.tint-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tint-dot{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:4px 5px;border-radius:12px;border:1px solid transparent}
.tint-dot.on{border-color:var(--green);background:rgba(240,248,244,.8)}
.tint-dot i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.1);display:block}
.tint-dot span{font-size:calc(10.5px*var(--fs));color:var(--sub)}
.poll-time{display:flex;gap:8px;margin:6px 0 2px}
.pt-btn{flex:1;border-radius:14px;padding:9px 8px;background:rgba(255,255,255,.55);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
.pt-btn.on{background:var(--green);border-color:transparent;color:#fff}
.pt-btn b{font-size:calc(14px*var(--fs))}
.pt-btn span{font-size:calc(11px*var(--fs));opacity:.75}
.poll-yesno{display:flex;gap:8px;margin:6px 0 2px;align-items:center}
.poll-yesno input{flex:1}
.poll-yesno .btn{flex-shrink:0}
.opt-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.opt-idx{width:26px;text-align:center;font-size:calc(12px*var(--fs));color:var(--sub);flex-shrink:0}
.opt-in{flex:1}
.opt-row .del{width:40px;height:40px;border-radius:10px;color:var(--danger);font-size:calc(16px*var(--fs));flex-shrink:0}
.poll-multi{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px;background:rgba(255,255,255,.5);border-radius:12px;padding:8px 10px}
.poll-multi .mstepper{display:flex;align-items:center;gap:8px}
.mstepper button{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;font-size:calc(17px*var(--fs))}
.mstepper b{font-size:calc(16px*var(--fs));min-width:20px;text-align:center}
.poll-log-btn{width:100%;margin-top:10px;padding:9px;border-radius:12px;background:rgba(255,255,255,.55);border:1px dashed var(--line);color:var(--sub);font-size:calc(13px*var(--fs));min-height:44px}
.poll-log-item{background:rgba(255,255,255,.55);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.pl-q{font-size:calc(14px*var(--fs));font-weight:600}
.pl-a{font-size:calc(13.5px*var(--fs));margin-top:2px}
/* 玻璃 ins 卡片升级 */
.ck-card{background:rgba(255,250,240,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);box-shadow:0 8px 24px rgba(214,158,102,.14),inset 0 1px 0 rgba(255,255,255,.6);border-radius:18px;border-bottom-left-radius:6px}
.ck-card.out{background:rgba(232,242,255,.62);border-color:rgba(255,255,255,.72);box-shadow:0 8px 24px rgba(120,160,210,.14),inset 0 1px 0 rgba(255,255,255,.6)}
.tf-card{align-self:flex-end;background:rgba(200,226,212,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);color:#3F6B58;border-radius:18px;border-bottom-right-radius:6px;min-width:150px;max-width:76%;text-align:center;box-shadow:0 10px 28px rgba(95,143,123,.18),inset 0 1px 0 rgba(255,255,255,.6);padding:12px 14px}
.tf-card.in{align-self:flex-start;background:rgba(255,228,233,.66);border-color:rgba(255,255,255,.72);color:#A5475B;border-bottom-left-radius:6px;border-bottom-right-radius:18px;box-shadow:0 10px 28px rgba(214,140,158,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.tf-card .tf-n{font-size:calc(12px*var(--fs));opacity:.85}
.tf-card .tf-a{font-size:calc(24px*var(--fs));font-weight:800;margin:3px 0;letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.tf-card .tf-t{font-size:calc(11px*var(--fs));opacity:.8}
.tf-btns button{background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.poll-card{background:rgba(255,255,255,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);border-radius:18px;border-bottom-right-radius:6px;padding:12px 13px;max-width:78%;box-shadow:0 10px 28px rgba(95,143,123,.14),inset 0 1px 0 rgba(255,255,255,.6)}
.poll-card .pq{font-size:calc(15px*var(--fs));font-weight:700;margin-bottom:8px}
.poll-card .po{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-bottom:6px;font-size:calc(13.5px*var(--fs));text-align:center}
.poll-card .pt{font-size:calc(11px*var(--fs));color:var(--sub);margin-top:6px;text-align:center}
/* ============ 高透玻璃主页 + 气泡预设 + 聊天室设置 ============ */
.status-card,.widget,.app-icon{background:linear-gradient(150deg,rgba(255,196,216,.46),rgba(255,238,244,.22) 45%,rgba(255,210,230,.34));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,.72);box-shadow:0 8px 26px rgba(255,168,196,.2),inset 0 1px 0 rgba(255,255,255,.65)}
.app-icon{border-radius:18px}
.app-item span{color:var(--ink)}
.home-title{color:var(--ink)}
.home-greet{color:var(--sub)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap}
.preset-btn{border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.55);border:1px solid var(--line);font-size:calc(13px*var(--fs));min-height:40px}
.preset-btn.on{background:var(--green);border-color:transparent;color:#fff}
/* 气泡预设 */
#view .bubble{border-radius:calc(var(--bub-r,22px)*1px);opacity:calc(var(--bub-o,100)*1%)}
#view.bs-wechat .bubble.in{background:#fff;border:1px solid #E4E4E4;color:#333;border-bottom-left-radius:6px}
#view.bs-wechat .bubble.out{background:#95EC69;color:#333;border-bottom-right-radius:6px}
#view.bs-wechat .bubble.out .t{color:rgba(0,0,0,.5)}
#view.bs-wechat .bubble .st{color:#576B95}
#view.bs-kakao .bubble{border-radius:24px}
#view.bs-kakao .bubble.in{background:#FFEB3B;color:#333;border-bottom-left-radius:8px}
#view.bs-kakao .bubble.out{background:#fff;color:#333;border:1px solid #E4E4E4;border-bottom-right-radius:8px}
#view.bs-kakao .bubble.out .t{color:rgba(0,0,0,.5)}
#view.bs-imessage .bubble{border-radius:20px}
#view.bs-imessage .bubble.in{background:#E9E9EB;color:#000;border-bottom-left-radius:6px}
#view.bs-imessage .bubble.out{background:#34C759;color:#fff;border-bottom-right-radius:6px}
#view.bs-wechat .bubble.out,.bubble.out .st{color:#333}
/* ============ v7u：浅粉气泡 / 已读符号 / 朋友圈 / 钱包 / 分页 ============ */
.bubble{border-radius:26px}
.bubble.in{background:linear-gradient(145deg,rgba(255,233,240,.94),rgba(255,219,229,.8));border:1px solid rgba(255,255,255,.78);color:#8A4A5C;box-shadow:0 4px 16px rgba(244,143,177,.16),inset 0 1px 0 rgba(255,255,255,.78);border-bottom-left-radius:9px}
.bubble.out{background:linear-gradient(145deg,#F9AEC2,#F28FB0);color:#fff;box-shadow:0 6px 18px rgba(244,143,177,.28),inset 0 1px 0 rgba(255,255,255,.4);border-bottom-right-radius:9px}
.bubble.out .t{color:rgba(255,255,255,.82)}
.bubble.recalled{background:rgba(255,255,255,.45)!important;color:#B9A68F;font-size:calc(13px*var(--fs));border:1px dashed rgba(180,160,140,.4);box-shadow:none!important}
.bubble .st{color:#7FA8D9;font-size:calc(11px*var(--fs))}
.bubble .st.gray{color:#C9B4BB;font-weight:400}
.bubble.out .st{color:rgba(255,255,255,.92)}
.bubble.out .st.gray{color:rgba(255,255,255,.65)}
/* 钱包陆沉卡 */
.wallet-hero.lc{background:linear-gradient(145deg,rgba(249,174,194,.94),rgba(242,143,176,.88));box-shadow:0 10px 26px rgba(242,143,176,.32),inset 0 1px 0 rgba(255,255,255,.6);margin-top:10px}
/* 朋友圈美化 */
.cover{height:224px;border-radius:0 0 20px 20px;margin-bottom:10px;box-shadow:0 8px 24px rgba(90,70,50,.12)}
.cover .me-overlay{position:absolute;left:12px;bottom:10px;display:flex;align-items:flex-end;gap:9px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.cover .me-overlay b{font-size:calc(17px*var(--fs));color:#fff;font-weight:700}
.cover .cov-btn{right:10px;bottom:12px}
.post{background:rgba(255,255,255,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.72);border-radius:20px;box-shadow:0 6px 20px rgba(90,70,50,.07);padding:13px 14px;margin-bottom:10px}
.post-form{background:rgba(255,255,255,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.72);border-radius:20px;padding:12px;box-shadow:0 6px 20px rgba(90,70,50,.07);margin-bottom:12px}
.post-form .btn{background:linear-gradient(145deg,#F9AEC2,#F28FB0);color:#fff;box-shadow:0 4px 12px rgba(242,143,176,.3)}
.cmt-box{background:rgba(244,143,177,.08);border-radius:10px}
.p-likes{color:#E8A33D}
/* app 分页 */
.app-grid.hide{display:none}
.page-dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.page-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(120,100,80,.28);transition:all .2s;min-width:0;padding:0}
.page-dots .dot.on{background:#F28FB0;width:18px;border-radius:4px}
/* 设置页分组 */
.pct-sub{font-size:calc(12.5px*var(--fs));font-weight:700;color:var(--green);margin:12px 0 6px;letter-spacing:.5px}
.pct-sub:first-child{margin-top:2px}
.me-group-title{font-family:var(--serif);font-size:calc(17px*var(--fs));font-weight:800;margin:20px 0 10px;color:#C97B8E;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.me-group-title:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,123,142,.4),transparent)}
/* 塔罗 */
.ts-grid{display:flex;flex-wrap:wrap;gap:8px}
.ts-card{flex:1 1 45%;min-width:130px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:10px 12px;text-align:left;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ts-card.on{border-color:#C97B8E;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(201,123,142,.35)}
.ts-card b{display:block;font-size:calc(15px*var(--fs))}
.ts-card span{font-size:calc(12px*var(--fs));color:var(--sub)}
.td-row{display:flex;gap:10px}
.td-card{flex:1;text-align:center}
.td-off{opacity:.55}
.tcard{background:linear-gradient(150deg,#F3E6F4,#E7DCF3);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:10px 8px;box-shadow:var(--glass-sh);min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tcard.tmajor{background:linear-gradient(150deg,#F7E8D9,#F1D9C4)}
.tcm{font-family:var(--serif);font-weight:700;font-size:calc(15px*var(--fs));color:#5B3E63}
.tcard.tmajor .tcm{color:#8A5B34}
.tck{font-size:calc(12px*var(--fs));color:#7E6486;line-height:1.4}
.tcl{font-size:calc(11px*var(--fs));color:#A48DAE;margin-top:2px}
.tr-nums{margin-bottom:8px}
.tr-grid{display:flex;flex-wrap:wrap;gap:10px}
.tr-item{flex:1 1 30%;min-width:92px;text-align:center}
.tr-pos{display:block;font-size:calc(11px*var(--fs));color:#C97B8E;margin-bottom:4px}
.tl-item{padding:9px 0;border-bottom:1px solid rgba(230,215,200,.5)}
.tl-item:last-child{border-bottom:none}
.tl-top{display:flex;justify-content:space-between;align-items:baseline}
.tl-tx{font-size:calc(13px*var(--fs));color:#8B8172;margin-top:2px}
/* 动态小组件 */
.w-feed{min-height:118px;display:flex;flex-direction:column;gap:6px}
.wf-tt{font-size:calc(12px*var(--fs));font-weight:700;color:#C97B8E}
.wf-list{display:flex;flex-direction:column;gap:5px;flex:1}
.wf-item{display:flex;align-items:center;gap:7px;font-size:calc(13px*var(--fs));cursor:pointer;min-height:26px}
.wf-dot{width:7px;height:7px;border-radius:50%;background:#F28FB0;flex:none;box-shadow:0 0 0 3px rgba(242,143,176,.18)}
.wf-tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-tm{font-size:calc(11px*var(--fs));color:#BBA98C;flex:none}
.wf-empty{font-size:calc(13px*var(--fs));color:#BBA98C;text-align:center;padding:18px 0}

/* 哥的主页 · 参考图格式 */
.ph-head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 8px}
.ph-av{display:block}
.ph-nm{font-family:var(--serif);font-size:calc(19px*var(--fs));font-weight:800;color:var(--ink)}
.ph-hd{font-size:calc(13px*var(--fs));color:#9A8C7C}
.ph-stats{display:flex;justify-content:space-around;padding:8px 0 10px}
/* ★ 主页头部：左头像 + 右两格数字（按设计稿） */
.ph-row{display:flex;align-items:center;gap:16px;padding:8px 6px 0}
.ph-row .ph-av{flex:none}
.ph-row .ph-stats{flex:1;padding:0}
.ph-row .ph-stats .ps{min-width:0}
.ph-id{display:flex;align-items:baseline;gap:8px;padding:10px 6px 0}
.ph-id b{font-size:calc(16px*var(--fs))}
.ph-id .ph-hd{font-size:calc(12.5px*var(--fs));color:var(--sub)}
.ph-sig2{padding:4px 6px 0;font-size:calc(12.5px*var(--fs));color:var(--sub);line-height:1.6}
.ph-btns{justify-content:flex-start;padding:10px 6px 12px}
.mom-cam{width:40px;height:40px;min-height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--green);background:var(--card);border:1px solid var(--line)}
.mom-cam svg{width:20px;height:20px}
.ph-stats .ps{text-align:center;min-width:80px}
.ph-stats .ps b{display:block;font-size:calc(20px*var(--fs));color:var(--ink)}
.ph-stats .ps span{font-size:calc(12px*var(--fs));color:#9A8C7C}
.ph-btns{display:flex;gap:10px;justify-content:center;padding:2px 0 12px}
.ph-follow{flex:1;max-width:170px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:10px 0;font-size:calc(13.5px*var(--fs));color:#6B6156;font-weight:700}
/* ★ 颜色一律跟着"设置里选的主题"走（applyTheme 会刷 --green 这些变量），
   不要写死任何颜色 —— 换主题时它会跟着变。 */
.ph-follow.on{background:var(--green);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(70,90,80,.22)}
.ph-msg{flex:1;max-width:170px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:10px 0;font-size:calc(13.5px*var(--fs));color:#6B6156;font-weight:700}
.ph-bio{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:12px 14px;margin:0 4px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph-whisper{display:block;font-size:calc(10px*var(--fs));letter-spacing:2px;color:#C9977B;font-weight:700;margin-bottom:4px}
.ph-wtxt{font-size:calc(14px*var(--fs));color:var(--ink);line-height:1.5}
.ph-sig{margin-top:6px;font-size:calc(12px*var(--fs));color:#9A8C7C}
.ph-tabs{display:flex;justify-content:space-around;margin:4px 4px 10px;border-bottom:1px solid rgba(220,205,185,.6);padding-bottom:8px}
.ph-tabs .pt2{background:none;border:none;font-size:calc(14px*var(--fs));color:#9A8C7C;padding:6px 12px;font-weight:600;border-bottom:2px solid transparent}
.ph-tabs .pt2.on{color:var(--green);border-bottom-color:var(--green)}
.ph-tabs .pt2 b{font-size:calc(11.5px*var(--fs));font-weight:700;opacity:.75;margin-left:2px}
/* ★ 礼物架：一格一格的货架 */
.gift-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:2px}
.gift-c{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-brd);border-radius:16px;padding:11px 6px;text-align:center;
  box-shadow:0 6px 16px rgba(150,120,140,.1)}
.gift-c .g-e{font-size:calc(26px*var(--fs));line-height:1.2}
.gift-c b{display:block;font-size:calc(11.5px*var(--fs));margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-c span{display:block;font-size:calc(10px*var(--fs));color:var(--sub);margin-top:2px}
.diary-item{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:12px 14px;margin:0 4px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.diary-item .d-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.d-date{font-size:calc(10px*var(--fs));letter-spacing:1.5px;color:#C9977B;font-weight:700}
.d-ops{display:flex;gap:10px}
.d-save{background:none;border:none;font-size:calc(12px*var(--fs));color:var(--green);font-weight:600;padding:2px 0}
.d-del{background:none;border:none;font-size:calc(12px*var(--fs));color:#E05C5C;font-weight:600;padding:2px 0}
.diary-item .d-body{font-size:calc(13px*var(--fs));color:var(--ink);line-height:1.65;white-space:pre-wrap}

/* 气泡微信弧度（保留浅粉渐变） */
 .bubble{border-radius:20px}
.bubble.in{border-radius:20px 20px 20px 5px}
.bubble.out{border-radius:20px 20px 5px 20px}
/* 气泡尾巴已经由圆角（右下/左下 5px）表现。
   原来另外用 border 画了个 8px 三角，长气泡时和圆角错位会露出一个尖角，
   短消息和卡片上尤其明显（就是截图里圈出来的小三角），这里直接去掉。 */
.bubble.in:after,.bubble.out:after{content:none!important;display:none!important;border:0!important}
.bubble.typing:after{display:none}
/* 聊天顶部按钮（返回键 + 三个功能键）统一尺寸 */
.chat-top .back{width:40px;height:40px;min-width:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:rgba(255,255,255,.6);border:1px solid var(--glass-brd);flex-shrink:0;padding:0}
/* 顶栏三个功能键横排（原来竖排占了 132px，把顶栏撑到 146px 高） */
.chat-top .pr{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:6px;flex-shrink:0}
.chat-top .pr .back{width:38px;height:38px;min-width:38px;border-radius:12px}
.chat-top{padding-top:calc(6px + env(safe-area-inset-top))}
.chat-top .ct-who{padding:2px 0}
.chat-top .ct-chips{margin-top:3px}
.chat-top .ct-chips .chip{font-size:calc(10px*var(--fs));padding:2px 7px}
/* 聊天页底部不要留那 30px 的空白带 */
#view:has(.chat-top){padding-bottom:0!important}
/* 主页横滑分页 */
.app-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px;padding:0 14px;position:relative}
.app-scroll::-webkit-scrollbar{display:none}
.home-pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.home-pages::-webkit-scrollbar{display:none}
.home-page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-height:0}
.home-title-2{margin-top:10px}
.app-scroll .app-grid{flex:0 0 calc(100% - 14px);scroll-snap-align:start;scroll-snap-stop:normal}

/* 后台保活档位 */
.ka-row{display:flex;gap:8px}
.ka-mode{flex:1;min-height:40px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--glass-brd);color:var(--ink);font-size:calc(13.5px*var(--fs))}
.ka-mode.on{background:#F2B8C8;color:#fff;border-color:#F2B8C8;font-weight:700}
/* 主页未读角标 */
.app-item{position:relative}
.app-badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:10px;background:#E2537B;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:3;box-shadow:0 2px 6px rgba(226,83,123,.4)}
/* 塔罗逆位 */
.tcard{position:relative}
.tcard.rev{border:1px solid rgba(178,94,139,.5);box-shadow:0 8px 22px rgba(178,94,139,.28)}
.tcard.rev .trv{position:absolute;right:6px;bottom:6px;font-size:calc(10px*var(--fs));color:#B25E8B;font-weight:700;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:8px}
/* 今日运势还没抽时的空卡（可点） */
.tcard-empty{cursor:pointer;border:1px dashed rgba(201,123,142,.55);background:rgba(255,255,255,.42)}
.tcard-empty .tck{font-size:calc(11.5px*var(--fs));line-height:1.5}
.tcard-empty:active{transform:scale(.97)}
/* 通知设置面板 */
.ntf-tag{font-size:calc(11.5px*var(--fs));font-weight:700;background:rgba(95,143,123,.12);border-radius:20px;padding:3px 10px;white-space:nowrap;flex-shrink:0}
.sw-row>span{flex-shrink:0}
/* 通知面板：文字长的地方改成纵向块，按钮单独一行，避免和说明文字挤在一起 */
.ntf-card{padding:4px 14px 14px}
.ntf-block{padding:12px 0;border-bottom:1px solid var(--line)}
.ntf-block:last-of-type{border-bottom:none}
.nb-head{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.nb-head b{font-size:calc(14px*var(--fs))}
.nb-desc{display:block;font-size:calc(11.5px*var(--fs));color:var(--sub);margin-top:4px;line-height:1.5}
.nb-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.nb-btns .btn{flex:1 1 0;min-width:110px;min-height:40px}
/* ===== 组件库 ===== */
.wdlib-list{display:flex;flex-direction:column;gap:10px}
.wdlib-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.5));backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.85);box-shadow:0 6px 20px rgba(150,120,140,.08)}
.wdlib-item.on{border-color:rgba(242,143,176,.5);box-shadow:0 8px 22px rgba(242,143,176,.16)}
.wdlib-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);flex-shrink:0}
.wdlib-tx{flex:1;min-width:0}
.wdlib-tx b{display:block;font-size:calc(15px*var(--fs))}
.wdlib-tx span{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.wdlib-btn{flex-shrink:0;font-size:calc(13px*var(--fs));padding:7px 14px;border-radius:20px;background:rgba(242,143,176,.14);color:#C4577E;font-weight:700;min-height:36px}
.wdlib-btn.added{background:rgba(120,100,80,.1);color:var(--sub);font-weight:400}
.wdlib-order{display:flex;flex-wrap:wrap;gap:6px}
.wdlib-chip{font-size:calc(12.5px*var(--fs));background:rgba(255,255,255,.7);border:1px solid var(--glass-brd);border-radius:20px;padding:4px 12px;color:var(--ink)}
/* 装修区的底图按钮：网格排布，文字不再被挤断行 */
.wdlib-imgrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.wdlib-imgrow .preset-btn{width:auto;min-height:42px;font-size:calc(12.5px*var(--fs));padding:8px 6px;white-space:nowrap}
.wdlib-btn{min-width:74px;text-align:center}
/* ============================================================
   高透玻璃 ins 风（统一材质层）
   思路：更透的底 + 更大的模糊与饱和 + 顶部高光内阴影 + 极细描边
   ============================================================ */
:root{
  --glass-1:rgba(255,255,255,.44);
  --glass-2:rgba(255,255,255,.62);
  --glass-3:rgba(255,255,255,.76);
  --glass-line:rgba(255,255,255,.78);
  --glass-line-2:rgba(255,255,255,.5);
  --glass-shadow:0 10px 30px rgba(150,120,140,.13);
  --glass-inset:inset 0 1px 0 rgba(255,255,255,.9);
  --blur:blur(24px) saturate(180%);
}
/* 小组件：通透玻璃 */
.widget{
  background-image:linear-gradient(155deg,rgba(255,255,255,.5),rgba(255,244,249,.3) 55%,rgba(255,255,255,.42))!important;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-line)!important;
  box-shadow:var(--glass-shadow),var(--glass-inset)!important;
  border-radius:22px!important;
}
.widget.w-time b{letter-spacing:.5px}
/* 组件内部排版压紧：每一类都排成一行高度，避免占两层 */
.widget.w-time,.widget.w-clock{display:flex!important;flex-direction:row!important;align-items:baseline;gap:9px;min-height:62px;grid-column:auto!important}
.widget.w-time b,.widget.w-clock b{font-size:calc(30px*var(--fs));line-height:1.1;font-variant-numeric:tabular-nums}
.widget.w-time span,.widget.w-clock span{font-size:calc(12.5px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.w-days{display:flex!important;flex-direction:row!important;align-items:baseline;gap:8px;min-height:62px}
.widget.w-days b{font-size:calc(26px*var(--fs));line-height:1.1}
.widget.w-days span{font-size:calc(12.5px*var(--fs));color:var(--sub)}
.widget.w-note{display:flex!important;flex-direction:row!important;align-items:baseline;gap:8px;min-height:62px}
.widget.w-note span{font-size:calc(12.5px*var(--fs));color:var(--sub)}
.widget.w-note b{font-size:calc(15.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.w-music{display:flex!important;align-items:center;gap:10px;min-height:66px}
.widget.w-music .wm-ic,.wfree .wm-ic{width:36px;height:36px;border-radius:13px;background:linear-gradient(150deg,#F9AEC2,#EE7BA4);flex-shrink:0;box-shadow:0 4px 12px rgba(242,143,176,.3)}
.widget.w-music .wm-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.28}
.widget.w-music .wm-tx b{font-size:calc(14px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.w-music .wm-tx span{font-size:calc(11px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.w-music .wm-btn{flex-shrink:0;width:38px;height:38px;min-height:38px;border-radius:50%;background:rgba(255,255,255,.8);color:#C4577E;box-shadow:0 3px 10px rgba(150,120,140,.14)}
.widget.w-feed{min-height:104px}
/* ===== 桌面小组件标题行 + 添加按钮 ===== */
.wd-add{display:flex;align-items:center;justify-content:center;margin:2px 0 8px auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.72);border:1px solid var(--glass-line);color:#C4577E;font-size:calc(19px*var(--fs));line-height:1;box-shadow:0 3px 10px rgba(150,120,140,.12);min-height:0;padding:0}
.wd-add:active{transform:scale(.92)}
/* ===== 新组件：天气 / 相册 / 倒数日 / 进度环 ===== */
.widget.w-weather{display:flex!important;align-items:center;gap:11px;min-height:74px}
.widget.w-weather .wx-ic{font-size:calc(26px*var(--fs));line-height:1;flex-shrink:0}
.widget.w-weather .wx-tx{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.widget.w-weather .wx-tx b{font-size:calc(21px*var(--fs))}
.widget.w-weather .wx-tx span{font-size:calc(11.5px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.w-photo{display:flex!important;flex-direction:column;gap:8px;min-height:150px;padding:10px!important}
.widget.w-photo .ph-img{display:block;width:100%;height:104px;border-radius:14px;background-size:cover;background-position:center;box-shadow:0 4px 14px rgba(150,120,140,.16)}
.widget.w-photo .ph-cap{font-size:calc(12.5px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.w-photo .ph-empty{display:flex;align-items:center;justify-content:center;height:104px;border-radius:14px;border:1px dashed rgba(201,123,142,.5);color:var(--sub);font-size:calc(12.5px*var(--fs));background:rgba(255,255,255,.4)}
.widget.w-count{display:flex!important;flex-direction:column;gap:4px;justify-content:center;min-height:70px}
.widget.w-count span{font-size:calc(12px*var(--fs));color:var(--sub)}
.widget.w-count b{font-size:calc(17px*var(--fs));color:var(--orange)}
.widget.w-progress{display:flex!important;align-items:center;gap:12px;min-height:96px}
.widget.w-progress .pg-ring{position:relative;width:60px;height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.widget.w-progress .pg-ring i{position:absolute;font-size:calc(13px*var(--fs));font-weight:700;font-style:normal;color:#C4577E}
.widget.w-progress .pg-lb{font-size:calc(14px*var(--fs))}
/* 动态小组件里每条小项更轻 */
.wf-item{background:rgba(255,255,255,.42);border-radius:12px;padding:4px 8px}
/* 聊天顶栏：悬浮玻璃条 */
.chat-top{
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.42))!important;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glass-line-2)!important;
  box-shadow:0 6px 22px rgba(150,120,140,.1),var(--glass-inset)!important;
}
.chat-top .ct-name{letter-spacing:.3px}
.chat-top .back,.chat-top .pat-av .avatar{background:rgba(255,255,255,.6);border:1px solid var(--glass-line);box-shadow:0 3px 10px rgba(150,120,140,.1)}
/* 聊天底栏：悬浮玻璃输入条 */
.chat-input{
  background:linear-gradient(0deg,rgba(255,255,255,.72),rgba(255,255,255,.46))!important;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-line-2)!important;
  box-shadow:0 -6px 22px rgba(150,120,140,.1),inset 0 1px 0 rgba(255,255,255,.9)!important;
  gap:9px;
}
.chat-input textarea{background:rgba(255,255,255,.62)!important;border:1px solid var(--glass-line)!important;box-shadow:inset 0 1px 3px rgba(150,120,140,.08),0 1px 0 rgba(255,255,255,.7)}
.chat-input button[data-act="send-chat"]{background:linear-gradient(150deg,#F9AEC2,#EE7BA4)!important;box-shadow:0 6px 16px rgba(242,143,176,.34),inset 0 1px 0 rgba(255,255,255,.5)}
.chat-input .tool-btn{background:rgba(255,255,255,.64)!important;border:1px solid var(--glass-line);box-shadow:0 2px 8px rgba(150,120,140,.08)}
/* 通用卡片 / 页面顶栏也统一材质 */
.card,.me-sec .card{background:linear-gradient(155deg,var(--glass-2),var(--glass-1))!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-line)!important;box-shadow:var(--glass-shadow),var(--glass-inset)!important}
.page-top{background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.46))!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-line-2)!important;box-shadow:0 6px 20px rgba(150,120,140,.08),var(--glass-inset)!important}
.page-top .back{background:rgba(255,255,255,.62);border:1px solid var(--glass-line);box-shadow:0 3px 10px rgba(150,120,140,.1)}
.status-card{background:linear-gradient(155deg,rgba(255,255,255,.52),rgba(255,240,247,.34))!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-line)!important;box-shadow:var(--glass-shadow),var(--glass-inset)!important}
.app-icon{box-shadow:0 8px 22px rgba(150,120,140,.16),inset 0 1px 0 rgba(255,255,255,.7)!important}
/* 输入框、开关、按钮统一柔和质感 */
input,textarea{background:rgba(255,255,255,.66)!important;border:1px solid var(--glass-line)!important}
.btn{background:linear-gradient(150deg,#7BA893,#5F8F7B)!important;box-shadow:0 6px 18px rgba(95,143,123,.26),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:rgba(255,255,255,.62)!important;color:var(--green)!important;border:1px solid var(--glass-line)!important;box-shadow:0 3px 10px rgba(150,120,140,.08)}
.chip{background:rgba(255,255,255,.6)!important;border:1px solid var(--glass-line);color:#6B5A6A}
.chip.b-soft{background:rgba(233,240,233,.75)!important;color:#3F6B58}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,252,254,.94))!important;backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--glass-line);box-shadow:0 -10px 40px rgba(150,120,140,.18)}
.post,.mail-item,.diary-item,.daily-card,.saved-item,.tr-item{background:linear-gradient(155deg,rgba(255,255,255,.6),rgba(255,255,255,.42))!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-line)!important;box-shadow:0 8px 24px rgba(150,120,140,.1),var(--glass-inset)!important}
.bubble.in{backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
/* 组件库条目也走高透 */
.wdlib-item{background:linear-gradient(155deg,rgba(255,255,255,.66),rgba(255,255,255,.44))!important}
@media (prefers-reduced-transparency:reduce){
  .widget,.card,.chat-top,.chat-input,.page-top{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background-color:rgba(255,255,255,.92)!important}
}
/* ===== 性能：手机上一堆大范围毛玻璃会明显掉帧、滚动发涩。
   窄屏把模糊半径与饱和度调小（观感几乎不变，GPU 压力小很多）。 ===== */
@media (max-width:600px){
  :root{--blur:blur(12px) saturate(135%)}
  .widget{backdrop-filter:blur(12px) saturate(140%)!important;-webkit-backdrop-filter:blur(12px) saturate(140%)!important;box-shadow:0 4px 12px rgba(150,120,140,.10),inset 0 1px 0 rgba(255,255,255,.7)!important}
  .chat-top,.chat-input,.page-top{backdrop-filter:blur(14px) saturate(140%)!important;-webkit-backdrop-filter:blur(14px) saturate(140%)!important}
  .card,.post,.mail-item,.diary-item,.daily-card,.saved-item,.tr-item,.status-card{backdrop-filter:blur(12px) saturate(140%)!important;-webkit-backdrop-filter:blur(12px) saturate(140%)!important}
}
/* 滚动容器：纵向滚动与横向分页各自独立，手势不打架 */
.home-page,.screen{overscroll-behavior:contain}
/* 浮层残留兜底：通话/转账/面板隐藏后不应再拦手或留下白块 */
#callOverlay:not(.show),#transferOverlay:not(.show),#sheet-mask.hide,#ntfBar[style*="none"]{pointer-events:none!important}
#toast{pointer-events:none}

/* ============ 通用 ============ */
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--glass-sh)}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;object-fit:cover;background:#6E7F5E}
.avatar.sm{width:34px;height:34px;font-size:calc(15px*var(--fs))}
.row{display:flex;align-items:center;gap:10px}
.meta{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.btn{background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:calc(15px*var(--fs));display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:var(--card);color:var(--green);border:1px solid var(--green)}
.btn.small{padding:6px 12px;font-size:calc(13px*var(--fs));border-radius:10px;min-height:40px}
.btn:active{opacity:.85}

/* 朋友圈 */
.post-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.post-form textarea{min-height:64px}
.post{display:flex;flex-direction:column;gap:8px}
.post .head{display:flex;align-items:center;gap:9px}
.post .head .nm{font-weight:700;font-size:calc(14.5px*var(--fs))}
.post .txt{font-size:calc(15px*var(--fs));white-space:pre-wrap;word-break:break-word;padding:4px 0}
.post .tag{display:inline-flex;align-items:center;gap:4px;font-size:calc(11px*var(--fs));color:var(--sub);background:#F1E9D7;border-radius:20px;padding:2px 9px;align-self:flex-start}
.cmt-box{margin-top:4px;background:#F3ECDC;border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:4px}
.cmt{font-size:calc(13.5px*var(--fs));line-height:1.5}
.cmt.reply{margin-left:16px;padding-left:9px;border-left:2px solid rgba(217,85,122,.35)}
.cmt-re{display:inline-block;font-size:calc(10px*var(--fs));color:#C4577E;background:rgba(242,143,176,.16);border-radius:6px;padding:1px 5px;margin-right:5px;vertical-align:1px}
.cmt b{font-weight:600;margin-right:4px}
.cover{width:100%;height:212px;border-radius:18px;background-size:cover;background-position:center 22%;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.cover .cov-btn{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.88);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:calc(12px*var(--fs));min-height:30px}

/* 信箱 */
.letter{position:relative}
.letter.unread{border-color:var(--green)}
.letter .dot-badge{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--green)}
.letter .subject{font-family:var(--serif);font-size:calc(16px*var(--fs));font-weight:700;margin:2px 0 4px}
.letter .body{font-size:calc(14px*var(--fs));color:#5A4632;white-space:pre-wrap;word-break:break-word;background:#FBF6EA;border-radius:10px;padding:8px 10px;margin-top:6px}

/* 字卡 */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.cat-tabs button{flex-shrink:0;font-size:calc(13px*var(--fs));padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.cat-tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.card-grid{display:flex;flex-direction:column;gap:10px}
.zika{border-left:4px solid var(--green);position:relative;padding-right:34px}
.zika .txt{font-size:calc(14.5px*var(--fs));white-space:pre-wrap;word-break:break-word}
.zika .chip{display:inline-block;font-size:calc(11px*var(--fs));color:var(--green);background:#ECF0E4;border-radius:20px;padding:2px 9px;margin-top:6px}
.zika .del{position:absolute;right:10px;top:10px;color:#BBA98C;font-size:calc(16px*var(--fs));padding:4px}
.zika .del:active{color:var(--danger)}
.lib-actions{display:flex;gap:8px;margin-bottom:12px}
.lib-actions button{flex:1}

/* 日记 */
.diary-card .d-date{font-family:var(--serif);font-size:calc(16px*var(--fs));font-weight:700}
.diary-card .d-txt{font-size:calc(14.5px*var(--fs));color:#4A3F33;white-space:pre-wrap;word-break:break-word;background:#FBF6EA;border-radius:10px;padding:9px 11px;margin-top:7px;line-height:1.75}

/* 我的/设置 */
.me-sec{margin-bottom:16px}
.me-sec h3{font-family:var(--serif);font-size:calc(15px*var(--fs));font-weight:700;margin-bottom:8px;color:#5A4632}
.contact-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.contact-item:last-child{border-bottom:none}
.contact-item .info{flex:1;min-width:0}
.contact-item .info b{display:block;font-size:calc(15px*var(--fs))}
.contact-item .info span{font-size:calc(11.5px*var(--fs));color:var(--sub);word-break:break-all}
.contact-item .on-tag{font-size:calc(11px*var(--fs));color:#fff;background:var(--green);border-radius:20px;padding:2px 8px;flex-shrink:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1;min-width:80px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:calc(16px*var(--fs));font-family:var(--serif)}
.stat span{font-size:calc(11px*var(--fs));color:var(--sub)}
.note{background:#FBF6EA;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:calc(12.5px*var(--fs));color:#6B5A44;line-height:1.6}

/* 弹出层 */
#sheet-mask{position:fixed;inset:0;background:rgba(58,44,31,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet-mask.hide{display:none}
.sheet{width:100%;max-width:560px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-brd);border-top:none;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:700;margin-bottom:12px}
.sheet label{display:block;font-size:calc(12.5px*var(--fs));color:var(--sub);margin:10px 0 4px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions button{flex:1;padding:11px 0;border-radius:12px;font-size:calc(15px*var(--fs));min-height:44px}
.sheet .actions .ok{background:var(--green);color:#fff}
.sheet .cancel{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.sheet .actions .cancel{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.rhy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rhy-grid .inl label{font-size:calc(11.5px*var(--fs));color:var(--sub);margin-bottom:3px;display:block}
.rhy-grid input{font-size:calc(16px*var(--fs));padding:8px 10px}
.unit-row{display:flex;gap:6px}
.unit-row select{flex:1;font-family:inherit;font-size:calc(16px*var(--fs));border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink)}
.sw-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:none}
.sw-row .tt{font-size:calc(14px*var(--fs))}
.sw-row .tt small{display:block;font-size:calc(11.5px*var(--fs));color:var(--sub);margin-top:1px}
.sw{position:relative;display:inline-block;width:46px;height:27px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .track{position:absolute;inset:0;background:#D8CBB2;border-radius:14px;transition:.2s}
.sw .thumb{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+.track{background:var(--wechat,#5F8F7B)}
.sw input:checked+.track+.thumb{left:22px}
.pct-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pct-grid .inl label{font-size:calc(11px*var(--fs));color:var(--sub);display:block;margin-bottom:3px}
.pct-grid input{font-size:calc(15px*var(--fs));padding:7px 6px;text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.avatar-prev{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:calc(22px*var(--fs));font-weight:700;object-fit:cover;flex-shrink:0}
.contact-pick{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;background:var(--card)}
.contact-pick.on{border-color:var(--green);background:var(--green-soft)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap}
.preset-row button{width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;border:2px solid transparent}
.preset-row button.on{border-color:var(--ink)}

/* 来电 / 通话（ring 来电全屏 · mini 顶部悬浮条 · full 全屏通话） */
#callOverlay{position:fixed;inset:0;z-index:80;display:none;color:#fff}
#callOverlay.show{display:block}
#callOverlay.ring,#callOverlay.full{background-size:cover;background-position:center;background-color:#2A3A30}
#callOverlay.ring::before,#callOverlay.full::before{content:'';position:absolute;inset:0;background:rgba(24,32,26,.48);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ring-box{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16% 0 calc(10% + env(safe-area-inset-bottom))}
.call-avatar{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:calc(42px*var(--fs));font-weight:700;overflow:hidden}
.call-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.call-avatar i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--serif)}
.call-name{font-size:calc(23px*var(--fs));font-weight:700;margin-top:16px}
.call-state{font-size:calc(13px*var(--fs));opacity:.78;margin-top:5px}
.call-timer{font-size:calc(15px*var(--fs));opacity:.95;margin-top:4px;font-variant-numeric:tabular-nums}
.call-btns{display:flex;gap:60px;align-items:flex-end}
.call-btn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:calc(12px*var(--fs));opacity:.92}
.call-btn .ic{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--danger)}
.call-btn.accept .ic{background:#2FBF71}
/* mini 顶部悬浮通话条（不挡聊天） */
#callOverlay.mini{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;z-index:90;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 10px 30px rgba(30,24,15,.18);color:var(--ink)}
.call-mini{display:flex;align-items:center;gap:10px;padding:8px 12px}
.call-mini .cm-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--serif);font-size:calc(17px*var(--fs));font-weight:700;color:#fff}
.call-mini .cm-av img{width:100%;height:100%;object-fit:cover}
.call-mini .cm-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal}
.call-mini .cm-tx{flex:1;min-width:0}
.call-mini .cm-tx b{font-size:calc(14px*var(--fs));display:block}
.call-mini .cm-tx span{font-size:calc(12px*var(--fs));color:var(--sub);font-variant-numeric:tabular-nums}
.call-mini button{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.65);color:var(--ink);flex-shrink:0;min-height:38px}
.call-mini button.duan{background:var(--danger);color:#fff}
/* full 全屏通话 */
.call-full{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 0 calc(12% + env(safe-area-inset-bottom));color:#fff}
.call-full .cf-top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.call-full .cf-top button{color:#fff;font-size:calc(13px*var(--fs));background:rgba(255,255,255,.16);border-radius:14px;padding:7px 14px;min-height:40px;display:flex;align-items:center;gap:5px}
.call-full .cf-body{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;gap:10px}
.call-full .call-timer{font-size:calc(17px*var(--fs));margin-top:6px}
.video-stage{width:min(300px,72%);aspect-ratio:3/4;border-radius:20px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.video-stage img.vf{width:100%;height:100%;object-fit:cover}
.video-stage .vs-label{position:absolute;bottom:8px;left:10px;font-size:calc(11px*var(--fs));opacity:.8;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 8px}
.video-badge{position:absolute;top:8px;right:8px;font-size:calc(10px*var(--fs));background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
#transferOverlay{position:fixed;inset:0;background:rgba(30,24,15,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:none;align-items:center;justify-content:center}
#transferOverlay.show{display:flex}
.transfer-pop{width:292px;background:#fff;border-radius:16px;padding:22px 16px 16px;text-align:center}
.transfer-pop .ttl{font-size:calc(14px*var(--fs));color:#555;margin-top:10px}
.transfer-pop .amt{font-size:calc(38px*var(--fs));font-weight:700;margin:6px 0 2px;font-family:var(--serif)}
.transfer-pop .amt small{font-size:calc(17px*var(--fs));font-weight:600}
.transfer-pop .btns{display:flex;gap:10px;margin-top:16px}
.transfer-pop .btns button{flex:1;padding:12px 0;border-radius:10px;font-size:calc(15px*var(--fs));min-height:44px}
.tr-accept{background:#2FBF71;color:#fff}
.tr-decline{background:#F2F2F2;color:#888}
/* ===== v7：字体 / 转账 / 钱包 / 统计 ===== */
.fs-row{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:12px 14px}
.fs-btn{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.7);color:var(--green);font-size:calc(18px*var(--fs));font-weight:700;display:flex;align-items:center;justify-content:center;min-height:44px}
.fs-val{flex:1;text-align:center;font-size:calc(16px*var(--fs));font-weight:600;font-variant-numeric:tabular-nums}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.amt-chip{background:var(--green-soft);color:#2F6B3C;border-radius:14px;padding:10px 14px;font-size:calc(14px*var(--fs));font-weight:600;min-height:44px}
.tf-card{align-self:flex-end;background:var(--green);color:#fff;border-radius:15px;border-bottom-right-radius:5px;padding:10px 14px;min-width:150px;max-width:76%;text-align:center;box-shadow:0 6px 16px rgba(95,143,123,.28)}
.tf-card.in{align-self:flex-start;background:#FBE2E6;color:#A5475B;border-bottom-left-radius:5px;border-bottom-right-radius:15px;box-shadow:0 6px 16px rgba(200,120,135,.22)}
.tf-card .tf-n{font-size:calc(12px*var(--fs));opacity:.85}
.tf-card .tf-a{font-size:calc(22px*var(--fs));font-weight:800;margin:3px 0;letter-spacing:.5px}
.tf-card .tf-t{font-size:calc(11px*var(--fs));opacity:.8}
.tf-btns{display:flex;gap:8px;margin:8px 0 2px}
.tf-btns button{flex:1;padding:7px 0;border-radius:10px;background:#fff;color:#A5475B;font-size:calc(13px*var(--fs));min-height:38px}
.tf-btns button.gray{color:var(--sub);background:rgba(255,255,255,.7)}
.ck-card{display:flex;flex-direction:column;gap:8px;border-radius:18px;padding:12px 13px;max-width:86%;min-width:180px;background:linear-gradient(160deg,#FFFBF0,#FFF3DC);border:1px solid #F3E0BC;box-shadow:0 6px 20px rgba(214,158,102,.14)}
.ck-card.out{background:linear-gradient(160deg,#F4F9FF,#E9F2FF);border-color:#CBDDF3}
.ck-line{display:flex;align-items:center;gap:7px}
.ck-ic{width:26px;height:26px;border-radius:50%;background:#F0C987;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck-card.out .ck-ic{background:#8FB7E8}
.ck-line b{font-size:calc(12.5px*var(--fs));color:#C08A3E;letter-spacing:.5px}
.ck-card.out .ck-line b{color:#5F8FB8}
.ck-tm{margin-left:auto;font-size:calc(11px*var(--fs));color:var(--sub);white-space:nowrap}
.ck-quote{background:#fff;border:1px solid rgba(243,224,188,.9);border-radius:12px;padding:9px 11px;font-size:calc(14px*var(--fs));line-height:1.55;color:#4A3F33;word-break:break-word}
.ck-card.out .ck-quote{border-color:#CBDDF3}
.ck-reply{display:flex;flex-direction:column;gap:8px}
.ck-in{width:100%;min-height:44px;max-height:120px;border-radius:12px;background:rgba(255,255,255,.92);border:1px solid var(--glass-line);padding:10px 12px;font-size:calc(13.5px*var(--fs))}
.ck-chips{display:flex;flex-wrap:wrap;gap:6px}
.ck-chips button{font-size:calc(12px*var(--fs));padding:6px 11px;border-radius:20px;background:rgba(255,255,255,.9);border:1px solid var(--line);color:#6B5A44;min-height:34px}
.ck-actions{display:flex;gap:8px}
.ck-actions .ck-later{flex:1;border-radius:12px;padding:9px 0;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--sub);font-size:calc(13px*var(--fs));min-height:40px}
.ck-actions .ck-send{flex:1.4;border-radius:12px;padding:9px 0;background:linear-gradient(150deg,#F0859F,#D9557A);color:#fff;font-size:calc(13.5px*var(--fs));font-weight:700;min-height:40px}
.ck-replied{display:flex;align-items:center;gap:8px;font-size:calc(12.5px*var(--fs));color:var(--sub);flex-wrap:wrap}
.ck-replied b{font-size:calc(13.5px*var(--fs));color:var(--ink);font-weight:600}
.ck-replied .ck-done{margin-left:auto;font-style:normal;font-size:calc(11.5px*var(--fs));background:rgba(226,83,123,.12);color:#C4577E;border-radius:20px;padding:3px 10px}
.ck-wait{font-size:calc(12px*var(--fs));color:var(--sub);text-align:right}
/* 朋友圈微信 */
.p-row{display:flex;gap:10px}
.p-av{flex-shrink:0}
.p-main{flex:1;min-width:0}
.post .p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.post .ptime{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.p-ops{display:flex;gap:4px}
.p-ops .op{display:inline-flex;align-items:center;gap:4px;font-size:calc(13px*var(--fs));color:var(--sub);background:none;border:none;padding:6px 10px;min-height:38px;border-radius:10px}
.p-ops .op.on{color:#E05C5C}
.p-ops .op .like-ic{color:#E05C5C}
.p-likes{margin-top:8px;background:#F3ECDC;border-radius:9px;padding:5px 10px;font-size:calc(13px*var(--fs));color:#3E5A8F}
.pc-in{display:flex;gap:8px;margin-top:8px;align-items:center}
.pc-in input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:rgba(255,255,255,.6);font-size:calc(13px*var(--fs));min-height:44px;box-sizing:border-box}
.pc-in button{min-height:44px;padding:0 14px;border-radius:10px;background:var(--green);color:#fff}
/* ===== 朋友圈：动态不要外围白框（仿微信）=====
   以前每条动态都套一张白卡（.card.post），像一张张卡片；
   微信是直接铺在背景上、只用一条细线分隔。这里改用 .moment，
   和 .post 那套玻璃卡完全脱钩，避免被主题里的 !important 又染回来。 */
.moment{display:flex;gap:10px;padding:16px 2px;min-height:112px;margin:0;background:none!important;border:none!important;
  border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.moment+.moment{border-top:1px solid var(--line)!important}
/* ★ 每条动态的"骨架"高度固定住：头像 + 昵称 + 正文 + 底部那行(时间/赞/评论)。
   用户报的"没评论的比我评论的短了一半" —— 以前没有最小高度，只有一行字的动态塌成一小条；
   现在每条至少 112px，有没有评论都占同样的骨架，差别只来自那块评论本身。 */
.moment .p-row{min-height:96px}
.moment .p-main{flex:1;min-width:0;display:flex;flex-direction:column}
.moment .p-foot{margin-top:auto}
.moment .p-main{flex:1;min-width:0}
.moment .nm{font-weight:700;font-size:calc(14.5px*var(--fs));color:var(--green)}
.moment .txt{font-size:calc(15px*var(--fs));white-space:pre-wrap;word-break:break-word;padding:3px 0}
.moment .p-sticker{max-width:150px;border-radius:14px;display:block;margin-top:6px}
.moment .p-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.moment .p-imgs img{width:104px;height:104px;object-fit:cover;border-radius:12px;display:block}
.moment .p-imgs.n1 img{width:100%;height:190px}
.moment .p-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.moment .ptime{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.moment .p-ops{display:flex;gap:14px;align-items:center}
.moment .op{display:flex;align-items:center;gap:4px;font-size:calc(12.5px*var(--fs));color:var(--sub);min-height:34px;padding:0 2px}
.moment .op.on{color:#D4605A;font-weight:700}
.moment .op .like-ic{font-size:calc(15px*var(--fs))}
.moment .tag{align-self:flex-start}
/* ★ 评论块要保持"原来那个长度"（用户：你朋友圈评论区都缩小一半了？我要这个长度）
   所以这里给足内边距和大一点的字号，不要去压缩它。 */
.moment .cmt-box{margin-top:10px;background:rgba(238,234,238,.94);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.moment .cmt-like{font-size:calc(13px*var(--fs));color:#6B5A63;padding-bottom:2px}
.moment .cmt-hr{height:1px;background:rgba(176,152,168,.3);margin:7px 0}
.moment .cmt{font-size:calc(13.5px*var(--fs));line-height:1.95;color:var(--ink)}
.moment .cmt b{color:var(--green);font-weight:700}
.moment .cmt-re{color:var(--sub);font-size:calc(11.5px*var(--fs));margin:0 3px}
.moment .pc-in{display:flex;gap:8px;margin-top:8px;align-items:center}
.moment .pc-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;
  background:rgba(255,255,255,.72);font-size:calc(13px*var(--fs));min-height:40px}
.moment .pc-in button{min-height:40px;padding:0 14px;border-radius:10px;background:var(--green);color:#fff;flex:none}
.me-overlay{position:absolute;right:10px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.me-overlay b{font-size:calc(14px*var(--fs))}
/* 邮件 */
.mail-tabs{display:flex;gap:8px;margin-bottom:12px}
.m-tab{flex:1;padding:10px;border-radius:14px;background:rgba(255,255,255,.45);border:1px solid var(--glass-brd);font-size:calc(14px*var(--fs));color:var(--sub);min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px}
.m-tab.on{background:var(--green);color:#fff;border-color:transparent}
.m-cnt{background:rgba(0,0,0,.14);border-radius:20px;padding:1px 7px;font-size:calc(11px*var(--fs))}
.m-tab.on .m-cnt{background:rgba(255,255,255,.28)}
.mail-item{display:flex;gap:11px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 13px;margin-bottom:9px}
.mail-item.unread{background:rgba(255,255,255,.68)}
.m-body{flex:1;min-width:0}
.m-top{display:flex;align-items:center;justify-content:space-between}
.m-top b{font-size:calc(14.5px*var(--fs))}
.m-time{font-size:calc(11px*var(--fs));color:var(--sub)}
.m-title{font-size:calc(14px*var(--fs));font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mail-item.unread .m-title{font-weight:800}
.m-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4C9EE8;margin-left:6px;vertical-align:middle}
.m-sum{font-size:calc(12.5px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.m-st{font-size:calc(11px*var(--fs));color:var(--green);margin-top:2px}
/* 「已发送」那封信下面直接展开他的回信（浅绿小块） */
.mail-reply{margin:-3px 2px 12px;padding:11px 13px;border-radius:14px;
  background:rgba(216,240,227,.94);border:1px solid rgba(122,178,150,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
.mail-reply .mr-top{display:flex;align-items:center;gap:8px}
.mail-reply .mr-tag{font-size:calc(11px*var(--fs));font-weight:800;color:#2F6B52;background:rgba(255,255,255,.8);
  border-radius:999px;padding:2px 9px;flex:none}
.mail-reply .mr-title{font-size:calc(13.5px*var(--fs));font-weight:700;color:#2F6B52;margin:7px 0 3px;word-break:break-word}
.mail-reply .mr-body{font-size:calc(13.5px*var(--fs));line-height:1.72;color:#33604D;white-space:pre-wrap;word-break:break-word}
/* 收件箱里标出"这是回信"（和他主动写来的信区分开） */
.m-re-tag{display:inline-block;font-size:calc(10.5px*var(--fs));font-weight:800;color:#2F6B52;
  background:rgba(216,240,227,.95);border:1px solid rgba(122,178,150,.4);border-radius:999px;
  padding:1px 7px;margin-right:6px;vertical-align:1px;flex:none}
.m-re-to{font-size:calc(11px*var(--fs));color:var(--green);margin-top:2px}

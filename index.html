  /* 第一步：把大图摘出去，让本地副本保持轻量（配额越紧，系统越容易清理） */
  var slim=null;
  try{slim=JSON.parse(json);slimForLocal(slim);slim=JSON.stringify(slim)}catch(e0){slim=null}
  var cands=[slim,json];
  for(var q=0;q<cands.length;q++){
    if(!cands[q])continue;
    try{localStorage.setItem(KEY,cands[q]);return {ok:true,json:cands[q]}}catch(e){}
  }
  /* 镜像键和主键内容完全一样，是最容易腾出的一大块空间。

  try{localStorage.removeItem(KEY_MIRROR)}catch(e){}

  function consider(owner,key){
    try{if(owner&&typeof owner[key]==='string'&&owner[key].length>4000)cand.push({o:owner,k:key,n:owner[key].length})}catch(e){}
  }
  var st=obj.settings||{};
  var ks=['coverImg','homeBgImg','chatBgImg','callBgImg'];
  for(var i=0;i<ks.length;i++)consider(st,ks[i]);
  if(obj.widgetImgs){for(var wk in obj.widgetImgs)consider(obj.widgetImgs,wk)}
  if(obj.me)consider(obj.me,'avatarImg');
  /* 这两类以前不在名单里 —— 所以无论怎么删都还是写不下 */
  if(obj.widgetPhoto)consider(obj.widgetPhoto,'img');
  if(Array.isArray(obj.stickers))for(var ski=0;ski<obj.stickers.length;ski++)consider(obj.stickers[ski],'img');
  if(Array.isArray(obj.contacts))for(var ci=0;ci<obj.contacts.length;ci++)consider(obj.contacts[ci],'avatarImg');
  if(Array.isArray(obj.posts))for(var pi=0;pi<obj.posts.length;pi++){
    var po=obj.posts[pi];
    if(po&&po.avatarImg)cand.push({o:po,k:'avatarImg',n:String(po.avatarImg).length});
    if(po&&Array.isArray(po.imgs))for(var ii=0;ii<po.imgs.length;ii++)if(typeof po.imgs[ii]==='string'&&po.imgs[ii].length>4000)cand.push({o:po.imgs,k:String(ii),n:po.imgs[ii].length});
    if(po&&typeof po.sticker==='string'&&po.sticker.length>4000)cand.push({o:po,k:'sticker',n:po.sticker.length});

  cand.sort(function(a,b){return b.n-a.n});

    try{dumpImages()}catch(e){}
    cand[c].o[cand[c].k]='';
    try{
      var _t=JSON.stringify(obj);
      localStorage.setItem(KEY,_t);

      window.__saveStatus='slim';

    }catch(e){}
  }
  /* 还不够：从最旧的聊天记录开始瘦身（只影响本机副本，IndexedDB 里仍是完整的） */
  if(Array.isArray(obj.messages)&&obj.messages.length){
    var trimmed=0;
    while(trimmed<obj.messages.length){
      var drop=Math.max(1,Math.ceil((obj.messages.length-trimmed)/4));
      obj.messages=obj.messages.slice(drop);

      try{
        var _t2=JSON.stringify(obj);

        _localDrop+=trimmed;
        window.__saveNote='本机存档空间已满，最早的 '+_localDrop+' 条聊天记录不再重复保存在本机副本里（设置和其他内容都在，IndexedDB 里仍是完整的）。建议去 设置→备份 导出一份';
        window.__saveStatus='slim';

     localMirror / _bak / _rawfail 三份副本加起来可能是主键的好几倍，
     它们一直占着配额，会让主键怎么写都失败 —— 以前从来没释放过。
     做法：先把内容挪进 IndexedDB（不丢），再从 localStorage 删掉，然后重试。 */
  try{

    var _freedAny=false,_freedBytes=0;
    for(var _si=0;_si<_spill.length;_si++){
      var _txt=null;
      try{_txt=localStorage.getItem(_spill[_si][1])}catch(e){}
      if(!_txt)continue;
      try{idbPut('spill_'+_spill[_si][0],_txt)}catch(e){}
      try{localStorage.removeItem(_spill[_si][1]);_freedAny=true;_freedBytes+=_txt.length}catch(e){}
    }
    window.__saveDiag={json:json.length,freed:_freedBytes,at:Date.now()};
    if(_freedAny){
      /* 先用完整 json 试 */
      try{
        localStorage.setItem(KEY,json);
        window.__saveStatus='slim';
        window.__saveNote='本机存档空间紧张，已把旧副本挪到大容量存储腾出空间（约 '+Math.round(_freedBytes/1024)+' KB），你的数据都还在';
        return {ok:true,json:json};
      }catch(e){}
      /* 再用瘦身版试 */
      try{
        var _sl=JSON.parse(json);slimForLocal(_sl);
        var _sj=JSON.stringify(_sl);
        localStorage.setItem(KEY,_sj);
        window.__saveStatus='slim';
        window.__saveNote='本机存档空间紧张，已腾出空间并只保留轻量副本；图片仍在大容量存储里';
        return {ok:true,json:_sj};
      }catch(e){}
    }
  }catch(e){}

  window.__saveStatus='failed';
  /* 最后一步：连消息都删光了还写不下，就只保设置，别把设置也丢了 */
  try{
    var tiny=JSON.parse(json);
    for(var tk in tiny){
      if(Array.isArray(tiny[tk])&&tiny[tk].length&&tk!=='contacts'&&tk!=='cards'&&tk!=='statusCards'&&tk!=='moodCards'&&tk!=='patCards'&&tk!=='diaryCards'&&tk!=='writerCards'){
        tiny[tk]=[];
      }
    }
    var _t3=JSON.stringify(tiny);
    if(_t3.length<300000){
      localStorage.setItem(KEY,_t3);
      window.__saveStatus='slim';
      window.__saveNote='本机存储空间已满，只保留了设置和字卡（聊天记录/朋友圈/信件等已不在本机副本里）。完整内容请用 设置→备份 导出，或删掉一些大图再试';
      return {ok:true,json:_t3};
    }
  }catch(e){}
  return {ok:false,json:null};
}

     等于每次保存都干两遍活。而 hydrateBig 读的 __big__ 标记现在**没有任何代码再写**，
     也就是说这份副本已经没人用了。所以日常只同步图片，big 副本改为"兜底时才写"。 */
  try{dumpImages()}catch(e){}

function finalizeWrite(){

var _inSave=false;
function save(){
  /* 重入保护：save() 里间接又触发 save() 时（消息风暴那种情况），
     一层层套下去会把调用栈打穿，报出 "Maximum call stack size exceeded" —— 
     而那个错误又被当成"保存失败"，把人往存储空间的方向带。 */
  if(_inSave){ window.__saveReentry=(window.__saveReentry||0)+1; return true }
  _inSave=true;

    /* 关键：**边序列化边**把大图换成空串（用 JSON.stringify 的 replacer）。
       · 不先拼一份含所有 base64 的完整字符串 —— 以前每存一次就白拼十几 MB，
         iOS 上就是这一步把页面撑崩的（实测 293KB 聊天记录却要拼 9.7MB 的串）。

         嵌套对象是和 state 共享的，那样会把内存里的图片一起清掉。
       图片本体由 dumpImages() 送进 IndexedDB，加载时靠 _imgs 清单读回。 */
    try{dumpImages()}catch(e){}
    var _imgs=imgValues(state),_ikeys=[],_big={};
    for(var _k in _imgs){_ikeys.push(_k);_big[_imgs[_k]]=1}
    var obj=plainCopy(state);
    if(_ikeys.length)obj._imgs=_ikeys;
    var json=JSON.stringify(obj,function(k,v){

       参考站的做法也是：主数据放 IndexedDB，localStorage 只当小的安全副本。
       这里改成：完整存档先写 IndexedDB —— 它成了才算保存成功；

      _rich=false;

        var _m=localStorage.getItem(KEY_MIRROR),_b=localStorage.getItem(KEY+'_bak');
        var _o=null;
        try{_o=JSON.parse(json)}catch(e0){}
        var _kn=_o?Object.keys(_o).length:0;
        var _cands=[_m,_b];
        for(var _q=0;_q<_cands.length;_q++){
          if(!_cands[_q])continue;

        }
      }catch(e2){}
    }

    if(_rich&&window.indexedDB){
      dbOK=true;                       /* 先乐观，紧接着异步核实真伪 */
      window.__saveDb='pending';
      window.__saveFullBytes=json.length;
      try{
        scheduleFullWrite(json);
      }catch(e){ window.__saveDb='fail'; dbOK=false }
    }else{
      window.__saveSkippedBackup=1;
      dbOK=!!window.__saveDb&&window.__saveDb==='ok';
    }

    var ok=writeBoth(json);
    /* 立刻记下"本机这份是否被裁过" —— 下面马上会把 __saveStatus 覆盖成 ok，
       而 IndexedDB 的成败是异步回来的，到那时就看不出来了 */
    window.__saveLocalLossy=(window.__saveStatus==='slim');
    if(ok&&dbOK){
      window.__saveStatus='ok';
      if(window.__saveErr)window.__saveErr=null;
    }else if(ok){
      window.__saveStatus='ok';
      if(window.__saveErr)window.__saveErr=null;
    }else if(dbOK){
      /* 本机缓存写不下，但完整存档已经进了大容量存储 —— 数据没丢，不算失败 */
      window.__saveStatus='dbonly';
      window.__saveNote='本机缓存写不下了，但完整存档已存进大容量存储，数据没有丢';
    }else{
      window.__saveStatus='failed';
      /* ★ 最危险的状态：本机缓存被裁、大容量存储也写不进去。
         以前这里只留下一个光秃秃的 "failed"，设置→存储 那一行不显示任何原因
         （它读的是 __saveErr），用户既不知道发生了什么、也不知道该做什么。
         现在把原因和该做的事一起记下来，面板直接显示。 */
      window.__saveErr={t:Date.now(),name:'StorageFull',

  }catch(e){

/** ★ 把新加的 App 补进"图标顺序"清单。
    首页是按 state.appOrder 渲染的，老存档里只有旧的 App，
    所以新加的「问卷」在升级后不会显示（用户报的）。这里在开机迁移时补齐。 */
function syncAppOrder(){
  try{
    var defs=appListDefs(),ids=[];
    for(var i=0;i<defs.length;i++)ids.push(defs[i].v);
    var cur=Array.isArray(state.appOrder)?state.appOrder.slice():[];
    cur=cur.filter(function(v){return ids.indexOf(v)>=0});     /* 去掉已经不存在的 */
    for(var j=ids.length-1;j>=0;j--)if(cur.indexOf(ids[j])<0)cur.unshift(ids[j]);   /* ★ 新加的 App 放最前面（第一页第一个） */
    /* ★ 一次性修正：之前那版把「问卷」接到了最后（跑到第二页去了），
       对已经出现过这个问题的存档，把它挪到第一个。只做一次，之后你自己怎么拖都行。 */
    try{
      if(!state.settings)state.settings={};
      if(!state.settings._appFirstFix){
        state.settings._appFirstFix=1;
        var _si=cur.indexOf('survey');
        if(_si>0){ cur.splice(_si,1); cur.unshift('survey') }
      }
    }catch(e){}
    state.appOrder=cur;
  }catch(e){}
}

       容器就被撑高一次，整个首页跟着变长。
       现在手动摆放的组件一律被夹在这个固定区域内，挪多少次长度都不变；
       只有"增删组件/换尺寸"这种真正改变内容的事才会让它变。 */
    /* ★ 区域高度只按"纯自动排布"算，完全不看手动位置。
       自动摆放那些没手动放过的组件时，仍然会避开你手动放的，
       但那是"摆的位置"，不该影响"区域有多高"。 */
    var areaH=widgetAreaHeight(keys,function(k){return real[k]||widgetEstH(k)});
    var gr=grid.getBoundingClientRect();
    /* 把手动摆放的组件夹回区域内（超出下边缘就顶回去），并把夹过的位置记下来 */
    var clamped=false;
    for(i=0;i<els.length;i++){
      var el3=els[i];
      var k3=wKeyOf(el3);
      if(!widgetHasPos(k3))continue;
      var h3=el3.offsetHeight||0;
      if(!h3||h3<20)h3=widgetEstH(k3);
      var y3=parseFloat(el3.style.top)||0;
      var maxY3=Math.max(0,areaH-h3);
      if(y3>maxY3){
        el3.style.top=maxY3+'px';
        if(state.widgetPos&&state.widgetPos[k3]){
          state.widgetPos[k3].y=Math.round(maxY3);
          clamped=true;
        }
      }
      /* 横向也保证不出界 */
      var w3=el3.offsetWidth||0;
      if(gr.width&&el3.offsetWidth>gr.width)el3.style.left='0%';
    }
    if(clamped)try{save()}catch(e){}
    var want=areaH+'px';
    if(sp&&sp.style.height!==want)sp.style.height=want;
  }
}
function wKeyOf(el){
  if(!el)return null;
  var k=el.getAttribute&&el.getAttribute('data-wkey');
  if(k)return k;
  var cls=(el.className||'')+'';
  if(cls.indexOf('w-music')>-1)return 'music';
  if(cls.indexOf('w-note')>-1)return 'note';
  if(cls.indexOf('w-days')>-1)return 'days';
  if(cls.indexOf('w-time')>-1||cls.indexOf('w-clock')>-1)return 'clock';
  if(cls.indexOf('w-feed')>-1)return 'feed';
  return null;
}

function feedEvent(text,view){

  for(var i=state.feedEvents.length-1;i>=0;i--){

    if(t-e.ts>6*3600*1000)break;

var TAROT_DECK=78;   /* 一副塔罗 78 张：22 张大阿卡纳 + 4 花色 × 14 张 */
function tarotCardAt(n){
  n=((Math.round(n)%TAROT_DECK)+TAROT_DECK)%TAROT_DECK;
  if(n<22)return {n:n,name:TAROT_MAJOR[n][0],key:TAROT_MAJOR[n][1],suit:''};
  var i=n-22,si=Math.floor(i/14),ri=i%14;

/** 数字 1–78 对应牌面；超出 78 的两位数按"各位数字"拆开，
 *  例如 92 → 9 和 2（而不是被整段丢掉，导致重复抽到同一张）。 */
function tarotNums(str){
  var raw=String(str==null?'':str).trim();
  if(!raw)return [7];
  /* ★ 以前是"把所有非数字字符删掉、再从前往后每次尽量取两位"，
     于是 "3和8" 会变成 38（一个数），单个数字根本没法输入。
     现在先按分隔符切开（空格 / 逗号 / 顿号 / 和 / + / 斜杠 / 竖线），
     每一段再当数字读；只有整段超范围时才退回"两位一组"的老逻辑。 */
  var parts=raw.split(/[\s,，、+＋和/|｜·;；]+/),out=[],i,j;
  for(i=0;i<parts.length;i++){
    var d=parts[i].replace(/[^0-9]/g,'');
    if(!d)continue;
    var v=parseInt(d,10);
    if(v>=1&&v<=TAROT_DECK){out.push(v);continue}
    j=0;
    while(j<d.length){
      if(j+1<d.length){
        var two=parseInt(d.substr(j,2),10);
        if(two>=1&&two<=TAROT_DECK){out.push(two);j+=2;continue}
      }
      var one=parseInt(d.charAt(j),10);
      if(one>=1&&one<=TAROT_DECK)out.push(one);
      j++;
    }
  }
  if(!out.length)out=[7];
  return out;
}
function tarotRandNums(count){
  var out=[];
  for(var i=0;i<count;i++)out.push(1+Math.floor(Math.random()*TAROT_DECK));
  return out;
}
function tarotShuffle(n){
  var a=[];for(var i=1;i<=n;i++)a.push(i);
  for(var i=n-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}

function tarotDoDraw(nums,who,question,spreadName){
  var nv=tarotNums(nums);

  for(var i=0;i<TAROT_SPREADS.length;i++)if(TAROT_SPREADS[i][0]===_tSpread)sp=TAROT_SPREADS[i];
  if(!sp)sp=TAROT_SPREADS[0];
  var cnt=sp[2],cards=[];
  var deck=tarotShuffle(78);
  var rp3=((state.settings&&state.settings.tarotRevPct)!=null?state.settings.tarotRevPct:50);
  /* ★ 原来是 deck[((nv[k%nv.length]||1)-1)%78]：数字不够时从头循环复用，
     所以"过去"和"未来"会抽到同一张牌。现在记录已用过的牌，
     用户没给数字的位置顺着牌堆往后取一张没用过的，保证一个牌阵里不重复。 */
  var used=[];
  function _tPick(want){
    var start=(want>=1&&want<=TAROT_DECK)?((want-1)%78):-1,di=-1,q;
    if(start>=0){for(q=0;q<78;q++){var cand=deck[(start+q)%78];if(used.indexOf(cand)<0){di=cand;break}}}
    if(di<0){for(q=0;q<78;q++)if(used.indexOf(deck[q])<0){di=deck[q];break}}
    if(di<0)di=deck[0];
    used.push(di);
    return di;
  }
  for(var k=0;k<cnt;k++){
    var want=(k<nv.length)?nv[k]:0;
    var cd0=tarotCardAt(_tPick(want));
    cd0.rev=Math.random()*100<rp3?1:0;
    cards.push(cd0);

  state._tarotLast={nums:nv,cards:cards,positions:sp[3],who:who,question:question||'',ts:now(),spreadName:sp[1]};
  state.tarotLog=state.tarotLog||[];
  state.tarotLog.push({ts:now(),who:who,question:question||'',cards:cards,spreadName:sp[1],spread:sp[0]});
  save();

function drawCards(n,poolArr){
  var pool=(poolArr||state.cards).slice();
  var out=[],k=0;
  while(pool.length&&out.length<n&&k<100){
    var i=Math.floor(Math.random()*pool.length);
    out.push(pool.splice(i,1)[0].text);k++;
  }
  return out;
}
var FALLBACK=['收到，我在。','嗯，我在听。','记下了。','好，就这么说定了。'];
function drawCardText(){var d=drawCards(1);return d.length?d[0]:pick(FALLBACK)}
function pickCardText(used){
  if(!state.cards.length)return drawCardText();
  /* 按分类分组并缓存（字卡库变了自动失效） */
  var sig=state.cards.length+':'+(state.cards[state.cards.length-1].id||'');
  if(_cardGroups&&_cardSig!==sig){_cardGroups=null;_cardKeys=null}
  _cardSig=sig;
  var groups=_cardGroups;
  if(!groups){
    groups={};
    for(var i=0;i<state.cards.length;i++){var tg=state.cards[i].tag||'';(groups[tg]=groups[tg]||[]).push(state.cards[i])}
    _cardGroups=groups;
    _cardKeys=null;
  }
  var keys=_cardKeys;
  if(!keys){keys=[];for(var kk in groups)keys.push(kk);_cardKeys=keys}
  /* 分类等概率 -> 分类内"不放回"地挑，保证同一条消息里不会重复用同一张字卡 */
  var order=_shuffleKeys(keys),fallback='';
  for(var a=0;a<order.length;a++){
    var g=groups[order[a]];
    if(!g||!g.length)continue;
    var pool=_unusedTexts(g,used);
    if(!pool.length)continue;
    var text=pool[Math.floor(Math.random()*pool.length)];
    if(!fallback)fallback=text;
    if(!used||used.indexOf(text)<0)return text;
  }
  return fallback||drawCardText();
}
function _shuffleKeys(keys){
  var a=keys.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function _unusedTexts(g,used){
  var out=[];
  for(var i=0;i<g.length;i++){
    var tx=g[i].text;
    if(!used||used.indexOf(tx)<0)out.push(tx);
  }
  return out;
}

function drawBalancedCards(n){
  var out=[],used=[];
  for(var i=0;i<n;i++){
    var t=pickCardText(used);
    if(!t)break;
    out.push(t);used.push(t);
  }
  return out;
}

  var puzzleOn=(st.puzzle===true);

  var rollPuzzle=puzzleOn&&state.cards.length&&(Math.random()*100<puzzlePct);

  if(avoid!=null&&text===avoid&&state.cards.length>1){
    for(var t=0;t<3;t++){
      var alt=(puzzleOn&&state.cards.length&&Math.random()*100<puzzlePct)?drawBalancedCards(rnd(1,puzzleMax())).join('\n\n'):pickCardText();

/* ================= 节奏与连发 ================= */
function rndDelay(c,kind){
  var min=kind==='init'?c.initMin:c.replyMin;
  var max=kind==='init'?c.initMax:c.replyMax;
  if(min>max){var tmp=min;min=max;max=tmp}
  return rnd(min,max)*1000;
}
/** 他"连发"时每条之间隔多久（秒）。主动消息和他的回复都用这一个。
    ★ 以前：主动消息是写死的 20~50 秒，而"回复"只有 0.9~1.8 秒 ——
      所以回复看起来像"一次全冒出来"（用户报的"连发要有间隔"）。 */
function burstGapMs(){
  var st=state.settings||{};
  var a=(st.burstGapMin!=null?st.burstGapMin:20), b=(st.burstGapMax!=null?st.burstGapMax:50);
  a=Number(a);b=Number(b);
  if(!isFinite(a)||a<1)a=20;
  if(!isFinite(b)||b<1)b=50;
  if(a>b){var t=a;a=b;b=t}
  return rnd(a,b)*1000;
}
function pickBurstCount(c){
  if(c.burstOn===false)return 1;
  var b=c.burst||[45,32,15,6,2];
  /* ★ 原来是"累加阈值"：r=随机*100，累加到超过 r 就取这个条数。
     可你填的 5 个数字加起来往往不等于 100（比如 45+40+30+25+10=150），
     排在后面的就永远抽不到 —— 4 条、5 条变成 0%，看起来就是"老只发一条"。
     现在按总和归一化：这 5 个数字当"相对权重"，自动换算成百分比，
     填多少都能正确分配（45/40/30/25/10 → 30%/26.7%/20%/16.7%/6.7%）。 */
  var sum=0,i;
  for(i=0;i<5;i++)sum+=Math.max(0,Number(b[i])||0);
  if(sum<=0)return 1;
  var r=Math.random()*sum,acc=0;
  for(i=0;i<5;i++){acc+=Math.max(0,Number(b[i])||0);if(r<acc)return i+1}
  return 1;
}
function pushIn(cid,text,t,replyTo,catchup){
  var m={id:uid(),contactId:cid,dir:'in',text:text,ts:t};
  if(catchup)m.catchup=1;      /* ★ 离线补发的消息：气泡上会带一个小"补发"标 */
  if(state.settings&&state.settings.soundOn)beep();
  if(replyTo)m.replyTo=replyTo;
  state.messages.push(m);
  /* ★ 只有"此刻就该出现"的消息才算未读。
     未来时间戳的那条等它到点再算 —— 否则会出现"有未读红点、聊天室里却没有"。 */

  /* ★ 连发的第 2、3 条时间戳是"未来 20~50 秒"，以前这里立刻就通知了，
     于是出现"通知里有一句话，聊天室却没有，过一会儿他才发过来"。
     现在只有"此刻就该出现"的消息才立刻通知，未来的那条等它到点在调度器里通知。 */

}
/** 他"这一轮"已经发了几条。
    ★ 口径很重要：只数"你最后一条消息之后"他发的那些。
      这样你一发消息他就重新有 5 条额度 —— 他不会因为你之前跟他聊过就不回你。
      （以前按"最近10分钟"算，结果他发满5条后连你的新消息都不回了，测试抓到过。） */
function hisRecentCount(cid,withinMs){
  var t=now(),n=0,win=withinMs||600000;
  for(var i=state.messages.length-1;i>=0;i--){
    var m=state.messages[i];
    if(!m||m.ts<t-win)break;
    if(m.contactId!==cid)continue;
    if(m.dir==='out')break;                  /* 遇到"我"发的 → 上一轮结束 */
    if(m.dir==='in'&&m.kind!=='sys')n++;
  }

/** 他还能再发几条（10 分钟内总共不超过 5 条） */
function hisQuota(cid){ return Math.max(0,5-hisRecentCount(cid)) }
function pushBurst(c,baseTs,count,quoteId,catchup){
  /* ★ 封顶：他 10 分钟内总共最多 5 条。
     以前"回复你（最多5条）"和"他主动来找你（又最多5条）"会叠起来，
     实测出现过一次 8 条（用户报的）。 */
  var _q=hisQuota(c.id);
  if(_q<=0)return;
  if(count>_q)count=_q;
  /* ★ 时间戳原来写成 baseTs + i*rnd(20,50)*1000：
     每次乘的是**新的**随机数，两个独立随机数相减会跑出范围，
     实测出现过 66 秒、60 秒的间隔（设定是 20~50 秒），甚至可能是负数导致消息乱序。
     现在改成"每条在上一条基础上再加 20~50 秒"，间隔恒定落在范围内、顺序也一定递增。 */
  var prev=null,ts=baseTs,used=[];
  var first=composeText(c,prev);
  pushIn(c.id,first,ts,quoteId,catchup);
  used.push(first);
  prev=first;
  for(var i=1;i<count;i++){
    var txt=composeText(c,prev),tries=0;
    /* 一次连发里不要重复同一句（换一句，最多试 6 次） */
    while(used.indexOf(txt)>=0&&tries++<6)txt=composeText(c,prev);
    ts+=burstGapMs();
    pushIn(c.id,txt,ts,null,catchup);
    used.push(txt);
    prev=txt;
  }
}

function postAddFiles(input){
  if(!input||!input.files||!input.files.length)return;
  var files=[],i;
  for(i=0;i<input.files.length;i++)files.push(input.files[i]);
  var idx=0;
  function next(){
    if(idx>=files.length||_postImgs.length>=4){
      try{input.value=''}catch(e){}
      if(_postImgs.length>=4&&idx<files.length)toast('最多 4 张哦');

        _postImgs.push(ref);
        next();
      }).catch(function(){next()});
    });
  }
  next();

/* ===== 图片选取：尽量不损失画质 =====
   以前壁纸会被压到最长边 1600 再用 JPEG 0.92 重编码，iPhone 截图（1179×2556）
   缩放后必然发糊。现在：壁纸/封面在安全范围内保持原分辨率，并且用无损 PNG，
   只有实在过大时才适度缩小。 */
function encodeImg(img,maxSide,opts){
  opts=opts||{};
  var w=img.width,h=img.height;
  var sc=Math.min(1,maxSide/Math.max(w,h));
  var cw=document.createElement('canvas');
  cw.width=Math.max(1,Math.round(w*sc));cw.height=Math.max(1,Math.round(h*sc));
  var cx=cw.getContext('2d');
  cx.imageSmoothingEnabled=true;
  cx.imageSmoothingQuality='high';
  cx.drawImage(img,0,0,cw.width,cw.height);
  /* 小图优先无损 PNG（图标/表情这类最需要锐利）；
     PNG 体积超标或指定了大图压缩，才回退 JPEG。 */
  if(opts.forcePng){
    try{var fp=cw.toDataURL('image/png');if(fp&&fp.length<4200000)return fp}catch(e){}
  }
  /* 没有缩小就优先无损 PNG，彻底避免二次压缩发糊 */
  if(sc>=1&&opts.allowPng!==false){
    try{var png=cw.toDataURL('image/png');if(png&&png.length<4200000)return png}catch(e){}
  }
  return cw.toDataURL(opts.mime||'image/jpeg',opts.q==null?0.95:opts.q);
}
function pickImageFile(input,onDone){
  if(!input.files||!input.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){try{onDone(img)}catch(e){toast('图片处理失败：'+e.message)}input.value=''};
    img.onerror=function(){toast('这张图片读不出来，换一张试试');input.value=''};
    img.src=fr.result;
  };
  fr.readAsDataURL(input.files[0]);
}

/** 找出一封"已发送"的信对应的回信。
    新数据直接用 reId 认亲；老存档里的回信没有 reId，用标题「Re：XXX」兜底。 */
function letterReplyOf(l){
  if(!l||l.dir!=='out')return null;
  var all=state.letters||[],i,x;
  for(i=0;i<all.length;i++){x=all[i];if(x&&x.dir==='in'&&x.reId&&x.reId===l.id)return x}
  var t='Re：'+(l.title||'来信');
  for(i=0;i<all.length;i++){x=all[i];if(x&&x.dir==='in'&&!x.reId&&x.title===t)return x}
  return null;
}
/** 反过来问：这封收件箱里的信，是不是回我某封信的？
    ★ 只认"确实是对我某封信的回信"：有链接(reId)就认；老存档没有链接时，
      用标题「Re：XXX」去存档里找那封"我发的 XXX"，找得到才算。
      找不到的（比如他自己寄来的「晚风来信」）一律**不算回信**。 */
function mailRepliedTo(l){
  if(!l||l.dir!=='in')return null;
  var all=state.letters||[],i,x;
  if(l.reId){ var o=byId(all,l.reId); if(o&&o.dir==='out')return o }
  var t=String(l.title||'');
  if(/^Re[：:]/.test(t)){
    var base=t.replace(/^Re[：:]/,'');
    for(i=0;i<all.length;i++){
      x=all[i];
      if(x&&x.dir==='out'&&String(x.title||'')===base)return x;
    }
  }
  return null;
}

/** 解析：空行忽略；【分类】/ [分类] 单独一行 = 切换分类；其余每行一张卡 */
function cardBatchParse(txt){
  var lines=String(txt==null?'':txt).split(/\r?\n/),out=[],cur='',i;
  for(i=0;i<lines.length;i++){
    var t=String(lines[i]).replace(/^\s+|\s+$/g,'');
    if(!t)continue;
    var m=t.match(/^[【\[](.+?)[】\]]$/);
    if(m){cur=String(m[1]).trim();continue}
    out.push({text:t,tag:cur});
  }
  return out;
}
function cardBatchSave(){
  var ta=document.querySelector('#cardBatchText');
  var arr=cardBatchParse(ta?ta.value:'');
  if(!arr.length){toast('一行写一张字卡');return}
  state.cardCats=state.cardCats||[];
  var t=now(),i;
  for(i=0;i<arr.length;i++){
    state.cards.push({id:uid(),text:arr[i].text,tag:arr[i].tag,created:t+i});
    if(arr[i].tag&&state.cardCats.indexOf(arr[i].tag)<0)state.cardCats.push(arr[i].tag);
  }
  _cardQ='';
  if(arr[0].tag)_cat=arr[0].tag;
  save();closeSheet();renderCards();
  toast('已导入 '+arr.length+' 张字卡');
}

function importCards(file){
  if(!file.files||!file.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var arr=d&&d.app==='zika-cards'&&Array.isArray(d.cards)?d.cards:(Array.isArray(d)?d:null);
      if(!arr||!arr.length){toast('没有找到字卡，请检查文件');return}
      var n=0;
      for(var i=0;i<arr.length;i++){
        var c=arr[i];
        if(!c||!c.text)continue;
        if(typeof c==='string')c={text:c};
        state.cards.push({id:uid(),text:String(c.text),tag:c.tag||'',created:now()});
        n++;
      }
      save();renderCards();toast('已导入 '+n+' 张字卡');
    }catch(e){toast('导入失败：文件无法读取')}
  };
  fr.readAsText(file.files[0]);
  file.value='';
}

/** 跳到设置页里的某个分区。
    不用 scrollIntoView：设置页的滚动发生在嵌套容器里，
    部分 iOS 版本对嵌套容器调 scrollIntoView 不生效（点了没反应）。
    这里自己找可滚动的祖先，直接算目标位置设 scrollTop。 */
function meJumpTo(id){
  var el=id?document.getElementById(id):null;
  if(!el)return;
  var sc=el.parentNode,guard=0;
  while(sc&&sc!==document.body&&guard++<20){
    var st=null;
    try{st=getComputedStyle(sc)}catch(e){}
    if(st&&/(auto|scroll)/.test(st.overflowY)&&sc.scrollHeight>sc.clientHeight+4)break;
    sc=sc.parentNode;
  }
  if(!sc||sc===document.body)sc=document.scrollingElement||document.documentElement;
  var top=0;
  try{
    top=el.getBoundingClientRect().top-(sc===document.scrollingElement?0:sc.getBoundingClientRect().top)+sc.scrollTop-58;
  }catch(e){}
  top=Math.max(0,Math.round(top));
  try{ if(sc.scrollTo)sc.scrollTo({top:top,behavior:'smooth'}); else sc.scrollTop=top; }
  catch(e){ try{sc.scrollTop=top}catch(e2){} }
  /* 兜底：万一平滑滚动没生效（老浏览器/无动画帧），100ms 后再直接设一次 */
  try{
    setTimeout(function(){
      try{
        if(Math.abs(el.getBoundingClientRect().top-58)>140)sc.scrollTop=top;
      }catch(e){}
    },320);
  }catch(e){}
  try{
    el.classList.add('me-flash');
    setTimeout(function(){try{el.classList.remove('me-flash')}catch(e){}},1200);
  }catch(e){}
}

/** 安全读一个数字输入框。
    ★ 只有"元素不存在 / 空着 / 不是数字"才用默认值 —— **填 0 就是 0**。
    以前满项目写成 parseFloat(...)||默认值，把 0 吃掉了：
    想把某个概率关成 0，结果被悄悄改成 50（自查扫出 39 处）。 */
function inpNum(id,def,min,max){
  var el=null;
  try{ if(typeof $==='function')el=$('#'+id) }catch(e){}
  if(!el){ try{ el=document.getElementById(id) }catch(e){} }
  if(!el)return def;
  var raw=String(el.value==null?'':el.value).trim();
  if(raw==='')return def;
  var v=parseFloat(raw);
  if(isNaN(v))return def;
  if(min!=null&&v<min)v=min;
  if(max!=null&&v>max)v=max;
  return v;
}
/** 把一个数字输入框写进对象。
    ★ 页面上**没有这个框**就什么都不做 —— 否则"在 A 卡片点保存"会把 B 卡片的设置冲成默认值。 */
function numField(obj,key,id,def,min,max){
  var el=null;
  try{ if(typeof $==='function')el=$('#'+id) }catch(e){}
  if(!el){ try{ el=document.getElementById(id) }catch(e){} }
  if(!el)return;
  var raw=String(el.value==null?'':el.value).trim();
  if(raw===''){ obj[key]=def; return }
  var v=parseFloat(raw);
  if(isNaN(v)){ obj[key]=def; return }
  if(min!=null&&v<min)v=min;
  if(max!=null&&v>max)v=max;
  obj[key]=v;
}

function pickUnitSec(secs){

  if(secs<60)return{val:secs,unit:'s'};
  if(secs%60===0&&secs<3600)return{val:secs/60,unit:'m'};
  if(secs%3600===0&&secs<86400)return{val:secs/3600,unit:'h'};
  if(secs%86400===0)return{val:secs/86400,unit:'d'};
  if(secs<600)return{val:secs,unit:'s'};
  return{val:Math.round(secs/60),unit:'m'};

/** 组装备份对象 */
function backupBuild(sel,withImages){
  var d={app:'zika-site',version:7,exported:new Date().toISOString(),cats:sel.slice(),state:{},images:{}};
  /* ★ 必须把存档自己的版本号也带上。
     导出只复制"所选分类里的 key"，而 version 不属于任何分类 —— 结果导出的 state 里没有 version，
     导入时 migrate() 里那句 if(!s.version||s.version<4) 就会成立，
     把回复节奏 / 主动节奏当成"老版本按分钟存的值"再乘一次 60
     （45 秒 → 45 分钟），这就是"每次导入都要重新调节奏"的原因。 */
  try{ d.state.version=Number(state.version)||7 }catch(eV){}
  var i,j,k;
  for(i=0;i<sel.length;i++){
    var keys=backupCatKeys(sel[i]);
    if(!keys)continue;
    for(j=0;j<keys.length;j++){
      k=keys[j];
      if(state[k]!==undefined)d.state[k]=cloneJSON(state[k]);
    }
  }
  /* 大图统一处理：
     · 勾了"包含图片" → 图片单独放进 d.images，state 里删掉，避免同一张图存两份（体积翻倍）
     · 没勾 → 直接删掉，档案才会小（代价是导入后壁纸/头像恢复成默认） */
  /* 图片位置一律从 state 里摘掉（图片本体由 backupExport 异步收集进 d.images）。
     这里必须按 allImagePaths 判定：媒体引用只有 28 个字符，imgValues 认不出来。 */
  var paths=allImagePaths(state);
  var del=[];
  for(var pi=0;pi<paths.length;pi++){
    var p=paths[pi];
    var c=backupCatOfPath(p);
    if(c&&sel.indexOf(c)<0)continue;         /* 没勾这一类，整类都不动 */
    if(!imgAt(state,p))continue;
    del.push(p);
  }
  for(var q=0;q<del.length;q++){
    var dots=del[q].split('.');
    var cur=d.state,ok=true;
    for(i=0;i<dots.length-1;i++){
      if(cur[dots[i]]===undefined){ok=false;break}
      cur=cur[dots[i]];
    }
    if(ok&&cur)try{delete cur[dots[dots.length-1]]}catch(e){}
  }
  d.hasImages=false;                         /* 真正的值等 backupExport 收完再定 */
  return d;
}
function backupExport(){
  var sel=backupSelCats();
  if(!sel.length){toast('至少选一类数据');return}
  var withImages=false;
  var cb=document.querySelector('#bkImgs');
  if(cb)withImages=!!cb.checked;
  var d=backupBuild(sel,withImages);
  var btn=document.querySelector('[data-act=\"backup-export\"]');
  if(withImages&&btn){ btn.disabled=true; btn.textContent='正在打包图片…' }
  /* 图片要从媒体库读二进制再转 dataURL，是异步的，所以下载放到 then 里 */
  collectImagesForBackup(sel,withImages).then(function(imgs){
    d.images=imgs||{};
    d.hasImages=withImages&&Object.keys(d.images).length>0;
    try{ doBackupDownload(d,sel,withImages) }
    finally{ if(btn){ btn.disabled=false; btn.textContent='导出' } }
  }).catch(function(){
    d.images=d.images||{};d.hasImages=false;
    try{ doBackupDownload(d,sel,withImages) }catch(e){}
    if(btn){ btn.disabled=false; btn.textContent='导出' }
  });
}
/** 真正落盘：把备份对象变成文件下载 */
function doBackupDownload(d,sel,withImages){

  document.body.appendChild(a);a.click();

/** 导入：分步做，出错能说清是哪一步 */
function importBackup(input){
  if(!input||!input.files||!input.files[0]){toast('没有选到文件');return}
  var f=input.files[0];
  var fr=new FileReader();
  fr.onerror=function(){toast('读不出这个文件，换一个试试');input.value=''};
  fr.onload=function(){
    var raw=fr.result;
    /* ① 解析 */
    var d=null;
    try{ d=JSON.parse(raw) }
    catch(e){
      toast('这个文件不是备份（内容不是 JSON）');
      input.value='';return;
    }
    if(!d||typeof d!=='object'){toast('这个文件不是备份');input.value='';return}
    /* ② 认版本：v7 带分类；v6 及更早是整份 state */
    var isNew=(d.app==='zika-site'&&d.state&&Array.isArray(d.cats));
    var isOld=(d.app==='zika-site'&&d.state&&Array.isArray(d.state.contacts));
    if(!isNew&&!isOld){toast('这不是字卡网站的备份文件');input.value='';return}

    var mode='merge';
    var sel2=document.querySelector('#bkMode');
    if(sel2)mode=sel2.value||'merge';

    var merged=null;
    try{
      if(isOld){
        /* 老格式：整份替换（和以前行为一致，保证老备份还能用） */
        merged=migrate(d.state);
      }else{
        /* 新格式：按分类合并或覆盖 */
        var base=(mode==='replace')?{}:cloneJSON(plainCopy(state));
        if(mode==='replace'){
          /* 覆盖模式：先放一份默认骨架，再把文件里的东西盖上去 */
          var def=defaultState();
          for(var dk in def)if(base[dk]===undefined)base[dk]=def[dk];
        }
        for(var ck in d.state)base[ck]=d.state[ck];
        merged=migrate(base);
      }
    }catch(e1){
      toast('备份内容有问题：'+(e1&&e1.message?e1.message:e1));
      input.value='';return;
    }
    if(!merged||!Array.isArray(merged.contacts)||!merged.contacts.length){
      toast('备份里没有联系人，无法导入');
      input.value='';return;
    }
    /* ★ 把"回复节奏 / 主动节奏 / 概率 / 开关"按备份文件里的原始数值还原。
       老备份里没有 version 字段，migrate() 会把 replyMin/initMin 当成分钟再乘 60，
       所以你以前每次导入完都得重新调一遍。这里直接覆盖回原值。
       （新导出的备份已经带上 version，不会再被换算；这一段是给老备份兜底的。） */
    try{
      var _rc=(d.state&&Array.isArray(d.state.contacts))?d.state.contacts:null;
      if(_rc&&Array.isArray(merged.contacts)){
        for(var _ri=0;_ri<merged.contacts.length&&_ri<_rc.length;_ri++){
          var _sc=_rc[_ri],_mc=merged.contacts[_ri];
          if(!_sc||!_mc||typeof _sc!=='object')continue;
          if(typeof _sc.replyMin==='number')_mc.replyMin=_sc.replyMin;
          if(typeof _sc.replyMax==='number')_mc.replyMax=_sc.replyMax;
          if(typeof _sc.initMin==='number')_mc.initMin=_sc.initMin;
          if(typeof _sc.initMax==='number')_mc.initMax=_sc.initMax;
          if(typeof _sc.letterMin==='number')_mc.letterMin=_sc.letterMin;
          if(typeof _sc.letterMax==='number')_mc.letterMax=_sc.letterMax;
          if(Array.isArray(_sc.burst))_mc.burst=_sc.burst.slice();
          if(typeof _sc.burstOn==='boolean')_mc.burstOn=_sc.burstOn;
          if(typeof _sc.readNR==='boolean')_mc.readNR=_sc.readNR;
          if(typeof _sc.readNRPct==='number')_mc.readNRPct=_sc.readNRPct;
          if(typeof _sc.replyPct==='number')_mc.replyPct=_sc.replyPct;
          if(typeof _sc.callPct==='number')_mc.callPct=_sc.callPct;
          if(typeof _sc.transferPct==='number')_mc.transferPct=_sc.transferPct;
        }
      }
    }catch(eR){}
    /* 导入是"整份替换"，属于有意为之的大改动，允许直接覆盖大容量存储里的旧副本 */
    try{window.__forceFullWrite=1}catch(e){}
    /* ★ 关键：导入进来的存档里，"下次该发消息的时间"往往是几天前甚至几个月前，
       直接跑补发逻辑就会一口气生成几百条消息（就是你看到的"陆沉一直发消息、
       计时器不管用"）。所以导入后统一把节奏重置到"现在"重新开始。 */
    try{
      var _t0=now();
      merged.lastActive=_t0;
      merged.nextInit={};
      merged.nextPostDue={};
      merged.nextCallDue=_t0+rnd(15,60)*60000;
      merged.nextLetterDue=_t0+rnd(180,1920)*60000;
      merged.nextVisitDue=_t0+rnd(180,720)*60000;
      merged.nextInviteDue=_t0+rnd(180,720)*60000;
      delete merged._pending;
      /* 把所有"已经到点但还没回"的标记清掉，补发时就不会一次爆一堆 */
      var _i2;
      if(Array.isArray(merged.messages))for(_i2=0;_i2<merged.messages.length;_i2++){
        var _m2=merged.messages[_i2];
        if(!_m2)continue;
        if(_m2.readDue)_m2.read=true;
        if(_m2.dir==='out'&&_m2.replyDue&&!_m2.answered)_m2.answered=true;
      }
      if(Array.isArray(merged.letters))for(_i2=0;_i2<merged.letters.length;_i2++){
        var _l2=merged.letters[_i2];
        if(_l2&&_l2.dir==='out'&&_l2.replyDue)_l2.answered=true;
      }
      if(Array.isArray(merged.posts))for(_i2=0;_i2<merged.posts.length;_i2++){
        var _p2=merged.posts[_i2];
        if(_p2&&_p2.commentDue)_p2.commented=true;
      }
    }catch(e){}
    try{window.__saveReentry=0}catch(e){}
    /* ③ 大图放回内存 + 存进 IndexedDB（放到最后，失败也不影响数据本身） */
    /* 导出时图片是 dataURL；导入时要重新收进媒体库、还原成引用，
       否则状态里又会塞回一大堆 base64（内存和存档体积都会炸回去）。
       某张收不进去就退回直接放原值 —— 绝不丢图。 */
    var imgs=d.images&&typeof d.images==='object'?d.images:null;
    var _imgJobs=[];
    if(imgs)for(var ik in imgs){ if(typeof imgs[ik]==='string'&&imgs[ik])_imgJobs.push({k:ik,v:imgs[ik]}); }

/* 回复不是"一串 setTimeout"就完事：计划会存进 state._pending。
   这样切出去 / 切回来（甚至页面被系统回收后重开）也能接着把没发完的补上。 */
function replyPlan(c,texts,quote,emojiMode){
  /* ★ 配额：他最近已经说了 5 条就不再补（避免"我发 1 条他回 8 条"） */
  var _q=hisQuota(c.id);
  if(_q<=0)return;
  if(texts&&texts.length>_q)texts=texts.slice(0,_q);
  state._pending={contactId:c.id,queue:texts.slice(),idx:0,quote:quote||null,
    emojiMode:!!emojiMode,nextAt:now()+rnd(900,1800),stopRolled:false,ts:now()};
  save();
  replyPump();
}
function replyPump(){
  clearTimeout(_replyTimer);
  var plan=state._pending;
  if(!plan)return;
  var c=contact(plan.contactId)||activeContact();
  if(!c){state._pending=null;save();return}
  var wait=plan.nextAt-now();
  if(wait>0){
    if(state.settings&&state.settings.typingOn!==false)_typing={contactId:c.id,ts:now(),hold:true};
    renderChat();
    _replyTimer=setTimeout(replyPump,Math.min(wait+30,3000));
    return;
  }
  var st=state.settings||{};
  if(plan.idx===0&&!plan.stopRolled){
    plan.stopRolled=true;
    if(st.stopTyping&&Math.random()*100<(st.stopTypingPct||15)){
      _typing=null;state._pending=null;
      state.messages.push({id:uid(),contactId:c.id,dir:'sys',text:pick(['陆沉打了一句话又删掉了','陆沉想了想，还是没发出去','他刚打了又删了']),ts:now()});
      save();renderChat();schedule();
      return;
    }
  }
  if(plan.emojiMode&&plan.idx===0){
    _typing=null;state._pending=null;
    maybeEmojiReply(c);
    save();renderChat();schedule();
    return;
  }
  var txt=plan.queue[plan.idx];
  if(txt===undefined){_typing=null;state._pending=null;save();schedule();return}
  pushIn(c.id,txt,now(),plan.idx===0?plan.quote:null);
  plan.idx++;
  if(plan.idx>=plan.queue.length){
    _typing=null;state._pending=null;save();renderChat();schedule();
    return;
  }
  plan.nextAt=now()+burstGapMs();   /* ★ 后续每条之间也留间隔 */
  save();renderChat();
  replyPump();
}

function ckCardLine(){
  var all=(state.cards||[]).filter(function(x){return x&&x.text&&String(x.text).trim()});
  if(!all.length)return '';
  var short=all.filter(function(x){return String(x.text).trim().length<=26});
  var pool=short.length?short:all;
  var t=String(pool[Math.floor(Math.random()*pool.length)].text||'').trim();
  if(t.length>44)t=t.slice(0,44);
  return t;

function ckAnswer(q){

function replyChat(m){
  var c=contact(m.contactId)||activeContact();
  if(!c)return;
  if(m.answered)return;                 /* 已经回过了就别再回一次 */
  /* ★ 查岗：回复要贴在查岗卡上，不能混成普通聊天消息 ——
     否则聊天流里根本分不清哪句是在回答查岗。 */
  if(m.kind==='checkin'){
    m.answered=true;
    /* ★ 查岗的回复不走聊天流，所以必须在这里把"输入中"收掉，
       否则 markRead 打开的三点会永远转下去（用户报的"一直显示输入中"就是这个）。 */
    _typing=null;state._pending=null;
    m.hisReply=ckAnswer(m.text);
    /* 混搭：贴题的短答 + 一句你字卡里的句子（没字卡时就只回短答） */
    m.hisCard=ckCardLine();
    m.hisReplyTs=now();
    save();
    try{if(location.hash.replace('#','')==='chat')renderChat()}catch(e){}
    schedule();
    return;
  }
  /* ★ 关键：这里原来**没有**把 m.answered 置 true。
     调度器的条件是"dir==='out' && replyDue && !answered"，
     所以同一条消息会被反复判定为"还没回"，于是无限回复。 */
  m.answered=true;
  if(m.kind==='poll'){replyPoll(m);return}
  var count=pickBurstCount(c),quote=null;
  if(Math.random()*100<((state.settings&&state.settings.quotePct)!=null?state.settings.quotePct:40)){
    for(var i=state.messages.length-1;i>=0;i--){
      var mm=state.messages[i];
      if(mm.dir==='out'&&mm.contactId===c.id&&mm.kind!=='poll'){quote=mm.id;break}
    }
  }
  var emojiMode=Math.random()*100<((state.settings&&state.settings.emojiPct)!=null?state.settings.emojiPct:15);
  var texts=[],prevTxt=null;
  for(var j=0;j<count;j++){var tt=composeText(c,prevTxt);texts.push(tt);prevTxt=tt}
  replyPlan(c,texts,quote,emojiMode);
}

function replyPoll(m,at){
  var c=contact(m.contactId);if(!c)return;
  var opts=m.options||[];

  var pool=opts.slice(),chosen=[];
  for(var i=0;i<n&&pool.length;i++){var idx=Math.floor(Math.random()*pool.length);chosen.push(pool.splice(idx,1)[0])}

  state.pollLog.push({q:m.question,chosen:chosen.slice(),ts:now()});
  /* 新的大卡片要把被选中的选项高亮出来，所以把选项也记在消息上 */
  m.answered=true;
  m.picked=[];
  for(var pi=0;pi<chosen.length;pi++){var oi=opts.indexOf(chosen[pi]);if(oi>=0)m.picked.push(oi)}
  var suffix=Math.random()<0.5?' '+drawCardText():'';
  pushIn(c.id,'我选「'+chosen.join('」「')+'」'+suffix,at||now());

  try{
    var _last=state.messages[state.messages.length-1];
    if(_last&&_last.dir==='in')_last.replyTo=m.id;
  }catch(e){}
  save();renderChat();schedule();
}

function svAutoFill(sv){
  if(!sv||sv.answered||sv.dir!=='out')return;
  if(surveyExpired(sv)){save();try{renderAll()}catch(e){}return}
  var ans=[];
  for(var i=0;i<sv.qs.length;i++){
    var q=sv.qs[i],n=(q.o||[]).length;if(n<1){ans.push([]);continue}
    var pool=[];for(var k=0;k<n;k++)pool.push(k);
    var cnt=1;
    if(q.m&&n>2)cnt=1+Math.floor(Math.random()*Math.min(3,n-1));   /* 多选：1~3 个 */
    var pick=[];
    for(var c2=0;c2<cnt&&pool.length;c2++)pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    pick.sort(function(a,b){return a-b});
    ans.push(pick);
  }
  sv.answers=ans;sv.answered=true;sv.answeredTs=now();
  var ct=contact(sv.contactId);
  if(ct)pushSys(ct.id,(ct.name||'他')+' 填完了问卷',now());
  save();
  try{renderAll()}catch(e){}
  try{renderChat()}catch(e){}
  schedule();
}

function addStickerFile(input){
  if(!input||!input.files||!input.files.length)return;
  /* 支持一次选多张：以前只读 files[0]，选十张也只进来一张 */
  var files=[];
  for(var fi=0;fi<input.files.length;fi++)files.push(input.files[fi]);
  var idx=0,added=0;
  function next(){
    if(idx>=files.length){
      input.value='';
      save();
      sheetStickers();
      if(added>1)toast('已添加 '+added+' 张表情');
      else if(added===1)toast('已添加表情');
      else toast('这些图片没能读出来，换几张试试');
      return;
    }
    var one=files[idx++];
    /* 单张处理流程不变，只是逐个喂进去 */
    var fake={files:[one],value:''};
    pickImageFile(fake,function(img){
      /* 表情控制在 360px 内、JPEG 0.8：既清楚又不会拖慢聊天渲染 */
      var MAX=360,sc=Math.min(1,MAX/Math.max(img.width,img.height));
      var cw=document.createElement('canvas');
      cw.width=Math.max(1,Math.round(img.width*sc));cw.height=Math.max(1,Math.round(img.height*sc));
      var cx=cw.getContext('2d');
      cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
      cx.fillStyle='#fff';cx.fillRect(0,0,cw.width,cw.height);
      cx.drawImage(img,0,0,cw.width,cw.height);
      mediaAdopt(cw.toDataURL('image/jpeg',.8),'sticker').then(function(ref){
        state.stickers.push({id:uid(),img:ref});
        added++;
        next();
      }).catch(function(){ next() });
    });
  }
  next();
}

function ntfRegisterSW(){

function ntfBeep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!_ntfAudio)_ntfAudio=new AC();
    var ctx=_ntfAudio;
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime;
    [[880,0,.16],[1245,.13,.2]].forEach(function(spec){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=spec[0];
      g.gain.setValueAtTime(0,t+spec[1]);
      g.gain.linearRampToValueAtTime(.09,t+spec[1]+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+spec[1]+spec[2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+spec[1]);o.stop(t+spec[1]+spec[2]+.02);
    });
  }catch(e){}
}

/* ================= 后台保活：离线补发 ================= */
/** ★ 你离开期间"已经到了该显示"的消息，不要一次全冒出来。
    典型场景：他正在连发（第 2、3 条的时间戳是 20~50 秒后），
    你切出去几分钟再回来 —— 这几条全都过期了，聊天区会一口气把它们铺出来。
    这里把"离开期间到点"的收件按 20~50 秒重新往后排，回来时是一条一条慢慢来。
    只动 dir==='in' 的收件，你自己的消息和系统消息不受影响。 */
/** 标记"已经露过面"的收件（弹过通知、或在聊天区显示过）。
    这类消息永远不再被 spreadDueMessages 往后挪 ——
    否则会出现"通知中心里有、聊天室里却没了"（用户报的吞消息）。 */
function markShownIn(contactId){
  var t=now(),ch=false,i;
  for(i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(!m||m.dir!=='in'||m.shown)continue;
    if(contactId&&m.contactId!==contactId)continue;
    if(m.ts<=t){m.shown=true;ch=true}
  }
  if(ch)try{save()}catch(e){}
  return ch;
}
function spreadDueMessages(sinceTs){
  var t=now(),k=0,i;
  var base=t+10000,maxAssigned=0;
  for(i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(!m||m.dir!=='in')continue;
    if(m.shown)continue;                        /* ★ 已经弹过通知/显示过的不动它 */
    if(!(m.ts>sinceTs&&m.ts<=t))continue;      /* 只处理"离开期间到点"的 */
    m.ts=base+k*rnd(20000,50000);
    if(m.ts>maxAssigned)maxAssigned=m.ts;
    k++;
    if(k>=12)break;
  }
  if(!maxAssigned)return 0;
  /* ★ 关键：本来排在后面、还没到点的收件，别被插到前面去（否则他会 1→3→2 地"说"）。
     凡是时间戳落在"刚重排的这段区间"里的，一律推到后面。 */
  for(i=0;i<state.messages.length;i++){
    var m2=state.messages[i];
    if(!m2||m2.dir!=='in')continue;
    if(m2.ts>t&&m2.ts<maxAssigned){
      m2.ts=maxAssigned+rnd(20000,50000);
      maxAssigned=m2.ts;
    }
  }
  try{save()}catch(e){}
  return k;
}
function syncCatchUp(){
  _ntfSilent=true;
  /* 补发的总量上限：离线很久（或导入了一份时间戳很旧的存档）时，
     原来会按联系人 × 消息条数一路补下去，一次生成几百条消息 ——
     界面卡死、计时器看起来"失灵"，一串同步调用还能把调用栈打穿。
     这里统一封顶。 */
  var _gen=0;
  var _GENMAX=24;
  var _MSGMAX=20000;
  var last=state.lastActive||now();
  /* ★ 先处理"连发没发完、离开期间全部过期"的那批（用户问的就是这个） */
  try{spreadDueMessages(last)}catch(e){}
  state.lastActive=now();
  var end=now();
  if(end-last<15000){_ntfSilent=false;save();schedule();return}
  for(var k=0;k<state.contacts.length;k++){
    var c=state.contacts[k];
    var t=state.nextInit[c.id]||last,guard=0,caught=0,_catchBase=now()+10000;
    while(t<end&&guard<50&&_gen<_GENMAX&&state.messages.length<_MSGMAX){
      t+=rndDelay(c,'init');
      if(t<=end){
        /* ★ 补发改成"往后排"：以前是拿过去的时间戳 pushBurst，错过的几轮
           会在你回到页面的那一瞬间全部冒出来（刷屏，用户报的"他一直发消息"）。
           现在第一轮排到 10 秒后、第二轮再往后推，每条之间仍是 20~50 秒，
           而且最多补 2 轮 —— 回来时像"他刚想起你"，而不是一次性倒完。 */
        if(caught<1){
          /* 第二轮的起点要排在"上一轮最后一条"之后，否则两轮会交错，
             他"说"的顺序就乱了（测试抓到过 10/40/86/55/75 这种乱序）。 */
          var _b=(typeof _catchBase==='number')?_catchBase:now()+10000;
          pushBurst(c,_b,1,null,true);  /* ★ 补发只补 1 条，并且打上"补发"标记 */
          maybePost(c,_b);
          _catchBase=_b+rnd(20000,50000)+15000;
          caught++;
        }
        guard++;_gen++;
      }
      else break;
    }
    if(_gen>=_GENMAX){state.nextInit[c.id]=Math.max(t,end);continue}
    state.nextInit[c.id]=Math.max(t,end);
    for(var i=0;i<state.messages.length;i++){
      var m=state.messages[i];
      if(m.contactId===c.id&&m.dir==='out'){
        if(m.readDue&&!m.read&&m.readDue<=end)m.read=true;
        if(m.replyDue&&!m.answered&&m.replyDue<=end){
          m.answered=true;
          if(m.kind==='checkin'){m.hisReply=ckAnswer(m.text);m.hisCard=ckCardLine();m.hisReplyTs=Math.min(m.replyDue,end)}
          else if(m.kind==='gift'||m.kind==='buyreq'){shopAnswer(m)}
          else if(m.kind==='poll'){replyPoll(m,Math.min(m.replyDue,end))}
          else if(c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null}
          else if(_gen<_GENMAX&&state.messages.length<_MSGMAX){pushBurst(c,Math.min(m.replyDue,end),pickBurstCount(c));_gen++}
        }
      }
    }
    for(var j=0;j<state.letters.length;j++){
      var l=state.letters[j];
      if(l.contactId===c.id&&l.dir==='out'&&!l.answered&&l.replyDue&&l.replyDue<=end){
        l.answered=true;
        var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);
        /* ★ 写信不再用"写信固定字卡"：改成从你添加的、分过类的字卡里随机抽；
   一张分类字卡都没有时，退回全部聊天字卡（保证不会抽空）。 */
        var _tagged=(state.cards||[]).filter(function(x){return x&&x.tag&&x.text});
        var pool=_tagged.length?_tagged:state.cards;
        var body=drawCards(n,pool).join('\n\n');
        if(!body)body=drawCardText();
        if(_gen<_GENMAX){state.letters.push({id:uid(),contactId:c.id,dir:'in',title:'Re：'+(l.title||'来信'),body:body,ts:Math.min(l.replyDue,end),unread:true});_gen++}
      }
    }
  }
  /* 离线期间欠下的"回复我的评论"也补上 */
  for(var q2=0;q2<state.posts.length;q2++){
    var _pq=state.posts[q2];
    if(_pq&&_pq.replyMineDue&&_pq.replyMineDue<=end){
      try{postReplyMine(_pq)}catch(e){}
    }
  }
  for(var q=0;q<state.posts.length;q++){
    var p=state.posts[q];
    if(p.contactId===null&&p.commentDue&&!p.commented&&p.commentDue<=end){
      var c2=contact(state.activeContact);
      if(c2){
        p.commented=true;
        if(Math.random()<0.5)p.heLiked=true;
        if(Math.random()*100<(c2.replyPct||100))p.comments.push({id:uid(),contactId:c2.id,text:pickCardText(),ts:Math.min(p.commentDue,end)});
      }
    }
  }
  var d0=new Date(last),d1=new Date(end);
  var loop=d0;
  while(loop.getTime()<=d1.getTime()&&loop.getTime()<=end){
    ensureDiary(loop.getTime());
    loop=new Date(loop.getTime()+86400000);
    if(loop.getTime()-d1.getTime()>7*86400000)break;
  }
  _ntfSilent=false;
  state.lastActive=end;
  save();renderAll();schedule();
  if(window.__saveReentry)toast('补发时出现了嵌套保存 '+window.__saveReentry+' 次（已自动拦住，不会再卡死）');
  else toast('补发完成：离线期间的新消息已同步');
}

var _kaCtx=null,_kaSrc=null;
function kaStart(){try{
  var st=state.settings||{};
  if(!st.keepAlive||st.keepAlive==='off')return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!_kaCtx)_kaCtx=new AC();
  if(_kaCtx.state==='suspended')_kaCtx.resume();
  if(!_kaSrc){
    var buf=_kaCtx.createBuffer(1,Math.max(1,Math.floor(_kaCtx.sampleRate*0.05)),_kaCtx.sampleRate);
    var d=_kaCtx.createBufferSource();d.buffer=buf;d.loop=true;
    var g=_kaCtx.createGain();g.gain.value=st.keepVol==='loud'?0.015:(st.keepVol==='faint'?0.002:0.007);
    d.connect(g);g.connect(_kaCtx.destination);d.start(0);_kaSrc=d;
  }
  st.kaCount=(st.kaCount||0)+1;save();
}catch(e){}}
function kaStop(){try{if(_kaCtx&&_kaCtx.state==='running')_kaCtx.suspend()}catch(e){}}

/* ===== 存档健康检查：被系统清理或读取失败时，明确告诉用户并引导恢复 ===== */
function storageHealthCheck(){
  try{
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){}
  try{
    var st=window.__loadStatus,note=window.__loadNote||'';
    window.__loadStatus='';
    if(st==='fallback'){toast((note||'存档读取异常')+'，建议立刻到 设置→备份 导出备份');return}
    if(st==='restored'){if(note)toast(note);return}
    if(st==='dbonly'){
      /* 本地存档是空的：去大容量备份里找一找，找到就问用户要不要恢复 */
      idbGet('full').then(function(full){
        var ok=false;
        if(typeof full==='string'&&full.length>200){
          try{var t=JSON.parse(full);if(t&&t.contacts&&t.contacts.length)ok=true}catch(e){}
        }
        if(ok){
          if(confirm('检测到之前的完整备份还在，要现在恢复吗？（恢复后设置和聊天记录都会回来）'))importFromIdbFull(full);
        }else{
          idbGet('images').then(function(imgs){
            var n=0;if(imgs&&typeof imgs==='object')for(var k in imgs)n++;
            if(n)toast('检测到您之前设置过壁纸，但存档已被系统清理；请到 设置→备份 导入最近的备份文件');
          }).catch(function(){});
        }
      }).catch(function(){});
    }
  }catch(e){}
}
/** 从 IndexedDB 的整份备份里恢复存档 */
function importFromIdbFull(full){
  try{
    var d=JSON.parse(full);
    if(!d||!d.contacts){toast('备份内容无法识别');return}
    normalizeBig(d);
    try{d=migrate(d)}catch(e){}
    state=d;
    _imgHydrating=false;
    hydrateImages(state);
    try{save()}catch(e){}
    if(typeof renderAll==='function')renderAll();
    toast('已恢复存档');
  }catch(e){toast('恢复失败，请用 设置→备份 导入备份文件')}
}

  var kind=(mode==='video'?'视频通话':'语音通话');

    txt=(who==='he'?'对方挂断了通话 · ':'你挂断了通话 · ')+kind+' '+fmtCall(sec);

function tideInfo(){
  var t=state.tide||{};
  if(!t||!t.start)return null;
  var st=new Date(t.start);
  if(isNaN(st.getTime()))return null;
  var cy=t.cycle||28,du=t.days||5;
  var nx=new Date(st.getTime()+cy*86400000);
  var today=new Date();today.setHours(0,0,0,0);
  var diff=Math.round((nx-today)/86400000);
  var inDays=Math.round((today-st)/86400000);
  var ovu=t.ovulation!==false;
  var status;
  if(inDays>=0&&inDays<du)status='正在经期第 '+(inDays+1)+' 天';
  else if(diff>0){
    if(ovu&&Math.abs(diff-(cy-14))<=3)status='接近排卵期，注意防护';
    else status='距离下次还有 '+diff+' 天';
  }else status='应该就在这几天';
  return {start:st,next:nx,diff:diff,status:status,cycle:cy,days:du,inDays:inDays};
}
function fmtDate(dt){
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}

  html+='<div class="screen">';

  if(info){
    html+='<div class="th-status">'+info.status+'</div><div class="th-next">下次预计 '+fmtDate(info.next)+'</div><div class="th-mini">周期 '+info.cycle+' 天 · 持续 '+info.days+' 天 · 上次开始 '+fmtDate(info.start)+'</div>';
  }else{
    html+='<div class="th-status">记下最近一次经期</div><div class="th-next">就能推算下次来的时间</div>';
  }
  html+='</div>';
  html+='<div class="card"><h3>记录这次</h3><div class="rhy-grid"><div class="inl"><label>开始日期</label><input id="tideStart" type="date" value="'+esc(t.start||'')+'"></div><div class="inl"><label>持续（天）</label><input id="tideDays" type="number" min="1" max="15" value="'+(t.days||5)+'"></div><div class="inl"><label>周期（天）</label><input id="tideCycle" type="number" min="15" max="60" value="'+(t.cycle||28)+'"></div></div>';
  html+='<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="flex:1" data-act="tide-save">保存</button><button class="btn ghost" style="flex:1" data-act="tide-record">记入历史</button></div>';
  html+='<p class="meta" style="margin-top:8px">排卵期提示按下次日期前推 14 天估算，仅供参考</p></div>';
  if(t.history&&t.history.length){
    html+='<div class="card" style="padding:0 14px"><h3 style="padding-top:12px">历史记录</h3>';
    for(var i=t.history.length-1;i>=0;i--){

/* 组件高度会变（动态条数、图片/字体加载完），用 ResizeObserver 盯着，
   一变就重新算容器高度 —— 这样容器永远盖得住组件，不会压到下面的 App 图标 */
var _wdRO=null;
function widgetObserve(){
  if(typeof ResizeObserver==='undefined')return;
  if(_wdRO){try{_wdRO.disconnect()}catch(e){}}
  try{
    _wdRO=new ResizeObserver(function(){fitWidgetGrid()});
  }catch(e){return}
  var ids=['widgetGrid0','widgetGrid1'];
  for(var g=0;g<ids.length;g++){
    var grid=document.getElementById(ids[g]);
    if(!grid)continue;
    var ws=grid.querySelectorAll('.widget');
    for(var i=0;i<ws.length;i++)try{_wdRO.observe(ws[i])}catch(e){}
  }
}
function initWidgetDrag(){
  fitWidgetGrid();
  widgetObserve();
  var _wgs=[document.getElementById('widgetGrid0'),document.getElementById('widgetGrid1')];
  for(var _wi=0;_wi<_wgs.length;_wi++)initOneWidgetDrag(_wgs[_wi]);
}
function initOneWidgetDrag(grid){
  if(!grid)return;
  var drag=null,timer=null,ghost=null,startX=0,startY=0,offX=0,offY=0,manageTimer=null,movedFlag=0;
  var lastX=null,lastY=null,pendingX=null,pendingY=null;
  function findW(t){var el=t;while(el&&el!==grid&&!el.classList.contains('widget'))el=el.parentNode;return el===grid?null:el}
  function clampN(v,a,b){return Math.max(a,Math.min(b,v))}
  function begin(x,y,target){
    var el=findW(target);
    if(!el||!el.classList.contains('wfree'))return;
    if(target&&target.closest&&target.closest('.wm-btn'))return;
    startX=x;startY=y;
    pendingX=null;pendingY=null;lastX=null;lastY=null;movedFlag=0;
    timer=setTimeout(function(){
      if(!el.parentNode)return;
      drag=el;
      var r=el.getBoundingClientRect();
      /* 真人往往是"按下就走"，长按这 350ms 里手指已经移动过了。
         所以要拿"手指现在的位置"当抓取点，否则幽灵会先跳一下，
         而且 movedFlag / 落点都还是空的，松手就只能读回组件原位。 */
      /* 抓取点必须用"手指最初按下的位置"，这样落点才等于 原始位置 + 手指位移。
         （如果改成用手指当前位置当抓取点，落点会正好抵消回原位 —— 别那么写） */
      offX=x-r.left;offY=y-r.top;
      var ax=(pendingX!=null?pendingX:x), ay=(pendingY!=null?pendingY:y);
      if(Math.abs(ax-startX)+Math.abs(ay-startY)>10){movedFlag=1;lastX=ax;lastY=ay}
      el.classList.add('dragging');
      grid.classList.add('editfree');
      ghost=el.cloneNode(true);
      ghost.id='dragGhost';
      ghost.className='widget';
      ghost.style.width=r.width+'px';
      ghost.style.height=r.height+'px';
      ghost.style.left='0';ghost.style.top='0';
      ghost.style.transform='translate3d('+r.left+'px,'+r.top+'px,0)';
      document.body.appendChild(ghost);
      if(pendingX!=null)ghost.style.transform='translate3d('+(pendingX-offX)+'px,'+(pendingY-offY)+'px,0)';
      try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
      /* 继续按住不放（不移动）= 打开这张组件的管理面板 */
      manageTimer=setTimeout(function(){
        if(drag&&!movedFlag){cancelDrag();var kk=wKeyOf(el);if(kk)sheetWidget(kk)}
      },900);
    },350);
  }
  var rafW=null;
  function cancelDrag(){
    if(manageTimer){clearTimeout(manageTimer);manageTimer=null}
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
    ghost=null;
    if(drag)drag.classList.remove('dragging');
    var g=document.getElementById('widgetGrid0')||document.getElementById('widgetGrid1');
    if(g)g.classList.remove('editfree');
    drag=null;
  }
  function move(x,y){
    /* 先无条件记住手指位置：长按可能还没生效，
       但这段位移必须留着，不然长按一生效就丢了 */
    pendingX=x;pendingY=y;
    if(!drag)return;
    if(Math.abs(x-startX)+Math.abs(y-startY)>10)movedFlag=1;
    lastX=x;lastY=y;                 /* 记住最后落点 —— 真实元素全程不动，只有 ghost 跟手 */
    if(rafW)return;
    rafW=requestAnimationFrame(function(){
      rafW=null;
      if(ghost)ghost.style.transform='translate3d('+(x-offX)+'px,'+(y-offY)+'px,0)';
    });
  }
  function end(){
    if(timer){clearTimeout(timer);timer=null}
    if(manageTimer){clearTimeout(manageTimer);manageTimer=null}
    var didMove=movedFlag;      /* 先留住，清零要放到后面用完之后 */
    movedFlag=0;
    if(!drag)return;
    var el=drag;
    el.classList.remove('dragging');
    grid.classList.remove('editfree');
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
    ghost=null;
    var k=wKeyOf(el);
    if(k){
      var gr=grid.getBoundingClientRect();
      var r=el.getBoundingClientRect();
      var w=el.offsetWidth||1;
      var h=el.offsetHeight||1;
      var maxX=Math.max(0,gr.width-w);
      /* 关键：纵向也限制在"当前组件区"里面。
         不限制的话，把组件往下拖会把容器撑高，下面的 App 图标整片被挤到屏幕外，
         看起来就像"图标点不开了"。 */
      var maxY=Math.max(0,gr.height-h);
      /* 真正落下的是 ghost 的位置：ghost 左上角 = (手指 - 抓取偏移)。
         以前这里读的是元素自身的 rect —— 而元素全程没动过，
         所以无论拖到哪都会算回原位（"拖完又弹回去"就是这个原因）。 */
      var dropL,dropT;
      if(lastX!=null&&lastY!=null){
        dropL=lastX-offX;
        dropT=lastY-offY;
      }else{
        dropL=r.left;dropT=r.top;
      }
      /* 吸附到 8px 网格，落点整齐（参考站 DESKTOP_GRID_SIZE=8） */
      var GRID=8;
      var snapN=function(v){return Math.round(v/GRID)*GRID};
      var px=clampN(snapN(dropL-gr.left),0,maxX);
      var py=clampN(snapN(dropT-gr.top),0,maxY);
      el.style.left=(gr.width?(px/gr.width*100):0)+'%';
      el.style.top=py+'px';
      state.widgetPos=state.widgetPos||{};
      state.widgetPos[k]={x:Math.round(gr.width?(px/gr.width*1000):0)/10,y:Math.round(py)};
      save();
      fitWidgetGrid();
    }
    drag=null;
    lastX=null;lastY=null;pendingX=null;pendingY=null;
  }
  grid.addEventListener('touchstart',function(e){var t=e.touches[0];if(t)begin(t.clientX,t.clientY,e.target)},{passive:true});
  grid.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    if(t){
      /* ★ 长按还没生效就滑动了 → 判定为"误触/滑动"，取消长按，组件不许移位。
         用户要的是"长按才拖拽"：手指按住不动够久才进入拖拽，
         碰到就走、轻轻一划都不能把组件挪走。 */
      if(timer&&(Math.abs(t.clientX-startX)+Math.abs(t.clientY-startY)>10)){
        clearTimeout(timer);timer=null;
      }
      move(t.clientX,t.clientY);
    }
    if(drag)e.preventDefault();
  },{passive:false});
  grid.addEventListener('touchend',function(){end()});
  grid.addEventListener('touchcancel',function(){end()});
  grid.addEventListener('mousedown',function(e){begin(e.clientX,e.clientY,e.target);e.preventDefault()});
  document.addEventListener('mousemove',function(e){if(drag){move(e.clientX,e.clientY);e.preventDefault()}});
  document.addEventListener('mouseup',function(){end()});
  var _rzT=null;
  window.addEventListener('resize',function(){if(_rzT)clearTimeout(_rzT);_rzT=setTimeout(fitWidgetGrid,180)});
}

/* ================= 音乐 App：上传 MP3 / 播放 / 一起听 =================
   设计要点：
     · 音频存进已有的"媒体库"（IndexedDB Blob），state 里只留 zika-media:// 短引用
     · 音频元素常驻 body，切页面不会断，也不需要为了播放再渲染整个页面
     · iOS 要求 play() 必须在用户手势里同步调用：所以选歌时先把 src 备好，
       播放键里同步 play()，不放在 Promise 里 */
var MUS_BGS={
  mb1:'linear-gradient(160deg,#3B2B4F,#5B3A63 55%,#8A5570)',
  mb2:'linear-gradient(160deg,#22303F,#2F4A5C 55%,#5B7E8C)',
  mb3:'linear-gradient(160deg,#4A2B2B,#6B3A3A 55%,#A2625C)',
  mb4:'linear-gradient(160deg,#2C3A2B,#3F5A3A 55%,#6E8A5C)'
};
var _musUrl='',_musUrlRef='',_musWantPlay=false;
function musState(){
  if(!state.music||typeof state.music!=='object')state.music={};
  var m=state.music;
  if(!Array.isArray(m.songs))m.songs=[];
  if(typeof m.cur!=='number'||m.cur<0)m.cur=0;
  if(typeof m.vol!=='number')m.vol=1;
  if(!m.loop)m.loop='list';
  if(m.shuffle===undefined)m.shuffle=false;
  if(m.bg===undefined)m.bg='';
  if(m.sess===undefined)m.sess=null;
  if(m.miniPos===undefined)m.miniPos=null;
  return m;
}
function musCur(){var m=musState();return m.songs[m.cur]||null}
function musFmt(t){
  t=Math.max(0,Math.floor(t||0));
  var m2=Math.floor(t/60),s2=t%60;
  return m2+':'+(s2<10?'0':'')+s2;
}
function musAudio(){
  var a=document.getElementById('musAudio');
  if(!a){
    a=document.createElement('audio');
    a.id='musAudio';
    a.setAttribute('preload','metadata');
    a.addEventListener('timeupdate',musPaint);
    a.addEventListener('durationchange',musPaint);
    a.addEventListener('ended',musEnded);
    a.addEventListener('play',musPaint);
    a.addEventListener('pause',musPaint);
    try{document.body.appendChild(a)}catch(e){}
  }
  return a;
}
/** 载入第 i 首：先把可播放地址准备好（异步），不动播放状态 */
function musLoad(i,autoplay){
  var m=musState();
  if(!m.songs.length){musPaint();return}
  m.cur=Math.max(0,Math.min(m.songs.length-1,i|0));
  var sg=m.songs[m.cur];
  if(!sg){musPaint();return}
  var a=musAudio();
  if(_musUrlRef&&_musUrlRef!==sg.ref&&_musUrl){try{URL.revokeObjectURL(_musUrl)}catch(e){}_musUrl='';}
  _musUrlRef=sg.ref;
  if(autoplay)_musWantPlay=true;
  mediaUrl(sg.ref).then(function(u){
    if(_musUrlRef!==sg.ref)return;
    if(!u){toast('这首歌的音频文件找不到了，重新上传一下');_musWantPlay=false;musPaint();return}
    _musUrl=u;
    if(a.getAttribute('src')!==u){a.setAttribute('src',u);try{a.load()}catch(e){}}
    if(_musWantPlay){_musWantPlay=false;try{a.play().catch(function(){})}catch(e){}}
    musPaint();
  });
  musPaint();
}
function musPlaying(){var a=document.getElementById('musAudio');return !!(a&&!a.paused&&!a.ended&&a.currentTime>0)}
function musPlay(){
  var m=musState();
  if(!m.songs.length){toast('先上传一首歌吧');return}
  var a=musAudio();
  if(!a.getAttribute('src')){musLoad(m.cur,true);return}
  try{var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
  try{window.__musT=setInterval(musWake,1000)}catch(e){}
  musPaint();
}
function musPause(){
  var a=document.getElementById('musAudio');
  try{a.pause()}catch(e){}
  try{if(window.__musT){clearInterval(window.__musT);window.__musT=null}}catch(e){}
  musSetWidgetMusic();
  save();
  musPaint();
}
function musToggle(){if(musPlaying())musPause();else musPlay()}
function musNext(auto){
  var m=musState();
  if(!m.songs.length)return;
  if(m.loop==='one'&&auto){musLoad(m.cur,true);return}
  var n=m.cur+1;
  if(m.shuffle&&m.songs.length>1){var r=m.cur;while(r===m.cur)r=Math.floor(Math.random()*m.songs.length);n=r}
  if(n>=m.songs.length){if(m.loop==='off'&&auto){musPause();return}n=0}
  musLoad(n,true);
}
function musPrev(){
  var m=musState();if(!m.songs.length)return;
  var a=document.getElementById('musAudio');
  if(a&&a.currentTime>4){try{a.currentTime=0}catch(e){}musPaint();return}
  var n=m.cur-1;if(n<0)n=m.songs.length-1;
  musLoad(n,true);
}
function musSeekRatio(r){
  var a=document.getElementById('musAudio');
  var d=(a&&isFinite(a.duration)&&a.duration>0)?a.duration:(musCur()&&musCur().dur)||0;
  if(!d)return;
  try{a.currentTime=Math.max(0,Math.min(1,r))*d}catch(e){}
  musPaint();
}
function musEnded(){musSetWidgetMusic();save();musNext(true)}
/** 播放中每秒把"正在听"同步到小组件，并把状态存一下（不用每帧存） */
function musWake(){
  musSetWidgetMusic();
  if(!window.__musSaved||Date.now()-window.__musSaved>8000){window.__musSaved=Date.now();try{save()}catch(e){}}
  musPaint();
}
function musSetWidgetMusic(){
  var sg=musCur();
  if(!sg)return;
  if(!state.widgetMusic||typeof state.widgetMusic!=='object')state.widgetMusic={song:'',artist:'',src:''};
  state.widgetMusic.song=sg.name||'未命名';
  state.widgetMusic.artist=sg.artist||'';
  state.widgetMusic.src=sg.ref||'';
}
function musProgress(){
  var a=document.getElementById('musAudio');
  if(!a)return {p:0,now:0,dur:0,playing:false};
  var d=(isFinite(a.duration)&&a.duration>0)?a.duration:((musCur()&&musCur().dur)||0);
  var now=a.currentTime||0;
  return {p:d?Math.max(0,Math.min(1,now/d)):0,now:now,dur:d,playing:musPlaying()};
}
/** 把当前状态刷到"小组件 / 播放页 / 悬浮条"上（哪个在就刷哪个） */
var _musLastSongKey='';
function musPaint(){
  try{
    var sg=musCur(),pr=musProgress();
    var name=sg?(sg.name||'未命名'):'还没有歌';
    var sub=sg?(sg.artist||'点开音乐 App 上传 MP3'):'点开音乐 App 上传 MP3';
    var wi=document.getElementById('wmBarI');if(wi)wi.style.width=Math.round(pr.p*100)+'%';
    var wn=document.getElementById('wmSongB');if(wn)wn.textContent=name;
    var ws=document.getElementById('wmSubB');if(ws)ws.textContent=pr.playing?(musFmt(pr.now)+' / '+musFmt(pr.dur)):sub;
    var wp=document.getElementById('wmPlayB');if(wp)wp.innerHTML=pr.playing?ICON_PAUSE:ICON_PLAY;
    var vn=document.getElementById('mvSongV');if(vn)vn.textContent=name;
    var vs=document.getElementById('mvSubV');if(vs)vs.textContent=sub;
    var vf=document.getElementById('mvFillV');if(vf)vf.style.width=Math.round(pr.p*100)+'%';

  /* 说完再跳，别一句话没看到就换歌了 */

    (function(k){

/** 把上传的壁纸画到一块 24×24 画布上量平均亮度（取卡片所在的那块区域） */
function musSpaceSampleBg(key){
  try{
    if(typeof Image==='undefined')return;
    var m=musState();
    var url=mediaUrlSync(m.bg);
    if(!url)return;                                    /* 地址还没解析好，下一次重画再量 */
    var img=new Image();

        var cv=document.createElement('canvas');cv.width=24;cv.height=24;

          var sx=Math.max(0,Math.round((img.width||24)*0.2)),sy=Math.max(0,Math.round((img.height||24)*0.12));

      _lsnTone[key]=lsnIsLightLum(lum)?1:0;
      try{if(_lsnEl)musSpacePaint(true)}catch(e){}
    };
    img.onerror=function(){ _lsnTone[key]=0 };
    img.src=url;
  }catch(e){}

  el.innerHTML=musSpaceHtml();

}
function musSpaceClose(){

/** 刷新空间里的内容：换歌 / 他说了新的一句 / 换了壁纸 → 整体重画；光走进度就只改数字 */
function musSpacePaint(force){
  if(!_lsnEl)return;
  try{
    /* ★ 每次都重铺一次背景：壁纸地址是异步解析的，图好了最迟一秒内就能自己换上，
       不用"退出一起听再进来"。同时也会重新判定明暗（浅底→深字）。 */
    musSpaceBgApply(_lsnEl);
    var m=musState(),sg=musCur(),pr=musProgress();
    var sig=String(m.cur)+'|'+(sg?String(sg.id||sg.name||''):'')+'|'+musSessSaid().length+'|'+String(m.bg||'');
    if(force||sig!==_lsnSig||!_lsnEl.innerHTML){
      _lsnSig=sig;
      _lsnEl.innerHTML=musSpaceHtml();
      musSpaceBgApply(_lsnEl);
      return;
    }
    var q=function(id){try{return _lsnEl.querySelector('#'+id)}catch(e){return null}};
    var e1=q('lsnSongV');if(e1)e1.textContent=sg?(sg.name||'未命名'):'还没有歌';
    var e2=q('lsnFillV');if(e2)e2.style.width=Math.round(pr.p*100)+'%';
    var e3=q('lsnNowV');if(e3)e3.textContent=musFmt(pr.now);
    var e4=q('lsnDurV');if(e4)e4.textContent=musFmt(pr.dur);
    var e5=q('lsnMinV');if(e5)e5.textContent=String(musSessMins());
    var e6=q('lsnPlayV');if(e6)e6.innerHTML=pr.playing?ICON_PAUSE:ICON_PLAY;
    var e7=q('lsnShufV');if(e7){if(m.shuffle)e7.classList.add('on');else e7.classList.remove('on')}
    var e8=q('lsnLoopV');if(e8){e8.innerHTML=(m.loop==='one'?ICON_LOOPONE:ICON_REPEAT);if(m.loop==='one')e8.classList.add('on');else e8.classList.remove('on')}
  }catch(e){}
}

/* ---------- 悬浮条（可自由摆放） ---------- */
function musBar(on){
  var el=document.getElementById('listenBar');
  if(!on){
    if(el&&el.parentNode)el.parentNode.removeChild(el);
    return;
  }
  if(el){musPaint();return}
  el=document.createElement('div');
  el.id='listenBar';
  el.className='lsn-bar';
  el.innerHTML='<span class="lsn-vinyl"></span><div class="lsn-tx"><b id="lsnSong">正在听</b><span id="lsnSub">共享播放</span></div>'
    +'<button data-mus="expand" title="放大">'+ICON_EXPAND+'</button>'
    +'<button data-mus="close" title="关闭"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  try{document.body.appendChild(el)}catch(e){}
  var m=musState();
  if(m.miniPos){
    /* ★ 必须把 transform 清掉：CSS 里是 left:50%+translateX(-50%) 居中的，
       一旦用 left/top 精确定位还留着 transform，元件就会整体偏半个宽度，
       手指按到的位置和看到的位置对不上（用户报的"拖不动/跑到聊天室外"）。 */
    el.style.transform='none';
    el.style.left=m.miniPos.L+'px';el.style.top=m.miniPos.T+'px';el.style.right='auto';
  }
  musBindBarDrag(el);
  musPaint();
}
function musBarToggle(){
  var m=musState();
  var inMusic=String(location.hash||'').replace('#','')==='music';
  /* ★ 独立空间开着的时候不飘悬浮条（空间本身就是"放大态"） */
  musBar(!!m.sess&&!inMusic&&!_lsnEl);
  /* 一起听：检测"换歌了" → 决定他这次说不说、要不要点一首 */
  try{musSessWatch()}catch(e){}
}
function musBindBarDrag(el){
  var dragging=false,sx=0,sy=0,baseL=0,baseT=0,moved=false;
  function touchXY(e){
    var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    return {x:t.clientX,y:t.clientY,target:t.target||e.target};
  }
  function start(x,y,target){
    var n=target,g=0;
    while(n&&n!==document.body&&g++<6){if(n.tagName==='BUTTON')return;n=n.parentNode}
    var r=el.getBoundingClientRect();
    baseL=r.left;baseT=r.top;sx=x;sy=y;moved=false;dragging=true;
    el.style.transition='none';
    /* ★ 开始拖就把居中用的 transform 去掉，否则位移会被再平移半个宽度 */
    el.style.transform='none';el.style.right='auto';
  }
  function move(x,y){
    if(!dragging)return;
    moved=true;
    var w=el.offsetWidth||200,h=el.offsetHeight||56;
    var vw=window.innerWidth||360,vh=window.innerHeight||640;
    var L=Math.max(6,Math.min(vw-w-6,baseL+(x-sx)));
    var T=Math.max(6,Math.min(vh-h-6,baseT+(y-sy)));
    el.style.left=L+'px';el.style.top=T+'px';el.style.right='auto';
  }
  function end(){
    if(!dragging)return;
    dragging=false;el.style.transition='';
    if(moved){
      var r=el.getBoundingClientRect();
      var m=musState();
      m.miniPos={L:Math.round(r.left),T:Math.round(r.top)};
      save();
    }
  }
  el.addEventListener('touchstart',function(e){var p=touchXY(e);start(p.x,p.y,p.target)},{passive:true});
  el.addEventListener('touchmove',function(e){var p=touchXY(e);move(p.x,p.y);if(dragging)e.preventDefault()},{passive:false});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',function(e){start(e.clientX,e.clientY,e.target);e.preventDefault()});
  document.addEventListener('mousemove',function(e){if(dragging){move(e.clientX,e.clientY);e.preventDefault()}});
  document.addEventListener('mouseup',end);
}

/* ================= 商城 App：随机商品 / 送礼 / 代买 =================
   商品每天按日期做种子随机生成（同一天固定，第二天换一批）。
   买/代买都会在聊天里生成一张卡片，回应走和聊天同一套回复节奏。 */
var SHOP_POOLS={
  daily:{n:'日用',min:9,max:69,list:[['香薰蜡烛','🕯️'],['棉柔巾','🧻'],['护手霜','🧴'],['洗衣凝珠','🧼'],['保温杯','🥤'],['毛绒抱枕','🧸'],['折叠伞','☂️'],['软底拖鞋','🩴']]},
  snack:{n:'零食',min:6,max:59,list:[['海盐薯片','🥔'],['焦糖爆米花','🍿'],['芒果干','🥭'],['黑巧克力豆','🍫'],['肉松饼','🥮'],['坚果礼盒','🥜'],['香辣小面筋','🌶️'],['黄油曲奇','🍪']]},
  gift:{n:'礼物',min:59,max:399,list:[['干花小夜灯','🕯️'],['星座项链','📿'],['手写相册','📔'],['木盒八音盒','🎵'],['定制马克杯','☕'],['香薰礼盒','🎁']]},
  dessert:{n:'甜品',min:12,max:128,list:[['草莓奶油蛋糕','🍰'],['提拉米苏','🍮'],['葡式蛋挞','🥧'],['马卡龙','🍬'],['焦糖布丁','🍮'],['舒芙蕾','🥞']]},
  drink:{n:'饮料',min:8,max:38,list:[['芋泥波波奶茶','🧋'],['生椰拿铁','☕'],['柠檬气泡水','🥤'],['蜜桃乌龙','🍑'],['热可可','🍫'],['杨枝甘露','🥭']]},
  cloth:{n:'衣服',min:89,max:599,list:[['oversize 卫衣','🧥'],['针织开衫','🧶'],['棉麻连衣裙','👗'],['宽松衬衫','👔'],['羊绒围巾','🧣'],['牛仔外套','🧥']]}
};
var SHOP_CATS=['daily','snack','gift','dessert','drink','cloth'];
function shopRand(seed){
  var h=2166136261,i;
  for(i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}
  return function(){
    h+=0x6D2B79F5;
    var t=h;t=Math.imul(t^(t>>>15),1|t);
    t^=t+Math.imul(t^(t>>>7),61|t);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function shopState(){
  if(!state.shop||typeof state.shop!=='object')state.shop={};
  var sh=state.shop;
  if(!Array.isArray(sh.items))sh.items=[];
  if(!Array.isArray(sh.orders))sh.orders=[];
  if(typeof sh.day!=='string')sh.day='';
  if(!sh.cat)sh.cat='all';
  return sh;
}
function shopToday(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
/** 每天生成一批；同一天多次打开是同一批（不会每次刷新都变） */
function shopGen(force){
  var sh=shopState(),today=shopToday();
  if(!force&&sh.day===today&&sh.items.length)return sh;
  var rnd=shopRand('zika-shop-'+today+'-'+(force?(sh.rv=(sh.rv||0)+1):'')),items=[],ci;
  for(ci=0;ci<SHOP_CATS.length;ci++){
    var k=SHOP_CATS[ci],p=SHOP_POOLS[k],pool=p.list.slice(),n;
    for(n=0;n<3&&pool.length;n++){
      var nm=pool.splice(Math.floor(rnd()*pool.length),1)[0];
      var price=Math.round((p.min+rnd()*(p.max-p.min))*10)/10;
      items.push({id:'it'+ci+'_'+n+'_'+Math.floor(rnd()*1e6).toString(36),name:nm[0],emoji:nm[1],cat:k,catName:p.n,price:price});
    }
  }
  sh.day=today;sh.items=items;
  return sh;
}
function shopItem(id){
  var sh=shopState(),i;
  for(i=0;i<sh.items.length;i++)if(sh.items[i].id===id)return sh.items[i];
  return null;
}
function shopSetCat(c){shopState().cat=c;save();renderShop()}
function shopRegen(){shopGen(true);save();renderShop();toast('换了一批新商品')}
/** 我买给他 */
function shopBuy(id){
  var it=shopItem(id);if(!it)return;
  var c=activeContact();if(!c){toast('先加个联系人吧');return}

    price:it.price,catName:it.catName,ts:now(),replyDue:now()+rndDelay(c),answered:false});
  var sh=shopState();
  sh.orders.unshift({id:uid(),name:it.name,emoji:it.emoji,price:it.price,dir:'out',ts:now(),status:'sent'});
  if(sh.orders.length>60)sh.orders.length=60;

/** 他的回应：收到礼物道谢 / 代买请求答应或婉拒 */
function shopAnswer(m){
  if(!m||m.answered)return;
  m.answered=true;
  var c=contact(m.contactId)||activeContact();
  if(!c)return;
  var sh=shopState();
  if(m.kind==='gift'){
    pushIn(c.id,pick(['谢谢你，我很喜欢','收到啦，我会好好用的','你怎么知道我想要这个','这个我要留很久']),now());
  }else if(m.kind==='buyreq'){
    if(Math.random()<0.72){
      m.accepted=true;
      state.messages.push({id:uid(),contactId:c.id,dir:'in',kind:'gift',itemName:m.itemName,emoji:m.emoji,
        price:m.price,catName:m.catName,ts:now(),accepted:true,fromAsk:true});
      sh.orders.unshift({id:uid(),name:m.itemName,emoji:m.emoji,price:m.price,dir:'in',ts:now(),status:'gift'});
      /* ★ 代买答应了就直接说这句预设的话（用户要的味道）：
         "宝宝想要，宝宝得到。你想要的买给你了。" 以前回的是"帮你买好啦/已经下单了"这种，
         听着像客服通知，不像他。 */
      pushIn(c.id,pick([
        '宝宝想要，宝宝得到。',
        '你想要的，买给你了。',
        '宝宝想要，宝宝得到 —— 买给你了，等收货吧。',
        '买好了。你想要的，我都记着呢。'
      ]),now()+1200);

      m.refused=true;
      pushIn(c.id,pick(['这次先不买啦','最近有点紧，下次一定','换一个好不好']),now());

  save();
  try{if(location.hash.replace('#','')==='chat')renderChat()}catch(e){}

/** 他来找我代买 */
function shopHisAsk(c){

function renderShop(){

  var sh=shopGen(),c=activeContact();
  var html='<div class="screen shop-screen">';
  html+='<div class="page-top"><button class="back" data-view="home">'+ICON_BACK+'</button><b>商城</b>'

/* 通话悬浮条：按住任意位置即可拖动，位置会记住，通话结束后不再复位 */
function callMiniPosClamp(L,T){
  var ov=$('#callOverlay');
  var w=ov?ov.offsetWidth:280,h=ov?ov.offsetHeight:56;
  var vw=window.innerWidth||360,vh=window.innerHeight||640;
  /* ★ 聊天页底部是输入框：小框不许停在那一片，否则挡住输入框点不动。
     留出 110px（输入栏 + 安全区）当禁区。 */
  var bottomGuard=110;
  var maxT=vh-h-6;
  try{ if(inChatView())maxT=Math.min(maxT,vh-h-bottomGuard) }catch(e){}
  return {L:Math.max(6,Math.min(vw-w-6,L)),T:Math.max(6,Math.min(maxT,T))};
}
function callMiniApplyPos(L,T){
  /* ★ 同上：清掉早期规则留下的 translateX(-50%)，否则小框的可见位置
     会比"代码认为的位置"偏左半个宽度，命中区域正好压住屏幕中间/输入框。 */
  try{
    var _ov=$('#callOverlay');
    if(_ov){_ov.style.transform='none';_ov.style.right='auto'}
  }catch(e){}
  /* ★ 这里自己也夹一次：不管谁调用（拖拽、恢复上次位置、外部直接调用），
     都不可能把条子停在聊天输入框那一片上。 */
  try{
    var _cp=callMiniPosClamp(L,T);
    L=_cp.L;T=_cp.T;
  }catch(e){}
  var ov=$('#callOverlay');
  if(!ov)return;
  ov.classList.add('dragged');
  ov.style.top=T+'px';ov.style.left=L+'px';ov.style.right='auto';
}
function bindCallDrag(){
  /* ★ 同上：state._cld 会被存档，刷新后直接 return → 打电话的小框拖不动。
     这个 bug 用户报过两次，根因就在这。 */
  if(_cldBound)return;_cldBound=true;
  var dragging=false,sx=0,sy=0,baseL=0,baseT=0,ov=null,moved=false;
  function start(x,y,target){
    ov=$('#callOverlay');
    if(!ov||!ov.classList.contains('mini'))return;
    /* ★★ 关键：手指必须真的落在小框上才算拖拽。
       以前只判断"是不是缩小状态"，于是屏幕任何地方按下都会 dragging=true，
       紧接着 touchmove 里的 preventDefault 会把整页滚动和输入框点击全部吃掉 ——
       用户报的"打完电话输入框点不开、聊天也滑不动"就是这个。 */
    if(!target||!ov.contains(target))return;
    /* 点在按钮上就别拖，免得按不到挂断 */
    var el=target;
    while(el&&el!==document.body){
      if(el.getAttribute&&el.getAttribute('data-nodrag')!==null&&el.getAttribute&&el.getAttribute('data-nodrag')!==undefined){}
      if(el.tagName==='BUTTON')return;
      el=el.parentNode;
    }
    var r=ov.getBoundingClientRect();
    baseL=r.left;baseT=r.top;sx=x;sy=y;moved=false;dragging=true;
    ov.style.transition='none';
  }
  function move(x,y){
    if(!dragging||!ov)return;
    moved=true;
    var p=callMiniPosClamp(baseL+(x-sx),baseT+(y-sy));
    ov.style.top=p.T+'px';ov.style.left=p.L+'px';ov.style.right='auto';
  }
  function end(){
    if(!dragging)return;
    dragging=false;
    if(ov){
      ov.style.transition='';
      if(moved){
        var r=ov.getBoundingClientRect();
        state._callPos={L:Math.round(r.left),T:Math.round(r.top)};
        save();
        ov.classList.add('dragged');
      }
    }
    ov=null;
  }
  document.addEventListener('touchstart',function(e){
    var t=e.touches&&e.touches[0];if(!t)return;
    start(t.clientX,t.clientY,e.target);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!dragging)return;
    var t=e.touches&&e.touches[0];if(!t)return;
    move(t.clientX,t.clientY);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',end);
  document.addEventListener('touchcancel',end);
  document.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    start(e.clientX,e.clientY,e.target);
    if(dragging)e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    move(e.clientX,e.clientY);
    e.preventDefault();
  });
  document.addEventListener('mouseup',end);
  window.addEventListener('resize',function(){
    if(!state._callPos)return;
    var p=callMiniPosClamp(state._callPos.L,state._callPos.T);
    state._callPos={L:p.L,T:p.T};
  });
}
bindCallDrag();

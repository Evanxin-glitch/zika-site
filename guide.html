function render(){

function openDetail(title,body){
  document.getElementById('dTitle').textContent=title;
  document.getElementById('dBody').innerHTML=body;
  document.getElementById('home').style.display='none';
  document.getElementById('detail').classList.add('on');
  window.scrollTo(0,0);
}
function closeDetail(){
  document.getElementById('detail').classList.remove('on');
  document.getElementById('home').style.display='flex';
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var it=e.target.closest?e.target.closest('.item'):null;
  if(it){ var s=SECTIONS[+it.getAttribute('data-i')]; openDetail(s.n+' · '+s.t, s.b); return }
  if(e.target.closest('#mustBtn')){ openDetail(MUST.t, MUST.b); return }
  if(e.target.closest('#back')){ closeDetail() }
});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>阅读</title>
<style>
:root{--ink:#1c1c1e;--sub:#8e8e93;--line:rgba(60,60,67,.12);--bg:#fbfbfd;--card:#fff;
  --rd-bg:#fff;--rd-ink:#111;--rd-sub:#8e8e93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.page{flex:1 1 auto;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 6px}
.head h1{font-size:30px;font-weight:800;margin:0}
.head .ring{width:52px;height:52px;border-radius:50%;border:3px solid #e6e6ea;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.head .ring i{font-style:normal;font-size:9px;color:var(--sub);font-weight:400}
.sec{padding:12px 18px 4px;font-size:20px;font-weight:800;display:flex;align-items:center}
.sec small{margin-left:auto;font-size:13px;font-weight:400;color:var(--sub)}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:8px 18px 14px}
.book{flex:0 0 auto;display:flex;gap:12px;background:#1f1f22;color:#fff;border-radius:16px;padding:14px;width:min(84vw,330px)}
.book .cov{width:70px;height:100px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.book .tt{font-size:16px;font-weight:700;line-height:1.35}
.book .au{font-size:13px;color:#c9c9ce;margin-top:2px}
.book .mt{font-size:12px;color:#a9a9b0;margin-top:6px}
.rows{padding:0 18px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.row .cov{width:48px;height:66px;border-radius:5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}
.row .tt{font-size:15px;font-weight:600}
.row .au{font-size:12.5px;color:var(--sub);margin-top:2px}
.empty{padding:34px 22px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.goal{margin:10px 18px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.goal h3{margin:0 0 4px;font-size:17px}
.goal p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.5}
.goal .big{font-size:52px;font-weight:200;font-variant-numeric:tabular-nums}
.goal .big small{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:8px 18px}
.gi .cov{width:100%;aspect-ratio:2/3;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:700}
.gi .tt{font-size:12.5px;margin-top:6px;line-height:1.35}
.gi .au{font-size:11px;color:var(--sub)}
.acts{display:flex;gap:8px;padding:6px 18px 10px}
.acts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 0;font-size:13px}
.reader{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--rd-bg);color:var(--rd-ink)}
.reader.on{display:flex}
.rt{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 4px}
.rt .t{flex:1;text-align:center;font-size:13px;color:var(--rd-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:40px;height:40px;border:0;background:none;color:inherit;font-size:16px;border-radius:12px}
.rl{font-size:12px;color:var(--rd-sub);text-align:center;padding-bottom:4px;min-height:16px}
.vp{flex:1 1 auto;position:relative;overflow:hidden}
.flow{position:absolute;left:0;top:0;height:100%;column-fill:auto;column-gap:0;padding:0;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:19px;line-height:1.95;text-align:justify;transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.flow p{margin:0 26px .95em;text-indent:2em}
.flow h2{font-size:1.1em;margin:.2em 26px .9em;text-indent:0;font-weight:600}
.flow p.poem{text-indent:0;white-space:pre-wrap}
.flow p[data-p]{position:relative;cursor:pointer;border-radius:8px}
.flow p.sel{background:rgba(0,0,0,.07)}
.flow p.hasnote::after{content:'';position:absolute;right:-13px;top:.8em;width:4px;height:4px;border-radius:50%;background:#111;opacity:.5}
.rb{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 16px calc(10px + env(safe-area-inset-bottom));font-size:12px;color:var(--rd-sub)}
.rb .sl{flex:1;height:2px;background:rgba(128,128,128,.25);border-radius:2px;position:relative}
.rb .sl i{position:absolute;left:0;top:0;bottom:0;background:var(--rd-ink);border-radius:2px}
.turn{position:absolute;top:0;bottom:0;width:25%;z-index:2}
.turn.l{left:0}.turn.r{right:0}
#askBar{position:fixed;left:0;top:0;z-index:58;display:none;background:#111;color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;white-space:nowrap}
#askBar.on{display:block}
#hisCard{position:fixed;left:16px;right:16px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:59;display:none;background:#111;color:#f2f2f2;border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.65}
#hisCard.on{display:block}
#hisCard b{color:#fff;opacity:.55;margin-right:6px;font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:#fafafa;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.16)}
.sheet.on{display:block}
.sheet h4{margin:0 0 10px;font-size:15px}
.rw{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.rw span{width:46px;color:#6b6b70}
.seg{flex:1;display:flex;background:#eeeef2;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:99;background:rgba(20,20,20,.9);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;display:none;max-width:80vw;text-align:center;line-height:1.5}
.gi{position:relative}
.gi .del{position:absolute;right:0;top:0;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:22px;padding:0}
/* ---- 批注 ---- */
.ic.pill{width:auto;height:28px;line-height:26px;padding:0 9px;font-size:12px;border:1px solid rgba(128,128,128,.35);border-radius:999px;white-space:nowrap;flex:0 0 auto}
#askBar{padding:0;display:none;align-items:stretch;overflow:hidden}
#askBar.on{display:flex}
#askBar button{border:0;background:none;color:#fff;font-size:13px;padding:9px 13px;white-space:nowrap}
#askBar .sp{width:1px;background:rgba(255,255,255,.28);margin:8px 0}
.flow p.flash{background:rgba(0,0,0,.12)}
#noteSheet .nsel{max-height:96px;overflow:auto;font-size:13px;line-height:1.65;color:#3c3c43;background:#eeeef2;border-radius:10px;padding:9px 11px;margin-bottom:10px;word-break:break-word}
#noteSheet textarea{width:100%;border:1px solid rgba(60,60,67,.14);background:#fff;border-radius:12px;padding:10px 12px;font:14px/1.55 inherit;color:var(--ink);outline:none;resize:none;display:block}
.nacts{display:flex;gap:10px;margin-top:12px}
.nacts button{flex:1;border:0;border-radius:12px;padding:12px 0;font-size:14px;background:#eeeef2;color:#1c1c1e}
.nacts button.pri{background:#111;color:#fff;font-weight:600}
#noteList .nlist{max-height:56vh;overflow:auto;-webkit-overflow-scrolling:touch}
.nrow{position:relative;background:#fff;border:1px solid rgba(60,60,67,.12);border-radius:14px;padding:11px 40px 11px 13px;margin-bottom:9px}
.nrow .nq{font-size:13px;line-height:1.6;color:#111;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .nn{font-size:13px;line-height:1.55;color:#8e8e93;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nrow .nf{font-size:11.5px;color:#8e8e93;margin-top:6px}
.nrow .ndel{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;border-radius:50%;background:#eeeef2;color:#8e8e93;font-size:12px;line-height:26px;padding:0}
.nempty{padding:26px 0 30px;text-align:center;color:#8e8e93;font-size:13px;line-height:1.8}
.nh{font-size:13px;font-weight:400;color:#8e8e93;margin-left:6px}
</style>
</head>
<body>
<div class="app">
  <div class="page" id="pgHome">
    <div class="head"><h1>主页</h1><div class="ring" id="ring">0<i>分钟</i></div></div>
    <div class="sec">继续阅读</div>
    <div class="carousel" id="car"></div>
    <div class="sec">之前读过 <small id="allBtn">全部 ›</small></div>
    <div class="rows" id="rows"></div>
    <div class="goal"><h3>阅读目标</h3><p>坚持每天阅读，慢慢读完。</p><div class="big" id="today">0:00<small>今日阅读进度</small></div></div>
    <div class="acts"><button id="btnExp">导出阅读数据</button><button id="btnImp">导入阅读数据</button></div>
  </div>
  <div class="page" id="pgLib" style="display:none">
    <div class="head"><h1>书库</h1><button class="ic" id="btnAdd">＋</button></div>
    <p style="padding:0 18px;color:var(--sub);font-size:13px;line-height:1.7;margin:4px 0 8px">单本上限 80 万字（txt 约 2.5MB）。支持 UTF-8 / GBK。</p>
    <div class="grid" id="gridLib"></div>
  </div>
  <div class="page" id="pgSearch" style="display:none">
    <div class="head"><h1>搜索</h1></div>
    <div style="padding:0 18px"><input id="q" placeholder="书名 / 作者" style="width:100%;border:0;background:#eeeef2;border-radius:12px;padding:12px 14px;font-size:15px;outline:none"></div>
    <div class="rows" id="rowsSearch" style="margin-top:10px"></div>
  </div>
  <div style="flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:rgba(251,251,253,.96);padding:6px 0 calc(8px + env(safe-area-inset-bottom))">
    <button class="tab" data-tab="home" style="flex:1;border:0;background:none;font-size:11px;color:var(--sub);padding:4px 0">主页</button>
    <button class="tab" data-tab="lib" style="flex:1;border:0;background:none;font-size:11px;color:var(--sub);padding:4px 0">书库</button>
    <button class="tab" data-tab="search" style="flex:1;border:0;background:none;font-size:11px;color:var(--sub);padding:4px 0">搜索</button>
  </div>
</div>

<div class="reader" id="reader">
  <div class="rt">
    <button class="ic" id="btnBack">‹</button>
    <div class="t" id="rdTitle"></div>
    <button class="ic pill" id="btnNotes">批注</button>
    <button class="ic" id="btnInvite" style="font-size:12px;width:auto;padding:0 8px;border:1px solid rgba(128,128,128,.35);border-radius:999px;height:28px;line-height:26px">邀请一起读</button>
    <button class="ic" id="btnAa">Aa</button>
  </div>
  <div class="rl" id="roomLine"></div>
  <div class="vp" id="vp"><div class="turn l" id="tl"></div><div class="turn r" id="tr"></div><div class="flow" id="flow"></div></div>
  <div class="rb"><span id="pgNo">1/1</span><div class="sl"><i id="slBar"></i></div><span id="pct">0%</span></div>
</div>

<div id="askBar"><button id="askSay">让陆沉说说这里</button><i class="sp"></i><button id="askNote">批注</button></div>
<div id="hisCard"><b>陆沉</b><span id="hisTx"></span></div>
<div class="sheet" id="sheet">
  <h4>显示</h4>
  <div class="rw"><span>字号</span><div class="seg" id="segFs"><button data-fs="17">小</button><button data-fs="19">中</button><button data-fs="22">大</button></div></div>
  <div class="rw"><span>行距</span><div class="seg" id="segLh"><button data-lh="1.7">紧</button><button data-lh="1.95">标准</button><button data-lh="2.2">松</button></div></div>
  <div class="rw"><span>纸色</span><div class="seg" id="segTh"><button data-th="light">白</button><button data-th="dark">黑</button></div></div>
</div>
<div class="sheet" id="noteSheet">
  <h4>写批注</h4>
  <div class="nsel" id="noteSel"></div>
  <textarea id="noteText" rows="3" placeholder="写点想法…"></textarea>
  <div class="nacts"><button id="noteCancel">取消</button><button class="pri" id="noteSave">保存批注</button></div>
</div>
<div class="sheet" id="noteList">
  <h4>批注<span class="nh" id="noteCount"></span></h4>
  <div class="nlist" id="noteRows"></div>
</div>
<div id="toast"></div>
<input type="file" id="fileTxt" accept=".txt,text/plain" style="display:none">
<input type="file" id="fileJson" accept=".json,application/json" style="display:none">
<script>
var BUILTIN=[{"id":"stray-birds","title":"飞鸟集","author":"泰戈尔","coverCss":"linear-gradient(160deg,#e9e2d0,#cbbfa4)","chapters":[{"title":"第 1 节","text":"泰戈尔\n《世界上最遥远的距离》\n世界上最遥远的距离 The furthest distance in the world\n不是生与死的距离 is not the way from birth to the end.\n而是我就站在你面前It is when I stand in front of you\n你却不知道我爱你 but you don't understand I love you.\n世界上最遥远的距离 The furthest distance in the world\n不是我就站在你面前 is not when I stand in front of you\n你却不知道我爱你 you don't know I love you\n而是爱到痴迷 It is when my love is bewildering the soul\n却不能说我爱你 but I can't speak it out\n世界上最遥远的距离 Thefurthest distance in the world\n不是我不能说我爱你 is not that I can't say I love you.\n而是想你痛彻心脾 It is after missing you deeply into my heart\n却只能深埋心底 I only can bury it in my heart\n世界上最遥远的距离The furthest distance in the world\n不是我不能说我想你 is not that I can't say to you I miss you\n而是彼此相爱 It is when we are falling in love\n却不能够在一起 but we can't stay nearby\n世界上最遥远的距离 The furthest distance in the world\n不是彼此相爱 is not we love each other .\n却不能够在一起 but can't stay together\n而是明知道真爱无敌 .It is we know our true love is breaking through the way\n却装作毫不在意 we turn a blind eye to it\n所以世界上最遥远的距离 So the furthest distance in the world"},{"title":"第 2 节","text":"不是树与树的距离 is not in two distant trees.\n而是同根生长的树枝 It is the same rooted branches\n却无法在风中相依 but can't depend on each other in the wind\n世界上最遥远的距离The furthest distance in the world\n不是树枝无法相依 is not can't depend on each other in the wind\n而是相互瞭望的星星 It is in the blinking stars who only can look with each other\n却没有交汇的轨迹 but their trade intersect.\n世界上最遥远的距离The furthest distance in the world\n不是星星没有交汇的轨迹 is not in the blinking stars who only can look with each other\n而是纵然轨迹交汇 It is after the intersection\n却在转瞬间无处寻觅 but they can't be found from then on afar\n世界上最遥远的距离The furthest distance in the world\n不是瞬间便无处寻觅 is not the light that is fading away.\n而是尚未相遇 It is the coincidence of us\n便注定无法相聚 is not supposed for the love.\n世界上最遥远的距离The furthest distance in the world\n是飞鸟与鱼的距离 is the love between the bird and fish.\n一个翱翔天际 One is flying in the sky,\n一个却深潜海底 the other is looking upon into the sea.\n夏天的飞鸟，飞到我的窗前唱歌，又飞去了。\n秋天的黄叶，它们没有什么可唱，只叹息一声，飞落在那里。\nstray birds of summer come to my window to sing and fly away.\nand yellow leaves of autumn, which have no songs, flutter and fall\nthere with a sign.\n世界上的一队小小的漂泊者呀，请留下你们的足印在我的文字里。"},{"title":"第 3 节","text":"o troupe of little vagrants of the world, leave your footprints in my words.\n世界对着它的爱人，把它浩翰的面具揭下了。\n它变小了，小如一首歌，小如一回永恒的接吻。\nthe world puts off its mask of vastness to its lover.\nit becomes small as one song, as one kiss of the eternal.\n是大地的泪点，使她的微笑保持着青春不谢。\nit is the tears of the earth that keep here smiles in bloom.\n无垠的沙漠热烈追求一叶绿草的爱，她摇摇头笑着飞开了。\nthe mighty desert is burning for the love of a bladeof grass who\nshakes her head and laughs and flies away.\n如果你因失去了太阳而流泪，那么你也将失去群星了。\nif you shed tears when you miss the sun, you also miss the stars.\n跳舞着的流水呀，在你途中的泥沙，要求你的歌声，你的流动呢。你肯挟瘸足的泥沙而俱下么？\nthe sands in your way beg for your song and your movement, dancing\nwater. will you carry the burden of their lameness?\n她的热切的脸，如夜雨似的，搅扰着我的梦魂。\nher wishful face haunts my dreams like the rain at night.\n有一次，我们梦见大家都是不相识的。\n我们醒了，却知道我们原是相亲相爱的。\nonce we dreamt that we were strangers.\nwe wake up to find that we were dear to each other.\n１０\n忧思在我的心里平静下去，正如暮色降临在寂静的山林中。\nsorrow is hushed into peace in my heart like the evening among\nthe silent trees."},{"title":"第 4 节","text":"１１\n有些看不见的手，如懒懒的微（风思）的，正在我的心上奏着　　潺（氵爰）的乐声。\nsome unseen fingers, like an idle breeze, are playing upon my heart\nthe music of the ripples.\n１２\n“海水呀，你说的是什么？”\n“是永恒的疑问。”\n“天空呀，你回答的话是什么？”\n“是永恒的沉默。”\nwhat language is thine, o sea?the language of eternal question.what language is thy answer, o sky?the language of eternal silence.\n１３\n静静地听，我的心呀，听那世界的低语，这是它对你求爱的表示呀。\nlisten, my heart, to the whispers of the world with which it makes\nlove to you.\n１４\n创造的神秘，有如夜间的黑暗－－是伟大的。而知识的幻影却不过如晨间之雾。\nthe mystery of creation is like the darkness of night--it is great.delusions of knowledge are like the fog of the morning.\n１５\n不要因为峭壁是高的，便让你的爱情坐在峭壁上。\ndo not seat your love upon a precipice because it is high.\n１６\n我今晨坐在窗前，世界如一个路人似的，停留了一会，向我点点头又走过去了。\ni sit at my window this morning where the world like a passer-by stops\nfor a moment, nods to me and goes.\n１７"},{"title":"第 5 节","text":"这些微（风思），是树叶的簌簌之声呀；它们在我的心里欢悦地微语着。\nthere little thoughts are the rustle of leaves; they have their\nwhisper of joy in my mind.\n１８\n你看不见你自己，你所看见的只是你的影子。\nwhat you are you do not see, what you see is your shadow.\n１９\n神呀，我的那些愿望真是愚傻呀，它们杂在你的歌声中喧叫着呢。\n让我只是静听着吧。\nmy wishes are fools, they shout across thy song, my master.\nlet me but listen.\n２０\n我不能选择那最好的。\n是那最好的选择我。\ni cannot choose the best.\nthe best chooses me.\n２１\n那些把灯背在背上的人，把他们的影子投到了自己前面。\nthey throw their shadows before them who carry their lantern on\ntheir back.\n２２\n我的存在，对我是一个永久的神奇，这就是生活。\nthat i exist is a perpetual surprise which is life.\n２３\n“我们萧萧的树叶都有声响回答那风和雨。你是谁呢，那样的沉默着？”"},{"title":"第 6 节","text":"“我不过是一朵花。”　　　　　　　　　　　　　　　　　　　　　　we, the rustling leaves, have a voice that answers the storms,\nbut who are you so silent?\"i am a mere flower.\n２４\n休息与工作的关系，正如眼睑与眼睛的关系。\nrest belongs to the work as the eyelids to the eyes.\n２５\n人是一个初生的孩子，他的力量，就是生长的力量。\nman is a born child, his power is the power of growth.\n２６\n神希望我们酬答他，在于他送给我们的花朵，而不在于太阳和土地。\ngod expects answers for the flowers he sends us, not for the sun\nthe earth.\n２７\n光明如一个裸体的孩子，快快活活地在绿叶当中游戏，它不知道人是会欺诈的。\nthe light that plays, like a naked child, among the green leaves\nhappily knows not that man can lie.\n２８\n啊，美呀，在爱中找你自己吧，不要到你镜子的谄谀去找寻。\no beauty, find thyself in love, not in the flattery of thy mirror.\n２９\n我的心把她的波浪在世界的海岸上冲激着，以热泪在上边写着她的题记：“我爱你。”\nmy heart beats her waves at the shore of the world and writes upon\nit her signature in tears with the words, \"i love thee.\"\n３０\n“月儿呀，你在等候什么呢？”"},{"title":"第 7 节","text":"“向我将让位给他的太阳致敬。”　　　　　　　　　　　　　　　　　moon, for what do you wait?to salute the sun for whom i must make way.\n３１\n绿树长到了我的窗前，仿佛是喑哑的大地发出的渴望的声音。\nthe trees come up to my window like the yearning voice of the dumb earth.\n３２\n神自己的清晨，在他自己看来也是新奇的。\nhis own mornings are new surprises to god.\n３３\n生命从世界得到资产，爱情使它得到价值。\nlife finds its wealth by the claims of the world, and its worth\nby the claims of love.\n３４\n枯竭的河床，并不感谢它的过去。\nthe dry river-bed finds no thanks for its past.\n３５\n鸟儿愿为一朵云。\n云儿愿为一只鸟。\nthe bird wishes it were a cloud.\nthe cloud wishes it were a bird.\n３６\n瀑布歌唱道：“我得到自由时便有了歌声了。”\nthe waterfall sing, \"i find my song, when i find my freedom.\"\n３７\n我说不出这心为什么那样默默地颓丧着。\n是为了它那不曾要求，不曾知道，不曾记得的小小的需要。"},{"title":"第 8 节","text":"i cannot tell why this heart languishes in silence.\nit is for small needs it never asks, or knows or remembers.\n３８\n妇人，你在料理家务的时候，你的手足歌唱着，正如山间的溪水歌唱着在小石中流过。\nwoman, when you move about in your household service your limbs sing\nlike a hill stream among its pebbles.\n３９\n当太阳横过西方的海面时，对着东方留下他的最后的敬礼。\nthe sun goes to cross the western sea, leaving its last salutation\nto the east.\n４０\n不要因为你自己没有胃口而去责备你的食物。\ndo not blame your food because you have no appetite.\n４１\n群树如表示大地的愿望似的，踮起脚来向天空窥望。\nthe trees, like the longings of the earth, stand atiptoe to peep\nat the heaven.\n４２\n你微微地笑着，不同我说什么话。而我觉得，为了这个，我已等待得久了。\nyou smiled and talked to me of nothing and i felt that for this\ni had been waiting long.\n４３\n水里的游鱼是沉默的，陆地上的兽类是喧闹的，空中的飞鸟是歌唱着的。\n但是，人类却兼有海里的沉默，地上的喧闹与空中的音乐。\nthe fish in the water is silent, the animal on the earth is noisy,"},{"title":"第 9 节","text":"the bird in the air is singing.\nbut man has in him the silence of the sea, the noise of the earth and\nthe music of the air.\n４４\n世界在踌躇之心的琴弦上跑过去，奏出忧郁的乐声。\nthe world rushes on over the strings of the lingering heart making\nthe music of sadness.\n４５\n他把他的刀剑当作他的上帝。\n当他的刀剑胜利的时候他自己却失败了。\nhe has made his weapons his gods.\nwhen his weapons win he is defeated himself.\n４６\n神从创造中找到他自己。\ngod finds himself by creating.\n４７\n阴影戴上她的面幕，秘密地，温顺地，用她的沉默的爱的脚步，跟在“光”后边。\nshadow, with her veil drawn, follows light in secret meekness,\nwith her silent steps of love.\n４８\n群星不怕显得象萤火那样。\nthe stars are not afraid to appear like fireflies.\n４９\n谢谢神，我不是一个权力的轮子，而是被压在这轮子下的活人之一。\ni thank thee that i am none of the wheels of power but i am one with"},{"title":"第 10 节","text":"the living creatures that are crushed by it.\n５０\n心是尖锐的，不是宽博的，它执着在每一点上，却并不活动。\nthe mind, sharp but not broad, sticks at every point but does not move.\n５１\n你的偶像委散在尘土中了，这可证明神的尘土比你的偶像还伟大。\nyou idol is shattered in the dust to prove that god's dust is greater\nthan your idol.\n５２\n人不能在他的历史中表现出他自己，他在历史中奋斗着露出头角。\nman does not reveal himself in his history, he struggles up through it.\n５３\n玻璃灯因为瓦灯叫它做表兄而责备瓦灯。但明月出来时，玻璃\n灯却温和地微笑着，叫明月为－－－“我亲爱的，亲爱的姐姐。”\nwhile the glass lamp rebukes the earthen for calling it cousin the\nmoon rises, and the glass lamp, with a bland smile, calls her,---my dear, dear sister.\n５４\n我们如海鸥之与波涛相遇似地，遇见了，走近了。海鸥飞去，波涛滚滚地流开，我们也分别了。\nlike the meeting of the seagulls and the waves we meet and come near.\nthe seagulls fly off, the waves roll away and we depart.\n５５\n我的白昼已经完了，我象一只泊在海滩上的小船，谛听着晚潮跳舞的乐声。\nmy day is done, and i am like a boat drawn on the beach, listening to\nthe dance-music of the tide in the evening.\n５６"},{"title":"第 11 节","text":"我们的生命是天赋的，我们惟有献出生命，才能得到生命。\nlife is given to us, we earn it by giving it.\n５７\n当我们是大为谦卑的时候，便是我们最接近伟大的时候。\nwe come nearest to the great when we are great in humility.\n５８\n麻雀看见孔雀负担着它的翎尾，替它担忧。\nthe sparrow is sorry for the peacock at the burden of its tail.\n５９\n决不要害怕刹那－－永恒之声这样唱着。\nnever be afraid of the moments--thus sings the voice of the everlasting.\n６０\n风于无路之中寻求最短之路，又突然地在“无何有之国”终之了它的追求。\nthe hurricane seeks the shortest road by the no-road, and suddenly ends\nits search in the nowhere.\n６１\n在我自己的杯中，饮了我的酒吧，朋友。\n一倒在别人的杯里，这酒的腾跳的泡沫便要消失了。\ntake my wine in my own cup, friend.\nit loses its wreath of foam when poured into that of others.\n６２\n“完全”为了对“不全”的爱，把自己装饰得美丽。\nthe perfect decks itself in beauty for the love of the imperfect.\n６３\n神对人说：“我医治你所以伤害你，爱你所以惩罚你。”"},{"title":"第 12 节","text":"god says to man, \"i heal you therefore i hurt, love you therefore punish.\"\n６４\n谢谢火焰给你光明，但是不要忘了那执灯的人，他是坚忍地站在黑暗当中呢。\nthank the flame for its light, but do not forget the lampholder\nstanding in the shade with constancy of patience.\n６５\n小草呀，你的足步虽小，但是你拥有你足下的土地。\ntiny grass, your steps are small, but you possess the earth under\nyour tread.\n６６\n幼花的蓓蕾开放了，它叫道：“亲爱的世界呀，请不要萎谢了。”\nthe infant flower opens its bud and cries, \"dear world, please do not\nfade.\"\n６７\n神对于那些大帝国会感到厌恶，却决不会厌恶那些小小的花朵。\ngod grows weary of great kingdoms, but never of little flowers.\n６８\n错误经不起失败，但是真理却不怕失败。\nwrong cannot afford defeat but right can.\n６９\n瀑布歌唱道：“虽然渴者只要少许的水便够了，我却很快活地给与了我的全部的水。　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　i give my whole water in joy,\nit is enough for the thirsty.\n７０\n把那些花朵抛掷上去的那一阵子无休无止的狂欢大喜的劲儿，其源泉是在哪里呢？\nwhere is the fountain that throws up these flowers in a ceaseless"},{"title":"第 13 节","text":"outbreak of ecstasy?\n７１\n樵夫的斧头，问树要斧柄。\n树便给了他。\nthe woodcutter's axe begged for its handle from the tree.\nthe tree gave it.\n７２\n这寡独的黄昏，幕着雾与雨，我在我的心的孤寂里，感觉到它的叹息。\nin my solitude of heart i feel the sigh of this widowed evening veiled\nwith mist and rain.\n７３\n贞操是从丰富的爱情中生出来的财富。\nchastity is a wealth that comes from abundance of love.\n７４\n雾，象爱情一样，在山峰的心上游戏，生出种种美丽的变幻。\nthe mist, like love, plays upon the heart of the hills and bring out\nsurprises of beauty.\n７５\n我们把世界看错了，反说它欺骗我们。\nwe read the world wrong and say that it deceives us.\n７６\n诗人－－飙风，正出经海洋森林，追求它自己的歌声。\nthe poet wind is out over the sea and the forest to seek his own voice.\n７７\n每一个孩子出生时都带来信息说：神对人并未灰心失望。"},{"title":"第 14 节","text":"every child comes with the message that god is not yet discouraged of man.\n７８\n绿草求她地上的伴侣。\n树木求他天空的寂寞。\nthe grass seeks her crowd in the earth.\nthe tree seeks his solitude of the sky.\n７９\n人对他自己建筑起堤防来。\nman barricades against himself.\n８０\n我的朋友，你的语声飘荡在我的心里，象那海水的低吟声绕缭在静听着的松林之间。\nyour voice, my friend, wanders in my heart, like the muffled sound\nof the sea among these listening pines.\n８１\n这个不可见的黑暗之火焰，以繁星为其火花的，到底是什么呢？\nwhat is this unseen flame of darkness whose sparks are the stars?\n８２\n使生如夏花之绚烂，死如秋叶之静美。\nlet life be beautiful like summer flowers and death like autumn leaves.\n８３\n那想做好人的，在门外敲着门；那爱人的看见门敞开着。\nhe who wants to do good knocks at the gate; he who loves finds the\ngate open.\n８４\n在死的时候，众多和而为一；在生的时候，一化为众多。"},{"title":"第 15 节","text":"神死了的时候，宗教便将合而为一。\nin death the many becomes one; in life the one becomes many.\nreligion will be one when god is dead.\n８５\n艺术家是自然的情人，所以他是自然的奴隶，也是自然的主人。\nthe artist is the lover of nature, therefore he is her slave and her\nmaster.\n８６\n“你离我有多远呢，果实呀？”\n“我藏在你心里呢，花呀。”　　　　　　　　　　　　　　　　　　　　how far are you from me, o fruit?i am hidden in your heart, o flower.\n８７\n这个渴望是为了那个在黑夜里感觉得到，在大白天里却看不见的人。\nthis longing is for the one who is felt in the dark, but not seen\nin the day.\n８８\n露珠对湖水说道；“你是在荷叶下面的大露珠，我是在荷叶上面的较小的露珠。”　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　you are the big drop of dew under the lotus leaf, i am the smaller\none on its upper side,\" said the dewdrop to the lake.\n８９\n刀鞘保护刀的锋利，它自己则满足于它的迟钝。\nthe scabbard is content to be dull when it protects the keenness of\nthe sword.\n９０\n在黑暗中，“一”视如一体；在光亮中，“一”便视如众多。　　　　　　在静听着的松林之间。\nin darkness the one appears as uniform; in the light the one appears\nas manifold."},{"title":"第 16 节","text":"９１\n大地借助于绿草，显出她自己的殷勤好客。\nthe great earth makes herself hospitable with the help of the grass.\n９２\n绿叶的生与死乃是旋风的急骤的旋转，它的更广大的旋转的圈子乃是在天上繁星之间徐缓的转动。\nthe birth and death of the leaves are the rapid whirls of the eddy\nwhose wider circles move slowly among stars.\n９３\n权势对世界说道：“你是我的。”\n世界便把权势囚禁在她的宝座下面。\n爱情对世界说道：“我是你的。”\n世界便给予爱情以在它屋内来往的自由。\npower said to the world, \"you are mine.\"\nthe world kept it prisoner on her throne.\nlove said to the world, \"i am thine.\"\nthe world gave it the freedom of her house.\n９４\n浓雾仿佛是大地的愿望。\n它藏起了太阳，而太阳原是她所呼求的。\nthe mist is like the earth's desire.\nit hides the sun for whom she cries.\n９５\n安静些吧，我的心，这些大树都是祈祷者呀。\nbe still, my heart, these great trees are prayers.\n９６"},{"title":"第 17 节","text":"瞬刻的喧声，讥笑着永恒的音乐。\nthe noise of the moment scoffs at the music of the eternal.\n９７\n我想起了浮泛在生与爱与死的川流上的许多别的时代，以及这些时代之被遗忘，我便感觉到离开尘世的自由了。\ni think of other ages that floated upon the stream of life and love\nand death and are forgotten, and i feel the freedom of passing away.\n９８\n我灵魂里的忧郁就是她的新婚的面纱。\n这面纱等候着在夜间卸去。\nthe sadness of my soul is her bride's veil.\nit waits to be lifted in the night.\n９９\n死之印记给生的钱币以价值，使它能够用生命来购买那真正的宝物。\ndeath's stamp gives value to the coin of life; making it possible\nto buy with life what is truly precious.\n１００\n白云谦逊地站在天之一隅。\n晨光给它戴上霞彩。\nthe cloud stood humbly in a corner of the sky.\nthe morning crowned it with splendour.\n１０１\n尘土受到损辱，却以她的花朵来报答。\nthe dust receives insult and in return offers her flowers.\n１０２\n只管走过去，不必逗留着采了花朵来保存，因为一路上花朵自会继续开放的。"},{"title":"第 18 节","text":"do not linger to gather flowers to keep them, but walk on,\nfor flowers will keep themselves blooming all your way.\n１０３\n根是地下的枝。\n枝是空中的根。\nroots are the branches down in the earth.\nbranches are roots in the air.\n１０４\n远远去了的夏之音乐，翱翔于秋间，寻求它的旧垒。\nthe music of the far-away summer flutters around the autumn seeking\nits former nest.\n１０５\n不要从你自己的袋里掏出勋绩借给你的朋友，这是污辱他的。\ndo not insult your friend by lending him merits from your own pocket.\n１０６\n无名的日子的感触，攀缘在我的心上，正象那绿色的苔藓，攀缘在老树的周身。\nthe touch of the nameless days clings to my heart like mosses round\nthe old tree.\n１０７\n回声嘲笑她的原声，以证明她是原声。\nthe echo mocks her origin to prove she is the original.\n１０８\n当富贵利达的人夸说他得到神的特别恩惠时，上帝却羞了。\ngod is ashamed when the prosperous boasts of his special favour.\n１０９"},{"title":"第 19 节","text":"我投射我自己的影子在我的路上，因为我有一盏还没有燃点起来的明灯。\ni cast my own shadow upon my path, because i have a lamp that has not\nbeen lighted.\n１１０\n人走进喧哗的群众里去，为的是要淹没他自己的沉默的呼号。\nman goes into the noisy crowed to drown his own clamour of silence.\n１１１\n终止于衰竭是“死亡”，但“圆满”却终止于无穷。\nthat which ends in exhaustion is death, but the perfect ending is\nin the endless.\n１１２\n太阳只穿一件朴素的光衣，白云却披了灿烂的裙裾。\nthe sun has his simple rode of light. the clouds are decked with\ngorgeousness.\n１１３\n山峰如群儿之喧嚷，举起他们的双臂，想去捉天上的星星。\nthe hills are like shouts of children who raise their arms, trying\nto catch stars.\n１１４\n道路虽然拥挤，却是寂寞的，因为它是不被爱的。\nthe road is lonely in its crowd for it is not loved.\n１１５\n权势以它的恶行自夸，落下的黄叶与浮游的云片却在笑它。\nthe power that boasts of its mischiefs is laughed at by the yellow\nleaves that fall, and clouds that pass by."},{"title":"第 20 节","text":"１１６\n今天大地在太阳光里向我营营哼鸣，象一个织着布的妇人，用一种已经被忘却的语言，哼着一些古代的歌曲。\nthe earth hums to me today in the sun, like a woman at her spinning,\nsome ballad of the ancient time in a forgotten tongue.\n１１７\n绿草是无愧于它所生长的伟大世界的。\nthe grass-blade is worthy of the great world where it grows.\n１１８\n梦是一个一定要谈话的妻子。\n睡眠是一个默默忍受的丈夫。\ndream is a wife who must talk,\nsleep is a husband who silently suffers.\n１１９\n夜与逝去的日子接吻，轻轻地在他耳旁说道：“我是死，是你的母亲。我就要给你以新的生命。\nthe night kisses the fading day whispering to his ear, i am death,\nyour mother. i am to give you fresh birth.\n１２０\n黑夜呀，我感觉到你的美了。你的美如一个可爱的妇人，当她把灯灭了的时候。\ni feel thy beauty, dark night, like that of the loved woman when\nshe has put out the lamp.\n１２１\n我把在那些已逝去的世界上的繁荣带到我的世界上来。\ni carry in my world that flourishes the worlds that have failed.\n１２２\n亲爱的朋友呀，当我静听着海涛时，我好几次在暮色深沉的黄昏里，在这个海岸上，感到你的伟大思想的沉默了。"},{"title":"第 21 节","text":"dear friend, i feel the silence of your great thoughts of many a\ndeepening eventide on this beach when i listen to these waves.\n１２３\n鸟以为把鱼举在空中是一种慈善的举动。\nthe bird thinks it is an act of kindness to give the fish a life\nin the air.\n１２４\n夜对太阳说道：“在月亮中，你送了你的情书给我。”\n“我已在绿草上留下了我的流着泪点的回答了。”　　　　　　　　　　　in the moon thou sendest thy love letters to me,i leave my answers in tears upon the grass.\n１２５\n伟人是一个天生的孩子，当他死时，他把他的伟大的孩提时代给了世界。\nthe great is a born child; when he dies he gives his great childhood\nto the world.\n１２６\n不是槌的打击，乃是水的载歌载舞，使鹅卵石臻于完美。\nnot hammer-strokes, but dance of the water sings the pebbles\ninto perfection.\n１２７\n蜜蜂从花中啜蜜，离开时营营地道谢。\n浮华的蝴蝶却相信花是应该向它道谢的。\nbees sip honey from flowers and hum their thanks when they leave.\nthe gaudy butterfly is sure that the flowers owe thanks to him.\n１２８\n如果你不等待着要说出完全的真理，那末把真话说出来是很容易的。\nto be outspoken is easy when you do not wait to speak the complete truth."},{"title":"第 22 节","text":"１２９\n“可能”问“不可能”道：\n“你住在什么地方呢？”\n它回答道：“在那无能为力者的梦境里。”\nasks the possible to the impossible,\nwhere is your dwelling-place?\nin the dreams of the impotent, comes the answer.\n１３０\n如果你把所有的错误都关在门外时，真理也要被关在门外面了。\nif you shut your door to all errors truth will be shut out.\n１３１\n我听见有些东西在我心的忧闷后面萧萧作响，－－我不能看见它们。\ni hear some rustle of things behind my sadness of heart,\n---i cannot see them.\n１３２\n闲暇在动作时便是工作。\n静止的海水荡动时便成波涛。\nleisure in its activity is work.\nthe stillness of the sea stirs in waves.\n１３３\n绿叶恋爱时便成了花。\n花崇拜时便成了果实。\nthe leaf becomes flower when it loves.\nthe flower becomes fruit when it worships.\n１３４"},{"title":"第 23 节","text":"埋在地下的树根使树枝产生果实，却不要什么报酬。\nthe roots below the earth claim no rewards for making the branches\nfruitful.\n１３５\n阴雨的黄昏，风无休止地吹着。\n我看着摇曳的树枝，想念万物的伟大。\nthis rainy evening the wind is restless.\ni look at the swaying branches and ponder over the greatness of\nall things.\n１３６\n子夜的风雨，如一个巨大的孩子，在不合时宜的黑夜里醒来，开始游喜和喧闹。\nstorm of midnight, like a giant child awakened in the untimely dark,\nhas begun to play and shout.\n１３７\n海呀，你这暴风雨的孤寂的新妇呀，你虽掀起波浪追随你的情人，但是无用呀。\nthou raisest thy waves vainly to follow thy lover, o sea, thou\nlonely bride of the storm.\n１３８\n文字对工作说道：“我惭愧我的空虚。”\n工作对文字说道：“当我看见你的时，我便知道我是怎样地贫乏了。”\ni am ashamed of my emptiness, said the word to the work.\ni know how poor i am when i see you, said the work to the word.\n１３９\n时间是变化的财富。时钟模仿它，却只有变化而无财富。\ntime is the wealth of change, but the clock in its parody makes"},{"title":"第 24 节","text":"it mere change and no wealth.\n１４０\n真理穿了衣裳，觉得事实太拘束了。\n在想象中，她却转动得很舒畅。\ntruth in her dress finds facts too tight.\nin fiction she moves with ease.\n１４１\n当我到这里那里旅行着时，路呀，我厌倦你了；当是现在，当你引导我到各处去时我便爱上你，与你结婚了。\nwhen i travelled to here and to there, i was tired of thee, o road,\nbut now when thou leadest me to everywhere i am wedded to thee in love.\n１４２\n让我设想，在群星之中，有一颗星是指导着我的生命通过不可知的黑暗的。\nlet me think that there is one among those stars that guides my life\nthrough the dark unknown.\n１４３\n妇人，你用了你美丽的手指，触着我的什物，秩序便如音乐似的生出来了。\nwoman, with the grace of your fingers you touched my things and order\ncame out like music.\n１４４\n一个忧郁的声音，筑巢于逝水似的年华中。\n它在夜里向我唱道：“我爱你。”\none sad voice has its nest among the ruins of the years.\nit sings to me in the night, ---i loved you.\n１４５\n燃着的火，以它熊熊的光焰警告我不要走近它。"},{"title":"第 25 节","text":"把我从潜藏在灰中的余烬里救出来吧。\nthe flaming fire warns me off by its own glow.\nsave me from the dying embers hidden under ashes.\n１４６\n我有群星在天上，\n但是，唉，我屋里的小灯却没有点亮。\ni have my stars in the sky.\nbut oh for my little lamp unlit in my house.\n１４７\n死文字的尘土沾着你。\n用沉默去洗净你的灵魂吧。\nthe dust of the dead words clings to thee.\nwash thy soul with silence.\n１４８\n生命里留了许多罅隙，从中送来了死之忧郁的音乐。\ngaps are left in life through which comes the sad music of death.\n１４９\n世界已在早晨敞开了它的光明之心。\n出来吧，我的心，带着你的爱去与它相会。\nthe world has opened its heart of light in the morning.\ncome out, my heart, with thy love to meet it.\n１５０\n我的思想随着这些闪耀的绿叶而闪耀；我的心灵因了这日光的抚触而歌唱；我的生命因为偕了万物一同浮泛在空间的蔚蓝，时间的墨黑而感到欢快*\nmy thoughts shimmer with these shimmering leaves and my heart sings\nwith the touch of this sunlight; my life is glad to be floating with"},{"title":"第 26 节","text":"all things into the blue of space, into the dark of time.\n１５１\n神的巨大的威权是在柔和的微（风思）里，而不在狂风暴雨之中。\ngod's great power is in the gentle breeze, not in the storm.\n１５２\n在梦中，一切事都散漫着，都压着我，但这不过是一个梦呀。但我醒来时，我便将觉得这些事都已聚集在你那里，我也便将自由了。\nthis is a dream in which things are all loose and they oppress.\ni shall find them gathered in thee when i awake and shall be free.\n１５３\n落日问道：“有谁继续我的职务呢？”\n瓦灯说道：“我要尽我所能地做去，我的主人。”\nwho is there to take up my duties? asked the setting sun.\ni shall do what i can, my master, said the earthen lamp.\n１５４\n采着花瓣时，得不到花的美丽。\nby plucking her petals you do not gather the beauty of the flower.\n１５５\n沉默蕴蓄着语声，正如鸟巢拥围着睡鸟。\nsilence will carry your voice like the nest that holds the sleeping birds.\n１５６\n大的不怕与小的同游。\n居中的却远而避之。\nthe great walks with the small without fear.\nthe middling keeps aloof.\n１５７"},{"title":"第 27 节","text":"夜秘密地把花开放了，却让白日去领受谢词。\nthe night opens the flowers in secret and allows the day to get thanks.\n１５８\n权势认为牺牲者的痛苦是忘恩负义。\npower takes as ingratitude the writhings of its victims.\n１５９\n当我们以我们的充实为乐时，那末，我们便能很快乐地跟我们的果实分手了。\nwhen we rejoice in our fulness, then we can part with our fruits with joy.\n１６０\n雨点吻着大地，微语道：“我们是你的思家的孩子，母亲，现在从天上回到你这里来了。”\nthe raindrops kissed the earth and whispered, --- we are thy homesick\nchildren, mother, come back to thee from the heaven.\n１６１\n蛛网好象要捉露点，却捉住了苍蝇。\nthe cobweb pretends to catch dewdrops and catches flies.\n１６２\n爱情呀，当你手里拿着点亮了的痛苦之灯走来时，我能够看见你的脸，而且以你为幸福。\nlove! when you come with the burning lamp of pain in your hand,\ni can see your face and know you as bliss.\n１６３\n萤火对天上的星说道：“学者说你的光明总有一天会消灭的。”\n天上的星不回答它。\nthe leaned say that your lights will one day be no more, said the\nfirefly to the stars.\nthe stars made no answer."},{"title":"第 28 节","text":"１６４\n在黄昏的微光里，有那清晨的鸟儿来到了我的沉默的鸟巢里。\nin the dusk of the evening the bird of some early dawn comes to\nthe nest of my silence.\n１６５\n思想掠过我的心上，如一群野鸭飞过天空。\n我听见它们鼓翼之声了。\nthoughts pass in my mind like flocks of lucks in the sky.\ni hear the voice of their wings.\n１６６\n沟洫总喜欢想：河流的存在，是专为它供给水流的。\nthe canal loves to think that rivers exist solely to supply it with water.\n１６７\n世界以它的痛苦同我接吻，而要求歌声做报酬。\nthe world has kissed my soul with its pain, asking for its return\nin songs.\n１６８\n压迫着我的，到底是我的想要外出的灵魂呢，还是那世界的灵魂，敲着我心的门，想要进来呢？\nthat which oppresses me, is it my soul trying to come out in the open,\nor the soul of the world knocking at my heart for its entrance?\n１６９\n思想以他自己的语言喂养它自己而成长起来了。\nthought feeds itself with its own words and grows.\n１７０\n我把我心之碗轻轻浸入这沉默之时刻中，它盛满了爱了。"},{"title":"第 29 节","text":"i have dipped the vessel of my heart into this silent hour; it has\nfilled with love.\n１７１\n或者你在工作，或者你没有。\n当你不得不说：“让我们做些事吧”时，那末就要开始胡闹了。\neither you have work or you have not.\nwhen you have to say, \"let us do something\", then begins mischief.\n１７２\n向日葵羞于把无名的花朵看作它的同胞。\n太阳升上来了，向它微笑，说道：“你好么，我的宝贝儿？”\nthe sunflower blushed to own the nameless flower as her kin.\nthe sun rose and smiled on it, saying, \"are you well, my darling?\"\n１７３\n“谁如命运似的催着我向前走呢？”\n“那是我自己，在身背后大跨步走着。”who drives me forward like fate?the myself striding on my back.\n１７４\n云把水倒在河的水杯里，它们自己却藏在远山之中。\nthe clouds fill the watercups of the river, hiding themselves in\nthe distant hills.\n１７５\n我一路走去，从我的水瓶中漏出水来。\n只剩下极少极少的水供我回家使用了。\ni spill water from my water jar as i walk on my way,\nvery little remains for my home.\n１７６"},{"title":"第 30 节","text":"杯中的水是光辉的；海中的水却是黑色的。\n小理可以用文字来说清楚，大理却只有沉末。\nthe water in a vessel is sparkling; the water in the sea is dark.\nthe small truth has words that are clear; the great truth has great\nsilence.\n１７７\n你的微笑是你自己田园里的花，你的谈吐是你自己山上的松林的萧萧；但是你的心呀，却是那个女人，那个我们全都认识的女人。\nyour smile was the flowers of your own fields, your talk was the rustle\nof your own mountain pines, but your heart was the woman that we all know.\n１７８\n我把小小的礼物留给我所爱的人，－－大的礼物却留给一切的人。心的门，想要进来呢？\nit is the little things that i leave behind for my loved ones,\n---great things are for everyone.\n１７９\n妇人呀，你用泪海包绕着世界的心，正如大海包绕着大地。\nwoman, thou hast encircled the world s heart with the depth of thy\ntears as the sea has the earth.\n１８０\n太阳以微笑向我问候。\n雨，他的忧闷的姐姐，向我的心谈话。\nthe sunshine greets me with a smile.\nthe rain, his sad sister, talks to my heart.\n１８１\n我的昼间之花，落下它那被遗忘的花瓣。\n在黄昏中，这花成熟为一颗记忆的金果。"},{"title":"第 31 节","text":"my flower of the day dropped its petals forgotten.\nin the evening it ripens into a golden fruit of memory.\n１８２\n我象那夜间之路，正静悄悄地谛听着记忆的足音。\ni am like the road in the night listening to the footfalls of its\nmemories in silence.\n１８３\n黄昏的天空，在我看来，象一扇窗户，一盏灯火，灯火背后的一次等待。\nthe evening sky to me is like a window, and a lighted lamp,\nand a waiting behind it.\n１８４\n太急于做好事的人，反而找不到时间去做好人。\nhe who is too busy doing good finds no time to be good.\n１８５\n我是秋云，空空地不载着雨水，但在成熟的稻田中，可以看见我的充实。\ni am the autumn cloud, empty of rain, see my fulness in the field\nof ripened rice.\n１８６\n他们嫉妒，他们残杀，人反而称赞他们。\n然而上帝却害了羞，匆匆地把他的记忆埋藏在绿草下面。\nthey hated and killed and men praised them.\nbut god in shame hastens to hide its memory under the green grass.\n１８７\n脚趾乃是舍弃了其过去的手指。\ntoes are the fingers that have forsaken their past."},{"title":"第 32 节","text":"１８８\n黑暗向光明旅行，但是盲者却向死亡旅行。\ndarkness travels towards light, but blindness towards death.\n１８９\n小狗疑心大宇宙阴谋篡夺它的位置。\nthe pet dog suspects the universe for scheming to take its place.\n１９０\n静静地坐着吧，我的心，不要扬起你的尘土。\n让世界自己寻路向你走来。\nsit still, my heart, do not raise your dust.\nlet the world find its way to you.\n１９１\n弓在箭要射出之前，低声对箭说道：“你的自由就是我的自由。”\nthe bow whispers to the arrow before it speeds forth--your freedom is mine.\n１９２\n妇人，在你的笑声里有着生命之泉的音乐。\nwoman, in your laughter you have the music of the fountain of life.\n１９３\n全是理智的心，恰如一柄全是锋刃的刀。\n它叫使用它的人手上流血。\na mind all logic is like a knife all blade.\nit makes the hand bleed that uses it.\n１９４\n神爱人间的灯光甚于他自己的大星。\ngod loves man's lamp lights better than his own great stars."},{"title":"第 33 节","text":"１９５\n这世界乃是为美之音乐所驯服了的狂风骤雨的世界。\nthis world is the world of wild storms kept tame with the music of beauty.\n１９６\n晚霞向太阳说道：“我的心经了你的接吻，便似金的宝箱了。”my heart is like the golden casket of thy kiss,\ncloud to the sun.\n１９７\n接触着，你许会杀害；远离着，你许会占有。\nby touching you may kill, by keeping away you may possess.\n１９８\n蟋蟀的唧唧，夜雨的淅沥，从黑暗中传到我的耳边，好似我已逝的\n少年时代沙地来到我的梦境中。\nthe cricket's chirp and the patter of rain come to me through the dark,\nlike the rustle of dreams from my past youth.\n１９９\n花朵向星辰落尽了的曙天叫道：“我的露点全失落了。”i have lost my dewdrop,\nlost all its stars.\n２００\n燃烧着的木块，熊熊地生出火光，叫道：“这是我的花朵，我的死亡。”\n让世界自己寻路向你走来。the burning log bursts in flame and cries, --- \"this is my flower, my death.\"\n２０１\n黄蜂认为邻蜂储蜜之巢太小。\n他的邻人要他去建筑一个更小的。\nthe wasp thinks that the honeyhive of the neighbouring bees is too small.\nhis neighbours ask him to build one still smaller."},{"title":"第 34 节","text":"２０２\n河岸向河流说道：“我不能留住你的波浪。\n让我保存你的足印在我的心里吧。”i cannot keep your waves,let me keep your footprints in my heart.\n２０３\n白日以这小小的地球的喧扰，淹没了整个宇宙的沉默。\nthe day, with the noise of this little earth, drowns the silence of\nall worlds.\n２０４\n歌声在天空中感到无限，图画在地上感到无限，诗呢，无论在空中，在地上都是如此。\n因为诗的词句含有能走动的意义与能飞翔的音乐。\nthe song feels the infinite in the air, the picture in the earth,\nthe poem in the air and the earth;\nfor its words have meaning that walks and music that soars.\n２０５\n太阳在西方落下时，他的早晨的东方已静悄悄地站在他面前。\nwhen the sun goes down to the west, the east of his morning stands\nbefore him in silence.\n２０６\n让我不要错误地把自己放在我的世界里而使它反对我。\nlet me not put myself wrongly to my world and set it against me.\n２０７\n荣誉使我感到惭愧，因为我暗地里求着它。\npraise shames me, for i secretly beg for it.\n２０８\n当我没有什么事做时，便让我不做什么事，不受骚扰地沉入安静深处吧，一如海水沉默时海边的暮色。"},{"title":"第 35 节","text":"let my doing nothing when i have nothing to do become untroubled in its\ndepth of peace like the evening in the seashore when the water is silent.\n２０９\n少女呀，你的纯朴，如湖水之碧，表现出你的真理之深邃。\nmaiden, your simplicity, like the blueness of the lake, reveals your\ndepth of truth.\n２１０\n最好的东西不是独来的，\n它伴了所有的东西同来。\nthe best does not come alone.\nit comes with the company of the all.\n２１１\n神的右手是慈爱的，但是他的左手却可怕。\ngod's right hand is gentle, but terrible is his left hand.\n２１２\n我的晚色从陌生的树木中走来，它用我的晓星所不懂得的语言说话。\nmy evening came among the alien trees and spoke in a languagewhich my morning stars did not know.\n２１３\n夜之黑暗是一只口袋，迸出黎明的金光。\nnight's darkness is a bag that bursts with the gold of the dawn.\n２１４\n我们的欲望把彩虹的颜色借给那只不过是云雾的人生。\nour desire lends the colours of the rainbow to the mere mistsand vapours of life.\n２１５\n神等待着，要从人的手上把他自己的花朵作为礼物赢得回去。"},{"title":"第 36 节","text":"god waits to win back his own flowers as gifts from man's hands.\n２１６\n我的忧思缠绕着我，要问我它自己的名字。\nmy sad thoughts tease me asking me their own names.\n２１７\n果的事业是尊贵的，花的事业是甜美的；但是让我做叶的事业吧，叶是谦逊地，专心地垂着绿荫的。\nthe service of the fruit is precious, the service of the flower issweet, but let my service be the service of the leaves in its shade ofhumble devotion.\n２１８\n我的心向着阑珊的风张了帆，要到无论何处的荫凉之岛去。\nmy heart has spread its sails to the idle winds for the shadowyisland of anywhere.\n２１９\n独夫们是凶暴的，但人民是善良的。\nmen are cruel, but man is kind.\n２２０\n把我当做你的杯吧，让我为了你，而且为了你的人而盛满水吧。\nmake me thy cup and let my fulness be for thee and for thine.\n２２１\n狂风暴雨象是在痛苦中的某个天神的哭声，因为他的爱情被大地所拒绝。\nthe storm is like the cry of some god in pain whose love the earth refuses.\n２２２\n世界不会流失，因为死亡并不是一个罅隙。\nthe world does not leak because death is not a crack.\n２２３\n生命因为付出了的爱情而更为富足。\nlife has become richer by the love that has been lost."},{"title":"第 37 节","text":"２２４\n我的朋友，你伟大的心闪射出东方朝阳的光芒，正如黎明中的一个积雪的孤峰。\nmy friend, your great heart shone with the sunrise of the east likethe snowy summit of a lonely hill in the dawn.\n２２５\n死之流泉，使生的止水跳跃。\nthe fountain of death makes the still water of life play.\n２２６\n那些有一切东西而没有您的人，我的上帝，在讥笑着那些没有别的东西而只有您的人呢。\nthose who have everything but thee, my god, laugh at those who have\nnothing but thyself.\n２２７\n生命的运动在它自己的音乐里得到它的休息。\nthe movement of life has its rest in its own music.\n２２８\n踢足只能从地上扬起尘土而不能得到收获。\nkicks only raise dust and not crops from the earth.\n２２９\n我们的名字，便是夜里海波上发出的光，痕迹也不留就抿灭了。\nour names are the light that glows on the sea waves at night and\nthen dies without leaving its signature.\n２３０\n让睁眼看着玫瑰花的人也看看它的刺。\nlet him only see the thorns who has eyes to see the rose.\n２３１\n鸟翼上系上了黄金，这鸟便永不能再在天上翱翔了。"},{"title":"第 38 节","text":"set the bird's wings with gold and it will never again soar in the sky.\n２３２\n我们地方的荷花又在这陌生的水上开了花，放出同样的清香，只是名字换了。\nthe same lotus of our clime blooms here in the alien water with\nthe same sweetness, under another name.\n２３３\n在心的远景里，那相隔的距离显得更广阔了。\nin heart's perspective the distance looms large.\n２３４\n月儿把她的光明遍照在天上，却留着她的黑斑给她自己。\nthe moon has her light all over the sky, her dark spots to herself.\n２３５\n不要说：“这是早晨”，别用一个“昨天”的名词把它打发掉。你第一次看到它，把它当作还没有名字的新生孩子吧。\ndo not say, \"it is morning,\" and dismiss it with a mane of yesterday.\nsee it for the first time as a new-born child that has no name.\n２３６\n青烟对天空夸口，灰烬对大地夸口，都以为它们是火的兄弟。\nsmoke boasts to the sky, and ashes to the earth, that they are\nbrothers to the fire.\n２３７\n雨点向茉莉花微语道：“把我永久地留在你的心里吧。”\n茉莉花叹息了一声，落在地上了。\nthe raindrop whispered to the jasmine, \"keep me in your heart for ever.\"\nthe jasmine sighed, \"alas,\" and dropped to the ground.\n２３８"},{"title":"第 39 节","text":"腆怯的思想呀，不要怕我。\n我是一个诗人。\ntimid thoughts, do not be afraid of me.\ni am a poet.\n２３９\n我的心在朦胧的沉默里，似乎充满了蟋蟀的鸣声－－声音的灰暗的\n暮色。\nthe dim silence of my mind seems filled with crickets' chirp ---\nthe grey twilight of sound.\n２４０\n爆竹呀，你对群星的侮蔑，又跟着你自己回到地上来了。\nrockets, your insult to the stars follows yourself back to the earth.\n２４１\n您曾经带领着我，穿过我的白天的拥挤不堪的旅程，而到达了我的黄昏的孤寂之境。\n在通宵的寂静里，我等待着它的意义。\nthou hast led me through my crowded travels of the day to my evening's\nloneliness.\ni wait for its meaning through the stillness of the night.\n２４２\n我们的生命就似渡过一个大海，我们都相聚在这个狭小的舟中。\n死时，我们便到了岸，各往各的世界去了。\nthis life is the crossing of a sea, where we meet in the same\nnarrow ship.\nin death we reach the shore and go to our different worlds.\n２４３"},{"title":"第 40 节","text":"真理之川从它的错误之沟渠中流过。\nthe stream of truth flows through its channels of mistakes.\n２４４\n今天我的心是在想家了，在想着那跨过时间之海的那一个甜蜜的时候。\nmy heart is homesick today for the one sweet hour across the sea of time.\n２４５\n鸟的歌声是曙光从大地反响过去的回声。\nthe bird-song is the echo of the morning light back from the earth.\n２４６\n晨光问毛茛道：“你是骄傲得不肯和我接吻么？”are you too proud to kiss me?\n２４７\n小花问道：“我要怎样地对你唱，怎样地崇拜你呢？太阳呀？”\n太阳答道：“只要用你的纯洁的素朴的沉默。”how may i sing to thee and worship, o sun?by the simple silence of thy purity,\n２４８\n当人是兽时，他比兽还坏。\nman is worse than an animal when he is an animal.\n２４９\n黑云受光的接吻时便变成天上的花朵。\ndark clouds become heaven's flowers when kissed by light.\n２５０\n不要让刀锋讥笑它柄子的拙钝。\nlet not the sword-blade mock its handle for being blunt.\n２５１\n夜的沉默，如一个深深的灯盏，银河便是它燃着的灯光。\nthe night's silence, like a deep lamp, is burning with the light of"},{"title":"第 41 节","text":"its milky way.\n２５２\n死象大海的无限的歌声，日夜冲击着生命的光明岛的四周。\naround the sunny island of life swells day and night death's\nlimitless song of the sea.\n２５３\n花瓣似的山峰在饮着日光，这山岂不象一朵花吗繝\nis not this mountain like a flower, with its petals of hill, drinking\nthe sunlight?\n２５４\n“真实”的含义被误解，轻重被倒置，那就成了“不真实”。\nthe real with its meaning read wrong and emphasis misplaced is the unreal.\n２５５\n我的心呀，从世界的流动找你的美吧，正如那小船得到风与水的优美似的。\nfind your beauty, my heart, from the world's movement, like the boat\nthat has the grace of the wind and the water.\n２５６\n眼不能以视来骄人，却以它们的眼镜来骄人。\nthe eyes are not proud of their sight but of their eyeglasses.\n２５７\n我住在我的这个小小的世界里，生怕使它再缩小一丁点儿。把我抬举到您的世界里去吧，让我高高兴兴地失去我的一切的自由。\ni live in this little world of mine and am afraid to make it the\nleast less. life me into thy world and let me have the freedom gladly\nto lose my all.\n２５８"},{"title":"第 42 节","text":"虚伪永远不能凭借它生长在权力中而变成真实。\nthe false can never grow into truth by growing in power.\n２５９\n我的心，同着它的歌的拍拍舐岸的波浪，渴望着要抚爱这个阳光熙和的绿色世界。\nmy heart, with its lapping waves of son, longs to caress this green\nworld of the sunny day.\n２６０\n道旁的草，爱那天上的星吧，你的梦境便可在花朵里实现了。\nwayside grass, love the star, then your dreams will come out in flowers.\n２６１\n让你的音乐如一柄利刃，直刺入市井喧扰的心中吧。\nlet your music, like a sword, pierce the noise of the market to its heart.\n２６２\n这树的颤动之叶，触动着我的心，象一个婴儿的手指。\nthe trembling leaves of this tree touch my heart like the fingers of\nan infant child.\n２６３\n小花睡在尘土里。\n它寻求蛱蝶走的道路。\nthe little flower lies in the dust.\nit sought the path of the butterfly.\n２６４\n我是在道路纵横的世界上。\n夜来了。打开您的门吧，家之世界呵！\ni am in the world of the roads."},{"title":"第 43 节","text":"the night comes. open thy gate, thou world of the home.\n２６５\n我已经唱过了您的白天的歌。\n在黄昏的时候，让我拿着您的灯走过风雨飘摇的道路吧。\ni have sung the songs of thy day.\nin the evening let me carry thy lamp through the stormy path.\n２６６\n我不要求你进我的屋里。\n你到我无量的孤寂里来吧，我的爱人！\ni do not ask thee into the house.\ncome into my infinite loneliness, my lover.\n２６７\n死亡隶属于生命，正与生一样。\n举足是走路，正如落足也是走路。\ndeath belongs to life as birth does.\nthe walk is in the raising of the foot as in the laying of it down.\n２６８\n我已经学会在花与阳光里微语的意义。－－再教我明白你在苦与死中所说的话吧。\ni have learnt the simple meaning of thy whispers in flowers and sunshine\n---teach me to know thy words in pain and death.\n２６９\n夜的花朵来晚了，当早晨吻着她时，她颤栗着，叹息了一声，萎落在地上了。\nthe night's flower was late when the morning kissed her, she shivered\nand sighed and dropped to the ground.\n２７０"},{"title":"第 44 节","text":"从万物的愁苦中，我听见了“永恒母亲”的呻吟。\nthrough the sadness of all things i hear the crooning of the eternal mother.\n２７１\n大地呀，我到你岸上时是一个陌生人，住在你屋内时是一个宾客，离开你的门时是一个朋友。\ni came to your shore as a stranger, i lived in your house as a guest,\ni leave your door as a friend, my earth.\n２７２\n当我去时，让我的思想到你那里来，如那夕阳的余光，映在沉默的星天的边上。\nlet my thoughts come to you, when i am gone, like the after glow of\nsunset at the margin of starry silence.\n２７３\n在我的心头燃点起那休憩的黄昏星吧，然后让黑夜向我微语着爱情。\nlight in my heart the evening star of rest and then let the night\nwhisper to me of love.\n２７４\n我是一个在黑暗中的孩子。\n我从夜的被单里向您伸出我的双手，母亲。\ni am a child in the dark.\ni stretch my hands through the coverlet of night for thee, mother.\n２７５\n白天的工作完了。把我的脸掩藏在您的臂间吧，母亲。\n让我入梦吧。\nthe day of work is done. hide my face in your arms, mother.\nlet me dream.\n２７６"},{"title":"第 45 节","text":"集会时的灯光，点了很久，会散时，灯便立刻灭了。\nthe lamp of meeting burns long; it goes out in a moment at the parting.\n２７７\n当我死时，世界呀，请在你的沉默中，替我留着“我已经爱过了”这句话吧。\none word keep for me in thy silence, o world, when i am dead,i have loved.\n２７８\n我们在热爱世界时便生活在这世界上。\nwe live in this world when we love it.\n２７９\n让死者有那不朽的名，但让生者有那不朽的爱。\nlet the dead have the immortality of fame, but the living the\nimmortality of love.\n２８０\n我看见你，象那半醒的婴孩在黎明的微光里看见他的母亲，于是微笑而又睡去了。\ni have seen thee as the half-awakened child sees his mother in the\ndusk of the dawn and then smiles and sleeps again.\n２８１\n我将死了又死，以明白生是无穷无尽的。\ni shall die again and again to know that life is inexhaustible.\n２８２\n当我和拥挤的人群一同在路上走过时，我看见您从阳台上送过来的微笑，我歌唱着，忘却了所有的喧哗。\nwhile i was passing with the crowd in the road i saw thy smile from\nthe balcony and i sang and forgot all noise.\n２８３\n爱就是充实了的生命，正如盛满了酒的酒杯。"},{"title":"第 46 节","text":"love is life in its fulness like the cup with its wine.\n２８４\n他们点了他们自己的灯，在他们的寺院内，吟唱他们自己的话语。\n但是小鸟们却在你的晨光中，唱着你的名字，－－因为你的名字便是快乐。\nthey light their own lamps and sing their own words in their temples.\nbut the birds sing thy name in thine own morning light, --- for thy\nname is joy.\n２８５\n领我到您的沉寂的中心，使我的心充满了歌吧。\nlead me in the centre of thy silence to fill my heart with songs.\n２８６\n让那些选择了他们自己的焰火咝咝的世界的，就生活在那里吧。\n我的心渴望着您的繁星，我的上帝。\nlet them live who choose in their own hissing world of fireworks.\nmy heart long s for thy stars, my god.\n２８７\n爱的痛苦环绕着我的一生，象汹涌的大海似地唱；而爱的快乐却象鸟儿们在话林里似地唱着。\nlove's pain sang round my life like the unplumbed sea, and love's joy\nsang like birds in its flowering groves.\n２８８\n假如您愿意，您就熄了灯吧。\n我将明白您的黑暗，而且将喜爱它。\nput out the lamp when thou wishest.\ni shall know thy darkness and shall love it.\n２８９"},{"title":"第 47 节","text":"当我在那日子的终了，站在您的面前时，您将看见我的伤疤，而知道我有我的许多创伤，但也有我的医治的法儿。\nwhen i stand before thee at the day s end thou shalt see my scars\nand know that i had my wounds and also my healing.\n２９０\n总有一天，我要在别的世界的晨光里对你唱道：“我以前在地球的光里，在人的爱里，已经见过你了。”\nsome day i shall sing to thee in the sunrise of some other world,i have seen thee before in the light of the earth, in the love of man.\n２９１\n从别的日子里飘浮道我的生命里的云，不再落下雨点或引起风暴了，却只给予我的夕阳的天空以色彩。\nclouds come floating into my life from other days no longer to shed\nrain or usher storm but to give colour to my sunset sky.\n２９２\n真理引起了反对它自己的狂风骤雨，那场风雨吹散了真理的广播的种子。\ntruth raises against itself the storm that scatters its seeds broadcast.\n２９３\n昨夜的风雨给今日的早晨戴上了金色的和平。\nthe storm of the last night has crowned this morning with golden peace.\n２９４\n真理仿佛带了它的结论而来；而那结论却产生了它的第二个。\ntruth seems to come with its final word; and the final word gives\nbirth to its next.\n２９５\n他是有福的，因为他的名望并没有比他的真实更光亮。\nblessed is he whose fame does not outshine his truth.\n２９６\n您的名字的甜蜜充溢着我的心，而我忘掉了我自己的，－－就象您的早晨的太阳升起时，那大雾便消失了。"},{"title":"第 48 节","text":"sweetness of thy name fills my heart when i forget mine---like\nthy morning sun when the mist is melted.\n２９７\n静悄悄的黑夜具有母亲的美丽，而吵闹的白天具有孩子的美丽。\nthe silent night has the beauty of the mother and the clamorous day\nof the child.\n２９８\n但人微笑时，世界爱了他；但他大笑时世界便怕他了。\nthe world loved man when he smiled. the world became afraid of him\nwhen he laughed.\n２９９\n神等待着人在智慧中重新获得童年。\ngod waits for man to regain his childhood in wisdom.\n３００\n让我感到这个世界乃是您的爱的成形吧，那末，我的爱也将帮助着它。\nlet me feel this world as thy love taking form, then my ove will help it.\n３０１\n您的阳光对着我的心头的冬天微笑，从来不怀疑它的春天的花朵。\nthy sunshine smiles upon the winter days of my heart, never doubting\nof its spring flowers.\n３０２\n神在他的爱里吻着“有涯”，而人却吻着“无涯”。\ngod kisses the finite in his love and man the infinite.\n３０３\n您越过不毛之年的沙漠而到达了圆满的时刻。"},{"title":"第 49 节","text":"thou crossest desert lands of barren years to reach the moment of fulfilment.\n３０４\n神的静默使人的思想成熟而为语言。\ngod's silence ripens man's thoughts into speech.\n３０５\n“永恒的旅客”呀，你可以在我的歌众找到你的足迹。\nthou wilt find, eternal traveller, marks of thy footsteps across my songs.\n３０６\n让我不至羞辱您吧，父亲，您在您的孩子们身上显出您的光荣。\nlet me not shame thee, father, who displayest thy glory in thy children.\n３０７\n这一天是不快活的。光在蹙额的云下，如一个被责打的儿童，灰白的脸上留着泪痕；风又号叫着，似一个受伤的世界的哭声。但是我知道，我正跋涉着去会我的朋友。\ncheerless is the day, the light under frowning clouds is like a\npunished child with traces of tears on its pale cheeks, and the cry of\nthe wind is like the cry of a wounded world. but i know i am travelling\nto meet my friend.\n３０８\n今天晚上棕榈叶在嚓嚓地作响，海上有大浪，满月呵，就象世界在心脉悸跳。从什么不可知的天空，您在您的沉默里带来了爱的痛苦的秘密？\ntonight there is a stir among the palm leaves, a swell in the sea,\nfull moon, like the heart throb of the world. from what unknown sky hast\nthou carried in thy silence the aching secret of love?\n３０９\n我梦见一颗星，一个光明岛屿，我将在那里出生。在它快速的闲暇深处，我的生命将成熟它的事业，象阳光下的稻田。\ni dream of a star, an island of light, where i shall be born and in\nthe depth of its quickening leisure my life will ripen its works like"},{"title":"第 50 节","text":"the rice-field in the autumn sun.\n３１０\n雨中的湿土的气息，就响从渺小的无声的群众那里来的一阵巨大的赞美歌声。\nthe smell of the wet earth in the rain rises like a great chant of\npraise from the voiceless multitude of the insignificant.\n３１１\n说爱情会失去的那句话，乃是我们不能够当作真理来接受的一个事实。\nthat love can ever lose is a fact that we cannot accept as truth.\n３１２\n我们将有一天会明白，死永远不能够夺去我们的灵魂所获得的东西。因为她所获得的，和她自己是一体。\nwe shall know some day that death can never rob us of that which our\nsoul has gained, for her gains are one with herself.\n３１３\n神在我的黄昏的微光中，带着花到我这里来。这些花都是我过去的，在他的花篮中还保存得很新鲜。\ngod comes to me in the dusk of my evening with the flowers from my\npast kept fresh in his basket.\n３１４\n主呀，当我的生之琴弦都已调得谐和时，你的手的一弹一奏，都可以发出爱的乐声来。\nwhen all the strings of my life will be tuned, my master, then at\nevery touch of thine will come out the music of love.\n３１５\n让我真真实实地活着吧，我的上帝。这样，死对于我也就成了真实的了。\nlet me live truly, my lord, so that death to me become true.\n３１６\n人类的历史在很忍耐地等待着被侮辱者的胜利。"},{"title":"第 51 节","text":"man's history is waiting in patience for the triumph of the insulted man.\n３１７\n我这一刻感到你的眼光正落在我的心上，象那早晨阳光中的沉默落在已收获的孤寂的田野上一样。\ni feel thy gaze upon my heart this moment like the sunny silence of\nthe morning upon the lonely field whose harvest is over.\n３１８\n在这喧哗的波涛起伏的海中，我渴望着咏歌之鸟。\ni long for the island of songs across this heaving sea of shouts.\n３１９\n夜的序曲是开始于夕阳西下的音乐，开始于它对难以形容的黑暗所作的庄严的赞歌。\nthe prelude of the night is commenced in the music of the sunset,\nin its solemn hymn to the ineffable dark.\n３２０\n我攀登上高峰，发现在名誉的荒芜不毛的高处，简直找不到一个遮身之地。我的引导者呵，领导着我在光明逝去之前，进到沉静的山谷里去吧。在那里，一生的收获将会成熟为黄金的智慧。\ni have scaled the peak and found no shelter in fame's bleak and barren\nheight. lead me, my guide, before the light fades, into the valley of\nquiet where life's harvest mellows into golden wisdom.\n３２１\n在这个黄昏的朦胧里，好些东西看来都仿佛是幻象一般－－尖塔的底层在黑暗里消失了，树顶象是墨水的模糊的斑点似的。我将等待着黎明，而当我醒来的时候，就会看到在光明里的您的城市。\nthings look phantastic in this dimness of the dusk---the spires whose\nbases are lost in the dark and tree tops like blots of ink. i shall wait\nfor the morning and wake up to see thy city in the light.\n３２２\n我曾经受苦过，曾经失望过，曾经体会过“死亡”，于是我以我在这伟大的世界里为乐。\ni have suffered and despaired and known death and i am glad that"},{"title":"第 52 节","text":"i am in this great world.\n３２３\n在我的一生里，也有贫乏和沉默的地域；它们是我忙碌的日子得到日光与空气的几片空旷之地。\nthere are tracts in my life that are bare and silent. they are the\nopen spaces where my busy days had their light and air.\n３２４\n我的未完成的过去，从后边缠绕到我身上，使我难于死去。请从它那里释放了我吧。\nrelease me from my unfulfilled past clinging to me from behind making\ndeath difficult.\n３２５\n“我相信你的爱。”让这句话做我的最后的话。\nlet this be my last word, that i trust thy love."}]}];

function dbPut(b){ return new Promise(function(res){ db().then(function(d){ if(!d)return res(false); try{ var tx=d.transaction('books','readwrite'); tx.objectStore('books').put(b); tx.oncomplete=function(){res(true)}; tx.onerror=function(){res(false)} }catch(e){res(false)} }) }) }
function cover(b){ var ch=(b.title||'书').slice(0,1); return '<div class="cov" style="background:'+(b.coverCss||'linear-gradient(160deg,#8e9aaf,#4a5568)')+'">'+esc(ch)+'</div>' }

/* ---- 读书 ---- */
function openBook(id){
  cur=BOOKS.filter(function(b){ return b.id===id })[0]; if(!cur)return;
  var p=S.progress[id]||{};

  var h='', pi;
  (cur.chapters||[]).forEach(function(ch,ci){ h+='<h2>'+esc(ch.title||('第'+(ci+1)+'章'))+'</h2>'; pi=0;
    String(ch.text||'').split(/\n+/).forEach(function(t){ t=t.trim(); if(!t)return;
      var key=cur.id+':'+ci+'-'+pi, cls=(t.length<28?'poem':'')+((S.said[key]!=null||noteOf(cur.id,ci+'-'+pi))?' hasnote':'');
      h+='<p'+(cls?' class="'+cls+'"':'')+' data-p="'+ci+'-'+pi+'">'+esc(t)+'</p>'; pi++;

  fl.style.columnWidth=w+'px'; fl.style.height=h+'px';

function goPage(n,instant){

var HIS=['我也觉得这里写得不错。','这一段我也喜欢。','你眼光不错，这里确实好。','我读的时候也在这儿停了一下。','这里值得多读两眼。','嗯，这里我也划了。','你读得比我细。','你指的地方，我都不觉得差。','这句我记住了。','这里慢慢读，别赶。','我也正想说这个。','你就爱挑这种句子。','这段我也划了线。','你读到这里，我在。','这句适合抄下来。','别急着往下，再看一眼。','我陪你把这段读完。'];
function hash(s){ var h=0; for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return h }

function say(t){ var c=$('hisCard'); $('hisTx').textContent=t; c.classList.add('on'); clearTimeout(say._t); say._t=setTimeout(function(){ c.classList.remove('on') },6500) }

  if(!bookId)return null;
  var n={ id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),

function importTxt(file){
  if(!file)return;
  if(file.size>MAX_BYTES){ toast('这个文件 '+(file.size/1048576).toFixed(1)+' MB，超过上限。单本最多 80 万字（约 2.5MB）',4000); return }
  var fr=new FileReader();
  fr.onload=function(){
    var buf=fr.result, txt='';
    try{ txt=new TextDecoder('utf-8',{fatal:true}).decode(buf) }
    catch(e){ try{ txt=new TextDecoder('gb18030').decode(buf) }catch(e2){ txt='' } }
    txt=String(txt||'').replace(/\r\n/g,'\n').trim();
    if(!txt){ toast('这个文件读不出来（编码不支持）'); return }
    var bad=(txt.match(/\uFFFD/g)||[]).length;
    if(bad>20){ try{ txt=new TextDecoder('gb18030').decode(buf) }catch(e){} }
    if(txt.length>MAX_CHARS){ toast('这本书 '+(txt.length/10000).toFixed(1)+' 万字，超过 80 万字上限',4000); return }
    var title=(file.name||'导入的书').replace(/\.txt$/i,'');
    var b={ id:'u'+Date.now(), title:title, author:'导入', coverCss:'linear-gradient(160deg,#7d8fa6,#3f4d5e)', chapters:splitChapters(txt) };
    dbPut(b); BOOKS.push(b); renderLib(); renderHome();
    toast('导入成功：《'+title+'》'+b.chapters.length+' 章 · '+(txt.length/10000).toFixed(1)+' 万字',3500);
  };
  fr.readAsArrayBuffer(file);
}
function splitChapters(txt){
  var lines=txt.split('\n'), idx=[], re=/^\s*(第[0-9零一二三四五六七八九十百千两]+[章节回][^\n]{0,40})\s*$/;
  lines.forEach(function(l,i){ if(re.test(l))idx.push(i) });
  if(idx.length>=2){ var out=[]; for(var k=0;k<idx.length;k++){ var s=idx[k], e=(k+1<idx.length)?idx[k+1]:lines.length;
    var body=lines.slice(s+1,e).join('\n').trim(); if(body)out.push({ title:lines[s].trim(), text:body }) } if(out.length)return out }
  var out2=[], size=8000;
  for(var p=0;p<txt.length;p+=size)out2.push({ title:'第 '+(out2.length+1)+' 节', text:txt.slice(p,p+size) });
  return out2;
}
function exportRead(){
  var data={ type:'zika-reading', v:2, state:{progress:S.progress,notes:S.notes,said:S.said,settings:S.settings}, books:BOOKS.filter(function(b){ return /^u/.test(b.id) }) };
  var s=JSON.stringify(data), mb=(s.length/1048576).toFixed(1);
  if(!confirm('导出阅读数据？\n'+data.books.length+' 本导入的书 + 进度 / '+(S.notes||[]).length+' 条批注，约 '+mb+' MB'))return;
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));
  a.download='阅读数据-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href) },3000);
}
function importRead(file){
  if(!file)return; var fr=new FileReader();
  fr.onload=function(){ var d=null; try{ d=JSON.parse(fr.result) }catch(e){} if(!d||d.type!=='zika-reading'){ toast('这不是阅读数据文件'); return }
    var added=0, impNotes=[];
    if(d.state){
      if(d.state.progress)S.progress=d.state.progress;
      if(d.state.settings)S.settings=d.state.settings;
      if(d.state.said&&typeof d.state.said==='object')S.said=d.state.said;
      if(Array.isArray(d.state.notes))impNotes=d.state.notes;
      else if(d.state.notes&&typeof d.state.notes==='object'){ impNotes=[]; Object.keys(d.state.notes).forEach(function(k){ if(S.said[k]==null)S.said[k]=d.state.notes[k] }) }
      migrate();
      var have={}; (S.notes||[]).forEach(function(n){ have[n.id]=1 });
      impNotes.forEach(function(n){ if(n&&n.id&&n.bookId&&!have[n.id]){ S.notes.push(n); have[n.id]=1; added++ } });
      if(typeof segOn==='function')segOn();
      if(cur){ applyTheme(S.settings.theme); buildFlow() }
      save();
    }
    (d.books||[]).forEach(function(b){ if(b&&b.id&&b.chapters){ dbPut(b); if(!BOOKS.some(function(x){return x.id===b.id}))BOOKS.push(b) } });
    renderHome(); renderLib(); if(cur)renderNotes();
    toast('导入完成：'+((d.books||[]).length)+' 本书 + '+(S.notes||[]).length+' 条批注');
  };
  fr.readAsText(file,'utf-8');
}
/* 删书 + 批注自检用到的小函数 */
function dbDel(id){
  return new Promise(function(res){
    db().then(function(d){ if(!d)return res(false);
      try{ var tx=d.transaction('books','readwrite'); tx.objectStore('books').delete(id);
        tx.oncomplete=function(){res(true)}; tx.onerror=function(){res(false)} }catch(e){res(false)}
    })
  });
}
function delBook(id){
  var b=BOOKS.filter(function(x){return x.id===id})[0];
  if(!b)return;
  if(!confirm('删除《'+b.title+'》？\n（只删这本，进度和批注也一起清掉）'))return;
  dbDel(id);
  BOOKS=BOOKS.filter(function(x){return x.id!==id});
  try{ delete S.progress[id] }catch(e){}
  try{ S.notes=(S.notes||[]).filter(function(n){ return n.bookId!==id }) }catch(e){}
  try{ Object.keys(S.said||{}).forEach(function(k){ if(k.indexOf(id+':')===0) delete S.said[k] }) }catch(e){}
  save(); renderHome(); renderLib();
  toast('已删除《'+b.title+'》');
}
(function bindDel(){
  document.addEventListener('click',function(e){
    var d=e.target.closest?e.target.closest('[data-del]'):null;
    if(!d)return;
    e.preventDefault(); e.stopPropagation();
    delBook(d.getAttribute('data-del'));
  },true);
})();

}

/* ---- 启动 ---- */
(function(){
  load(); resetDay(); segOn();
  BOOKS=BUILTIN.slice(); renderHome(); renderLib();
  dbAll().then(function(all){ if(all&&all.length){ var ids={}; all.forEach(function(b){ids[b.id]=1});
    BUILTIN.forEach(function(b){ if(!ids[b.id]) dbPut(b) });
    var map={}; BOOKS.concat(all).forEach(function(b){ map[b.id]=b });
    BOOKS=Object.keys(map).map(function(k){return map[k]});
    renderHome(); renderLib();
  } }).catch(function(){});
})();

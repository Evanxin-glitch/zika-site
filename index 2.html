<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="字卡陪伴小站：桌面主界面、聊天、朋友圈、信箱、字卡库、日记">
<title>字卡 · 陪伴小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235F8F7B'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23FFFDF6' font-family='serif'%3E字%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F1E8; --card:#FFFEFB; --ink:#33302A; --sub:#8B8172;
  --line:#E8DFCE; --green:#5F8F7B; --orange:#D98E5F; --blue:#7A9CC6; --brown:#8A7458;
  --green-soft:#E9F0E9; --orange-soft:#F8ECE2; --danger:#D4605A;
  --radius:18px; --shadow:0 3px 14px rgba(70,58,40,.09);
  --serif:'Songti SC','STSong','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
textarea{resize:none}
input:focus,textarea:focus{border-color:var(--green)}
::placeholder{color:#BBA98C}
#app{max-width:560px;margin:0 auto;background:var(--bg);position:relative;min-height:100dvh}
@media(min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 30px rgba(70,58,40,.06)}}
#view{min-height:100dvh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}

/* 页面顶栏（子页返回） */
.page-top{display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10;background:var(--bg)}
.page-top .back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--card);border:1px solid var(--line);flex-shrink:0}
.page-top .pt{font-family:var(--serif);font-size:18px;font-weight:700;margin-left:6px}
.page-top .pr{margin-left:auto;display:flex;gap:6px}
.screen{padding:4px 14px 20px}
.view-title{font-family:var(--serif);font-size:18px;font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.view-title .count{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--sub);font-weight:400}

/* ============ 主界面（桌面） ============ */
#home{padding:calc(26px + env(safe-area-inset-top)) 18px 20px}
.home-greet{font-size:14px;color:var(--sub);letter-spacing:1px}
.home-title{font-family:var(--serif);font-size:26px;font-weight:700;margin:2px 0 14px}
.status-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--card),#FBF7EC);border:1px solid var(--line);border-radius:24px;padding:15px 16px;margin-bottom:20px;box-shadow:0 8px 24px rgba(70,58,40,.10);cursor:pointer}
.status-card .sc-body{flex:1;min-width:0}
.status-card .sc-name{font-family:var(--serif);font-size:17px;font-weight:700}
.status-card .sc-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#5A4632;background:#F3EDDF;border-radius:20px;padding:3px 10px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.b-soft{background:var(--green-soft);color:#3F6B58}
.app-sec-title{font-size:13px;color:var(--sub);letter-spacing:1.5px;margin-bottom:10px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.app-item{text-align:center;cursor:pointer}
.app-icon{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 7px;box-shadow:0 6px 18px rgba(70,58,40,.13);transition:transform .12s}
.app-item:active .app-icon{transform:scale(.92)}
.app-item span{font-size:13px;color:var(--ink)}
.home-foot{text-align:center;font-size:12px;color:#B3A994;margin-top:26px;line-height:1.7}

/* ============ 聊天 ============ */
.chat-top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(70,58,40,.05);position:sticky;top:0;z-index:10}
.chat-top .ct-who{flex:1;min-width:0}
.chat-top .ct-name{font-family:var(--serif);font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.chat-top .ct-chips{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.chat-top .ct-chips .chip{font-size:10.5px;padding:2px 8px}
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 96px)}
#chatList{flex:1;overflow-y:auto;padding:12px 12px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;background-size:cover;background-position:center;background-attachment:local}
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px;padding:0 10px}
.msg-row.in{justify-content:flex-start}
.msg-row.out{flex-direction:row-reverse}
.bubble-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;overflow:hidden;color:#fff;box-shadow:var(--shadow)}
.bubble-av img{width:100%;height:100%;object-fit:cover}
.bubble-av i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff}
.bubble{max-width:76%;padding:9px 12px;border-radius:17px;font-size:15px;position:relative;word-break:break-word;white-space:pre-wrap;cursor:pointer}
.bubble.out{background:var(--green);border-bottom-right-radius:5px;color:#fff}
.bubble.out .t{color:rgba(255,255,255,.72)}
.bubble.in{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble .t{display:block;font-size:10.5px;color:var(--sub);margin-top:4px;text-align:right;white-space:nowrap}
.bubble .st.gray{opacity:.5}
.bubble.out .quote-box{background:rgba(0,0,0,.16);color:#fff}
.bubble.in.typing{min-width:56px;min-height:36px;display:flex;align-items:center;justify-content:center}
.bubble .st{color:var(--green);font-weight:700;font-size:10.5px}
.bubble .st.gray{color:#BBA98C;font-weight:400}
.quote-box{font-size:12px;color:var(--sub);background:rgba(138,116,88,.1);border-left:2px solid var(--line);border-radius:6px;padding:4px 8px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bubble.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:11px 14px}
.typing-dots{display:inline-flex;gap:3px;align-items:center}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:#BBA98C;animation:blink 1.1s infinite}
.typing-dots i:nth-child(2){animation-delay:.22s}.typing-dots i:nth-child(3){animation-delay:.44s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quote-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:7px 12px 0;font-size:12px;color:var(--sub)}
.quote-bar .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-bar button{color:var(--green);font-size:13px;padding:4px 6px;min-height:30px}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.chat-input textarea{flex:1;max-height:96px;min-height:42px;background:#FBF9F2}
.chat-input button{background:var(--green);color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;flex-shrink:0;min-width:64px;min-height:44px}
.chat-input .tool-btn{background:#F4F0E6;color:var(--green);width:42px;height:42px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-width:0}
.center-msg{text-align:center;color:var(--sub);font-size:12.5px;margin:4px auto;background:rgba(138,116,88,.12);border-radius:20px;padding:3px 12px;max-width:86%;word-break:break-all}
.transfer-card{align-self:center;background:#E7F0E1;border:1px solid #CFE0C4;border-radius:12px;padding:9px 14px;font-size:13.5px;max-width:86%}
.transfer-card b{color:#2F6B3C;font-size:15px}

/* ============ 通用 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:18px;font-weight:700;object-fit:cover;background:#6E7F5E}
.avatar.sm{width:34px;height:34px;font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.meta{font-size:11.5px;color:var(--sub)}
.btn{background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:var(--card);color:var(--green);border:1px solid var(--green)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px;min-height:40px}
.btn:active{opacity:.85}

/* 朋友圈 */
.post-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.post-form textarea{min-height:64px}
.post{display:flex;flex-direction:column;gap:8px}
.post .head{display:flex;align-items:center;gap:9px}
.post .head .nm{font-weight:700;font-size:14.5px}
.post .txt{font-size:15px;white-space:pre-wrap;word-break:break-word;padding:4px 0}
.post .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);background:#F1E9D7;border-radius:20px;padding:2px 9px;align-self:flex-start}
.cmt-box{margin-top:4px;background:#F3ECDC;border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:4px}
.cmt{font-size:13.5px;line-height:1.5}
.cmt b{font-weight:600;margin-right:4px}
.cover{width:100%;height:118px;border-radius:18px;background-size:cover;background-position:center;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.cover .cov-btn{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.88);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:12px;min-height:30px}

/* 信箱 */
.letter{position:relative}
.letter.unread{border-color:var(--green)}
.letter .dot-badge{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--green)}
.letter .subject{font-family:var(--serif);font-size:16px;font-weight:700;margin:2px 0 4px}
.letter .body{font-size:14px;color:#5A4632;white-space:pre-wrap;word-break:break-word;background:#FBF6EA;border-radius:10px;padding:8px 10px;margin-top:6px}

/* 字卡 */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.cat-tabs button{flex-shrink:0;font-size:13px;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.cat-tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.card-grid{display:flex;flex-direction:column;gap:10px}
.zika{border-left:4px solid var(--green);position:relative;padding-right:34px}
.zika .txt{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.zika .chip{display:inline-block;font-size:11px;color:var(--green);background:#ECF0E4;border-radius:20px;padding:2px 9px;margin-top:6px}
.zika .del{position:absolute;right:10px;top:10px;color:#BBA98C;font-size:16px;padding:4px}
.zika .del:active{color:var(--danger)}
.lib-actions{display:flex;gap:8px;margin-bottom:12px}
.lib-actions button{flex:1}

/* 日记 */
.diary-card .d-date{font-family:var(--serif);font-size:16px;font-weight:700}
.diary-card .d-txt{font-size:14.5px;color:#4A3F33;white-space:pre-wrap;word-break:break-word;background:#FBF6EA;border-radius:10px;padding:9px 11px;margin-top:7px;line-height:1.75}

/* 我的/设置 */
.me-sec{margin-bottom:16px}
.me-sec h3{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:8px;color:#5A4632}
.contact-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.contact-item:last-child{border-bottom:none}
.contact-item .info{flex:1;min-width:0}
.contact-item .info b{display:block;font-size:15px}
.contact-item .info span{font-size:11.5px;color:var(--sub);word-break:break-all}
.contact-item .on-tag{font-size:11px;color:#fff;background:var(--green);border-radius:20px;padding:2px 8px;flex-shrink:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1;min-width:80px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:16px;font-family:var(--serif)}
.stat span{font-size:11px;color:var(--sub)}
.note{background:#FBF6EA;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#6B5A44;line-height:1.6}

/* 弹出层 */
#sheet-mask{position:fixed;inset:0;background:rgba(58,44,31,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet-mask.hide{display:none}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:12px}
.sheet label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions button{flex:1;padding:11px 0;border-radius:12px;font-size:15px;min-height:44px}
.sheet .actions .ok{background:var(--green);color:#fff}
.sheet .cancel{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.sheet .actions .cancel{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.rhy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rhy-grid .inl label{font-size:11.5px;color:var(--sub);margin-bottom:3px;display:block}
.rhy-grid input{font-size:16px;padding:8px 10px}
.unit-row{display:flex;gap:6px}
.unit-row select{flex:1;font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink)}
.sw-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:none}
.sw-row .tt{font-size:14px}
.sw-row .tt small{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
.sw{position:relative;display:inline-block;width:46px;height:27px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .track{position:absolute;inset:0;background:#D8CBB2;border-radius:14px;transition:.2s}
.sw .thumb{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+.track{background:var(--wechat,#5F8F7B)}
.sw input:checked+.track+.thumb{left:22px}
.pct-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pct-grid .inl label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.pct-grid input{font-size:15px;padding:7px 6px;text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.avatar-prev{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:22px;font-weight:700;object-fit:cover;flex-shrink:0}
.contact-pick{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;background:var(--card)}
.contact-pick.on{border-color:var(--green);background:var(--green-soft)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap}
.preset-row button{width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;border:2px solid transparent}
.preset-row button.on{border-color:var(--ink)}

/* 来电 / 转账 */
#callOverlay{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:16% 0 calc(10% + env(safe-area-inset-bottom));color:#fff;background:linear-gradient(160deg,#3E5C4A,#2A4436)}
#callOverlay.show{display:flex}
.call-avatar{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:42px;font-weight:700;overflow:hidden;object-fit:cover}
.call-name{font-size:23px;font-weight:700;margin-top:16px}
.call-state{font-size:13px;opacity:.78;margin-top:5px}
.call-timer{font-size:15px;opacity:.95;margin-top:4px;font-variant-numeric:tabular-nums}
.call-btns{display:flex;gap:60px;align-items:flex-end}
.call-btn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;opacity:.92}
.call-btn .ic{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--danger)}
.call-btn.accept .ic{background:var(--wechat,#2FBF71)}
#transferOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center}
#transferOverlay.show{display:flex}
.transfer-pop{width:292px;background:#fff;border-radius:16px;padding:22px 16px 16px;text-align:center}
.transfer-pop .ttl{font-size:14px;color:#555;margin-top:10px}
.transfer-pop .amt{font-size:38px;font-weight:700;margin:6px 0 2px;font-family:var(--serif)}
.transfer-pop .amt small{font-size:17px;font-weight:600}
.transfer-pop .btns{display:flex;gap:10px;margin-top:16px}
.transfer-pop .btns button{flex:1;padding:12px 0;border-radius:10px;font-size:15px;min-height:44px}
.tr-accept{background:#2FBF71;color:#fff}
.tr-decline{background:#F2F2F2;color:#888}

#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(58,44,31,.92);color:#FFFDF6;padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:99;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px;line-height:1.7}
.empty .big{font-family:var(--serif);font-size:30px;display:block;margin-bottom:8px;color:#C9B592}

/* ===== v5：聊天工具 + 表情 + 决策 + 查岗 ===== */
.chat-tools{display:flex;gap:6px;align-items:center;padding:6px 10px 0;background:var(--card);flex-shrink:0}
.chat-tools button{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0;background:#F4F0E6}
.chat-tools button.on{background:var(--green);color:#fff}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 2px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink);padding:6px 0;border-radius:12px}
.tool-item:active{background:#EFE8D8}
.tool-item .ti{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--green)}
.stk-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 2px}
.stk-item{font-size:27px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44px}
.stk-img{height:56px;width:56px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff}
.bubble img.msg-img{max-width:210px;max-height:270px;border-radius:12px;display:block}
.poll-card{align-self:flex-end;max-width:84%;background:var(--card);border:1px solid var(--line);border-radius:17px 5px 17px 17px;padding:10px 13px}
.poll-card .pq{font-size:14.5px;font-weight:600;margin-bottom:8px;white-space:pre-wrap}
.poll-card .po{font-size:13px;color:#3F6B58;background:var(--green-soft);border-radius:10px;padding:6px 10px;margin-bottom:6px;white-space:pre-wrap}
.poll-card .pt{font-size:10.5px;color:var(--sub);margin-top:4px}
.checkin-list{display:flex;flex-direction:column;gap:8px}
.checkin-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px}
.checkin-item .ci-txt{flex:1;font-size:14.5px}
.checkin-item .del{color:#BBA98C;font-size:16px;padding:6px;min-height:44px}

/* ===== v5：陪伴番茄钟 ===== */
.companion-bg{position:relative;border-radius:24px;overflow:hidden;min-height:400px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#EAF0EC,#DCE8DE);border:1px solid var(--line)}
.companion-bg .cbg{position:absolute;inset:0;background-size:cover;background-position:center}
.companion-bg .cc{position:relative;z-index:1}
.timer-box{text-align:center;padding:22px 0 14px;background:rgba(255,253,246,.8);border-radius:20px;border:1px solid rgba(232,223,206,.7)}
.timer{font-family:var(--serif);font-size:56px;font-weight:700;color:#4A3F33;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-state{font-size:13px;color:var(--sub);margin-top:4px}
.mode-chips{display:flex;gap:8px;flex-wrap:wrap}
.mode-chip{padding:8px 14px;border-radius:20px;font-size:13px;background:rgba(255,253,246,.85);border:1px solid var(--line);color:#4A3F33;min-height:44px}
.mode-chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.timer-btns{display:flex;gap:10px}
.timer-btns button{flex:1;padding:13px 0;border-radius:14px;font-size:15px;background:var(--green);color:#fff;min-height:46px}
.timer-btns button.ghost{background:rgba(255,253,246,.85);color:var(--green);border:1px solid var(--green)}

/* ===== v5：来电视频 ===== */
.video-stage{width:200px;height:340px;border-radius:22px;background:linear-gradient(160deg,#1F2E26,#31483A);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.video-stage img.vf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-stage .vs-label{font-size:12px;color:rgba(255,255,255,.55);position:absolute;bottom:10px;left:0;right:0;text-align:center}
.video-badge{position:absolute;top:8px;right:8px;font-size:10.5px;background:rgba(0,0,0,.4);color:#fff;border-radius:12px;padding:2px 8px}

/* ===== v5：主页壁纸/图标装修 ===== */
#home.cbg{background-size:cover;background-position:center;background-attachment:fixed}
.icon-edit-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.icon-edit-item:last-child{border-bottom:none}
.icon-edit-item .ie-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.icon-edit-item .ie-ic img{width:100%;height:100%;object-fit:cover}
.icon-edit-item .ie-nm{flex:1;font-size:14.5px}
.icon-edit-item button{font-size:12.5px;color:var(--green);padding:8px 10px;min-height:44px}
.icon-edit-item button.gray{color:var(--sub)}
.bg-cell{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.bg-cell:last-child{border-bottom:none}
.bg-cell .bc-nm{flex:1;font-size:14.5px}
.bg-cell .bc-th{width:44px;height:30px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line);flex-shrink:0}
.sm-list{display:flex;flex-direction:column;gap:8px}
.sm-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px}
.sm-item .txt{flex:1;font-size:14.5px}
.preset-row{display:flex;gap:10px;flex-wrap:wrap}
.me-av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:17px;font-weight:600;flex-shrink:0;overflow:hidden}
.me-av img{width:100%;height:100%;object-fit:cover}
.post-acts{display:flex;align-items:center;gap:14px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.post-acts .act{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);min-height:44px;padding:0 4px}
.post-acts .act.on{color:#D4605A}
.post-acts .like-ic{font-size:15px}
.post-acts .he-like{font-size:12.5px;color:var(--sub);background:var(--green-soft);border-radius:10px;padding:3px 9px}
.preset-row button{width:62px;height:70px;border-radius:12px;border:2.5px solid transparent;min-height:44px}
.preset-row button.on{border-color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
</div>
<div id="sheet-mask" class="hide"></div>
<div id="callOverlay"></div>
<div id="transferOverlay"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 基础 ================= */
var KEY='zika_site_v3';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function now(){return Date.now()}
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+now().toString(36)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(arr){return arr.length?arr[Math.floor(Math.random()*arr.length)]:null}
function ms(mins){return Math.max(1,Math.round(mins))*60000}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmtTime(ts){
  var d=new Date(ts),td=new Date();
  var hh=('0'+d.getHours()).slice(-2),mm=('0'+d.getMinutes()).slice(-2),hm=hh+':'+mm;
  var d0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  var t0=new Date(td.getFullYear(),td.getMonth(),td.getDate()).getTime();
  if(d0===t0)return hm;
  if(d0===t0-86400000)return '昨天 '+hm;
  if(d.getFullYear()===td.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function fmtDur(s){
  if(s<60)return s+'秒';
  var mins=Math.round(s/60);
  if(mins<60)return mins+'分钟';
  var h=Math.floor(mins/60),m=mins%60;
  return m?h+'小时'+m+'分':h+'小时';
}
function fmtCall(sec){return Math.floor(sec/60)+'分'+('0'+(sec%60)).slice(-2)+'秒'}
function dateStr(ts){var d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2200)}
function avatarHtml(c,size){
  size=size||40;
  var st='width:'+size+'px;height:'+size+'px';
  if(c&&c.avatarType==='img'&&c.avatarImg)return '<img class="avatar" src="'+c.avatarImg+'" style="'+st+'" alt="">';
  var name=c?c.name:'?',co=c?c.color:'#6E7F5E',ch=(name||'?').trim().charAt(0);
  return '<svg class="avatar" width="'+size+'" height="'+size+'" viewBox="0 0 40 40" style="background:'+co+';border-radius:50%"><text x="20" y="26" text-anchor="middle" font-size="18" fill="#fff" font-family="\'Songti SC\',serif" font-weight="700">'+esc(ch)+'</text></svg>';
}
function contact(id){for(var i=0;i<state.contacts.length;i++)if(state.contacts[i].id===id)return state.contacts[i];return null}
function activeContact(){return contact(state.activeContact)||state.contacts[0]}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function msgText(id){var m=byId(state.messages,id);return m?m.text:''}

/* ================= 数据 v3 ================= */
function defContact(){
  var t=now();
  return {id:uid(),name:'新对象',color:'#7A9CC6',avatarType:'char',avatarImg:'',replyMin:180,replyMax:900,initMin:7200,initMax:18000,letterMin:600,letterMax:7200,burst:[45,32,15,6,2],burstOn:true,puzzle:true,readNR:false,readNRPct:20,callPct:30,transferPct:15,replyPct:100,created:t};
}
function defaultState(){
  var t=now(),mj=defContact();mj.id='mj';mj.name='梦角哥';mj.color='#5F8F7B';
  return {
    version:5,contacts:[mj],
    cards:[
      {id:uid(),text:'今天也辛苦啦，忙完了记得早点休息。',tag:'日常',created:t},
      {id:uid(),text:'你凶我也没关系，我不会走的。',tag:'吵架',created:t},
      {id:uid(),text:'刚才看了一眼窗外，忽然就想起你了。',tag:'想念',created:t},
      {id:uid(),text:'别一直盯着屏幕，起来喝口水。',tag:'日常',created:t},
      {id:uid(),text:'吵架可以，不许偷偷掉眼泪。',tag:'吵架',created:t},
      {id:uid(),text:'等你忙完，我们好好说说话。',tag:'日常',created:t}
    ],
    statusCards:[
      {id:uid(),text:'在喝咖啡'},{id:uid(),text:'在开会'},{id:uid(),text:'在加班'},
      {id:uid(),text:'在散步'},{id:uid(),text:'刚睡醒'},{id:uid(),text:'在看你的消息'},
      {id:uid(),text:'在做饭'},{id:uid(),text:'在打游戏'}
    ],
    moodCards:[
      {id:uid(),text:'心情不错'},{id:uid(),text:'有点想你'},{id:uid(),text:'有点累'},
      {id:uid(),text:'很开心'},{id:uid(),text:'很平静'},{id:uid(),text:'在等你消息'},
      {id:uid(),text:'想见你'},{id:uid(),text:'心情多云'}
    ],
    writerCards:[
      {id:uid(),text:'见字如面，今天也一直在想你。'},{id:uid(),text:'写完这封信，我就要去忙了，但心还留在这里。'},
      {id:uid(),text:'你那边天气好吗？我这里刚下了雨。'},{id:uid(),text:'有好多话想说，落到纸上反而只写得出这一句。'},
      {id:uid(),text:'别担心我，一切都好，就是想早点见到你。'},{id:uid(),text:'这封信慢慢看，不用急着回。'}
    ],
    checkinPresets:['在干嘛','吃饭了吗','想我了吗','在哪'],
    messages:[],posts:[],letters:[],transfers:[],stickers:[],
    diary:{},
    currentStatus:{text:'在喝咖啡',ts:t},currentMood:{text:'心情不错',ts:t},
    settings:{chatBg:'bg1',chatBgImg:'',cover:'cov1',coverImg:'',homeBg:'hb1',homeBgImg:'',diaryCount:3,letterCount:2},
    appIcons:{},
    companion:{bgKey:'cb1',bgImg:'',modes:[{id:uid(),name:'学习',mins:25,color:'#5F8F7B'},{id:uid(),name:'运动',mins:45,color:'#D98E5F'},{id:uid(),name:'工作',mins:50,color:'#7A9CC6'}],custom:[]},
    me:{name:'我',avatarType:'char',avatarImg:'',color:'#D98E5F'},
    receivedTotal:0,nextInit:{},lastActive:t,activeContact:'mj'
  };
}
function migrate(s){
  if(!s.version||s.version<4){
    for(var iv=0;iv<s.contacts.length;iv++){
      var cv=s.contacts[iv];
      cv.replyMin=(cv.replyMin||3)*60;cv.replyMax=(cv.replyMax||15)*60;
      cv.initMin=(cv.initMin||90)*60;cv.initMax=(cv.initMax||300)*60;
    }
  }
  if(!s.version||s.version<5){
    for(var iw=0;iw<s.contacts.length;iw++){
      var cw=s.contacts[iw];
      if(cw.letterMin===undefined)cw.letterMin=600;
      if(cw.letterMax===undefined)cw.letterMax=7200;
    }
    if(!s.writerCards||!Array.isArray(s.writerCards))s.writerCards=defaultState().writerCards;
    if(!s.checkinPresets||!Array.isArray(s.checkinPresets))s.checkinPresets=['在干嘛','吃饭了吗','想我了吗','在哪'];
    if(!s.stickers||!Array.isArray(s.stickers))s.stickers=[];
    if(!s.appIcons||typeof s.appIcons!=='object')s.appIcons={};
    if(!s.settings)s.settings={};
    if(!s.settings.homeBg)s.settings.homeBg='hb1';
    if(!s.settings.homeBgImg)s.settings.homeBgImg='';
    if(!s.companion)s.companion=defaultState().companion;
    if(!s.companion.modes||!s.companion.modes.length)s.companion.modes=defaultState().companion.modes;
    if(!s.companion.custom)s.companion.custom=[];
    if(!s.me)s.me={name:'我',avatarType:'char',avatarImg:'',color:'#D98E5F'};
    if(!s.me.name)s.me.name='我';
    if(!s.me.avatarType)s.me.avatarType='char';
    if(!s.me.color)s.me.color='#D98E5F';
  }
  for(var i=0;i<s.contacts.length;i++){
    var c=s.contacts[i];
    if(c.avatarType===undefined)c.avatarType='char';
    if(c.avatarImg===undefined)c.avatarImg='';
    if(!c.burst)c.burst=[45,32,15,6,2];
    if(c.burstOn===undefined)c.burstOn=true;
    if(c.puzzle===undefined)c.puzzle=true;
    if(c.readNR===undefined)c.readNR=false;
    if(c.readNRPct===undefined)c.readNRPct=20;
    if(c.callPct===undefined)c.callPct=30;
    if(c.transferPct===undefined)c.transferPct=15;
    if(c.replyPct===undefined)c.replyPct=100;
  }
  if(!s.statusCards||!s.statusCards.length)s.statusCards=defaultState().statusCards;
  if(!s.moodCards||!s.moodCards.length)s.moodCards=defaultState().moodCards;
  if(!s.diary)s.diary={};
  if(!s.currentStatus)s.currentStatus={text:'在喝咖啡',ts:now()};
  if(!s.currentMood)s.currentMood={text:'心情不错',ts:now()};
  if(!s.settings)s.settings={chatBg:'bg1',chatBgImg:'',cover:'cov1',coverImg:'',diaryCount:3,letterCount:2};
  if(!s.settings.chatBg)s.settings.chatBg='bg1';
  if(!s.settings.chatBgImg)s.settings.chatBgImg='';
  if(!s.settings.cover)s.settings.cover='cov1';
  if(!s.settings.coverImg)s.settings.coverImg='';
  if(!s.settings.diaryCount)s.settings.diaryCount=3;
  if(!s.settings.letterCount)s.settings.letterCount=2;
  if(!s.posts)s.posts=[];
  for(var j=0;j<s.posts.length;j++)if(!s.posts[j].comments)s.posts[j].comments=[];
  if(!s.transfers)s.transfers=[];
  if(s.receivedTotal===undefined)s.receivedTotal=0;
  s.version=5;
  return s;
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return null;
    var d=JSON.parse(raw);
    if(d&&(d.version===1||d.version===2||d.version===3)&&Array.isArray(d.contacts))return migrate(d);
  }catch(e){}
  return null;
}
var state=load()||defaultState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存失败：空间不足')}}

/* ================= 壁纸 / 封面 ================= */
var BG_PRESETS={
  bg1:'linear-gradient(180deg,#F6F1E8,#EFE7D6)',
  bg2:'linear-gradient(180deg,#EAF0EC,#DCECDF)',
  bg3:'linear-gradient(180deg,#F2E9E2,#E8D8C8)',
  bg4:'linear-gradient(180deg,#E8EEF5,#D8E4EE)',
  bg5:'linear-gradient(180deg,#F6EFE6,#F0E3D3)'
};
var COV_PRESETS={
  cov1:'linear-gradient(135deg,#BFD8C8,#E9E4D0)',
  cov2:'linear-gradient(135deg,#F2C9A8,#F6E3CF)',
  cov3:'linear-gradient(135deg,#A9C4DE,#DCE9F2)',
  cov4:'linear-gradient(135deg,#D8C8B8,#EFE3D2)',
  cov5:'linear-gradient(135deg,#C9D8C0,#E4E8DA)'
};
var HB_PRESETS={
  hb1:'linear-gradient(180deg,#F6F1E8,#EFE7D6)',
  hb2:'linear-gradient(180deg,#EAF0EC,#DCE8DE)',
  hb3:'linear-gradient(180deg,#F6ECE3,#EEDCC9)',
  hb4:'linear-gradient(180deg,#E8EEF5,#D8E4EE)',
  hb5:'linear-gradient(180deg,#F6EFE9,#EFDCD3)'
};
function chatBgStyle(){
  var st=state.settings;
  if(st.chatBgImg)return 'background-image:url('+st.chatBgImg+')';
  return 'background-image:'+(BG_PRESETS[st.chatBg]||BG_PRESETS.bg1);
}
function homeBgStyle(){
  var st=state.settings;
  if(st.homeBgImg)return 'background-image:url('+st.homeBgImg+')';
  return 'background-image:'+(HB_PRESETS[st.homeBg]||HB_PRESETS.hb1);
}
function coverStyle(){
  var st=state.settings;
  if(st.coverImg)return 'background-image:url('+st.coverImg+')';
  return 'background-image:'+(COV_PRESETS[st.cover]||COV_PRESETS.cov1);
}

/* ================= 路由 ================= */
var VIEWS=['home','chat','moments','mail','cards','diary','companion','me'];
function router(){
  var h=location.hash.replace('#','');
  if(VIEWS.indexOf(h)<0){location.hash='home';return}
  render(h);
}
function render(v){
  v=v||location.hash.replace('#','')||'home';
  if(v==='home')renderHome();
  else if(v==='chat')renderChat();
  else if(v==='moments')renderMoments();
  else if(v==='mail')renderMail();
  else if(v==='cards')renderCards();
  else if(v==='diary')renderDiary();
  else if(v==='companion')renderCompanion();
  else renderMe();
}
function renderAll(){render()}
window.addEventListener('hashchange',router);

/* ================= 主界面（桌面） ================= */
var ICON_BACK='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
var ICON_WALL='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 14l4-4 5 5 3-3 4 4"/></svg>';
function renderHome(){
  var c=activeContact();
  var d=new Date(),hour=d.getHours();
  var greet=hour<6?'夜深了，还在等我吗':hour<9?'早上好':hour<12?'上午好':hour<14?'中午好':hour<18?'下午好':'晚上好';
  var html='<div id="home" class="cbg" style="'+homeBgStyle()+'">';
  html+='<div class="home-greet">'+greet+' · '+(d.getMonth()+1)+'月'+d.getDate()+'日</div>';
  html+='<div class="home-title">字卡小站</div>';
  html+='<div class="status-card" data-view="chat">'+avatarHtml(c)+'<div class="sc-body"><div class="sc-name">'+esc(c.name)+'</div><div class="sc-chips"><span class="chip b-soft">'+esc(state.currentStatus.text)+'</span><span class="chip">'+esc(state.currentMood.text)+'</span></div></div></div>';
  html+='<div class="app-sec-title">应用</div><div class="app-grid">';
  var apps=[
    {v:'chat',n:'聊天',c:'#5F8F7B',ic:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>'},
    {v:'moments',n:'朋友圈',c:'#D98E5F',ic:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/></svg>'},
    {v:'mail',n:'信箱',c:'#7A9CC6',ic:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg>'},
    {v:'cards',n:'字卡库',c:'#B08968',ic:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 5v14"/></svg>'},
    {v:'diary',n:'日记',c:'#8A7458',ic:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h12v18H6z"/><path d="M9 7h6m-6 4h6"/></svg>'},

/* ================= 字卡抽取 ================= */
function drawCards(n,poolArr){
  var pool=(poolArr||state.cards).slice();
  var out=[],k=0;
  while(pool.length&&out.length<n&&k<100){
    var i=Math.floor(Math.random()*pool.length);
    out.push(pool.splice(i,1)[0].text);k++;
  }
  return out;
}
var FALLBACK=['收到，我在。','嗯，我在听。','记下了。','好，就这么说定了。'];
function drawCardText(){var d=drawCards(1);return d.length?d[0]:pick(FALLBACK)}
function pickCardText(){
  if(state.cards.length){
    var groups={};
    for(var i=0;i<state.cards.length;i++){var tg=state.cards[i].tag||'';(groups[tg]=groups[tg]||[]).push(state.cards[i])}
    var keys=Object.keys(groups);
    var g=groups[keys[Math.floor(Math.random()*keys.length)]];
    return g[Math.floor(Math.random()*g.length)].text;
  }
  return drawCardText();
}
function drawBalancedCards(n){
  var out=[];
  for(var i=0;i<n;i++)out.push(pickCardText());
  return out;
}
function composeText(c){
  if(c&&c.puzzle&&state.cards.length)return drawBalancedCards(rnd(2,3)).join('\n\n');
  return pickCardText();
}

/* ================= 节奏与连发 ================= */
function rndDelay(c,kind){
  var min=kind==='init'?c.initMin:c.replyMin;
  var max=kind==='init'?c.initMax:c.replyMax;
  if(min>max){var tmp=min;min=max;max=tmp}
  return rnd(min,max)*1000;
}
function pickBurstCount(c){
  if(c.burstOn===false)return 1;
  var b=c.burst||[45,32,15,6,2];
  var r=Math.random()*100,acc=0;
  for(var i=0;i<5;i++){acc+=(b[i]||0);if(r<acc)return i+1}
  return 1;
}
function pushIn(cid,text,t,replyTo){
  var m={id:uid(),contactId:cid,dir:'in',text:text,ts:t};
  if(replyTo)m.replyTo=replyTo;
  state.messages.push(m);
  return m;
}
function pushBurst(c,baseTs,count,quoteId){
  pushIn(c.id,composeText(c),baseTs,quoteId);
  for(var i=1;i<count;i++)pushIn(c.id,composeText(c),baseTs+i*rnd(20,50)*1000);
}
function maybePost(c,t){
  var d0=new Date(t);d0.setHours(0,0,0,0);
  var cnt=0;
  for(var i=0;i<state.posts.length;i++){
    var p=state.posts[i];
    if(p.contactId===c.id){var d1=new Date(p.ts);d1.setHours(0,0,0,0);if(d1.getTime()===d0.getTime())cnt++}
  }
  if(cnt>=3)return;
  state.posts.push({id:uid(),contactId:c.id,text:pickCardText(),ts:t,comments:[]});
}

  var body=drawCards(n).join('\n\n');

}

/* ================= 调度器 ================= */
var _timer=null,_typing=null;
function schedule(){
  if(_timer){clearTimeout(_timer);_timer=null}
  var items=[],t=now();
  for(var i=0;i<state.messages.length;i++){
    var m=state.messages[i];
    if(m.dir==='out'&&m.readDue&&!m.read)items.push({ts:m.readDue,fn:(function(mm){return function(){markRead(mm)}})(m)});
    if(m.dir==='out'&&m.replyDue&&!m.answered)items.push({ts:m.replyDue,fn:(function(mm){return function(){replyChat(mm)}})(m)});
    if(m.dir==='in'&&m.ts>t)items.push({ts:m.ts,fn:function(){renderChat()}});
  }
  for(var j=0;j<state.letters.length;j++){
    var l=state.letters[j];
    if(l.dir==='out'&&!l.answered&&l.replyDue)items.push({ts:l.replyDue,fn:(function(ll){return function(){replyLetter(ll)}})(l)});
  }
  for(var k=0;k<state.posts.length;k++){
    var p=state.posts[k];
    if(p.commentDue&&p.commentDue>t&&!p.commented)items.push({ts:p.commentDue,fn:(function(pp){return function(){postComment(pp)}})(p)});
  }
  for(var cid in state.nextInit){
    var c=contact(cid);
    if(!c)continue;
    var nt=state.nextInit[cid];
    if(!nt||nt<=t)nt=t+rndDelay(c,'init');
    items.push({ts:nt,fn:(function(cc){return function(){initiate(cc)}})(c)});
  }
  if(!items.length)return;
  items.sort(function(a,b){return a.ts-b.ts});
  var nx=items[0];
  var wait=nx.ts-now();
  if(wait>0)_timer=setTimeout(function(){nx.fn();schedule()},Math.min(wait,2147483000));
  else{nx.fn();schedule()}
}
function markRead(m){
  if(m.read)return;
  m.read=true;
  var c=contact(m.contactId);
  if(c&&c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null;m.answered=true}
  save();renderChat();
}
function initiate(c){
  refreshMood();
  if(state.checkinPresets&&state.checkinPresets.length&&Math.random()<0.25)pushIn(c.id,'查岗：'+pick(state.checkinPresets),now());
  pushBurst(c,now(),pickBurstCount(c));
  if(Math.random()<0.5)maybePost(c,now());
  state.nextInit[c.id]=now()+rndDelay(c,'init');
  save();renderAll();schedule();
}
function rndLetterDelay(c){
  var min=c.letterMin||600,max=c.letterMax||7200;
  if(min>max){var tmp=min;min=max;max=tmp}
  return rnd(min,max)*1000;
}
function replyLetter(l){
  var c=contact(l.contactId);if(!c)return;
  l.answered=true;
  var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);
  var pool=state.writerCards&&state.writerCards.length?state.writerCards:state.cards;
  var body=drawCards(n,pool).join('\n\n');
  if(!body)body=drawCardText();
  state.letters.push({id:uid(),contactId:c.id,dir:'in',title:'Re：'+(l.title||'来信'),body:body,ts:now(),unread:true});
  save();renderMail();schedule();toast(c.name+' 回了你的信');
}

  p.comments.push({id:uid(),contactId:c.id,text:drawCardText(),ts:now()});

function fmtLeft(){

    }

function beep(init){
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended')_actx.resume();
    if(init)return;
    var o=_actx.createOscillator(),g=_actx.createGain();
    o.frequency.value=880;g.gain.value=.28;
    o.connect(g);g.connect(_actx.destination);
    o.start();

  }catch(e){}
}

function unitToSec(v,unit){
  v=Math.max(1,parseInt(v,10)||1);
  return unit==='s'?v:(unit==='m'?v*60:(unit==='h'?v*3600:v*86400));
}
function pickUnitSec(secs){
  if(secs<60)return{val:secs,unit:'s'};
  if(secs%60===0&&secs<3600)return{val:secs/60,unit:'m'};
  if(secs%3600===0&&secs<86400)return{val:secs/3600,unit:'h'};
  if(secs%86400===0)return{val:secs/86400,unit:'d'};
  return{val:Math.round(secs/60),unit:'m'};
}

  var rMax=unitToSec($('#cReplyMax').value,$('#cReplyUnit2').value);
  var iMin=unitToSec($('#cInitMin').value,$('#cInitUnit').value);
  var iMax=unitToSec($('#cInitMax').value,$('#cInitUnit2').value);
  var lMin=unitToSec($('#cLetterMin').value,$('#cLetterUnit').value);
  var lMax=unitToSec($('#cLetterMax').value,$('#cLetterUnit2').value);
  if(rMax<rMin){toast('回复“最慢”不能小于“最快”');return}
  if(iMax<iMin){toast('主动“最慢”不能小于“最快”');return}
  if(lMax<lMin){toast('回信“最慢”不能小于“最快”');return}
  var burst=[0,0,0,0,0];
  for(var k=0;k<5;k++)burst[k]=clamp(parseFloat($('#b'+(k+1)).value)||0,0,100);
  if(!burst.reduce(function(a,b){return a+b},0))burst=[45,32,15,6,2];
  function applyC(c){
    c.name=name;c.replyMin=rMin;c.replyMax=rMax;c.initMin=iMin;c.initMax=iMax;c.letterMin=lMin;c.letterMax=lMax;
    c.burstOn=$('#cBurstOn').checked;c.burst=burst;

  }
  if(id){var c0=contact(id);if(!c0)return;applyC(c0)}
  else{var nc=defContact();applyC(nc);state.contacts.push(nc);state.activeContact=nc.id}
  _avImg=null;_avPicked=false;
  save();closeSheet();renderAll();schedule();toast('已保存');
}

      var s=migrate(d.state);

      if(!s.moodCards||!Array.isArray(s.moodCards))s.moodCards=defaultState().moodCards;

      if(!s.posts||!Array.isArray(s.posts))s.posts=[];
      if(!s.letters||!Array.isArray(s.letters))s.letters=[];
      if(!s.transfers||!Array.isArray(s.transfers))s.transfers=[];
      if(!s.diary||typeof s.diary!=='object')s.diary={};
      if(!s.nextInit||typeof s.nextInit!=='object')s.nextInit={};
      var ok=false;
      for(var i=0;i<s.contacts.length;i++)if(s.contacts[i].id===s.activeContact)ok=true;
      if(!ok&&s.contacts.length)s.activeContact=s.contacts[0].id;

  var c=contact(m.contactId);if(!c)return;

/* ================= 后台保活：离线补发 ================= */
function syncCatchUp(){
  var last=state.lastActive||now();
  state.lastActive=now();
  var end=now();
  if(end-last<15000){save();schedule();return}
  for(var k=0;k<state.contacts.length;k++){
    var c=state.contacts[k];
    var t=state.nextInit[c.id]||last,guard=0;
    while(t<end&&guard<50){
      t+=rndDelay(c,'init');
      if(t<=end){pushBurst(c,t,pickBurstCount(c));maybePost(c,t);guard++}
    }
    state.nextInit[c.id]=Math.max(t,end);
    for(var i=0;i<state.messages.length;i++){
      var m=state.messages[i];
      if(m.contactId===c.id&&m.dir==='out'){
        if(m.readDue&&!m.read&&m.readDue<=end)m.read=true;
        if(m.replyDue&&!m.answered&&m.replyDue<=end){
          m.answered=true;
          if(m.kind==='poll'){replyPoll(m,Math.min(m.replyDue,end))}
          else if(c.readNR&&Math.random()*100<c.readNRPct){m.replyDue=null}
          else pushBurst(c,Math.min(m.replyDue,end),pickBurstCount(c));
        }
      }
    }
    for(var j=0;j<state.letters.length;j++){
      var l=state.letters[j];
      if(l.contactId===c.id&&l.dir==='out'&&!l.answered&&l.replyDue&&l.replyDue<=end){
        l.answered=true;
        var n=clamp(((state.settings&&state.settings.letterCount)||2),1,8);
        var pool=state.writerCards&&state.writerCards.length?state.writerCards:state.cards;
        var body=drawCards(n,pool).join('\n\n');
        if(!body)body=drawCardText();
        state.letters.push({id:uid(),contactId:c.id,dir:'in',title:'Re：'+(l.title||'来信'),body:body,ts:Math.min(l.replyDue,end),unread:true});
      }
    }
  }
  for(var q=0;q<state.posts.length;q++){
    var p=state.posts[q];
    if(p.contactId===null&&p.commentDue&&!p.commented&&p.commentDue<=end){
      var c2=contact(state.activeContact);
      if(c2){
        p.commented=true;
        if(Math.random()<0.5)p.heLiked=true;
        if(Math.random()*100<(c2.replyPct||100))p.comments.push({id:uid(),contactId:c2.id,text:pickCardText(),ts:Math.min(p.commentDue,end)});
      }
    }
  }
  var d0=new Date(last),d1=new Date(end);
  var loop=d0;
  while(loop.getTime()<=d1.getTime()&&loop.getTime()<=end){
    ensureDiary(loop.getTime());
    loop=new Date(loop.getTime()+86400000);
    if(loop.getTime()-d1.getTime()>7*86400000)break;
  }
  save();renderAll();schedule();
  toast('补发完成：离线期间的新消息已同步');
}

/* ================= 弹层 ================= */
function openSheet(html){
  var m=$('#sheet-mask');
  m.innerHTML='<div class="sheet">'+html+'</div>';
  m.classList.remove('hide');
}
function closeSheet(){var m=$('#sheet-mask');m.classList.add('hide');m.innerHTML=''}

/* ================= 全局事件 ================= */
var fileInput=document.createElement('input');
fileInput.type='file';fileInput.id='fileImport';fileInput.style.display='none';
fileInput.accept='application/json,.json';
document.body.appendChild(fileInput);
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='sheet-mask'){closeSheet();return}
  var v=e.target.closest('[data-view]');
  if(v){location.hash=v.getAttribute('data-view');return}
  var btn=e.target.closest('[data-act]');
  if(btn){
    var act=btn.getAttribute('data-act'),id=btn.getAttribute('data-id');
    if(act==='switch-contact')sheetSwitch();
    else if(act==='send-chat')sendChat();
    else if(act==='quote')startQuote(id);
    else if(act==='quote-cancel'){_quoteId=null;renderChat()}
    else if(act==='post-create')postCreate();
    else if(act==='letter-new')sheetLetter();
    else if(act==='letter-send')letterSend();
    else if(act==='card-add')sheetCard();
    else if(act==='card-save')cardSave();
    else if(act==='card-del')cardDel(id);
    else if(act==='cat'){_cat=btn.getAttribute('data-cat');renderCards()}
    else if(act==='quick-tag')quickTag(btn.getAttribute('data-tag'));
    else if(act==='card-export')cardExport();
    else if(act==='card-import'){var cf=document.getElementById('cardFile');if(cf)cf.click()}
    else if(act==='sm-add')sheetStatusCard(btn.getAttribute('data-kind'));
    else if(act==='sm-save')smSave(btn.getAttribute('data-kind'));
    else if(act==='sm-del')smDel(btn.getAttribute('data-kind'),id);
    else if(act==='sm-lib')sheetSmLib(btn.getAttribute('data-kind'));
    else if(act==='contact-add')sheetContact('');
    else if(act==='contact-edit')sheetContact(id);
    else if(act==='contact-save')contactSave();
    else if(act==='contact-del')contactDel(id);
    else if(act==='pick-contact')pickContact(id);
    else if(act==='pick-color')pickColor(btn.getAttribute('data-color'));
    else if(act==='avatar-upload'){var af=$('#avatarFile');if(af)af.click()}
    else if(act==='avatar-reset'){_avImg=null;_avPicked=false;updAvatarPrev()}
    else if(act==='bg-sheet')sheetChatBg();
    else if(act==='cover-sheet')sheetCover();
    else if(act==='pick-bg')pickBg(btn.getAttribute('data-key'));
    else if(act==='pick-cover')pickCover(btn.getAttribute('data-key'));
    else if(act==='upload-bg'){var bf=$('#bgFile');if(bf)bf.click()}
    else if(act==='upload-cover'){var cvf=$('#coverFile');if(cvf)cvf.click()}
    else if(act==='clear-bg')clearBg();
    else if(act==='clear-cover')clearCover();
    else if(act==='save-gen')saveGen();
    else if(act==='home-sheet')sheetHomeBg();
    else if(act==='pick-homebg')pickHomeBg(btn.getAttribute('data-key'));
    else if(act==='upload-homebg'){var hf=$('#homeBgFile');if(hf)hf.click()}
    else if(act==='clear-homebg')clearHomeBg();
    else if(act==='icon-upload'){_iconTarget=btn.getAttribute('data-v');var icf=$('#iconFile');if(icf)icf.click()}
    else if(act==='icon-reset')iconReset(btn.getAttribute('data-v'));
    else if(act==='checkin')sheetCheckin();
    else if(act==='checkin-send')sendCheckin(state.checkinPresets[parseInt(btn.getAttribute('data-idx'),10)]);
    else if(act==='checkin-custom'){var ckIn=$('#checkinCustom');if(ckIn&&ckIn.value.trim())sendCheckin(ckIn.value.trim());else toast('写一句查岗的话')}
    else if(act==='checkin-add')sheetCheckinAdd();
    else if(act==='checkin-add-save')checkinAddSave();
    else if(act==='checkin-del')checkinDel(parseInt(btn.getAttribute('data-idx'),10));
    else if(act==='poll')sheetPoll();
    else if(act==='poll-send')pollSend();
    else if(act==='tools')sheetTools();
    else if(act==='emoji')sheetStickers();
    else if(act==='emoji-send')sendEmoji(btn.getAttribute('data-e'));
    else if(act==='sticker-send')sendSticker(btn.getAttribute('data-id'));
    else if(act==='sticker-add'){var sf=$('#stickerFile');if(sf)sf.click()}
    else if(act==='image-send'){ensureImgInput().click()}
    else if(act==='call-voice'){closeSheet();showCall('voice')}
    else if(act==='call-video'){closeSheet();showCall('video')}
    else if(act==='lib'){_lib=btn.getAttribute('data-lib');renderCards()}
    else if(act==='mode-pick')modePick(btn.getAttribute('data-id'));
    else if(act==='timer-start')timerStart();
    else if(act==='timer-pause')timerPause();
    else if(act==='timer-reset')timerReset();
    else if(act==='mode-add')sheetModeAdd();
    else if(act==='mode-save')modeSave();
    else if(act==='cbg-change')sheetCbg();
    else if(act==='pick-cbg')pickCbg(btn.getAttribute('data-key'));
    else if(act==='upload-cbg'){var cbf=$('#cbFile');if(cbf)cbf.click()}
    else if(act==='clear-cbg')clearCbg();
    else if(act==='me-edit')sheetMe();
    else if(act==='me-pick-color')mePickColor(btn.getAttribute('data-color'));
    else if(act==='me-upload'){var mf=$('#meAvatarFile');if(mf)mf.click()}
    else if(act==='me-reset')meResetAv();
    else if(act==='me-save')meSave();
    else if(act==='post-like')toggleLike(btn.getAttribute('data-id'));
    else if(act==='backup-export')backupExport();
    else if(act==='backup-import')fileInput.click();
    else if(act==='sheet-close')closeSheet();
    else if(act==='mail-read')mailRead(id);
    return;
  }
  var cb=e.target.closest('[data-call]');
  if(cb){
    var ca=cb.getAttribute('data-call');
    if(ca==='accept')callAccept();
    else callHangup();
    return;
  }
  var tb=e.target.closest('[data-tr]');
  if(tb){transferDecide(tb.getAttribute('data-tr')==='accept')}
});
var cardFile=document.createElement('input');
cardFile.type='file';cardFile.id='cardFile';cardFile.style.display='none';
cardFile.accept='application/json,.json';
document.body.appendChild(cardFile);
document.addEventListener('change',function(e){
  if(!e.target)return;
  if(e.target.id==='fileImport')importBackup(e.target);
  else if(e.target.id==='cardFile')importCards(e.target);
  else if(e.target.id==='avatarFile')readAvatarFile(e.target);
  else if(e.target.id==='bgFile')readImg(e.target,'bg');
  else if(e.target.id==='coverFile')readImg(e.target,'cover');
  else if(e.target.id==='stickerFile')addStickerFile(e.target);
  else if(e.target.id==='iconFile')readIconFile(e.target);
  else if(e.target.id==='homeBgFile')readUploadImg(e.target,'home');
  else if(e.target.id==='cbFile')readUploadImg(e.target,'cb');
  else if(e.target.id==='imgFile')sendImageMsg(e.target);
  else if(e.target.id==='meAvatarFile')readMeFile(e.target);
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncCatchUp()});
window.addEventListener('focus',syncCatchUp);
window.addEventListener('load',function(){
  state.lastActive=now();
  ensureDiary(now());
  refreshMood();
  syncCatchUp();
  router();
  rollLoginEvents();
});
</script>
</body>
</html>
